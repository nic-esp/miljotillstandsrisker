name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/data
          cp Artefakt_C_Riskregister/Artefakt_C_riskregister.html _site/index.html
          cp Artefakt_C_Riskregister/Artefakt_C_riskregister.json _site/data/riskregister.json
          cp Artefakt_C_Riskregister/_build/mappable_nodes.json _site/data/nodes.json
          cp Artefakt_C_Riskregister/mcp-server/data/sources.json _site/data/sources.json
          cp Artefakt_B_Processkarta_nodordbok/Artefakt_B_processkarta_import.json _site/data/process-charts.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/riskregister.json
          test -s _site/data/nodes.json
          test -s _site/data/sources.json
          test -s _site/data/process-charts.json
          test -s _site/data/index.html
          test -s _site/ai-access.html
          test -s _site/llms.txt
          test -s _site/sitemap.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
