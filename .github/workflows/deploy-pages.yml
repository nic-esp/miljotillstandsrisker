name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Artefakt_C_Riskregister/mcp-server/package-lock.json

      - name: Install test and build dependencies
        working-directory: Artefakt_C_Riskregister/mcp-server
        run: npm ci

      - name: Rebuild all derived artifacts
        working-directory: Artefakt_C_Riskregister/mcp-server
        run: npm run build:all

      - name: Run regression tests
        working-directory: Artefakt_C_Riskregister/mcp-server
        run: npm test

      - name: Verify committed artifacts are synchronized
        run: |
          git ls-files --error-unmatch \
            Artefakt_C_Riskregister/mcp-server/data/riskregister.csv \
            Artefakt_C_Riskregister/mcp-server/data/riskregister-items.csv \
            Artefakt_C_Riskregister/mcp-server/data/exploration.json \
            Artefakt_C_Riskregister/mcp-server/data/controls.csv
          git diff --exit-code -- \
            Artefakt_B_Processkarta_nodordbok/Artefakt_B_processkarta_import.json \
            Artefakt_C_Riskregister/Artefakt_C_riskregister.json \
            Artefakt_C_Riskregister/Artefakt_C_riskregister.html \
            Artefakt_C_Riskregister/_build/mappable_nodes.json \
            Artefakt_C_Riskregister/mcp-server/data/sources.json \
            Artefakt_C_Riskregister/mcp-server/data/riskregister.csv \
            Artefakt_C_Riskregister/mcp-server/data/riskregister-items.csv \
            Artefakt_C_Riskregister/mcp-server/data/exploration.json \
            Artefakt_C_Riskregister/mcp-server/data/controls.csv

      - name: Prepare static site
        run: node scripts/prepare-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
