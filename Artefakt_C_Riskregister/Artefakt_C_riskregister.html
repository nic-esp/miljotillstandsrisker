tas som en tillfällig teknikfråga och tas inte med i prövningsobjektet.","description":"Tillfälliga arbeten är ofta det som orsakar störst grundvattenpåverkan i ett projekt, men de glöms lätt bort vid avgränsningen eftersom de inte ingår i den färdiga anläggningen. Grundvattenbortledning är vattenverksamhet även när den är tillfällig, om den inte är obetydlig. Om sänkningen senare påverkar brunnar, grundvattenberoende våtmarker eller sättningskänslig mark uppstår både skadeståndsrättslig exponering och tillsynsingripanden. En avgränsning som bara omfattar driften ger en tillståndsdom som inte täcker byggskedet.","motivation":"Mark- och miljödomstolarnas praxis om grundvattenbortledning (t.ex. MMD-domar där tillstånd meddelats för bortledning efter hydrogeologisk utredning, M 13782-22 dom 2024-06-27) visar att det är infödet och påverkan på grundvattennivåer som är den centrala prövningsfrågan – även i byggskedet. Källa: Sveriges Domstolar samt 11 kap. 3 § MB.","affects":"B40-010 och B40-030 (underlagsbehovet växer), samt B40-P110 där yrkandet måste omfatta byggskedet.","impact":"Kompletteringskrav eller ny ansökan mitt i byggskedet, stoppade arbeten och skadeståndsanspråk från brunnsägare och grannar.","mitigation":"Låt hydrogeologen bedöma byggskedets inföde separat och ta med tillfälliga arbeten i avgränsningen. Upprätta kontrollprogram för grundvattennivåer redan i ansökan.","source_refs":["MB","COURT_WV","EXT: MMD-dom M 13782-22 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/m-13782-22-dom-2024-06-27.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-010-03","node_id":"B40-010","chart_key":"B40","node_label":"Avgränsa vattenåtgärden","title":"Följdåtgärder utanför huvudplatsen missas","category":"Rättslig osäkerhet","trigger":"Schaktmassor som tippas i vatten, avledda diken utanför arbetsområdet eller erosionsskydd längre nedströms bedöms som separata smååtgärder.","description":"En vattenåtgärd har ofta följdåtgärder på andra platser: masshantering, utjämningsdiken, recipientskydd eller kompensationsåtgärder. Om dessa inte fångas i avgränsningen enligt 11 kap. 2 § MB saknas rättigheter och tillstånd för dem, trots att de är en förutsättning för att huvudåtgärden ska kunna genomföras. Upptäcks bristen vid screeningen i B40-060 eller av tillsynsmyndigheten kan hela avgränsningsarbetet behöva göras om och vägvalet i B40-G070 ändras.","motivation":"Välgrundat resonemang: 11 kap. 2 § MB:s definition av vattenverksamhet omfattar åtgärder som syftar till att ändra vattnets djup eller läge oavsett var de sker; domstolspraxis kräver att hela den verksamhet som ansökan avser är avgränsad och kungjord, annars riskerar domen att inte täcka delarna eller att ogiltigförklaras i överinstansen.","affects":"B40-010 samt B40-060 och B40-G070; berör även B40-P110 där fastighetsförteckningen blir ofullständig.","impact":"Fördröjning genom omarbetad avgränsning och nytt vägval, samt risk att tillståndet inte täcker hela genomförandet.","mitigation":"Använd ett samlat åtgärdsschema med huvud- och följdåtgärder på karta innan avgränsningen låses. Konsultera tillsynsmyndigheten i tveksamma fall.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-030-01","node_id":"B40-030","chart_key":"B40","node_label":"Ta fram vatten-, miljö- och sakägarunderlag","title":"Hydrologiskt och hydrogeologiskt underlag håller inte domstolsmått","category":"Underlagsbrist & data","trigger":"Grundvattenmätningar görs under för kort tid eller fel årstid, och recipients- eller flödesdata saknas för relevanta årsvariationer.","description":"Vattenrättslig prövning ställer höga krav på underlaget: domstolen ska kunna bedöma skador och olägenheter för allmänna och enskilda intressen. Hydrologiska och hydrogeologiska data är säsongsberoende – en grundvattenserie som inte täcker både hög- och lågvatten ger osäkra påverkansbedömningar. Upptäcks bristerna först vid MMD:s prövning eller tillsynsmyndighetens kompletteringskrav kan ett helt mätår behövas, vilket förskjuter ansökan ett år eller mer. Bristfälligt underlag leder också till att motparter lättare kan bryta ned bedömningarna vid överklagande.","motivation":"MMD-praxis om grundvattenbortledning (bl.a. M 13782-22, dom 2024-06-27) visar att tillstånd bygger på att den hydrogeologiska utredningen ger stöd för att skador av väsentlig betydelse inte uppstår – underlag som inte når den bevisnivån leder till komplettering eller avslag. Källa: Sveriges Domstolar samt Miljösamverkan Sveriges handläggarstöd för domstolsprövning av vattenverksamheter.","affects":"B40-030 och nedströms B40-G040, B40-G070 samt särskilt B40-P100/B40-P110 där MKB:n och ansökan bygger på underlaget.","impact":"Fördröjning om minst ett mätår, merkostnad för kompletterande fältarbete och försvagad processposition vid prövning.","mitigation":"Planera fältprogrammet med minst ett helt hydrologiskt år och täck årstidsvariationer. Använd SGU:s och SMHI:s data som komplement och dokumentera osäkerheter öppet.","source_refs":["MB","COURT_WV","EXT: Miljösamverkan Sverige – Handläggarstöd domstolsprövning vattenverksamheter https://www.miljosamverkansverige.se/wp-content/uploads/handlaggarstod-domstolsprovning-vattenverksamheter.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-030-02","node_id":"B40-030","chart_key":"B40","node_label":"Ta fram vatten-, miljö- och sakägarunderlag","title":"Befintliga tillstånd och gamla vattendomar förbises","category":"Underlagsbrist & data","trigger":"Inventeringen av befintliga tillstånd begränsas till digitala register och missar äldre vattendomar, rättigheter och förmåner som inte är registrerade.","description":"Vattenrättsliga rättigheter ligger ofta i århundradegamla vattendomar, bygningdomar och samfällighetsdokument som inte återfinns i moderna register. En åtgärd som kolliderar med en äldre regleringsrätt eller fiskerätt kan stoppas eller bli ersättningspliktig även om den får tillstånd. Noden kräver uttryckligen kartläggning av befintliga tillstånd, och underlåter projektägaren det bygger ansökan på en felaktig rättighetsbild. Upptäcks en gammal rättighet först i prövningen kan sakägarbilden och ersättningsfrågorna explodera.","motivation":"Vattenkraftens omprövning för moderna miljövillkor (MB 11 kap. 27 §, nationell plan beslutad av regeringen 25 juni 2020) har visat hur komplex och historiskt belastad den svenska vattenrättsliga rättighetsbilden är; även dagens domstolsprocesser bygger på vattendomar från 1900-talets första hälft. Källa: Energimyndigheten och prop. 2017/18:243.","affects":"B40-030 och B40-G040 (rådighetsfrågan), samt B40-P110 där ersättnings- och sakägaravsnitt bygger på inventeringen.","impact":"Ersättningskrav och sakägartvister i prövningen, fördröjning och i värsta fall att åtgärden inte kan genomföras som planerat.","mitigation":"Beställ arkivsökning hos domstolar, Lantmäteriet och vattenregleringsföretag tidigt. Intervjua lokala markägare och fiskevårdsorganisationer om historiska rättigheter.","source_refs":["MB","LVV","EXT: Energimyndigheten – Tillstånd för vattenkraft https://www.energimyndigheten.se/energisystem-och-analys/tillstand-och-provning/tillstandsprocesser/tillstand-for-vattenkraft/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-030-03","node_id":"B40-030","chart_key":"B40","node_label":"Ta fram vatten-, miljö- och sakägarunderlag","title":"Sakägarförteckningen blir felaktig eller ofullständig","category":"Underlagsbrist & data","trigger":"Fastighetsgränser i vatten, fiskerättigheter och delägarskap i vattenområden är svårutredda, och fel personer listas som berörda.","description":"Vattenrättslig prövning förutsätter att alla särskilt berörda identifieras, eftersom de har rätt att höras och kan få rätt till ersättning eller deltagande. Fastighetsindelning i vatten är ofta osäker, fiskerätt kan vara samfälld, och strandfastigheter kan ha skiftade gränser. En felaktig sakägarförteckning innebär att kungörelse och delgivning blir felaktig i den fortsatta processen, vilket är ett processuellt fel som kan ogiltigförklara beslutet. Det skapar också grogrund för sena, starka sakägarinvändningar som fördröjer ärendet.","motivation":"Välgrundat resonemang: delgivnings- och kungörelsefel är en av de vanligaste formella grunderna för återförvisning i vattenmål; LVV:s och MB 22 kap:s krav på att berörda ska höras gör en korrekt sakägarbild till en processförutsättning, inte bara en kvalitetsfråga.","affects":"B40-030 samt B40-N110 (anmälningsunderlag) och B40-P110 (ansökan) där sakägarförteckningen återanvänds.","impact":"Återförvisning på formella grunder, förlängd handläggning och skärpt motstånd från sakägare som upptäcker att de inte beretts möjlighet att yttra sig.","mitigation":"Beställ fastighetsutredning och lagfarts-/fiskerättskontroll via Lantmäteriet. Dubbelkolla delägar- och samfällighetsförhållanden innan underlaget låses.","source_refs":["MB","LVV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-050-01","node_id":"B40-050","chart_key":"B40","node_label":"Säkra rättighet eller omprojektera","title":"Förhandling om rättighet misslyckas och tvingar fram omprojektering","category":"Intressekonflikt & markåtkomst","trigger":"Fastighetsägaren vägrar sälja eller upplåta rättigheten, eller kräver ersättningsnivåer som projektet inte kan bära.","description":"När rådighet saknas återstår förvärv, upplåtelse, ändrad lokalisering eller nedläggning av åtgärden. Markägare som inser att deras samtycke är en processförutsättning har en stark förhandlingsposition och kan höja priset eller helt avböja. En omprojektering till ny lokalisering innebär att avgränsning (B40-010), klassificering (B40-G020) och underlag (B40-030) måste göras om helt eller delvis. Loopen tillbaka till B40-G040 kan upprepas flera gånger om den nya lokaliseringen stöter på nya rådighetsproblem.","motivation":"Välgrundat resonemang: eftersom rådighet är en absolut processförutsättning utan dispensmöjlighet (LVV 2 kap.) finns ingen processuell väg förbi en vägrande markägare annat än de tvångsrättsinstitut som själva kräver domstolsprövning; erfarenheten från svenska lednings- och dammprojekt visar att rättighetsförhandlingar är en av de vanligaste orsakerna till förskjutna tidplaner.","affects":"B40-050 med återkoppling till B40-G040 samt uppströms B40-010 och B40-030 vid omprojektering.","impact":"Långvarig fördröjning, ökade rättighetskostnader och i slutändan risk att åtgärden måste flyttas eller avbrytas.","mitigation":"Inled rättighetsförhandlingar parallellt med utredningsarbetet, ha en realistisk reservlokalisering och överväg tidigt om tvångsrättsinstituten (28 kap. MB) är framkomliga.","source_refs":["LVV","MB"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-050-02","node_id":"B40-050","chart_key":"B40","node_label":"Säkra rättighet eller omprojektera","title":"Säkrad rättighet täcker inte hela det slutliga prövningsobjektet","category":"Rättslig osäkerhet","trigger":"Rättigheten säkras utifrån ett preliminärt åtgärdsomfång, men projekteringen eller kompletteringarna ändrar sedan arbetsområdets utbredning.","description":"Rättighetsarbetet sker ofta parallellt med att projekteringen fortfarande rör sig. Om den slutliga ansökan eller anmälan omfattar större eller annorlunda belägna arbeten än de som rättigheterna täcker uppstår en lucka som inte upptäcks förrän domstolen eller tillsynsmyndigheten granskar rådigheten. Varje förändring av åtgärdens utbredning måste därför matchas mot rättighetsunderlaget på nytt. Annars är scenariot detsamma som vid ursprunglig rådighetsbrist: avvisning eller tvungen komplettering mitt i processen.","motivation":"Välgrundat resonemang kopplat till LVV 2 kap.: rådigheten prövas mot det faktiska åtgärdsområdet i ansökan, och praxis visar att domstolar kontrollerar att rådighetsunderlaget täcker hela det yrkade omfånget; förändringar under handläggningen kräver formell komplettering.","affects":"B40-050 och B40-G040 (förnyad kontroll) samt B40-P110/B40-P120 om bristen upptäcks sent.","impact":"Förnyade förhandlingar under pågående process, kompletteringsturer och försening.","mitigation":"Inför en rutin där varje projekteringsändring triggar rådighetskontroll. Teckna avtal med marginaler eller optionsklausuler för rimliga justeringar.","source_refs":["LVV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-060-01","node_id":"B40-060","chart_key":"B40","node_label":"Screena parallella prövningar","title":"Strandskyddsdispens missas vid screeningen","category":"Sektorssamordning","trigger":"Åtgärden ligger inom strandskyddsområde men projektet bedömer att åtgärden är undantagen eller att dispens är en formsak.","description":"Vattenverksamheter ligger ofta i eller nära strandskyddsområden, och ett vattentillstånd ersätter inte strandskyddsdispens. Dispersprövningen är avsedd att vara restriktiv och kräver särskilda skäl; kommunala dispensbeslut kan dessutom upphävas av länsstyrelsen eller i domstol. Om dispensbehovet inte fångas i screeningen kan projektet bygga vidare på ett vattenspår som senare blockeras av strandskyddsfrågan. Även en beviljad dispens kan vara ogiltig om fel instans eller fel grund använts.","motivation":"Strandskyddet är ett tungt vägande allmänt intresse där lagstiftaren förutsatt restriktivitet (Naturvårdsverkets dispensvägledning), och MÖD:s praxis (bl.a. MÖD 2020:2 och MÖD 2024:20) visar att dispenser återkommande upphävs eller avslås när avvägningen inte håller. Källa: Naturvårdsverket och lagen.nu.","affects":"B40-060 samt vägval B40-G070 och slutnoderna B40-E130/B40-N180 där parallella beslut ska vara klara.","impact":"Stopp i genomförandet trots vunnet vattentillstånd, fördröjning för nytt dispensärende och risk att projektet inte kan genomföras som planerat.","mitigation":"Ta fram en parallell tillståndsmatris med strandskydd som obligatorisk rad, kontrollera dispensgrunderna mot 7 kap. MB och invänta lagakraftvunnet dispensbeslut före byggstart.","source_refs":["MB","STRAND","EXT: Naturvårdsverket – Dispens från strandskyddet https://www.naturvardsverket.se/vagledning-och-stod/skyddad-natur/strandskydd/dispens-fran-strandskyddet/","EXT: MÖD 2020:2 https://lagen.nu/dom/mod/2020:2"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-060-02","node_id":"B40-060","chart_key":"B40","node_label":"Screena parallella prövningar","title":"Natura 2000-påverkan upptäcks först efter vägvalet","category":"Sektorssamordning","trigger":"Screeningen bygger på kartavstånd i stället för funktionell analys av påverkan på skyddsvärden, t.ex. hydrologisk koppling till ett Natura 2000-område.","description":"Natura 2000-prövning enligt 7 kap. MB är kumulativ och funktionell: även åtgärder utanför området kan kräva tillstånd om de påverkar skyddsvärdena, till exempel genom grundvattensänkning eller ändrad avrinning. En screening som bara tittar på om åtgärden ligger inom områdesgränsen missar hydrologiska kopplingar. Upptäcks påverkan först hos länsstyrelsen eller i domstolen kan hela spårvalet ha varit fel, eftersom Natura 2000-tillstånd eller undantagsprövning enligt 7 kap. 28 a–29 b §§ MB måste läggas till. Det kan också göra ett annars möjligt undantag i 11 kap. oanvändbart.","motivation":"Havsbaserad vindkraft är det tydligaste exemplet: projekt som Blekinge Offshore i Hanöbukten har prövats med Natura 2000 och fågelskydd som centrala frågor, och flera havsvindsprojekt (t.ex. Storgrundet) har nekats tillstånd med hänsyn till Natura 2000-värden. Källa: Naturvårdsverkets rapport om havsbaserad vindkraft och Eolus projektbeskrivning.","affects":"B40-060 samt B40-GE110 och vägval B40-G070; hela undantags- och anmälningsspåret påverkas.","impact":"Omarbetat vägval, kompletterande Natura 2000-prövning, fördröjning och i värsta fall avslag på undantagsgrunder.","mitigation":"Gör en tidig Natura 2000-screening med hydrologisk och ekologisk kopplingsanalys, inte bara avståndsmätning. Involvera länsstyrelsens Natura 2000-handläggare i dialogen.","source_refs":["MB","NATURA","EXT: Eolus – Blekinge Offshore https://www.eolus.com/projekt/blekinge-offshore/","EXT: Naturvårdsverket – Hur många fick lov? (havsbaserad vindkraft) https://www.naturvardsverket.se/4ac50a/contentassets/bc6e6986ab504e4b98c3c8e58a55223f/bilaga-hur-manga-fick-lov.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-060-03","node_id":"B40-060","chart_key":"B40","node_label":"Screena parallella prövningar","title":"Muddermassor, dumpning och sektorstillstånd staplas i fel ordning","category":"Sektorssamordning","trigger":"Åtgärden kräver även tillstånd för dumpning av muddermassor, ledningskoncession, kulturmiljötillstånd eller PBL-prövning, och dessa spår har motstridiga villkor eller tidplaner.","description":"En vattenverksamhet kan samtidigt utlösa dumpningstillstånd (15 kap. MB), anmälan enligt artskyddsförordningen, fornminnestillstånd enligt KML och bygglov enligt PBL. Sektorsspåren prövas av olika aktörer med olika tidsperspektiv, och ett beslut kan förutsätta ett annat. Om screeningen inte resulterar i en realistisk samordningsplan riskerar projektet att få ett vattentillstånd som inte kan utnyttjas förrän andra spår är klara – eller att behöva göra om utredningar när ett sektorsspår ställer villkor som förändrar åtgärden.","motivation":"Välgrundat resonemang: samordningsproblematiken är ett dokumenterat strukturproblem i svensk tillståndsprocess – SOU 2024:98 (En ny samordnad miljöbedömnings- och tillståndsprövningsprocess) och prop. 2023/24:152 bygger just på kritiken att parallella prövningar skapar dubbelarbete, motstridiga villkor och långa ledtider.","affects":"B40-060 samt samtliga nedströms spår; även B50 (sektorsspår) via parallel_process_refs.","impact":"Förskjuten byggberedskap, dubbelarbete i utredningar och risk för motstridiga villkor mellan tillstånden.","mitigation":"Upprätta en levande tillståndsmatris med ansvarig per spår och beroendeanalys. Avstäm tidplaner mellan spåren vid varje projektbesluts punkt.","source_refs":["MB","KML","PBL","EXT: SOU 2024:98 En ny samordnad miljöbedömnings- och tillståndsprövningsprocess https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-E130-01","node_id":"B40-E130","chart_key":"B40","node_label":"Slutför övriga prövningar och dokumentera bedömningen","title":"Undantagspaketet saknar spårbar bevisning vid senare tvist","category":"Underlagsbrist & data","trigger":"Dispenser, rättigheter, samråd och undantagsbedömningar slutförs men dokumenteras ostrukturerat eller spritt mellan konsulter och projektorganisationen.","description":"Undantagsspåret ger inget myndighetsbeslut som kan åberopas; projektets enda skydd vid framtida tillsyn eller tvist är det egna dokumentationspaketet. Om bevisningen för undantagsgrunden, Natura 2000-bedömningen och eventuella parallella dispenser inte är samlad, versionerad och spårbar kan projektet inte försvara sig när frågan aktualiseras – kanske många år senare av en ny ägare eller ny myndighetshandläggare. Personalomsättning och konsultbyten förvärrar problemet.","motivation":"Välgrundat resonemang: vid undantag enligt 11 kap. MB finns ingen rättskraftig instansprövning, vilket gör den egna dokumentationen till projektets enda rättsliga bevis; tillsynsärenden om äldre åtgärder visar att bristande arkivering återkommande leder till att verksamhetsutövare inte kan visa att åtgärden var laglig.","affects":"B40-E130 och överlämningen till B70-START; hela projektets rättsliga dokumentation.","impact":"Oförmåga att försvara genomförda arbeten vid tillsyn eller ägarbyte, med krav på återställning eller efterhandsprövning som möjlig följd.","mitigation":"Upprätta ett indexerat undantagspaket med beslutsunderlag, kartor, avtal och myndighetskontakter. Arkivera i projektets långsiktiga dokumentation och vid ägaröverlåtelse.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-E130-02","node_id":"B40-E130","chart_key":"B40","node_label":"Slutför övriga prövningar och dokumentera bedömningen","title":"Parallella beslut är inte lagakraftvunna vid byggstart","category":"Överklagande & rättsprocess","trigger":"Strandskyddsdispens, artskyddsdispens eller annat parallellt beslut är meddelat men ännu inte lagakraftvunnet när arbetena planeras starta.","description":"Noden samlar alla parallella prövningar före överlämning till byggberedskap, men beslut som kan överklagas är inte slutgiltiga förrän överklagandetiden löpt ut eller överinstansen avgjort. Strandskydds- och artskyddsbeslut överklagas relativt ofta av grannar och miljöorganisationer. Påbörjas arbeten innan lagakraft riskerar projektet att behöva riva eller återställa om beslutet upphävs. Detta är särskilt känsligt i vattenmiljö där återställning är dyr och tekniskt svår.","motivation":"MÖD:s praxis om strandskydd (bl.a. MÖD 2020:2 och upprepade upphävanden av kommunala dispensbeslut) visar att dispenser i strandskyddade områden överklagas och ogiltigförklaras med kort varsel; samma mönster gäller artskyddsdispenser där miljöorganisationer är aktiva klagande. Källa: lagen.nu och Naturvårdsverkets dispensvägledning.","affects":"B40-E130 och överlämningen till B70-START (byggberedskap).","impact":"Tvungna återställningsåtgärder, avbrutet bygge och förlorade investeringar om parallellt beslut upphävs efter påbörjat arbete.","mitigation":"Inför en lagakraftkontroll som formell startspärr: byggstart får inte beordras förrän samtliga parallella beslut vunnit laga kraft eller överklaganderisken medvetet accepterats på ledningsnivå.","source_refs":["MB","STRAND","ARTSKYDD","EXT: MÖD 2020:2 https://lagen.nu/dom/mod/2020:2"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-G020-01","node_id":"B40-G020","chart_key":"B40","node_label":"Är åtgärden vattenverksamhet?","title":"Felklassificering av tillfällig grundvattenbortledning","category":"Rättslig osäkerhet","trigger":"Projektägaren bedömer att en tillfällig grundvattensänkning för schaktning är 'obetydlig' och därmed inte vattenverksamhet enligt 11 kap. 3 § MB.","description":"Gränsdragningen mellan obetydlig grundvattenpåverkan och tillståndspliktig vattenverksamhet är notoriskt svår. Bedömningen kräver hydrogeologisk kunskap om inföde, påverkansområde och mottagare, och den görs ofta av projektledare utan sådan expertis. Klassificeras åtgärden fel bygger hela det fortsatta spårvalet på fel grund. Tillsynsmyndigheten kan i efterhand bedöma att tillstånd krävts och inleda tillsynsärende med förbud och återställningskrav. Överklagas frågan är det domstolens och inte projektägarens bedömning som gäller.","motivation":"Inom bergbyggnad och infrastruktur är grundvattenfrågan den dominerande vattenrättsliga konflikten; SGF:s vägledningar och MMD-praxis visar att infödesberäkningar och påverkansbedömningar regelmässigt ifrågasätts och att domstolar ställer höga krav på hydrogeologiskt underlag. Källa: Svenska Geotekniska föreningen rapport 2021:1 och 11 kap. 3 § MB.","affects":"B40-G020 samt vägvalet i B40-G070 och därmed samtliga fyra spår (undantag, anmälan, tillstånd, markavvattning).","impact":"Tillsynsingripande, återförvisning till tillståndsspåret, stoppade arbeten och återställningskostnader.","mitigation":"Anlita hydrogeolog för klassificeringen, gör en enkel infödesuppskattning och dokumentera bedömningen. Vid osäkerhet: kontakta tillsynsmyndigheten skriftligt innan arbetet påbörjas.","source_refs":["MB","EXT: SGF rapport 2021:1 Introduktion till bergbyggnad för geotekniker https://svenskageotekniskaforeningen.se/wp-content/uploads/Publikationer/SGF_Rapporter/2021_1_Introduktion_bergbyggnad_geotekniker.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G020-02","node_id":"B40-G020","chart_key":"B40","node_label":"Är åtgärden vattenverksamhet?","title":"Gränsdragning mot husbehov och undantagna smååtgärder feltolkas","category":"Rättslig osäkerhet","trigger":"Åtgärder som avledning av dagvatten, infiltration för att öka grundvattenmängden eller små vattentäkter antas falla utanför vattenverksamhetsbegreppet.","description":"Definitionen i 11 kap. 3 § MB omfattar även åtgärder på land som ändrar vattnets djup eller läge, samt infiltration och bortledande av grundvatten. Samtidigt finns undantag för husbehovstäkter och en del mindre åtgärder. Tolkningen av var gränsen går är oenhetlig i praktiken, och begrepp som 'vattenområde' och 'ändrat djup eller läge' har gett upphov till omfattande rättslig litteratur och tvister. En projektägare som lutar sig mot en generös tolkning riskerar att bygga utan tillstånd där domstol ser tillståndsplikt.","motivation":"Välgrundat rättsligt resonemang kopplat till 11 kap. 3 § MB: vattenverksamhetsbegreppet är avsiktligt brett och dess gränser har prövats i ett stort antal vattenmål; SOU 2023:72 (Gällande rätt för vattenfrågor) beskriver ingående gränsdragningsproblemen kring t.ex. vattentäkt och husbehovsförbrukning.","affects":"B40-G020 och B40-G070; felaktig klassificering följer med till B40-E130 eller B40-N110 och kan sprängas först vid tillsyn.","impact":"Retroaktiv tillståndsprövning, vite, återställningskrav och i allvarliga fall åtal för miljöbrott.","mitigation":"Gör en systematisk klassificering mot samtliga led i 11 kap. 3 § MB och dokumentera ställningstagandet. Ta in jurist eller sakkunnig vid gränsfall.","source_refs":["MB","EXT: SOU 2023:72 Gällande rätt för vattenfrågor https://data.riksdagen.se/dokument/hbb372"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G020-03","node_id":"B40-G020","chart_key":"B40","node_label":"Är åtgärden vattenverksamhet?","title":"Sammansatt åtgärd klassificeras bara delvis","category":"Teknisk komplexitet","trigger":"Åtgärden innehåller flera led – t.ex. pålning i vatten, muddring och grundvatteninfiltration – men bara det mest synliga ledet klassificeras.","description":"Klassificeringsnoden listar åtta olika åtgärdstyper, från vattenanläggning till markavvattning. I praktiken består projekt av kombinationer, och en klassificering som bara fångar huvudledet missar att t.ex. muddringsmassornas upplag eller grundvattenåterföringen också är vattenverksamhet. Varje led kan dessutom hamna i olika spår – delen kan vara anmälningspliktig medan helheten kräver tillstånd. En partiell klassificering ger ett underlag som inte håller för tillsynsmyndighetens eller domstolens helhetsbedömning.","motivation":"Erfarenheten från hamn-, bro- och kustskyddsprojekt (t.ex. Vellinge kommuns skydd mot höga havsnivåer, MMD-dom M 3258-18, 2020-05-07) visar att sammansatta åtgärder med vallar, pålning och avvattning prövas samlat och att varje del måste rymmas i ansökan. Källa: Växjö tingsrätts mark- och miljödomstol samt 11 kap. 2–3 §§ MB.","affects":"B40-G020 och B40-030 (underlagsbehov), samt vägval B40-G070.","impact":"Ofullständig ansökan eller anmälan, kompletteringstvång och fördröjning; i värsta fall ogiltigförklarat beslut vid överklagande.","mitigation":"Kartlägg åtgärden led för led mot 11 kap. 3 § MB:s samtliga punkter. Använd klassificeringsmatris och låt sakkunnig signera den.","source_refs":["MB","EXT: Växjö TR MMD M 3258-18 dom 2020-05-07 https://vellinge.se/siteassets/planer-och-projekt-i-vellinge-kommun/dokument/skydd-mot-hoga-havsnivaer/vaxjo-tr-m-3258-18-dom-2020-05-07_liten.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G040-01","node_id":"B40-G040","chart_key":"B40","node_label":"Finns rådighet över vattnet?","title":"Rådighetsbrist leder till avvisning utan sakprövning","category":"Intressekonflikt & markåtkomst","trigger":"Projektägaren saknar äganderätt, servitut, nyttjanderätt eller lagstadgad rådighet över hela det vattenområde där åtgärden ska bedrivas.","description":"Rådighet enligt LVV 2 kap. är en processförutsättning som sökanden ska styrka. Saknas rådighet avvisas ansökan utan att frågan om tillstånd ens prövas i sak, oavsett hur genomarbetat övrigt underlag är. Gränserna mellan fastigheters vatten är ofta osäkra, och en åtgärd kan sträcka sig över flera ägares vatten utan att projektägaren känner till det. Upptäcks bristen först i domstolen har hela ansökningsprocessen varit förgäves och återstår bara omförhandling eller omprojektering.","motivation":"Rådighetskravet tillämpas strikt: utan rådighet avvisas ansökan utan sakprövning (2 kap. LSV/LVV), och MÖD har i mål om dammrivning och biotopvårdande åtgärder (M 10181-19, slutligt beslut 2020-11-16) prövat just vilken rådighetsgrund som krävs för olika åtgärdstyper. Källa: Sveriges Domstolar och Skatteverkets rättsliga vägledning om vattenrätt.","affects":"B40-G040 och B40-050; vid oupptäckt brist även B40-P110 och B40-P120 där ansökan avvisas.","impact":"Avvisning, förlorad avgift och handläggningstid samt omstart av rättighetsarbetet – ofta med förhandlingar mot motvilliga grannar.","mitigation":"Gör en rådighetsutredning per åtgärdsdel med fastighetsgränser i vatten innan vägvalet. Säkra skriftliga avtal enligt LVV 2 kap. 2 § och dokumentera dem som bilaga.","source_refs":["LVV","EXT: MÖD M 10181-19 slutligt beslut 2020-11-16 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2020/m10181-19.-slutligt-beslut.-2020-11-16.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G040-02","node_id":"B40-G040","chart_key":"B40","node_label":"Finns rådighet över vattnet?","title":"Kommunal rådighet enligt LVV 2 kap. 5 § missförstås","category":"Rättslig osäkerhet","trigger":"En kommun eller annan aktör bygger sin prövningsrätt på 2 kap. 5 § LVV (vattenverksamhet önskvärd från allmän miljö- eller hälsosynpunkt) utan att förutsättningarna är uppfyllda.","description":"LVV 2 kap. 5 § ger kommuner och vissa andra rådighet för vattenverksamhet som är önskvärd från allmän miljö- eller hälsosynpunkt, men bestämmelsen tolkas restriktivt. Det räcker inte att kommunen anser projektet bra – verksamheten måste vara av det slag bestämmelsen avser och övriga förutsättningar vara uppfyllda. Bygger ett klimatanpassnings- eller miljöprojekt på en för vid tolkning kan rådighetsgrund falla i domstolen, med avvisning eller ogiltigförklaring som följd.","motivation":"I Högsta domstolens prövning av kommunalt skydd mot höga havsnivåer (rörande Vellinge, Svea hovrätt M 7988-22 slutligt beslut 2024-04-26) prövades uttryckligen om kommunerna hade vattenrättslig rådighet via 2 kap. 5 § LSV – ett aktuellt exempel på att bestämmelsens räckvidd är tvistig även för angelägna klimatåtgärder. Källa: Svea hovrätts mark- och miljööverdomstol.","affects":"B40-G040 och B40-050; i förlängningen hela tillståndsspåret B40-P110–B40-P120.","impact":"Avvisning eller upphävt tillstånd efter lång process, med försenade klimat- och miljöåtgärder som följd.","mitigation":"Pröva 5 §-förutsättningarna med jurist, inhämta förhandsbesked i möjlig mån och säkra kompletterande avtalsrådighet med fastighetsägarna som reserv.","source_refs":["LVV","EXT: Svea hovrätt MÖD M 7988-22 slutligt beslut 2024-04-26 https://www.vastervik.se/contentassets/3cf5dfb4ab004f9dac8ac4195c0f9467/svea_hr_m_7988-22_slutligt_beslut_sarskilt_uppsatt_2024-04-26.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G040-03","node_id":"B40-G040","chart_key":"B40","node_label":"Finns rådighet över vattnet?","title":"Avtal om rådighet håller inte för domstolens krav","category":"Intressekonflikt & markåtkomst","trigger":"Rådighetsavtal är muntliga, äldre än den tillåtna avtalstiden eller tecknade av fel part (t.ex. en delägare utan fullmakt).","description":"Avtalsrådighet enligt LVV 2 kap. 2 § ställer krav på form och innehåll, och avtal om rådighet utan äganderätt är tidsbegränsade. Vid flera berörda fastigheter krävs att samtliga behöriga avtalsparter omfattas. Ett avtal som visar sig bristfälligt under handläggningen kan inte lappas i efterhand utan att ansökan dras tillbaka eller kompletteras formellt. Motparter har starkt incitament att angripa rådigheten, eftersom det är det enklaste sättet att fälla en ansökan.","motivation":"I MMD:s prövning av nya tunnelbanan (Nacka tingsrätt MMD, mål M 10098-24, deldom 2026-03-27) behandlas rådigheten som en styrkningsfråga som sökanden måste visa – avtal och lagrum åberopas och granskas ingående. Källa: Nacka tingsrätts mark- och miljödomstol samt LVV 2 kap.","affects":"B40-G040 och B40-050 (loopen för att säkra rättighet), samt B40-P120 vid registrerat mål.","impact":"Avvisning eller omfattande komplettering, försening och försvagad förhandlingsposition mot markägarna.","mitigation":"Låt fastighetsjurist granska avtal mot LVV:s krav, använd skriftliga avtal med tydliga åtgärdsbeskrivningar och kontrollera firmateckning och fullmakter.","source_refs":["LVV","EXT: Nacka TR MMD M 10098-24 deldom 2026-03-27 https://nyatunnelbanan.se/wp-content/uploads/2025/04/Nacka-TR-M-10098-24-Deldom-2026-03-27.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G070-01","node_id":"B40-G070","chart_key":"B40","node_label":"Bestäm 11 kap.-väg","title":"Fel spår väljs: undantag trots att tillståndsplikt föreligger","category":"Rättslig osäkerhet","trigger":"Projektägaren väljer undantags- eller anmälningsspår utan att ha styrkt att förutsättningarna i 11 kap. 11–16 §§ MB och FVV 19 § faktiskt är uppfyllda.","description":"Vägvalet mellan undantag, anmälan, tillstånd och markavvattning är processens mest konsekvensrika beslut. Ett undantag som grundas på att det är 'uppenbart' att intressen inte skadas kräver en dokumenterad bedömning som håller vid tillsyn och överklagande. Väjs fel spår kan arbeten ha hunnit utföras innan tillsynsmyndigheten ingriper, vilket förvandlar en processfråga till ett ärende om olaglig vattenverksamhet. Även om dialog med tillsynsmyndigheten rekommenderas är det projektägaren som bär risken för valet.","motivation":"Erfarenheten från länsstyrelsernas tillsyn visar att återkommande ingripanden gäller åtgärder som utförts med stöd av felaktigt tillämpade undantag; Naturvårdsverkets vägledning om markavvattning betonar att undantagen ska tillämpas restriktivt och att bevisbördan ligger hos verksamhetsutövaren. Källa: Naturvårdsverket och MB 11 kap. 11–16 §§.","affects":"B40-G070 och samtliga fyra grenar B40-GE100, B40-GN100, B40-P100 och B40-GM100.","impact":"Tillsynsingripande med förbud och återställningskrav, tvingad ansökan i efterhand, försening och möjlig straffrättslig exponering.","mitigation":"Dokumentera vägvalet skriftligt med hänvisning till lagrum och tröskelvärden. Begär skriftlig bekräftelse eller åtminstone dokumenterad dialog med tillsynsmyndigheten innan arbeten påbörjas.","source_refs":["MB","FVV","EXT: Naturvårdsverket – Markavvattning https://www.naturvardsverket.se/vagledning-och-stod/branscher-och-verksamheter/markavvattning/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-G070-02","node_id":"B40-G070","chart_key":"B40","node_label":"Bestäm 11 kap.-väg","title":"Muntlig myndighetsdialog ger falsk trygghet","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten lämnar muntliga eller informella besked om vilket spår som är rätt, utan att beskedet är bindande eller dokumenterat.","description":"Noden rekommenderar dialog med tillsynsmyndigheten, men ett informellt besked är inte rättsligt bindande och kan inte åberopas vid överklagande eller tillsyn av en annan myndighet. Handläggare byts, organisationer förändras och ett muntligt 'det låter som anmälan räcker' försvinner när ärendet väl granskas. Projektägare som bygger hela vägvalet på ett mötesantecknat besked står utan skydd när beskedet bestrids. Dessutom kan olika länsstyrelser bedöma liknande åtgärder olika.","motivation":"Välgrundat resonemang: förhandsbesked av myndigheter är inte bindande enligt allmän förvaltningsrättslig princip, och länsstyrelsernas skilda praxis i vattenfrågor är väldokumenterad i bl.a. Naturvårdsverkets vägledningsarbete och riksdagens debatt om likabehandling i miljöprövningen.","affects":"B40-G070 och alla nedströms spår; särskilt känsligt i B40-GE100 och B40-GN100 där bedömningen är diskretionär.","impact":"Förlorad bevisning för vägvalet, omprövning av spårvalet och försening när myndighetens slutliga bedömning avviker från det informella beskedet.","mitigation":"Begär alltid skriftligt svar, diarieför dialogen och låt egen sakkunnig göra en oberoende bedömning av spårvalet som komplement.","source_refs":["MB","FVV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-G070-03","node_id":"B40-G070","chart_key":"B40","node_label":"Bestäm 11 kap.-väg","title":"Markavvattning förväxlas med övrig vattenverksamhet","category":"Rättslig osäkerhet","trigger":"Åtgärden har både avvattnande och andra syften, och projektägaren väljer anmälnings- eller tillståndsspår trots att den särskilda markavvattningsregleringen ska tillämpas.","description":"Markavvattning är särreglerad i 11 kap. MB: den omfattas inte av de generella undantagen i 12 § och kräver alltid tillstånd eller täcker täckdikningsundantaget. En åtgärd som i praktiken varaktigt ökar en fastighets lämplighet genom avvattning är markavvattning även om den presenteras som något annat, t.ex. erosionsskydd eller dränering. Fel vägval innebär att ansökan hamnar hos fel instans (MMD i stället för länsstyrelse) eller att åtgärden utförs utan det tillstånd som krävs.","motivation":"SOU 2026:18 (Odlingstorv och klimatet) slår uttryckligen fast att markavvattning regleras särskilt och inte omfattas av undantaget i 11 kap. 12 § MB – en felbedömning som regelbundet återkommer i tillsynsärenden om dikning. Källa: SOU 2026:18 och MB 11 kap. 13 §.","affects":"B40-G070 och grenen B40-GM100–B40-M160; fel val kan också smitta B40-P100 om tillstånd söks hos fel instans.","impact":"Avvisning eller återförvisning till rätt instans, förlorad handläggningstid och risk för ingripande mot redan utförda dikningsåtgärder.","mitigation":"Analysera åtgärdens faktiska syfte och varaktighet mot 11 kap. 2 § MB:s definition. Vid osäkerhet, behandla åtgärden som markavvattning och kontrollera förbuds- och dispensreglerna direkt.","source_refs":["MB","FVV","EXT: SOU 2026:18 Odlingstorv och klimatet https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/odlingstorv-och-klimatet_heb318/html/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE100-01","node_id":"B40-GE100","chart_key":"B40","node_label":"Är undantagsgrunden styrkt?","title":"'Uppenbart'-kriteriet går inte att styrka i efterhand","category":"Rättslig osäkerhet","trigger":"Undantaget bygger på en egen bedömning att det är uppenbart att varken allmänna eller enskilda intressen skadas, men dokumentationen saknar substans.","description":"Undantaget i 11 kap. 11–12 §§ MB förutsätter att skada är utesluten, inte bara osannolik. Bevisbördan ligger på verksamhetsutövaren, och en bedömning som gjorts utan fältundersökning, sakägarkartläggning eller hydrologisk analys håller inte om en granne, fiskevårdsförening eller tillsynsmyndighet ifrågasätter den. Åtgärder som påverkar vattenförhållandena har ofta effekter som inte är uppenbara – grundvattenpåverkan kan slå mot brunnar hundratals meter bort. Ett underbyggt undantag kan därför slås ut långt efter att arbetet slutförts.","motivation":"Välgrundat rättsligt resonemang kopplat till 11 kap. 12 § MB: rekvisitet 'uppenbart' är avsett att tillämpas restriktivt, och förarbetena (prop. 1997/98:45) understryker att osäkerhet ska slå till tillståndspliktens fördel; länsstyrelsernas tillsynspraxis bekräftar att bristfällig dokumentation är den vanligaste orsaken till ingripanden mot påstått undantagna åtgärder.","affects":"B40-GE100 och B40-E130; vid ingripande även B40-GN100/B40-P100 eftersom rätt spår måste väljas om.","impact":"Förbud, återställningskrav och tvingad tillståndsprocess i efterhand, ofta med pågående eller redan utförda arbeten.","mitigation":"Bygg ett undantagsbeslut på fältdata, sakägarkartläggning och skriftligt motiverad bedömning som arkiveras. Låt sakkunnig granska att 'uppenbart'-kriteriet verkligen är uppfyllt.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE100-02","node_id":"B40-GE100","chart_key":"B40","node_label":"Är undantagsgrunden styrkt?","title":"Särskilt undantag i 11 kap. 15–16 §§ tolkas för extensivt","category":"Rättslig osäkerhet","trigger":"Undantagen för vissa ledningsdragningar eller andra särskilt reglerade åtgärder tillämpas utan att samtliga rekvisit (t.ex. anmälan vid skada på fisket) iakttas.","description":"De särskilda undantagen i 11 kap. 15–16 §§ MB är villkorade: vissa åtgärder är undantagna tillståndsplikt men ska ändå anmälas om fisket kan skadas, och andra förutsätter att åtgärden ligger inom angivna gränser. En tolkning som bara ser till huvudundantaget och inte till villkoren skapar en formell brist som kan utnyttjas av motparter. Tillsynsmyndigheten kan också bedöma att villkoren inte var uppfyllda och att åtgärden därmed var tillståndspliktig.","motivation":"Välgrundat resonemang: 11 kap. 15 § MB:s anmälningsplikt vid skada på fisket är ett ofta förbisett villkor – länsstyrelsernas vägledningar om sura sulfatjordar och dikning visar att just fiskehänsynen är det som utlöser anmälningsplikt trots annars gällande undantag. Källa: Länsstyrelsen Västra Götaland och MB 11 kap. 15 §.","affects":"B40-GE100 och B40-GN100 (anmälan kan ändå krävas) samt B40-E130.","impact":"Formellt felaktigt undantag, tillsynsärende och behov av att komplettera med anmälan eller tillståndsansökan i efterhand.","mitigation":"Kontrollera varje undantagsrekvisit separat, inklusive anmälningsvillkor och geografiska gränser. Dokumentera att samtliga villkor är uppfyllda, inte bara huvudundantaget.","source_refs":["MB","EXT: Länsstyrelsen – Miljöproblemet sura sulfatjordar https://www.lansstyrelsen.se/download/18.8cd5a1b19362fb4fc23808/1732539539998/Miljöproblemet sura sulfatjordar.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE100-03","node_id":"B40-GE100","chart_key":"B40","node_label":"Är undantagsgrunden styrkt?","title":"Förändrade förhållanden gör undantaget inaktuellt","category":"Extern händelse","trigger":"Nya skyddsbeslut, nya kunskapslägen om arters förekomst eller ändrade hydrologiska förhållanden uppstår mellan bedömningen och genomförandet.","description":"Ett undantag bedöms vid en tidpunkt men åtgärden kan utföras år senare. Under tiden kan området ha blivit naturreservat eller Natura 2000-område, nya artfynd kan ha gjorts eller vattenförhållandena kan ha ändrats genom andra åtgärder. Undantagsbedömningen är då inte längre aktuell, men projektet fortsätter som om inget hänt. Eftersom undantaget inte resulterar i något beslut finns ingen instans som automatiskt uppmärksammar förändringen – ansvaret ligger helt på projektägaren.","motivation":"Välgrundat resonemang: till skillnad från tillstånd och anmälan får undantaget ingen myndighetsprövning, vilket gör att skyddsvärdet av dokumentationen är projektets enda försvar; erfarenheten från svensk tillsyn visar att förändrade omständigheter (nya skyddsområden, nya artfynd) är en återkommande grund för att ifrågasätta äldre undantagsbedömningar.","affects":"B40-GE100 och B40-E130, samt B40-GE110 om nya Natura 2000-frågor tillkommit.","impact":"Inkräktande på nya skyddsvärden, tillsynsingripande och möjlig återställningsskyldighet trots att undantaget var korrekt när det gjordes.","mitigation":"Inför ett giltighetsdatum i undantagsdokumentationen och gör en ny kontroll av skydds- och artläget innan arbeten påbörjas, särskilt om tiden gått.","source_refs":["MB","NATURA"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-GE110-01","node_id":"B40-GE110","chart_key":"B40","node_label":"Kan Natura 2000 påverkas betydande?","title":"Kumulativa effekter på Natura 2000 underskattas","category":"Rättslig osäkerhet","trigger":"Bedömningen tittar bara på den egna åtgärdens effekter och bortser från sammantagna effekter med andra planer och projekt i samma vattensystem.","description":"Natura 2000-prövningen enligt 7 kap. 28 a § MB kräver att åtgärdens effekter bedöms både separat och i kombination med andra planer och projekt. I vattensystem med många pågående åtgärder – vattenkraftsomprövningar, dikning, kustskydd, hamnarbeten – kan en liten åtgärd bli den som fäller den kumulativa bedömningen. En projektägare som inte kartlägger övriga aktuella åtgärder i avrinningsområdet kan därför inte veta om betydande påverkan kan antas. Missbedöms detta är undantaget från 11 kap. värdelöst, eftersom Natura 2000-kraven gäller oberoende.","motivation":"Habitatdirektivets och MÖD:s praxis kräver kumulativ bedömning; Naturvårdsverkets vägledning om Natura 2000 och erfarenheten från havsbaserad vindkraft (där flera projekt i samma region bedömts gemensamt, t.ex. Blekinge Offshore i Hanöbukten) visar att kumulativa effekter är ett genomslagskraftigt avslagsargument. Källa: Naturvårdsverket och Eolus.","affects":"B40-GE110 och B40-E130; vid positiv bedömning aktualiseras separat Natura 2000-tillstånd som förlänger hela spåret.","impact":"Krävt Natura 2000-tillstånd mitt i processen, fördröjning och risk för avslag om alternativ- eller tvingande-skäl-prövning inte kan genomföras.","mitigation":"Kartlägg andra planerade och pågående åtgärder i vattendistriktet via länsstyrelsens register och vattenmyndighetens åtgärdsprogram. Gör kumulativ analys i screeningen.","source_refs":["MB","NATURA","EXT: Eolus – Blekinge Offshore https://www.eolus.com/projekt/blekinge-offshore/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE110-02","node_id":"B40-GE110","chart_key":"B40","node_label":"Kan Natura 2000 påverkas betydande?","title":"Undantaget förväxlas med befrielse från Natura 2000-kraven","category":"Rättslig osäkerhet","trigger":"Projektet antar att ett beviljat eller bedömt undantag enligt 11 kap. MB innebär att ingen separat Natura 2000-prövning behövs.","description":"Noden pekar uttryckligen på att ett undantag från 11 kap. aldrig undanröjer kravet på Natura 2000-tillstånd. Ändå är förväxlingen vanlig i praktiken, eftersom undantagsspåret inte har någon myndighetskontroll som automatiskt fångar frågan. Om åtgärden kan påverka ett Natura 2000-område betydande krävs tillstånd av länsstyrelsen enligt 7 kap. 28 b § MB, och arbeten som påbörjats utan detta är olagliga oavsett vattenrättslig status. Ansvaret ligger helt på verksamhetsutövaren att driva båda spåren parallellt.","motivation":"Välgrundat rättsligt resonemang kopplat till MB 11 kap. 9 § tredje stycket och 7 kap. 28 a–29 b §§: regelverken är kumulativa, och Naturvårdsverkets vägledning om Natura 2000 betonar att art- och habitatdirektivets krav gäller oavsett nationella tillståndsundantag.","affects":"B40-GE110 och B40-E130; i praktiken hela undantagsspårets giltighet.","impact":"Olagligt genomförande trots vattenrättsligt undantag, tillsyn, återställningskrav och skadat skyddsområde.","mitigation":"Inför en obligatorisk Natura 2000-checkpunkt i undantagsspåret med dokumenterad bedömning av betydande påverkan, separat från 11 kap.-bedömningen.","source_refs":["MB","NATURA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE110-03","node_id":"B40-GE110","chart_key":"B40","node_label":"Kan Natura 2000 påverkas betydande?","title":"Betydandeprövningen görs utan tillräckligt ekologiskt underlag","category":"Underlagsbrist & data","trigger":"Bedömningen av om betydande påverkan kan antas görs på generella kartdata utan fältinventering av skyddsvärdena i påverkansområdet.","description":"Betydandeprövningen kräver kunskap om vilka arter och naturtyper som är områdets skyddsvärden och hur åtgärden påverkar dem, inklusive hydrologiska samband. Generella kartlager (t.ex. artportalsdata) är ofta ofullständiga för små vatten och grundvattenberoende naturtyper. Utan fältinventering kan bedömningen inte visa att betydande påverkan är utesluten, och länsstyrelsen kan då begära komplettering eller ställa sig negativ. Inventeringar är dessutom säsongsberoende, vilket kan skjuta beslutet ett år framåt.","motivation":"Erfarenheten från svenska Natura 2000-prövningar visar att skyddsvärdeinventeringar med fel säsong eller för grov metodik är en av de vanligaste orsakerna till kompletteringskrav; Naturvårdsverkets vägledning ställer krav på att bedömningen ska bygga på områdesspecifik kunskap om bevarandestatus. Källa: Naturvårdsverket – Natura 2000 i Sverige.","affects":"B40-GE110 och B40-E130 samt uppströms B40-030 om inventeringar måste kompletteras.","impact":"Fördröjning om en eller flera inventeringssäsonger och osäker ställning i dialogen med länsstyrelsen.","mitigation":"Planera art- och naturtypsinventeringar i rätt säsong tidigt, kartlägg skyddsvärdena via bevarandeplanen och dokumentera osäkerheter med försiktighetsprincipen.","source_refs":["MB","NATURA","ART"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE120-01","node_id":"B40-GE120","chart_key":"B40","node_label":"Krävs 12:6-samråd?","title":"12:6-samrådet missas trots väsentlig naturmiljöpåverkan","category":"Rättslig osäkerhet","trigger":"Åtgärden bedöms som undantagen och projektägaren slår sig till ro utan att pröva om åtgärden kan komma att väsentligt ändra naturmiljön.","description":"MB 12 kap. 6 § kräver samråd med länsstyrelsen för åtgärder som inte prövas i annan ordning men som kan antas väsentligt ändra naturmiljön. Bestämmelsen är utformad som ett skyddsnät för just de undantagna åtgärder som ändå kan ha stor miljöpåverkan. Rekvisitet 'väsentligt ändra naturmiljön' är vagt och tolkas olika, men underlåten samrådsanmälan kan leda till förbud eller föreläggande enligt 26 kap. MB. Många projektägare känner inte till bestämmelsen alls, eftersom den ligger utanför 11 kap.","motivation":"Välgrundat resonemang: 12 kap. 6 § MB är en ofta förbisedd bestämmelse som infördes för att fånga åtgärder i skyddsluckan mellan tillståndspliktiga verksamheter; länsstyrelser har i flera tillsynsärenden förbjudit pågående arbeten där samrådsanmälan underlåtits. Källa: MB 12 kap. 6 § och länsstyrelsernas tillsynspraxis.","affects":"B40-GE120 och B40-E130; missat samråd kan tvinga fram ny prövning och stoppa genomförandet.","impact":"Förbud eller föreläggande mot pågående arbete, fördröjning för efterhandsamråd och försämrad relation till länsstyrelsen.","mitigation":"Gör en uttrycklig 12:6-bedömning i undantagsdokumentationen. Vid minsta osäkerhet: skicka samrådsanmälan – kostnaden är liten jämfört med risken.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GE120-02","node_id":"B40-GE120","chart_key":"B40","node_label":"Krävs 12:6-samråd?","title":"Samrådet drar ut på tiden utan formell tidsgräns","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen hanterar samrådsanmälan med låg prioritet eftersom bestämmelsen saknar lagfästa handläggningstider.","description":"Till skillnad från anmälan enligt FVV har 12:6-samrådet inga tydliga lagreglerade tidsramar, och länsstyrelsens handläggning kan dra ut på tiden utan att projektägaren har effektiva rättsmedel att påskynda den. Under samrådet kan länsstyrelsen begära kompletteringar och föreslå ändringar som påverkar projektets utformning. För projekt med säsongbundet genomförande (t.ex. arbete i vatten utanför lektid) kan en försening innebära att hela arbetsfönstret missas.","motivation":"Välgrundat resonemang: handläggningstider hos länsstyrelser i miljöärenden är ett dokumenterat problem – Naturvårdsverkets statistik över handläggningstider och riksdagsmotioner om miljöprövningens effektivitet visar på betydande variationer och köer, särskilt i ärenden utan lagfästa tidsgränser.","affects":"B40-GE120 och B40-E130 samt överlämningen till B70 (byggberedskap).","impact":"Fördröjning av byggstart, förlorat arbetsfönster och merkostnad för omplanering av entreprenad.","mitigation":"Skicka samrådsanmälan tidigt, med komplett underlag, och följ upp aktivt. Bygg in tidbuffert i genomförandeplanen för samrådets osäkra varaktighet.","source_refs":["MB","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GM100-01","node_id":"B40-GM100","chart_key":"B40","node_label":"Är åtgärden markavvattning?","title":"Gränsen mellan markavvattning och tillfällig sänkning dras fel","category":"Rättslig osäkerhet","trigger":"Åtgärden presenteras som tillfällig grundvattensänkning eller dränering men har i praktiken det varaktiga syfte som kvalificerar som markavvattning enligt 11 kap. 2 § MB.","description":"Markavvattning definieras av syftet: att varaktigt öka en fastighets lämplighet för ändamålet genom avvattning, sänkning, urtappning eller skydd mot vatten. Gränsen mot tillfälliga byggåtgärder och mot annan vattenverksamhet är subtil och avgör vilken instans och vilket regelverk som gäller. En feltolkning kan innebära att projektet hamnar i tillståndsspåret hos MMD när länsstyrelsen är rätt instans – eller tvärtom – och att förbuds- och dispensreglerna i FVV 4–4 c §§ aldrig prövas trots att de gäller.","motivation":"MÖD:s dom M 6347-23 (2024-09-13) om skillnaden mellan underhåll av täckdikning och nydikning visar att gränsdragningen i dikningsfrågor är levande praxis; SOU 2026:18 bekräftar att markavvattningsbegreppet fortsatt skapar tillämpningsproblem. Källa: MÖD M 6347-23 och SOU 2026:18.","affects":"B40-GM100 och grenvalet mellan B40-GM110 och de övriga spåren.","impact":"Fel instans och fel regelverk, med avvisning, omhandläggning och risk för ingripande mot utförda dikningsåtgärder.","mitigation":"Analysera åtgärdens faktiska syfte och varaktighet dokumenterat. Vid tveksamhet: ansök om markavvattningstillstånd hos länsstyrelsen, som även kan överlämna till MMD vid behov.","source_refs":["MB","FVV","EXT: MÖD M 6347-23 dom 2024-09-13 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/m6347-23-dom-2024-09-13.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GM100-02","node_id":"B40-GM100","chart_key":"B40","node_label":"Är åtgärden markavvattning?","title":"Skydds- och nyttointressen i avvattningen bortfaller ur analysen","category":"Intressekonflikt & markåtkomst","trigger":"Klassificeringen fokuserar på tekniken och missar att markavvattning per definition berör andra fastighetsägares nytta och skador, inklusive väghållare.","description":"Markavvattning är ett kollektivt institut: fastigheter som har nytta av avvattningen ska som huvudregel delta i verksamheten och kostnaderna, och väghållare kan räknas in om vägen har avsevärd inverkan. Klassificeringsnoden är därför inte bara en juridisk etikett utan startpunkten för en intressentanalys. Missar projektet att identifiera deltagande- och ersättningsintressena tidigt byggs ansökan på en felaktig bild av vem som ska bära kostnaderna, vilket garanterar tvister senare.","motivation":"MÖD:s avgörande M 4651-18 behandlar just deltagande- och kostnadsfördelningsreglerna i LVV 3 kap. och visar att frågan om vilka fastigheter och väghållare som ska delta är en av markavvattningsmålens mest tvistiga delar. Källa: MÖD M 4651-18.","affects":"B40-GM100, B40-GM140 (överlämnandefrågan) och B40-M150/B40-M160.","impact":"Kostnadsfördelningstvister, överlämnande till MMD och förlängd process.","mitigation":"Kartlägg nytta och skador för samtliga berörda fastigheter och väghållare redan vid klassificeringen. Inled dialog om deltagande före ansökan.","source_refs":["LVV","MB","EXT: MÖD M 4651-18 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2019/m-4651-18.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GM110-01","node_id":"B40-GM110","chart_key":"B40","node_label":"Gäller täckdikningsundantag eller förbudsområde?","title":"Täckdikningsundantagets 300 mm-gräns och jordbruksmarksrekvisit överskrids","category":"Rättslig osäkerhet","trigger":"Dräneringen dimensioneras större än 300 mm eller görs på mark som inte är jordbruksmark, men behandlas som undantagen täckdikning.","description":"Undantaget för täckdikning i 11 kap. 13 § MB är snävt: det gäller täckdikning av jordbruksmark med dräneringsrör upp till 300 mm diameter, och det gäller inte om allmänna eller enskilda intressen skadas. Gränsen mellan underhåll av befintlig dikning och nydikning är dessutom avgörande – förstärkning eller fördjupning är nydikning som kan kräva tillstånd. I praktiken missförstås undantaget ofta som ett generellt frikort för dränering, vilket leder till tillståndspliktiga åtgärder utan tillstånd.","motivation":"MÖD:s dom M 6347-23 (2024-09-13) drar uttryckligen gränsen mellan underhåll (tillåtet) och nydikning (prövningspliktigt), och Naturvårdsverkets vägledning om markavvattning slår fast att 300 mm-undantaget är det enda undantaget från tillståndsplikten. Källa: MÖD M 6347-23 och Naturvårdsverket.","affects":"B40-GM110 och grenvalet till B40-M130 respektive B40-E130.","impact":"Olaglig markavvattning, tillsynsingripande och i efterhand krävd ansökan om tillstånd och eventuellt dispens.","mitigation":"Dokumentera dimension, markslag och om åtgärden är underhåll eller nydikning. Vid fördjupning eller förstärkning: behandla som ny åtgärd och pröva tillståndsplikten.","source_refs":["MB","FVV","EXT: Naturvårdsverket – Markavvattning https://www.naturvardsverket.se/vagledning-och-stod/branscher-och-verksamheter/markavvattning/","EXT: Jordbruksverket – Vattenverksamhet och vattenanläggningar https://jordbruksverket.se/vaxter/odling/vattenhushallning/vattenverksamhet-och-vattenanlaggningar"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GM110-02","node_id":"B40-GM110","chart_key":"B40","node_label":"Gäller täckdikningsundantag eller förbudsområde?","title":"Markavvattningsförbudet i södra Sverige förbises","category":"Rättslig osäkerhet","trigger":"Projektet känner inte till att större delen av södra Sverige omfattas av markavvattningsförbud enligt 11 kap. 14 § MB och FVV 4–4 c §§, och att dispens krävs utöver tillstånd.","description":"I förbudsområdena räcker inte tillstånd – länsstyrelsen måste dessutom meddela dispens från förbudet, och dispens ska ges restriktivt, i princip bara om området saknar betydelse från naturvårdssynpunkt. Förbudskartläggningen är en egen kunskapsuppgift: gränserna följer länsgränser och särskilt värdefulla våtmarker. Projekt som planerar dikning i södra Sverige utan att ha dispensfrågan i tidplanen riskerar att upptäcka ett extra, ofta avgörande hinder först vid ansökan.","motivation":"Länsstyrelsen Västra Götaland och Naturvårdsverket slår fast att markavvattning som kräver tillstånd är förbjuden i hela södra Sverige med dispens som enda väg, och att dispensmöjligheten är avsedd att användas restriktivt (Naturvårdsverkets rapport 7072). Källa: Naturvårdsverket och länsstyrelserna.","affects":"B40-GM110, B40-M120 och B40-M130; dispensbeslutets utfall avgör om ansökan överhuvudtaget är meningsfull.","impact":"Extra processled med osäker utgång, fördröjning och möjligt totalt hinder för avvattningen.","mitigation":"Kontrollera förbudsläget hos länsstyrelsen innan projektet dimensioneras. Där förbud gäller: utred dispensförutsättningarna först och ha alternativ utförandeplan utan avvattning.","source_refs":["MB","FVV","EXT: Naturvårdsverket – Styrmedel för markavvattning (rapport 7072) https://www.naturvardsverket.se/4acc02/globalassets/media/publikationer-pdf/7000/978-91-620-7072-4.pdf","EXT: Länsstyrelsen Västra Götaland – Markavvattning https://www.lansstyrelsen.se/vastra-gotaland/miljo-och-vatten/atgarder-och-verksamheter-i-vatten/markavvattning.html"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GM140-01","node_id":"B40-GM140","chart_key":"B40","node_label":"Ska ärendet överlämnas till MMD?","title":"Obligatoriskt överlämnande upptäcks sent och nollställer länsstyrelsens arbete","category":"Överklagande & rättsprocess","trigger":"Under handläggningen framställs yrkande om annans deltagande, tvångsrätt, ersättning eller inlösen, vilket enligt LVV 7 kap. 19 § tvingar länsstyrelsen att överlämna ärendet till MMD.","description":"Överlämnandeplikten aktiveras av motparternas yrkanden, inte av sökandens plan. Ett ärende som börjat som en enkel ansökan hos länsstyrelsen kan därför mitt i processen flyttas till domstol, där det går in i MMD:s ordinarie ansökningsprocess med kungörelse, yttranden och eventuell huvudförhandling. Länsstyrelsen ska visserligen bifoga ett yttrande, men domstolen gör en egen prövning. För sökanden innebär överlämnandet i praktiken en process omstart med domstolens längre ledtider.","motivation":"LVV 7 kap. 19 § är ett vedertaget tvångsled i markavvattningsärenden; bestämmelsens text är entydig (skall överlämna vid yrkande om deltagande, tvångsrätt eller ersättning) och domstolarnas handläggarstöd beskriver att överlämnade ärenden behandlas som vanliga ansökningsmål. Källa: LVV och Miljösamverkan Sverige.","affects":"B40-GM140 och B40-M160; ersätter B40-M150 som beslutsled.","impact":"Omstart i domstol med åtskilliga månaders till års förlängning och nya kostnader för processföring.","mitigation":"Kartlägg deltagande- och ersättningsfrågorna före ansökan och försök lösa dem i avtal, så att inga tvingande yrkanden framställs. Räkna i tidplanen med att överlämnande kan ske.","source_refs":["LVV","COURT_WV","EXT: LVV 7 kap. 19 § via Miljölagar (WSP) https://compliance.wsp.com/customer/1791/pdf/Miljolagar2020_upd1.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-GM140-02","node_id":"B40-GM140","chart_key":"B40","node_label":"Ska ärendet överlämnas till MMD?","title":"Diskretionärt överlämnande vid berörda tredje fastigheter skapar oförutsägbarhet","category":"Rättslig osäkerhet","trigger":"Länsstyrelsen utnyttjar möjligheten att överlämna ärendet till MMD eftersom andra fastigheter än sökandens kan beröras, trots att projektet planerat för ett länsstyrelsebeslut.","description":"Utöver den obligatoriska regeln får länsstyrelsen överlämna ärenden där andra fastigheter kan komma att beröras. Bedömningen är diskretionär och svår att förutse: samma typ av ärende kan stanna hos en länsstyrelse men skickas vidare av en annan. Osäkerheten gör att projektet inte kan lita på länsstyrelsespårets kortare ledtid, och beslutet att överlämna kan komma sent efter påbörjad handläggning.","motivation":"Välgrundat resonemang kopplat till LVV 7 kap. 19 § andra stycket: bestämmelsen ger länsstyrelsen ett skönsmässigt utrymme som i praktiken tillämpas olika mellan länen, och fastighetsberöring är nästan alltid för handen vid markavvattning eftersom avvattningseffekterna inte följer fastighetsgränser.","affects":"B40-GM140 och valet mellan B40-M150 och B40-M160.","impact":"Oförutsedd flytt till domstolsspår med förlängd och fördyrad process.","mitigation":"Fråga länsstyrelsen tidigt om överlämnande övervägs. Dimensionera tidplanen för domstolsspåret och se ett kvarhållet länsstyrelseärende som en bonus, inte en plan.","source_refs":["LVV","COURT_WV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GN100-01","node_id":"B40-GN100","chart_key":"B40","node_label":"Ryms åtgärden i anmälningslistan?","title":"Tröskelvärdena i FVV 19 § feltolkas","category":"Rättslig osäkerhet","trigger":"Åtgärdens art, storlek eller geografiska läge ligger nära trösklarna i FVV 19 § och klassificeras som anmälningspliktig trots att tillstånd krävs.","description":"FVV 19 § listar de vattenverksamheter som får anmälas i stället för att sökas tillstånd om, med trösklar för yta, volym, djup och plats (t.ex. våtmarker, dammar och mindre anläggningar). Trösklarna är tekniska och måste mätas mot den faktiska utformningen; små ändringar i projekteringen kan flytta åtgärden över en gräns. En felbedömning upptäcks ofta först när tillsynsmyndigheten granskar anmälan – då är projektet redan inne i fel spår och måste ställas om till tillståndsansökan hos MMD.","motivation":"Prop. 2023/24:152 beskriver uttryckligen att gränsdragningen mellan anmälan och tillstånd enligt FVV 19 § är en återkommande källa till felklassificering, och pågående reformarbete (SOU 2025:21:s förslag till ny 19 §-lydelse) visar att nuvarande trösklar bedöms vara otydliga och föråldrade. Källa: prop. 2023/24:152 och SOU 2025:21.","affects":"B40-GN100 och B40-P100 (omspår till tillstånd) samt hela anmälningsgrenen B40-N110–B40-N180.","impact":"Omtag med full tillståndsansökan, förlorade månader och i värsta fall ingripande om arbeten redan påbörjats.","mitigation":"Mät åtgärden mot varje tröskel i FVV 19 § med projekterade mått, och dokumentera mätningarna. Vid gränsvärden: välj tillståndsspåret eller sök tillsynsmyndighetens skriftliga bekräftelse.","source_refs":["FVV","MB","EXT: Prop. 2023/24:152 Steg på vägen mot en mer effektiv miljöprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/html/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GN100-02","node_id":"B40-GN100","chart_key":"B40","node_label":"Ryms åtgärden i anmälningslistan?","title":"Listningen garanterar inte att ärendet stannar i anmälningsspåret","category":"Rättslig osäkerhet","trigger":"Projektet planerar tid och kostnad efter det snabba anmälningsspåret utan att räkna med att BMP-bedömningen kan tvinga fram tillståndsansökan.","description":"Även en korrekt anmäld åtgärd kan, om tillsynsmyndigheten bedömer att betydande miljöpåverkan kan antas, föreläggas att söka tillstånd enligt FVV 22 a–22 d §§. Det innebär att anmälningsspårets fördel i tid och kostnad är villkorad. Projekt som budgeterar och planerar byggstart efter anmälningsbeslutet utan riskmarginal för ett övergång till tillståndsspåret utsätter sig för en full domstolsprocess som oväntat tillägg i tidplanen. Osäkerheten är störst för åtgärder nära känsliga vatten eller fiskeintressen.","motivation":"Välgrundat resonemang kopplat till FVV 22 a–22 d §§: BMP-institutet infördes för att säkerställa att miljöpåverkande åtgärder inte undkommer domstolsprövning, och HaV:s vägledning om anmälan betonar att listning i 19 § inte fritar från den materiella bedömningen. Källa: HaV och FVV.","affects":"B40-GN100, B40-GN150 och möjligt omspår till B40-P100/B40-P120.","impact":"Oförutsedd övergång till domstolsprocess med åtskilliga månaders till års fördröjning och ökade utredningskostnader.","mitigation":"Gör en egen förhandsbedömning av betydande miljöpåverkan innan spårvalet. Planera tidplanen med ett alternativscenario där tillstånd krävs.","source_refs":["FVV","HAV_WV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GN130-01","node_id":"B40-GN130","chart_key":"B40","node_label":"Är anmälan tillräcklig?","title":"Kompletteringskrav triggar ändlös loop mot upprättandet","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten begär komplettering av art, omfattning, sakägare eller miljöeffekter, och varje komplettering leder till nya frågor.","description":"Kompletteringsloopen mellan B40-GN130 och B40-N110 kan upprepas flera varv om underlaget inte är genomtänkt från början. Varje komplettering startar om granskningen, och nya uppgifter kan ändra myndighetens bedömning av om betydande miljöpåverkan kan antas. Det finns ingen begränsning i antalet kompletteringsturer, och processens slutdatum blir därmed oplanerbart. För projekt som redan annonserat startdatum uppstår trovärdighetsproblem mot entreprenörer och finansiärer.","motivation":"Välgrundat resonemang: kompletteringsturer är den enskilt vanligaste orsaken till förlängda anmälningsärenden enligt länsstyrelsernas handläggningserfarenhet, och HaV:s vägledning betonar att fullständighet vid inlämning är nyckeln till ett snabbt spår. Källa: HaV – Anmälan om vattenverksamhet.","affects":"Loopen B40-GN130→B40-N110 samt nedströms B40-N140, B40-GN150 och B40-N180.","impact":"Oplanerbar fördröjning, stigande konsultkostnader och risk att säsongsfönstret för arbetet missas.","mitigation":"Gör en intern 'myndighetsgranskning' av anmälan före inlämning med checklista mot FVV 20 § och MBD 8–9 §§. Besvara kompletteringskrav samlat och fullständigt, inte styckvis.","source_refs":["FVV","HAV_WV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GN130-02","node_id":"B40-GN130","chart_key":"B40","node_label":"Är anmälan tillräcklig?","title":"Kompletteringskraven avslöjar att åtgärden hör hemma i tillståndsspåret","category":"Rättslig osäkerhet","trigger":"Granskningen visar att åtgärdens faktiska omfattning överstiger FVV 19 §-trösklarna eller att miljöeffekterna inte kan bedömas utan full prövning.","description":"Tillräcklighetsgranskningen är den punkt där tillsynsmyndigheten första gången ser åtgärden i detalj. Visar det sig att åtgärden är större, annorlunda belägen eller mer påverkande än anmälan gav sken av kan myndigheten konstatera att tillstånd krävs direkt eller via BMP-beslutet längre fram. Projektet har då lagt tid och pengar på ett anmälningsunderlag som inte kan återanvändas rakt av i en ansökan till MMD, eftersom ansökningskraven i MB 22 kap. och LVV är betydligt tyngre.","motivation":"Välgrundat resonemang kopplat till FVV 19 § och 22 a–22 d §§: anmälningsinstitutet bygger på att åtgärderna är små och förutsägbara, och prop. 2023/24:152 visar att myndigheter regelbundet hänvisar anmälda åtgärder till tillståndsprövning när granskningen avslöjar större omfattning. Källa: prop. 2023/24:152 och FVV.","affects":"B40-GN130 och omspår till B40-P100/B40-P110/B40-P120.","impact":"Full omläggning till domstolsspår med nya underlagskrav, förlorade månader och fördyrad utredning.","mitigation":"Utforma anmälningsunderlaget så att det kan återanvändas som stomme i en ansökan (samma kartor, teknisk beskrivning och MKB-logik). Ha en förberedd omspårsplan.","source_refs":["FVV","MB","LVV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-GN150-01","node_id":"B40-GN150","chart_key":"B40","node_label":"Kan betydande miljöpåverkan antas?","title":"Positivt BMP-beslut tvingar fram tillståndsföreläggande","category":"Rättslig osäkerhet","trigger":"Tillsynsmyndigheten bedömer att den anmälda åtgärden kan antas medföra betydande miljöpåverkan och beslutar enligt FVV 22 b § att tillstånd ska sökas.","description":"BMP-bedömningen är anmälningsspårets kvalitativa grindvakt: kan betydande miljöpåverkan inte uteslutas ska myndigheten förelägga verksamhetsutövaren att ansöka om tillstånd. Beslutet ska vara motiverat och offentliggjort, vilket gör det svårt att förhandla bort. För projektet innebär ett positivt BMP-beslut att hela investeringen i anmälningsunderlaget förlorar sitt värde och att en full domstolsprocess hos MMD väntar. Bedömningen är diskretionär och påverkas starkt av remissutfallet, särskilt fiske- och Natura 2000-synpunkter.","motivation":"Välgrundat resonemang kopplat till FVV 22 a–22 d §§ och prop. 2023/24:152, som beskriver BMP-institutet som en avsiktlig mekanism för att återföra miljöpåverkande åtgärder till tillståndsprövning; SOU 2024:98 visar att begreppet 'betydande miljöpåverkan' bedöms vara det mest styrande – och omdiskuterade – i hela miljöprövningssystemet. Källa: prop. 2023/24:152 och SOU 2024:98-remissyttranden.","affects":"B40-GN150 och omspår till B40-P100–B40-P120; även B40-N180 om beslutet överklagas.","impact":"Tvingad domstolsprocess med årsvis fördröjning, nya underlagskrav och väsentligt ökade kostnader.","mitigation":"Bygg anmälningsunderlaget så att betydande påverkan trovärdigt kan uteslutas (kvantifierade effekter, skyddsåtgärder, övervakning). Förbered mentalt och finansiellt för omspår till tillstånd.","source_refs":["FVV","HAV_WV","EXT: SOU 2024:98-remissyttrande, Uppsala kommun https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GN150-02","node_id":"B40-GN150","chart_key":"B40","node_label":"Kan betydande miljöpåverkan antas?","title":"BMP-beslutet motiveras eller offentliggörs felaktigt","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten brådskar och lämnar ett beslut utan tillräcklig motivering eller utan det offentliggörande som FVV kräver.","description":"FVV 22 a–22 d §§ ställer formkrav: beslutet om betydande miljöpåverkan ska vara motiverat och offentliggöras. Ett omotiverat eller felaktigt publicerat beslut är sårbart för överklagande och kan upphävas, vilket skjuter tillbaka processen till före beslutet. Osäkerhet om beslutets giltighet gör att projektet inte vet om det får bygga eller måste söka tillstånd – ett limbo som kan vara värre än ett klart nej.","motivation":"Välgrundat resonemang: motiverings- och offentliggörandekrav är formella giltighetsvillkor; förvaltningsrättslig praxis upphäver regelbundet beslut som inte uppfyller motiveringskravet, särskilt när beslutet är överklagbart och berör enskilda.","affects":"B40-GN150 och B40-GN170 samt B40-N180 (startvillkoren blir osäkra).","impact":"Upphävt eller ifrågasatt beslut, förnyad handläggning och juridisk osäkerhet om åtgärdens status.","mitigation":"Granska beslutets motivering och publicering vid mottagandet. Vid brister: överväg om ett begärt rättelse- eller överklagandeutspel skyddar projektets position bättre än passivitet.","source_refs":["FVV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GN150-03","node_id":"B40-GN150","chart_key":"B40","node_label":"Kan betydande miljöpåverkan antas?","title":"BMP-begreppet är omdiskuterat och påverkas av pågående reform","category":"Politisk & policyrisk","trigger":"Reformarbetet med samordnad miljöbedömning och nya tröskelbegrepp ändrar tolkningsramverket medan ärendet pågår.","description":"Begreppet 'betydande miljöpåverkan' är föremål för både doktrin, praxisutveckling och lagstiftningsarbete (SOU 2024:98, prop. 2023/24:152 och därpå följande förändringar). En myndighet som tillämpar en ny tolkningslinje kan komma till annat resultat än projektet räknat med när anmälan lämnades. Reformosäkerheten gör det svårt att förutsäga utgången, särskilt i ärenden som pågår över årsskiften då nya regler eller vägledningar träder i kraft.","motivation":"SOU 2024:98 och remissinstansernas yttranden visar att just tröskelbegreppet är prövningens mest omdiskuterade del, och lagstiftaren har successivt justerat regelverket (prop. 2023/24:152); pågående reformer kring Miljöprövningsmyndigheten (betänkande 2025/26:MJU24) förstärker osäkerheten. Källa: SOU 2024:98 och riksdagens betänkande om ny myndighet för miljöprövning.","affects":"B40-GN150 och strategin för hela anmälningsgrenen; även vägval B40-G070 retroaktivt.","impact":"Oförutsägbar bedömning, förskjuten process och behov av att omvärdera spårvalet mitt i ärendet.","mitigation":"Bevaka lagstiftnings- och vägledningsläget löpande. Dimensionera underlaget så att det håller även under en strängare tolkning av betydande-kriteriet.","source_refs":["FVV","NEW_AUTH","EXT: Betänkande 2025/26:MJU24 Ny myndighet för miljöprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/ny-myndighet-for-miljoprovning_hd01mju24/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-GN170-01","node_id":"B40-GN170","chart_key":"B40","node_label":"Ställningstagande enligt 23 §","title":"Försiktighetsmått blir i praktiken en ny villkorsprövning","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten meddelar försiktighetsmått enligt FVV 23 § som är tekniskt eller ekonomiskt betungande, t.ex. övervakningsprogram eller arbetstidsbegränsningar.","description":"Ställningstagandet enligt FVV 23 § kan innehålla försiktighetsmått som i praktiken styr åtgärdens utformning lika mycket som tillståndsvillkor skulle ha gjort. Skillnaden är att måtten beslutas i ett enklare förfarande utan domstols lika noggranna prövning, men med samma bindande verkan. Överdrivet långtgående mått kan göra projektet olönsamt eller tekniskt omöjligt att genomföra som planerat, och frågan om måttens laglighet kan bara lösas genom överklagande.","motivation":"Välgrundat resonemang kopplat till FVV 23 §: försiktighetsmått är bindande och överklagbara, och praxis visar att myndigheter använder institutet för att reglera arbetstider, metodval och övervakning i anmälda åtgärder – ibland mer ingående än vad en tillståndsprövning resulterat i.","affects":"B40-GN170 och B40-N180 (startvillkoren) samt genomförandeekonomin i B70.","impact":"Fördyrat eller försenat genomförande, eller tvingat överklagande med ytterligare handläggningstid.","mitigation":"Föreslå själv väl avvägda försiktighetsmått i anmälan så att myndigheten kan bygga på dem. Granska beslutade mått mot proportionalitetsprincipen och överklaga vid uppenbart orimliga krav.","source_refs":["FVV","MB"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-GN170-02","node_id":"B40-GN170","chart_key":"B40","node_label":"Ställningstagande enligt 23 §","title":"Underrättelse om 'ingen åtgärd' ger falsk trygghet","category":"Överklagande & rättsprocess","trigger":"Projektet bygger vidare på en underrättelse om att myndigheten inte avser vidta åtgärd, utan att beakta att underrättelsen inte är en tillståndsgaranti.","description":"En underrättelse om att tillsynsmyndigheten inte vidtar åtgärd innebär att åtgärden får påbörjas, men den är ingen prövning i sak och skyddar inte mot senare tillsyn om förhållandena visar sig vara annorlunda än anmälan gav sken av. Avviker genomförandet från anmälan, eller uppstår oanade effekter, kan myndigheten ingripa i efterhand. Projekt som behandlar underrättelsen som ett kvitto på laglighet tar en risk som bärs helt internt.","motivation":"Välgrundat resonemang kopplat till FVV 23 § och MB 11 kap. 9 b §: anmälningsinstitutet är ett tillsynsfilter, inte ett tillstånd; tillsynspraxis visar att ingripanden sker när utförandet avviker från det anmälda, oavsett tidigare underrättelse.","affects":"B40-GN170 och B40-N180 samt genomförandefasen i B70.","impact":"Tillsynsingripande under pågående arbete, återställningskrav och förlorat förtroende för anmälan som dokumentation.","mitigation":"Håll genomförandet strikt inom anmälan ramar, dokumentera utförandet löpande och gör en ny anmälan eller ansökan om omfattningen behöver ändras.","source_refs":["FVV","MB","HAV_WV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-M120-01","node_id":"B40-M120","chart_key":"B40","node_label":"Sök dispens från markavvattningsförbud","title":"Dispens beviljas inte eftersom 'särskilda skäl' är en restriktiv prövning","category":"Rättslig osäkerhet","trigger":"Länsstyrelsen finner att området har naturvårdsvärden eller att skälen inte är tillräckligt starka, och avslår dispensansökan.","desc
