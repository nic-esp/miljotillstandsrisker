p.","impact":"Förlust av laga kraft-vägen och minst ett till två års överprövning, ofta betydligt längre.","mitigation":"Räkna i planeringen med överklagande som basfall för kontroversiella projekt; bygg bygg- och finansieringsplaner som tål flerinstansprocess; identifiera tidigt vilka grupper som har talerätt och vad de driver.","source_refs":["MB","EXT: Betänkande 2020/21:KU10 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/granskningsbetankande-hosten-2020_h801ku10/html/","EXT: Sveriges Radio om Markbygden https://www.sverigesradio.se/artikel/6697781"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-G210-02","node_id":"B60-G210","chart_key":"B60","node_label":"Överklagas avgörandet i tid?","title":"Inhibition och verkställighet före laga kraft blir en egen stridsfråga","category":"Överklagande & rättsprocess","trigger":"Sökanden vill börja bygga på det överklagade beslutet, eller motparter begär inhibition, och frågan om verkställighet måste prövas separat.","description":"Även när överklagandet kommit in kan sökanden i vissa fall få bedriva förberedande åtgärder, men gränsen är skarp: byggande som förutskickar utgången kan leda till återställningskrav om beslutet upphävs. Motparter kan begära inhibition för att stoppa all verksamhet under överprövningen. Inhibitionsprövningen blir då en snabb, parallell delprocess där projektets hela tidsplan står på spel utan att sakfrågan prövats.","motivation":"Verkställighets- och inhibitionsfrågor är etablerade stridsområden i svensk miljöprocess; förhandsbesked om byggande på överklagade tillstånd har prövats upp till Högsta domstolen i gruv- och täktmål, och erfarenheten visar att motparter systematiskt begär inhibition i kontroversiella projekt.","affects":"B60-G210, B60-220 och projektets bygglogistik utanför processkartan.","impact":"Spärr mot byggstart under hela överprövningen, alternativt risk för återställningskrav om man bygger på egen risk.","mitigation":"Avgränsa strikt vad som är förberedande åtgärder respektive verkställighet; begär själv förtydligande av förstainstansbeslutet; räkna aldrig in byggstart före laga kraft i den bindande tidplanen.","source_refs":["MB","MMDL"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-G230-01","node_id":"B60-G230","chart_key":"B60","node_label":"Vilken överprövningsväg gäller?","title":"Klaganden väljer fel forum och får starta om","category":"Överklagande & rättsprocess","trigger":"Överklagande ges in till fel instans – till exempel kommunalt beslut direkt till domstol i stället för via länsstyrelsen – och måste slussas om.","description":"Överprövningskedjan varierar mellan beslutstyper: kommunala beslut går ofta via länsstyrelsen, myndighetsbeslut till mark- och miljödomstolen och MMD:s förstainstansavgöranden direkt till MÖD. Klaganden som väljer fel väg skyddas delvis av ombudsregler, men omslutningen tar tid och kan bli föremål för rättidighetsprövning i rätt instans. För sökanden innebär varje sådan omslutning ytterligare osäkerhet om när överprövningen faktiskt startar.","motivation":"Instanskedjorna i MB och PBL är olika uppbyggda och sammanflätade; SOU 2025:122 om kortare instanskedja bygger uttryckligen på att nuvarande struktur är svåröverskådlig för enskilda, vilket i sig bekräftar att felvalda överklagandevägar är ett strukturellt fenomen.","affects":"B60-G230 och starttiden för B60-240/B60-250/B60-260.","impact":"Fördröjning och osäkerhet om överprövningens omfattning och sammansättning av klaganden.","mitigation":"Bevaka alla inkomna överklaganden oavsett forum; kontrollera att omslutna överklaganden behandlas rättidighetsmässigt korrekt; håll en egen karta över vilken instans som prövar vad.","source_refs":["MB","MMDL","PBL","EXT: SOU 2025:122 En kortare instanskedja för mark- och miljöärenden https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/en-kortare-instanskedja-for-mark-och-miljoarenden_hdb3122/html/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-G230-02","node_id":"B60-G230","chart_key":"B60","node_label":"Vilken överprövningsväg gäller?","title":"S1-reformen ändrar instanskartan mitt i processen","category":"Politisk & policyrisk","trigger":"Beslut som meddelats av Miljöprövningsmyndigheten från 2027-07-01 överklagas på en kedja som delvis skiljer sig från delegationernas, och övergångsfrågor för mål på väg upp i instanserna är inte fullt utredda.","description":"När första instans byter från delegation till ny myndighet ändras också motpartsrollen i överprövningen: myndigheten blir part i domstol när dess beslut överklagas, och länsstyrelsens tidigare roller ska omfördelas. Mål som påbörjats före ikraftträdandet kan hamna i gränslandet mellan gamla och nya överprövningsvägar. Tolkningstvister om övergångsreglerna kan drivas av motparter som ett sätt att ogiltigförklara handläggningen.","motivation":"Nodens s1_delta visar att Miljöprövningsmyndigheten blir motpart vid överklaganden medan länsstyrelsen behåller talerätt för allmänna intressen (SFS 2026:1442–1444); välgrundat resonemang: övergångsregler för pågående mål är historiskt en av de mest tvisteframkallande delarna av instansreformer.","affects":"B60-G230, B60-250 (ny motpart) och B60-260 (PT-frågans förutsättningar).","impact":"Osäkerhet om rätt överprövningsväg och motpart, med risk för processuella angrepp och fördröjning.","mitigation":"Följ lagtext och övergångsbestämmelser för SFS 2026:1442–1444 noggrant; begär vägledning från berörda instanser i gränsfall; dokumentera vald överprövningsväg juridiskt.","source_refs":["SFS2026_1442","SFS2026_1443","SFS2026_1444","NEW_AUTH"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G290-01","node_id":"B60-G290","chart_key":"B60","node_label":"Återförvisas eller avslutas överprövningen?","title":"Återförvisningsloopen blir en permanent process","category":"Överklagande & rättsprocess","trigger":"Överinstansen återförvisar, den nya handläggningen leder till ett nytt beslut, som överklagas igen – och kedjan upprepar sig utan självbromsande mekanism.","description":"Beslutspunkten skickar återförvisade mål tillbaka till fullständighetskontrollen (B60-030), vilket innebär att hela beredningskedjan tekniskt kan upprepas. Varje nytt beslut skapar nya överklaganderättigheter för alla taleberättigade, även de som inte klagat förut. Det finns ingen lagregel som begränsar antalet återförvisningsvarv. För motståndare är loopen ett rationellt instrument: varje varv kostar dem lite men projektet år.","motivation":"Nordkalk/Ojnarefjärden är skolexemplet: från ansökan och första domarna via HD 2010, ny domstolshandläggning och MÖD-avslag 2018 till nya ansökningar och tillstånd som fastställdes först 2026 (SVT 2026-06-25) – en nästan tjugoårig slinga av återförvisningar och omprövningar.","affects":"B60-G290 med loop till B60-030; konsumerar i praktiken hela B60-diagrammet på nytt.","impact":"Fördröjning om flera år per varv, utan övre gräns, med tillhörande kostnader och åldrande underlag.","mitigation":"Eliminera processuella felkällor i första handläggningsvarvet (kungörelse, delgivning, motivering); vid återförvisning: genomför den nya handläggningen så fullständigt att nästa överprövning saknar återförvisningsgrund; uppdatera allt tidskänsligt underlag direkt.","source_refs":["MB","MMDL","EXT: SVT om Nordkalks fastställda tillstånd 2026 https://www.svt.se/nyheter/lokalt/ost/nordkalks-tillstand-att-bryta-sten-fastslas"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G290-02","node_id":"B60-G290","chart_key":"B60","node_label":"Återförvisas eller avslutas överprövningen?","title":"Splittrat slutläge: delar slutgiltiga, delar återförvisade","category":"Teknisk komplexitet","trigger":"Överinstansen upphäver bara en del av avgörandet – till exempel vissa villkor eller en delfastighet – medan resten vinner laga kraft.","description":"Ett slutligt utfall behöver inte vara entydigt. Överinstansen kan låta huvudtillståndet stå men återförvisa enskilda villkor, säkerhetsbelopp eller geografiska delar. Projektet står då med ett delvis gällande tillstånd: byggbarheten för vissa delar är oklar, villkorskatalogen är inkonsekvent och B70-konsolideringen måste hantera en beslutsmatris med olika rättskraftstatus per komponent. Samordningen med parallella spår (PBL, koncessioner) blir särskilt felkänslig när bara en del av helheten är slutlig.","motivation":"Välgrundat resonemang: MÖD:s möjligheter att fastställa, ändra, upphäva eller återförvisa kan kombineras i samma avgörande, och praxis visar att deldomar och delvisa upphävanden är vanliga i sammansatta mål (jfr Nordkalk-målen där olika ansökningsdelar fick olika utfall i M 5375-14 respektive M 5431-14).","affects":"B60-G290, delvis återkoppling till B60-030, och särskilt B70-010/B70-G020 som måste konsolidera splittrade finalitetsstatusar.","impact":"Ofullständig byggberedskap: vissa delar kan påbörjas, andra inte, med risk för felaktiga byggbeslut på fel grundval.","mitigation":"Dokumentera finalitetsstatus per villkor och per delområde i beslutsloggen; verifiera mot B70 att varje byggdel faktiskt vilar på lagakraftvunnet beslut; begär förtydligande från instansen om avgörandets räckvidd är otydlig.","source_refs":["MB","MMDL"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-START-01","node_id":"B60-START","chart_key":"B60","node_label":"Ansökan eller överprövningsbart ärende initierat","title":"Inkonsistent handoff från variantprocesserna stoppar registreringen","category":"Underlagsbrist & data","trigger":"Ansökningspaketet som lämnas från B30- eller B40-spåren saknar styrkta handläggningsdelar eller har motstridiga yrkanden mellan de parallella spåren.","description":"Noden tar emot färdiga ansökningspaket från miljöfarlig verksamhet, vattenverksamhet och omprövningsspår. Om prövningsramen låsts olika i de parallella processerna – till exempel att vattendelen har andra kapacitetsgränser än 9 kap.-delen – kan paketet inte registreras som ett sammanhållet ärende. Bristerna upptäcks först när första instans granskar formalia, vilket skjuter hela prövningen framför sig. Eftersom handoff-punkten saknar egen juridisk reglering vilar kvaliteten helt på sökandens interna konsolidering.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att kombinerade mål (9 kap. + 11 kap. MB) ofta återgår till sökanden just i inlärningsfasen eftersom yrkandena inte är samordnade mellan spåren; Naturvårdsverkets vägledning om tillståndsprövning betonar att ansökan ska vara komplett vid ingivningen för att inte processen ska dras ut.","affects":"Noden själv och nedströms B60-010 samt indirekt hela B60-kedjan eftersom ett felaktigt paket följer med till fullständighetskontrollen i B60-030.","impact":"Fördröjning redan vid registrering och risk att ärendet splittras i flera parallella mål med olika tidsplaner och instanser.","mitigation":"Konsolidera en gemensam yrkandematris över alla spår före ingivning; genomför förhandsdialog med tänkbar första instans om ärendets upplägg; använd processkartans tillståndsmatris (B10-070) som checklista vid handoff.","source_refs":["MB","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-010-01","node_id":"B70-010","chart_key":"B70","node_label":"Konsolidera beslut, planer, rättigheter och villkor","title":"Beslutsmatrisen bygger på inaktuella versioner av beslut och villkor","category":"Underlagsbrist & data","trigger":"En villkorsändring, rättelse, deldom eller nytt beslut i överinstans meddelas efter att den versionerade besluts- och villkorsmatrisen upprättats, utan att matrisen uppdateras.","description":"Noden ska skapa en versionerad besluts- och villkorsmatris över huvudtillstånd, dispenser, planer, koncessioner, markåtkomst och startkrav. Långa processer innebär att beslut uppdateras löpande: deldomar ersätts av slutdomar, MPD-beslut ändras efter överklagande till mark- och miljödomstol, och villkor justeras efter kompletteringar. Om versionshanteringen brister arbetar projektet vidare på ett föråldrat villkor, t.ex. ett äldre bullervärde eller en upphävd skyddsåtgärd. Felet upptäcks ofta först vid myndighetens godkännande av förstartsdokumentation eller i efterhandskontroll, när omarbetning är dyrast.","motivation":"I målet om Preemraff i Lysekil meddelade mark- och miljödomstolen först deldom (2018-03-16, mål M 4706-16) och därefter slutliga avgöranden, och ärendet prövades vidare i MÖD som 2020-06-15 meddelade sitt avgörande – varje instansbyte förändrade villkorsbilden. Det illustrerar att villkorsläget är rörligt ända tills laga kraft inträder. Källa: Sveriges Domstolar, https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/","affects":"Noden själv, B70-040 (förstartsvillkor extraheras ur fel version), B70-G050 och B70-G110 (förenlighetskontroll mot inaktuella villkor).","impact":"Omarbetning av förstartsdokumentation, fördröjda myndighetsgodkännanden och risk för byggstart i strid med gällande villkor med vites- och återställningspåföljder.","mitigation":"Upprätta strikt versionshantering med en enda auktoritativ källa per beslut och med ändringslogg. Schemalägg obligatorisk omverifiering av matrisen mot diarier och domstolsutdrag vid varje gate i B70. Utse en ansvarig beslutsförvaltare för hela projektets tillståndspaket.","source_refs":["MB","COURT_MFV","EXT: Sveriges Domstolar – Preemraff https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-010-02","node_id":"B70-010","chart_key":"B70","node_label":"Konsolidera beslut, planer, rättigheter och villkor","title":"Parallellt sektorsbeslut faller bort ur konsolideringen","category":"Sektorssamordning","trigger":"Ett beslut som ligger utanför huvudspårets diarium – strandskyddsdispens, ledningsrätt, KML-tillstånd, Seveso-besked eller nätkoncession – bevakas inte av det team som upprättar beslutsmatrisen.","description":"Konsolideringen ska omfatta alla tillstånd, planer, koncessioner och markrättigheter, men dessa beslut fattas av olika instanser (kommun, länsstyrelse, Lantmäteriet, Bergsstaten, Ei, domstolar) och levereras i olika format och kanaler. Beslut som hanterats av en underkonsult eller ett annat bolag i koncernen riskerar att inte nå matrisen. Typiska bortfall är strandskyddsdispenser för enskilda anläggningsdelar, ledningsrätter för interna vägar och kablar, samt tillstånd enligt kulturmiljölagen för åtgärder vid fornlämningar. Ett bortfallet beslut upptäcks först när det fysiskt blockerar ett byggmoment, trots att huvudtillståndet är i laga kraft.","motivation":"MÖD 2016:13 visar hur strandskyddslinjen angivits felaktigt i detaljplanen så att ett större strandskyddat område exploaterades än planen täckte – avstämningen mellan plan, dispens och faktiskt genomförande är ett känt svagt led. Erfarenheten från svenska infrastrukturprojekt visar också att ledningsrätts- och förrättningsärenden ofta ligger efter huvudtillstånden. Källa: MÖD 2016:13, https://lagen.nu/dom/mod/2016:13","affects":"Noden själv, B70-G070 (markåtkomstkontroll med luckor), B70-G090 (sektorsgates som saknas i matrisen) och B70-130 (felaktig byggberedskapsdeklaration).","impact":"Sent upptäckt tillståndsbehov stoppar enskilda byggmoment, kräver ny ansökan mitt i byggfasen och kan försena hela projektet flera månader.","mitigation":"Härled beslutslistan ur den versionerade tillståndsmatrisen från B10-070 i stället för från levererade dokument. Genomför en formell gap-analys: för varje fysiskt moment, ange vilket beslut som möjliggör det. Låt fastighetsjurist och platschef gemensamt signera att inga moment saknar täckande beslut.","source_refs":["STRAND","KML","PBL","EI_GRID","EXT: MÖD 2016:13 https://lagen.nu/dom/mod/2016:13"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-010-03","node_id":"B70-010","chart_key":"B70","node_label":"Konsolidera beslut, planer, rättigheter och villkor","title":"Olika projektgränser i olika beslut omöjliggör konsistent matris","category":"Teknisk komplexitet","trigger":"MB-tillståndet, detaljplanen, koncessionen och rättighetsbesluten avgränsar verksamheten med olika geometrier, kapaciteter eller momentindelningar, så att matrisens rader inte kan kopplas en-till-en.","description":"Varje prövningsspår avgränsar sitt eget objekt: miljötillståndet beskriver verksamhetsområde och kapacitet, detaljplanen reglerar användning och byggrätter, ellagskoncessionen en specifik ledningssträcka, och förrättningsbesluten enskilda fastigheter. Vid konsolidering måste dessa mappas mot samma fysiska anläggning. När projektet ändrats under processens gång – vanligt i fleråriga processer – kan ett äldre beslut avse en sträckning eller kapacitet som inte längre byggs, medan ett nyare beslut täcker ett område som det äldre inte omfattar. Utan en gemensam referensgeometri och kapacitetsdefinition blir matrisen skenhel, och förenlighetsproblemen dyker upp först i B70-G110 eller på fält.","motivation":"I Markbygdenprövningarna har projektet hanterats i etapper med separata tillstånd och villkor (bl.a. MÖD M 6331-17, dom 2018-06-19), där gränser, verksantaganden och säkerhetsvillkor skiljer sig mellan etapperna – ett exempel på hur svårt det är att hålla multipla beslutspaket konsistenta över tid. Källa: MÖD M 6331-17, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-6331-17.pdf","affects":"Noden själv och särskilt B70-G110 (förenlighetskontroll), B70-120 (tvungen konfliktlösning) samt B70-130.","impact":"Förenlighetskontrollen misslyckas sent i processen, vilket tvingar fram villkorsändringar, kompletterande prövningar eller omprojektering med avsevärd fördröjning.","mitigation":"Etablera tidigt en gemensam digital projektgeometri (koordinatsatt anläggningsmodell) som alla beslut refereras mot. Dokumentera för varje beslut exakt vilka anläggningsdelar det täcker och vilka kapacitetstal som gäller. Inför avstämningspunkter där matrisen valideras mot aktuell projektering.","source_refs":["MB","PBL","ELLAG","EXT: MÖD M 6331-17 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-6331-17.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-030-01","node_id":"B70-030","chart_key":"B70","node_label":"Hantera kvarstående överprövning eller inhibition","title":"Kompletteringskrav vid återförvisning kräver nya säsongsinventeringar","category":"Underlagsbrist & data","trigger":"Överinstansen kräver kompletterande natur- eller vattenundersökningar som bara kan utföras under vissa årstider, och återförvisningsbeslutet kommer efter att säsongen passerat.","description":"Noden hanterar det fall att prövningen fortsätter i överinstans eller återförvisats. Kompletteringskrav gäller ofta fältdata – artinventeringar, hydrologiska mätningar eller bullermätningar – som är säsongsberoende. Om kravet meddelas på hösten kan datainsamlingen inte genomföras förrän nästa vår eller sommar, och handläggningen förskjuts med upp till ett år utöver själva domstolstiden. Denna fördröjning samverkar med att parallella besluts giltighetstider och igångsättningstider fortsätter löpa, vilket kan skapa nya konflikter i B70-G110.","motivation":"MÖD:s kompletteringspraxis (t.ex. mål M 8827-14 med detaljerade krav på hydrologisk komplettering) visar att överinstansen regelmässigt kräver nytt fältunderlag. Säsongsberoendet i ekologiska inventeringar är etablerat i Naturvårdsverkets vägledning om specifik miljöbedömning. Källa: MÖD M 8827-14, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2015/m-8827-14.pdf","affects":"B70-030:s loop tillbaka till B70-G020, samt indirekt B70-G110 (tidsmässiga konflikter) och B70-130.","impact":"Fördröjning om upp till ett år utöver rättsprocessens egen tid; ökade utredningskostnader och risk att parallella tillstånds tidsfrister hinner löpa ut.","mitigation":"Upprätta en säsongsplan för alla tänkbara kompletteringsinventeringar och genomför dem förebyggande där osäkerhet finns. Upprätthåll fältberedskap och konsultavtal under hela överprövningen. Yrka i överinstansen på att befintliga data får användas där metodmässigt försvarbart.","source_refs":["MB","NV_EIA","EXT: MÖD M 8827-14 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2015/m-8827-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-030-02","node_id":"B70-030","chart_key":"B70","node_label":"Hantera kvarstående överprövning eller inhibition","title":"Inhibitionsbeslut träffar pågående förberedande arbeten mitt i byggberedskapen","category":"Överklagande & rättsprocess","trigger":"Överinstansen beslutar om inhibition av ett verkställbart beslut efter att projektet redan inlett förberedelser eller tidiga markarbeten i enlighet med verkställighetsrätten.","description":"Projektet kan ha rätt att verkställa ett överklagat beslut men är ändå utsatt för risken att klaganden begär och får inhibition. Ett inhibitionsbeslut stoppar omedelbart fortsatt ianspråktagande och kan komma mitt i pågående entreprenad. Noden måste då uppdatera tillståndspaketet, stoppa berörda moment och hantera avtalskonsekvenser mot entreprenörer. Oreda i kommunikationen om vilka moment som får fortsätta kan leda till oavsiktliga villkorsbrott, som både medför rättsliga påföljder och försvårar projektets ställning i den fortsatta överprövningen.","motivation":"Inhibitionsinstitutet är etablerat i överprövningen av både miljöbalks- och PBL-beslut; i PBL-praxis kan verkställbarheten inhiberas oavsett om startbesked getts, vilket visar att stoppet kan komma sent i kedjan (prop. om verkställbarhet av bygglovsbeslut). Källa: Prop. om verkställbarhet av beslut om bygglov, rivningslov och marklov, https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/verkstallbarhet-av-beslut-om-bygglov-rivningslov_h503240/html/","affects":"B70-030, B70-G020 (statusändring), B70-G140 (praktisk readiness bryts) och pågående byggberedskap.","impact":"Tvärstopp i berörda byggmoment, stillaståendekostnader för entreprenad, omförhandling av tidplan och potentiella villkorsbrott om stoppet inte kommuniceras korrekt.","mitigation":"Definiera i förväg vilka moment som är reversibla respektive irreversibla och skjut upp irreversibla moment tills inhibitionsrisken fallit bort. Inför en bevakningsrutin med 24-timmarsrespons på överinstansens beslut och en förberedd stopporder-mall till entreprenaden.","source_refs":["MB","MMDL","PBL","EXT: Prop. verkställbarhet av beslut om bygglov m.m. https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/verkstallbarhet-av-beslut-om-bygglov-rivningslov_h503240/html/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-040-01","node_id":"B70-040","chart_key":"B70","node_label":"Extrahera förstartsvillkor, tidsfrister och kontrollkrav","title":"Förstartsvillkor förbises i den samlade villkorsmassan","category":"Underlagsbrist & data","trigger":"Ett villkor med krav på godkännande före start – kontrollprogram, arbetsplan, detaljprojektering eller säkerhetsställande – ligger begravt i ett bifogat beslut eller en äldre dom och tas inte med i förstartsvillkorslistan.","description":"Tillståndsbeslut innehåller ofta ett stort antal villkor varav bara en del uttryckligen reglerar vad som måste vara klart före markarbete eller byggstart. Vissa förstartskrav finns dessutom i separata handlingar, t.ex. i vattendomars bestämmelser om arbetsplaner eller i MPD-beslut om godkänt kontrollprogram. Om extraktionen är manuell och baseras på skning i enstaka dokument missas villkor som är formulerade indirekt. Felet materialiseras först när myndigheten vägrar godkänna start eller när tillsynen i efterhand konstaterar att arbeten påbörjats utan föreskrivet godkännande.","motivation":"Vattendomar och miljötillstånd förenas regelmässigt med villkor om godkända kontrollprogram och ekonomiska säkerheter före ianspråktagande – se t.ex. MÖD:s dom 2025-02-10 i mål M 4304-23 där tillståndets giltighet gjordes beroende av ställd säkerhet och särskilda anmälningstider fastställdes. Källa: MÖD M 4304-23, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2025/m-4304-23-dom-2025-02-10.pdf","affects":"B70-G050 (villkorskontroll med lucka), B70-060 (tvungen efterkomplettering), B70-130 och B70-G140.","impact":"Fördröjning i avvaktan på efterhandsgodkännanden, risk för vite eller återställningskrav vid för tidig start, samt försämrad trovärdighet gentemot tillsynsmyndigheten.","mitigation":"Låt två personer oberoende extrahera förstartsvillkoren ur varje beslut och synka resultaten. Strukturera extraktionen efter moment (markarbete, grundläggning, igångsättning) snarare än efter beslut. Verifiera listan mot tillsynsmyndighetens och prövningsmyndighetens förväntningar i ett avstämningsmöte.","source_refs":["MB","COURT_WV","EXT: MÖD M 4304-23 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2025/m-4304-23-dom-2025-02-10.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-040-02","node_id":"B70-040","chart_key":"B70","node_label":"Extrahera förstartsvillkor, tidsfrister och kontrollkrav","title":"Otydliga villkorsformuleringar ger tolkningstvist om vad som krävs före start","category":"Rättslig osäkerhet","trigger":"Ett villkor är formulerat utan preciserad tidpunkt, ansvarig godkännare eller mätbart kriterium, och projektägare och myndighet tolkar kravet olika.","description":"Äldre domar och beslut saknar ibland moderna preciseringar: igångsättningstid kan saknas, ianspråktagandetid kan användas i stället, och godkännandekrav kan sakna angiven instans. Vid extraktionen måste varje sådant villkor översättas till en konkret handling med ansvarig och deadline, och vid otydlighet uppstår tolkningsutrymme. Om projektet väljer den gynnsammaste tolkningen utan myndighetens bekräftelse finns risk för att myndigheten eller en motpart i efterhand hävdar en strängare läsning, med krav på stopp eller efterhandsprövning som följd.","motivation":"MÖD:s dom 2020-12-21 i mål M 13516-19 illustrerar problemet: det aktuella tillståndet saknade uttrycklig föreskrift om igångsättningstid och angav i stället en tid för ianspråktagande, vilket skapade osäkerhet om tillståndets räckvidd. Källa: MÖD M 13516-19, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2020/m-13516-19-dom-2020-12-21.pdf","affects":"B70-G050, B70-060 och B70-G140; vid eskalation även återgång till prövningsspåren B30/B40.","impact":"Tolkningstvist försenar startbeslut och godkännanden; i ogynnsamt fall krävs villkorsändring eller ny prövning för att klarlägga innehållet.","mitigation":"Flagga alla otydliga villkor i förstartsvillkorslistan och inhämta prövnings- eller tillsynsmyndighetens skriftliga tolkningsbesked innan arbeten planeras. Dokumentera tolkningsbesluten i beslutsmatrisen. Vid väsentlig osäkerhet, överväg proaktiv ansökan om villkorsförtydligande.","source_refs":["MB","EXT: MÖD M 13516-19 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2020/m-13516-19-dom-2020-12-21.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-060-01","node_id":"B70-060","chart_key":"B70","node_label":"Komplettera säkerhet eller förstartsdokumentation","title":"Kompletteringsloopen mellan inlämning och avslag drar ut förstarten","category":"Myndighetskapacitet & handläggning","trigger":"Inlämnade förstartshandlingar eller säkerhetshandlingar underkänns av myndigheten och måste kompletteras, ibland flera varv, innan B70-G050 kan passeras på nytt.","description":"Noden är explicit utformad som en loop: komplettera, lämna in, kontrollera igen. Varje varv innehåller både projektets omarbetningstid och myndighetens handläggningstid. Om kravbilden är otydlig eller förändras mellan varven – till exempel när en ny handläggare tar över ärendet – kan loopen upprepas flera gånger. Utan disciplin på inlämningarnas kvalitet blir noden en dold förlängningsfaktor där varje avslag kostar både omarbetning och ny kötid hos myndigheten.","motivation":"Erfarenheten från svenska tillstånds- och godkännandeprocesser visar att kompletteringsvarv är en av de vanligaste orsakerna till förlängda handläggningstider; Eis rapport om ledtider för elnätsutbyggnad (R2023:09) pekar ut just flervarvsförfaranden och förrättningshandläggning som flaskhalsar. Källa: Ei R2023:09, https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf","affects":"B70-060:s loop mot B70-G050 och därmed hela byggberedskapskedjan mot B70-130.","impact":"Ackumulerande fördröjning om veckor till månader per kompletteringsvarv; osäkerhet i byggprogrammet gör entreprenadplanering svår.","mitigation":"Begär skriftlig och uttömmande avslagsmotivering vid första underkännandet. Genomför intern kvalitetsgranskning mot myndighetens tidigare godkännandebeslut innan varje inlämning. Driv parallellt förberedande arbete för moment som inte berörs av det underkända godkännandet.","source_refs":["MB","EI_GRID","EXT: Ei R2023:09 Kortare ledtider för elnätsutbyggnad https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-060-02","node_id":"B70-060","chart_key":"B70","node_label":"Komplettera säkerhet eller förstartsdokumentation","title":"Ändrad projektering gör ställd säkerhet och förstartshandlingar inaktuella","category":"Teknisk komplexitet","trigger":"Projektets tekniska utformning förändras under förstartsfasen – ny dammhöjd, fler turbiner, ändrad schaktmassa – så att underlaget för säkerhetsbelopp och förstartshandlingar måste räknas om.","description":"Säkerhetsbelopp och förstartsdokumentation beräknas på en specifik teknisk utformning. Sena konstruktionsändringar, ofta drivna av entreprenadupphandling eller geotekniska fynd, kan höja återställningsbehovet eller förändra kontrollprogrammens innehåll. Myndigheten kan då kräva ny säkerhetsberäkning och reviderade handlingar, och i värsta fall ifrågasättas om ändringen överhuvudtaget ryms inom tillståndet eller kräver ändringsprövning. Noden riskerar då att inte bara komplettera utan att återkoppla till prövningsspåren uppströms.","motivation":"Gränserna mellan åtgärd inom tillståndet och ändring som kräver ny prövning är ett återkommande tvistefråga i svensk miljörätt (jfr MPF 1 kap. 4 och 11 §§ om ändringsanmälan kontra ändringstillstånd); erfarenheten visar att tekniska förskjutningar sent i processen ofta tvingar fram förnyad myndighetskontakt. Strikt välgrundat resonemang kopplat till MPF 1 kap. 4 och 11 §§ samt MB 16 kap.","affects":"B70-060, B70-G050 och vid ändringsprövningsbehov återkoppling till B30- och B40-spåren.","impact":"Omberäkning och omgodkännande av säkerhet och handlingar; vid ändringskrav ny prövningsprocess med betydligt längre ledtid.","mitigation":"Inför ändringsfryspunkt för tillståndsrelevanta parametrar före förstartsgodkännandena. Låt varje konstruktionsändring passera en snabb tillståndskonsekvensbedömning innan den beslutas. Håll säkerhetsberäkningen parametrisk så att beloppet kan justeras utan full omarbetning.","source_refs":["MB","MPF"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-080-01","node_id":"B70-080","chart_key":"B70","node_label":"Säkra eller korrigera saknad genomföranderätt","title":"Förrättnings- eller expropriationsbeslut överklagas och förlänger rättighetsloopen","category":"Överklagande & rättsprocess","trigger":"Det beslut om ledningsrätt, fastighetsbildning eller expropriation som skulle säkra den saknade genomföranderätten överklagas av berörd fastighetsägare eller sakägare.","description":"Noden slutför avtal, förrättning, markanvisning eller omprojektering och återgår sedan till rättighetskontrollen i B70-G070. Varje överklagat rättighetsbeslut skapar ett nytt rättsprocessled ovanpå själva förrättningen: fastighetsdomstols- eller MÖD-prövning kan tillkomma, och tiden multipliceras. Eftersom överklaganderisker är svåra att styra blir noden potentiellt iterativ över lång tid, samtidigt som projektets övriga gates är passerade och projektorganisationen står redo. Kostnaden består därför inte bara i fördröjning utan i att hålla byggberedskap levande.","motivation":"Ledningsrätts- och expropriationsbeslut är överklagbara enligt ledningsrättslagen och expropriationslagen, och erfarenheten från svensk infrastrukturutbyggnad (bl.a. Eis ledtidsrapport R2023:09) visar att rättighetsprocesserna regelmässigt utgör den längsta ledtidskomponenten i linjeprojekt. Källa: Ei R2023:09, https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf","affects":"B70-080:s loop mot B70-G070 och därmed B70-G090 och B70-130.","impact":"Flerårig fördröjning för berörda delar; risk att projektet måste delas upp i byggetapper med olika rättighetsstatus, vilket fördyrar logistik och entreprenad.","mitigation":"Identifiera tidigt vilka rättigheter som sannolikt kräver tvångsförfarande och initiera dem parallellt med miljöprövningen. Erbjud rimliga ersättningar tidigt för att minska överklagandeincitamentet. Planera byggsekvensen så att tvistiga fastigheter ligger sist.","source_refs":["LVV","EI_GRID","EXT: Ei R2023:09 https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-080-02","node_id":"B70-080","chart_key":"B70","node_label":"Säkra eller korrigera saknad genomföranderätt","title":"Omprojektering för att kringgå markmotstånd skapar nya tillståndsbehov","category":"Sektorssamordning","trigger":"För att lösa oöverstigligt markmotstånd väljer projektet att flytta en väg, ledning eller anläggningsdel – men den nya sträckningen träffar nya tillstånds- eller dispansområden.","description":"Omprojektering är nodens legitima sista utväg, men en ny sträckning eller placering kan korsa strandskydd, Natura 2000-områden, fornlämningar eller detaljplanelägen som inte prövats i de befintliga besluten. Därmed uppstår nya ansöknings- eller ändringsbehov i B20–B50-spåren, och nodens återgång till B70-G070 förvandlas till en återgång långt uppströms i processkartan. Risken är latent eftersom omprojekteringen ofta drivs av markavtals- eller entreprenadlogik utan att tillståndskonsekvenserna utreds först.","motivation":"MÖD 2016:13 illustrerar hur även små geometriska avvikelser (felaktigt angiven strandlinje) får rättsliga konsekvenser när genomförandet hamnar utanför det prövade läget. Att nya lägen kan kräva nya dispenser och prövningar följer direkt av MB 7 kap., strandskyddsreglerna och KML. Källa: MÖD 2016:13, https://lagen.nu/dom/mod/2016:13","affects":"B70-080, B70-G110 (förenlighet mot nya gränser) samt potentiellt B20-, B30-, B40- och B50-spåren vid nya prövningsbehov.","impact":"Nya tillstånds- eller dispensprocesser med månader till års ledtid; omprojekteringslösningen kan visa sig dyrare än den ursprungliga tvångsrätten den skulle undvika.","mitigation":"Genomför alltid en snabb tillståndskonsekvensanalys (screening mot strandskydd, Natura 2000, KML, PBL) innan en omprojektering beslutas. Dokumentera i beslutsmatrisen exakt vilka beslut som täcker det nya läget. Behåll tvångsrättsprocessen som parallellt spår tills alternativet är tillståndsmässigt klart.","source_refs":["STRAND","NATURA","KML","PBL","EXT: MÖD 2016:13 https://lagen.nu/dom/mod/2016:13"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-100-01","node_id":"B70-100","chart_key":"B70","node_label":"Slutför saknade parallella byggstartsgates","title":"Återöppnat B50-spår fastnar i kommunens eller sektorsmyndighetens handläggningskö","category":"Myndighetskapacitet & handläggning","trigger":"Den saknade gaten kräver ett nytt eller kompletterat ärende hos byggnadsnämnd, länsstyrelse, Ei eller annan sektorsmyndighet, vars handläggningstider inte ligger i projektets kontroll.","description":"Noden återöppnar det relevanta B50-spåret när ett parallellt beslut eller startbesked saknas. Detta innebär i praktiken ett nytt myndighetsärende – bygglovskomplettering, dispensansökan, koncessionskomplettering – med egen handläggnings- och eventuell samrådstid. Eftersom huvudspåret är klart uppstår en asymmetri: hela byggberedskapen väntar på ett ofta förhållandevis litet ärende som ändå har månader av ledtid. Byggnadsnämnder och länsstyrelser har varierande kapacitet, och ärendet konkurrerar med ordinarie kö utan möjlighet till skyndsamhetsyrkande i de flesta fall.","motivation":"Dokumenterade handläggningsproblem hos svenska tillstånds- och rättighetsmyndigheter (JO-kritik mot Lantmäteriet 2023, Svenskt Näringslivs genomgång 2024) visar att även formellt enkla ärenden kan ta lång tid när kapaciteten är ansträngd. Källor: https://www.publikt.se/nyhet/jo-kritik-mot-lantmateriet-langsam-handlaggning-25837 och https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html","affects":"B70-100:s loop mot B70-G090 och därmed B70-G110 och B70-130; handoff till B50-START.","impact":"Byggstart uppskjuten med det saknade ärendets fulla handläggningstid; projektorganisation och entreprenadavtal står i vänteläge.","mitigation":"Identifiera potentiella restgates tidigt och lämna in kompletterande ansökningar parallellt, inte sekventiellt efter gate-kontrollen. Upprätta direktkontakt med handläggande nämnd eller myndighet och be om realistisk tidsprognos. Undersök om delar av bygget kan starta utan den saknade gaten (momentvis startbesked).","source_refs":["PBL","PBL_START","EI_GRID","EXT: Publikt – JO-kritik mot Lantmäteriet https://www.publikt.se/nyhet/jo-kritik-mot-lantmateriet-langsam-handlaggning-25837"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-100-02","node_id":"B70-100","chart_key":"B70","node_label":"Slutför saknade parallella byggstartsgates","title":"Förändrade förutsättningar i parallellspåret gör att beslutet inte längre matchar projektet","category":"Teknisk komplexitet","trigger":"Mellan det att det parallella beslutet fattades och dess aktivering i B70 har projektets teknik, dimensionering eller tidplan ändrats så att beslutet måste omarbetas i stället för bara inhämtas.","description":"Parallella beslut fattas ofta långt före huvudtillståndets laga kraft. När gaten slutligen ska slutföras kan beslutet avse en äldre projektversion: en koncession med annan kapacitet, ett bygglov med annan placering, en markanvisning med annat tidsläge. Att \"slutföra\" gaten blir då inte en inhämtning utan en ändringsprocess, ibland med krav på nytt samråd eller ny prövning. Noden underskattar lätt detta om statusmatrisen bara registrerar beslutets existens och inte dess innehållsmässiga giltighet mot aktuell projektversion.","motivation":"Storskaliga projekt som Markbygden har prövats i etapper med beslut över många år (MMD 2012, MÖD M 6331-17 2018), där teknisk utveckling och ändrade verksantaganden mellan besluten skapat avstämningsproblem – ett mönster som generaliserar till alla fleråriga multiprojekt. Källa: MÖD M 6331-17, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-6331-17.pdf","affects":"B70-100, B70-G090 och B70-G110 (innehållskonflikter som dyker upp vid förenlighetskontrollen).","impact":"Ändrings- eller nyprövningsärenden i parallellspår med fördröjning från månader till år; risk att den konsoliderade matrisen måste byggas om.","mitigation":"Låt statusmatrisen registrera både beslutets existens och dess parametrar (kapacitet, geometri, giltighetstid) samt vilken projektversion de avser. Inför kvartalsvisa giltighetskontroller av parallella beslut mot aktuell projektering. Eskalera avvikelser till ändringsbedömning omedelbart, inte vid gate-kontrollen.","source_refs":["MB","PBL","ELLAG","EXT: MÖD M 6331-17 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-6331-17.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-120-01","node_id":"B70-120","chart_key":"B70","node_label":"Lös beslutskonflikt eller omprojektera","title":"Konfliktlösning kräver villkorsändring eller ny prövning med egen processledtid","category":"Myndighetskapacitet & handläggning","trigger":"Den identifierade beslutskonflikten kan bara lösas genom att något av de slutliga besluten ändras, vilket kräver ansökan om villkorsändring, omprövning eller nytt tillstånd hos berörd instans.","description":"Noden ska identifiera styrande beslut och initiera villkorsändring eller ny prövning. Men en villkorsändring är en egen prövningsprocess: ansökan, eventuell komplettering, remiss och möjlighet för parter att yttra sig, samt överklagbarhet. För ändringar med potentiellt ökad miljöpåverkan kan ändringsanmälan eller nytt tillstånd krävas enligt MPF 1 kap. 4 och 11 §§, vilket förlänger ytterligare. Medan konfliktlösningen pågår står projektet still, och det finns en risk att ändringsprocessen öppnar för nya synpunkter som berör fler delar av beslutet än den ursprungliga konflikten.","motivation":"Länsstyrelsernas vägledning om ändring av villkor i miljötillstånd visar att villkorsändring kräver saklig grund (uppenbart onödigt, strängare än nödvändigt eller oförutsedda omständigheter) och egen myndighetsprövning – det är ingen formell åtgärd. Källa: Länsstyrelsen Dalarna, https://www.lansstyrelsen.se/dalarna/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/provningar-av-befintlig-miljofarlig-verksamhet/andra-villkor-i-tillstand-for-miljofarlig-verksamhet.html","affects":"B70-120:s loop mot B70-G110 samt återkoppling till B30- och B40-spåren vid ny prövning.","impact":"Fördröjning om månader till år beroende på ändringens karaktär; öppnande av beslutet kan leda till ytterligare villkorsändringar.","mitigation":"Analysera först om konflikten kan lösas genom omprojektering inom befintliga besluts ramar (billigast och snabbast). Vid villkorsändring, avgränsa yrkandet strikt till konfliktpunkten för att undvika att öppna hela beslutet. Förhandla fram stöd hos tillsynsmyndigheten innan ansökan lämnas.","source_refs":["MB","MPF","EXT: Länsstyrelsen – Ändra villkor i tillstånd https://www.lansstyrelsen.se/dalarna/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/provningar-av-befintlig-miljofarlig-verksamhet/andra-villkor-i-tillstand-for-miljofarlig-verksamhet.html"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-120-02","node_id":"B70-120","chart_key":"B70","node_label":"Lös beslutskonflikt eller omprojektera","title":"Omprojekteringen rubbar alternativ- och MKB-förutsättningarna i det ursprungliga tillståndet","category":"Rättslig osäkerhet","trigger":"Den valda lösningen ändrar verksamhetens lokalisering, utformning eller omfattning så pass att frågan uppstår om den ursprungliga MKB:n och alternativprövningen fortfarande bär tillståndet.","description":"Miljötillstånd vilar på den prövade alternativ- och effektbeskrivningen. Om beslutskonflikten löses genom en omprojektering som förskjuter dessa förutsättningar – annan placering av anläggningsdelar, ändrad kapacitetsfördelning, nya påverkansområden – kan motparter hävda att tillståndet inte täcker det som nu ska byggas. Det öppnar för överklagande av efterföljande beslut, krav på ändringstillstånd eller i värsta fall ifrågasättande av huvudtillståndets giltighet för den ändrade delen. Gränsdragningen mellan anpassning inom tillståndet och ny prövningspliktig ändring är rättsligt svår och tvistekänslig.","motivation":"MB 6 kap:s krav på alternativbeskrivning och MKB samt MPF 1 kap. 4 och 11 §§ om ändringsbedömning gör att väsentliga avvikelser från det prövade objektet är en dokumenterad tvisteyta i svensk praxis; erfarenheten från stora infrastrukturprocesser visar att motparter aktivt bevakar sådana avvikelser. Strikt välgrundat resonemang kopplat till MB 6 kap. och MPF 1 kap.","affects":"B70-120, B70-G110 (förnyad förenlighetskontroll) och potentiellt B20/B30 vid krav på kompletterande miljöbedömning.","impact":"Risk för ny miljöbedömnings- och prövningsprocess för den ändrade delen; osäkerhet om huvudtillståndets täckning kan försena byggstart betydligt.","mitigation":"Gör en formell ändringsbedömning enligt MPF 1 kap. för varje omprojekteringsalternativ innan det väljs. Dokumentera att MKB:ns effektbedömningar fortfarande är giltiga eller komplettera dem proaktivt. Behåll det prövade alternativet som fallback tills den nya lösningens tillståndsmässighet är klarlagd.","source_refs":["MB","MPF","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-130-01","node_id":"B70-130","chart_key":"B70","node_label":"Fastställ legal byggberedskap","title":"legal_build_ready sätts på felaktig grund – förbisedd verkställighets- eller inhibitionsfråga","category":"Rättslig osäkerhet","trigger":"Readiness-beslutet fattas utifrån ofullständig eller felaktig slutstatus, till exempel att ett beslut behandlats som verkställbart fastän överinstansen inhiberat det, eller att en frist missbedömts.","description":"Noden sätter en binär flagga som hela byggorganisationen agerar på. Ett felaktigt positivt beslut innebär att arbeten påbörjas utan rättsligt stöd, med risk för förelägganden, vite och återställningsskyldighet samt skadeståndsanspråk från sakägare. Ett felaktigt negativt beslut innebär onödig fördröjning. Eftersom flaggan aggregerar många gates (finalitet, villkor, rättigheter, sektorsbeslut) är den helt beroende av att underlagskedjan är verifierad; felet behöver inte uppstå i noden själv utan kan ärvas från vilken föregående kontroll som helst.","motivation":"Verkställighetsreglerna i MB 22 kap. 28 § och motsvarande i PBL gör att ett besluts rättsliga bärkraft kan ändras av överinstansens agerande (inhibition) efter att projektet gjort sin bedömning; Uppsala kommuns yttrande över SOU 2024:98 beskriver avvägningen som genuint svår. Källa: https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf","affects":"B70-130, B70-G140 och hela byggfasen; vid felaktig positiv flagga även retroaktiv rättslig exponering.","impact":"Vid falskt positivt utfall: olaga byggstart med vite, stopp och återställningskrav. Vid falskt negativt: onödig fördröjning av entreprenadstart.","mitigation":"Kräv fyrögonprincip med oberoende juridisk signatur på underlaget till readiness-beslutet, inklusive dagsfärsk kontroll av diarier och överinstansbeslut. Dokumentera beslutsunderlaget per gate med datum och källa. Inför en formell återkallelserutin om någon underlagsstatus ändras efter flaggningen.","source_refs":["MB","MMDL","PBL","EXT: Uppsala kommuns yttrande över SOU 2024:98 https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-130-02","node_id":"B70-130","chart_key":"B70","node_label":"Fastställ legal byggberedskap","title":"Readiness-beslutet fattas utan dokumenterad spårbarhet per gate","category":"Underlagsbrist & data","trigger":"Fastställandet sker som en samlad projektledarbedömning utan att varje gates status dokumenterats med källa, datum och ansvarig, vilket omöjliggör efterkontroll och ansvarsutredning.","description":"Värdet i noden ligger i att beslutet är spårbart: vid senare tvist, tillsyn eller försäkringsfråga måste projektet kunna visa exakt vilka beslut och villkor som låg till grund för byggberedskapen. Om fastställandet bara dokumenteras som ett mötesprotokoll eller en e-postbekräftelse kan projektet inte i efterhand bevisa att kontrollerna var korrekta. Detta försvagar ställningen både vid eventuella villkorsbrottsprocesser och vid transaktioner eller finansieringsgranskningar där byggberedskapen ska verifieras av extern part.","motivation":"Strikt välgrundat resonemang: eftersom B70:s gates är villkorade av en kedja av myndighetsbeslut (MB, PBL, ellagen, minerallagen) är dokumenterad spårbarhet en förutsättning för att kunna försvara byggberedskapen vid tillsyn enligt MB 26 kap. och vid överlåtelse- eller finansieringsprövning. Källor: MB och MMDL i källregistret.","affects":"B70-130 och B70-G140; indirekt hela byggfasens rättsliga dokumentation.","impact":"Försvagad bevisställning vid tvist eller tillsyn, försvårade transaktions- och finansieringsprocesser, samt svårighet att snabbt korrigera ett felaktigt readiness-beslut.","mitigation":"Fastställ byggberedskapen i ett signerat readiness-intyg med bilagd gate-för-gate-statusmatris (beslut, datum, källhänvisning, ansvarig kontrollant). Arkivera underlagen versionsstyrt. Inför kvartalsvis revalidering av intyget om byggstarten dröjer.","source_refs":["MB","MMDL","PBL"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-150-01","node_id":"B70-150","chart_key":"B70","node_label":"Avhjälp praktisk tillståndsrelaterad restpunkt","title":"Restpunkten visar sig vara materiell och kräver ny prövning i stället för komplettering","category":"Underlagsbrist & data","trigger":"Det som registrerats som en praktisk restpunkt (saknat godkännande, ofullständig villkorsefterlevnad) visar sig vid närmare granskning kräva ett nytt myndighetsbeslut eller en ändringsprövning.","description":"Noden är avsedd för avhjälpande av mindre restpunkter, men gränsen mellan en komplettering och en ny prövningsfråga är inte alltid tydlig när punkten upptäcks. Om restpunkten berör själva tillståndets räckvidd – till exempel att ett godkännande aldrig efterfrågats i rätt form eller att efterlevnaden avviker från villkorets ordalydelse – kan myndigheten kräva formell handläggning med remiss och överklagbarhet. Noden blir då inte en snabb återgång till B70-G140 utan en omväg via B30/B40-spåren, och felaktig triagering av restpunkten förlänger hanteringen.","motivation":"Gränsdragningsproblematiken mellan komplettering och ändringsprövning är inbyggd i MPF 1 kap. 4 och 11 §§ och dokumenterad i myndighetsvägledningar om villkorsändring (Länsstyrelsen Dalarna); erfarenheten visar att sent upptäckta formbrister i godkännandekedjor regelmässigt kräver ny handläggning. Källa: https://www.lansstyrelsen.se/dalarna/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/provningar-av-befintlig-miljofarlig-verksamhet/andra-villkor-i-tillstand-for-miljofarlig-verksamhet.html","affects":"B70-150:s loop mot B70-G140 samt vid ny prövning B30- och B40-spåren.","impact":"I stället för en snabb avhjälpning uppstår en ny myndighetsprocess med fördröjning om månader och möjlig överklagbarhet.","mitigation":"Triagea varje restpunkt med juridisk sakkunskap direkt vid upptäckt: avhjälps inom befintligt beslut eller kräver nytt beslut? Kontakta berörd myndighet tidigt för att klarlägga hanteringsvägen innan arbete läggs på en komplettering som visar vara otillräcklig.","source_refs":["MB","MPF","EXT: Länsstyrelsen – Ändra villkor i tillstånd https://www.lansstyrelsen.se/dalarna/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/provningar-av-befintlig-miljofarlig-verksamhet/andra-villkor-i-tillstand-for-miljofarlig-verksamhet.html"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-END-01","node_id":"B70-END","chart_key":"B70","node_label":"Praktiskt tillståndsmässigt byggberedd","title":"Byggberedskapen urholkas av att tillståndet aldrig tas i anspråk innan fristens utgång","category":"Extern händelse","trigger":"Efter att byggberedskapen fastställts fördröjs den fysiska starten av externa faktorer – finansiering, marknadsläge eller ägarbeslut – så att igångsättnings- eller arbetstider i de lagakraftvunna besluten hinner löpa ut.","description":"Slutnoden markerar att projektet är byggberett, men beredskapen är inte evig: beslutens tidsvillkor fortsätter löpa. Om den faktiska byggstarten av externa skäl skjuts upp – exempelvis genom försämrade marknadsförutsättningar eller ägarens finansiella kris – kan tillstånd förfalla enligt 24 kap. 2 § MB innan de tas i anspråk. Vindkraftssektorns ekonomiska svårigheter 2023–2025, med rekonstruktioner och ägartillskott i miljardklassen, visar att även fullt tillståndsgivna storskaliga projekt kan stå länge utan att påbörjas. Byggberedskap måste därför förstås som ett tillstånd med bäst-före-datum.","motivation":"Markbygden Ett AB:s rekonstruktion 2023 och fortsatta ekonomiska kris (ägartillskott om nära två miljarder) visar att finansiella faktorer kan förhala ianspråktagandet av färdigprövade projekt; samtidigt är 24 kap. 2 § MB:s förfallanderegel och MÖD:s restriktiva förlängningspraxis (M 9024-15) gällande rätt. Källor: https://www.affarsvarlden.se/artikel/markbygden-ett-konkursmassigt-trots-agartillskott-pa-tva-miljarder och https://cdn.birdlife.se/wp-content/uploads/2018/12/Mark-och-milj%C3%B6%C3%B6verdomstolen_ig%C3%A5ngs%C3%A4ttningstid_2016-05-17.pdf","affects":"B70-END och hela investeringen; vid förfall återgång till respektive prövningsspår (B30/B40/B50).","impact":"Förfallna tillstånd trots genomförd byggberedskapsprocess; ny prövning krävs eller projektet avskrivs, med förlorade utrednings- och processkostnader.","mitigation":"Koppla readiness-flaggan till en bevakad fristkalender och revalidera byggberedskapen regelbundet om starten dröjer. Ansök om förlängning i god tid med dokumenterade giltiga skäl. Där det är rättsligt möjligt och kommersiellt rimligt, ta tillstånd i anspråk genom ett tidigt definierat startmoment.","source_refs":["MB","EXT: Affärsvärlden – Markbygden Ett https://www.affarsvarlden.se/artikel/markbygden-ett-konkursmassigt-trots-agartillskott-pa-tva-miljarder","EXT: MÖD M 9024-15 https://cdn.birdlife.se/wp-content/uploads/2018/12/Mark-och-milj%C3%B6%C3%B6verdomstolen_ig%C3%A5ngs%C3%A4ttningstid_2016-05-17.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G020-01","node_id":"B70-G020","chart_key":"B70","node_label":"Är alla nödvändiga avgöranden slutliga eller verkställbara?","title":"Överklagande inkommer på sista fristdagen och nollställer finalitetskontrollen","category":"Överklagande & rättsprocess","trigger":"En motpart, sakägare eller miljöorganisation överklagar ett nyckelbeslut sent på den tjugoförsta dagen av överklagandefristen, efter att projektet hunnit behandla beslutet som slutligt.","description":"Finalitetskontrollen bygger på att överklagandefrister har löpt ut utan att talan förts. Miljöorganisationer med partsställning och berörda fastighetsägare har i svenska processer ofta väntat till fristens slut för att hinna samla underlag och finansiering. Ett inkommet överklagande förflyttar beslutet till mark- och miljödomstolen eller MÖD och öppnar frågor om prövningstillstånd, verkställbarhet och inhibition. Projektets samlade finalitetsstatus ändras därmed retroaktivt, och parallella gates som antagits klara måste omprövas eftersom villkorsläget åter är öppet.","motivation":"I tillståndsprövningen av Preemraff i Lysekil överklagade bl.a. Naturskyddsföreningen och processen gick från MPD via mark- och miljödomstolen (deldom 2018) till MÖD (avgörande 2020-06-15) – flera års extra handläggning trots att första instans bifallit ansökan. Källa: Sveriges Domstolar, https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/","affects":"B70-G020 (loop tillbaka), B70-030 (överprövningshantering aktiveras) och indirekt B70-130 (byggberedskap kan inte deklareras).","impact":"Byggberedskapen uppskjuts med månader till år beroende på instansväg; kalkyler, entreprenadavtal och finansieringsvillkor måste förhandlas om.","mitigation":"Bevaka diarier och delgivning aktivt under hela överklagandeperioden; planera inte byggstart förrän fristerna utlöpt. Kartlägg tidigt tänkbara klagande och deras bevakningsmönster. Förhandla flexibla startvillkor i entreprenad- och finansieringsavtal som tål fristdagsöverklaganden.","source_refs":["MB","MMDL","COURT_APPEAL","EXT: Sveriges Domstolar – Preemraff https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G020-02","node_id":"B70-G020","chart_key":"B70","node_label":"Är alla nödvändiga avgöranden slutliga eller verkställbara?","title":"Verkställbarhetsbedömningen av icke lagakraftvunna beslut blir fel","category":"Rättslig osäkerhet","trigger":"Projektet vill ta ett överklagat men verkställbart tillstånd i anspråk, och den juridiska bedömningen av verkställighetsrätt, prövningstillstånd och inhibitionsrisk blir felaktig eller oenig.","description":"Noden ska särskilja beslut som är slutliga från beslut som är verkställbara trots överklagande. Enligt 22 kap. 28 § MB gäller som utgångspunkt att ansökningsbeslut får verkställas trots överklagande, men överinstansen kan besluta om inhibition, och vissa beslutstyper har särskilda verkställighetsregler. Bedömningen kräver analys av beslutstyp, instansväg och eventuella verkställighetsförordnanden. Om projektet bygger på ett beslut som sedan inhiberas eller upphävs riskerar genomförda arbeten att behöva återställas. Om projektet tvärtom avvaktar i onödan försenas byggstarten utan rättslig nödvändighet. Remissyttranden till SOU 2024:98 visar att avvägningen mellan effektivitet och rättssäkerhet vid verkställighet är omdiskuterad.","motivation":"Uppsala kommuns remissvar över SOU 2024:98 konstaterar att 22 kap. 28 § MB:s verkställighetsregel är en avvägning mellan effektivitet och rättssäkerhet och att motstående intressen och skaderisker är betydande i miljöärenden – ett erkännande av att verkställbarhetsfrågan är genuint svårbedömd. Källa: Uppsala kommun, yttrande över SOU 2024:98, https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf","affects":"B70-G020, B70-030 och B70-130; vid felaktig ianspråktagande även hela byggfasen.","impact":"Antingen onödig fördröjning eller byggande på olaga grund med risk för återställningsförelägganden, vite och förlorade investeringar i redan utförda arbeten.","mitigation":"Låt alltid extern miljöprocessjurist besvara verkställbarhetsfrågan skriftligt per beslut, inklusive inhibitionsrisk och fallbacks. Avvakta laga kraft för irreversibla moment (sprängning, fälld skog, grundläggning) även när beslutet är verkställbart. Bevaka överinstansens hantering för att fånga inhibitionsbeslut omedelbart.","source_refs":["MB","MMDL","COURT_APPEAL","EXT: Uppsala kommuns yttrande över SOU 2024:98 https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G020-03","node_id":"B70-G020","chart_key":"B70","node_label":"Är alla nödvändiga avgöranden slutliga eller verkställbara?","title":"Återförvisning från överinstans river upp hela beslutspaketet","category":"Överklagande & rättsprocess","trigger":"MÖD eller mark- och miljödomstolen återförvisar ett centralt tillståndsbeslut till underinstansen på grund av bristfällig utredning eller felaktig handläggning.","description":"Återförvisning innebär att ett beslut som projektet räknat som i det närmaste klart ska tas upp på nytt, ofta med krav på kompletterande utredning, ny kungörelse och nya yttranderundor. Eftersom besluten i B70 är inbördes beroende kan återförvisning av huvudtillståndet göra att parallella beslut (dispenser, koncessioner) som byggde på det prövade underlaget också måste ses över. Finalitetskontrollen kan då inte passera förrän hela kedjan återupprättats, och mellantiden kan vara betydlig eftersom domstolarnas och delegationernas handläggningstider är långa.","motivation":"Kompletterings- och återförvisningspraxis hos MÖD är omfattande; exempelvis MÖD:s beslut i mål M 8827-14 visar detaljerade krav på kompletterande utredning innan målet kan slutföras. Remissmaterialet till SOU 2024:98 behandlar särskilt tidsfrister vid återförvisning eftersom det är ett känt förlängningsmoment. Källa: MÖD M 8827-14, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2015/m-8827-14.pdf","affects":"B70-030 (överprövningsloop), B70-G020 (upprepad finalitetskontroll) och via handoff B60-START även överklagandespåret.","impact":"Förnyad förstainstanshandläggning med fördröjning om typiskt ett till flera år; risk för att tidigare vunna finalitet i parallella spår måste omprövas.","mitigation":"Gör en återförvisningsriskbedömning av ansökningsunderlagets svagaste punkter innan finalitetsplanering. Håll utredningsteamet delvis mobiliserat tills laga kraft inträtt. Säkerställ att kompletteringar kan produceras snabbt och att kontaktytor mot prövningsinstanserna är etablerade.","source_refs":["MB","MMDL","COURT_APPEAL","EXT: MÖD M 8827-14 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2015/m-8827-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-G050-01","node_id":"B70-G050","chart_key":"B70","node_label":"Är säkerheter och förhandsbesked godkända?","title":"Ekonomisk säkerhet är inte ställd eller godkänd – tillståndet saknar giltighet","category":"Rättslig osäkerhet","trigger":"Tillståndsbeslutet gör giltigheten beroende av ställd ekonomisk säkerhet, men bankgarantin är inte upprättad, har fel form eller har inte godkänts av myndigheten när byggstart närmar sig.","description":"Många tillstånd för miljöfarlig verksamhet och vattenverksamhet är enligt 16 kap. MB villkorade med att ekonomisk säkerhet ställs och godkänns för avhjälpande av miljöskador och återställning. Godkännandet är en separat myndighetsprövning av belopp, säkerhetsform och garantins löptid. Om säkerheten inte är godkänd får verksamheten inte sättas igång, och om tidsfristen för säkerhetsställandet löper ut kan tillståndet förfalla. Risken är särskilt påtaglig i projekt där finansieringen är osäker eller där garantibehovet är stort, eftersom bankgarantier av denna storlek binder kreditramar och kräver långa förhandlingar.","motivation":"MÖD:s dom 2025-02-10 (M 4304-23) exemplifierar att domstolen med stöd av 16 kap. 3 § MB gör tillståndets giltighet direkt beroende av ställd säkerhet. Länsstyrelsernas ansökningsvägledning poängterar att verksamhet som inte sätts igång inom föreskriven tid förfaller. Källa: MÖD M 4304-23, https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2025/m-4304-23-dom-2025-02-10.pdf","affects":"B70-G050 (gate kan inte passeras), B70-060 (kompletteringsloop) och slutligen B70-130/B70-G140.","impact":"Byggstart stoppas tills säkerheten godkänts; i ogynnsamt fall förfaller tillståndet och hela prövningen måste göras om.","mitigation":"Påbörja garantiförhandlingarna direkt efter tillståndsbeslutet och matcha garantins löptid mot myndighetens krav. Verifiera säkerhetens lydelse mot beslutstexten med jurist innan den ställs. Följ upp myndighetens godkännande aktivt – räkna inte godkännandet som en ren formalitet.","source_refs":["MB","EXT: MÖD M 4304-23 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2025/m-4304-23-dom-2025-02-10.pdf","EXT: Länsstyrelsen – Att söka tillstånd till miljöfarlig verksamhet https://www.lansstyrelsen.se/download/18.68fbc90d193243b379e49095/1732528529140/Att%20s%C3%B6ka%20tillst%C3%A5nd%20till%20milj%C3%B6farlig%20verksamhet.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G050-02","node_id":"B70-G050","chart_key":"B70","node_label":"Är säkerheter och förhandsbesked godkända?","title":"Myndighetens godkännande av förstartshandlingar dröjer i handläggningskö","category":"Myndighetskapacitet & handläggning","trigger":"Tillsyns- eller prövningsmyndigheten ska godkänna kontrollprogram, arbetsplan eller detaljprojektering före start, men saknar handläggningskapacitet inom projektets tidsfönster.","description":"Förstartsvillkoren kräver ofta positiva myndighetsbeslut, inte bara inlämnade handlingar. Länsstyrelser och kommunala nämnder har begränsad kapacitet för dessa godkännanden, och det finns sällan lagstadgade frister. Ett godkännande som projektet budgeterat till några veckor kan i praktiken ta månader, särskilt vid semestertider eller när ärendet kräver samråd mellan flera myndigheter. Eftersom godkännandet är ett hårt villkor kan inte heller förberedande markarbeten starta, trots att alla andra gates är passerade.","motivation":"JO har riktat kritik mot Lantmäteriet för långsam handläggning och Svenskt Näringsliv har dokumenterat att Lantmäteriets handläggningstider fördröjer företagsprojekt – ett mönster som gäller godkännandeärenden brett i svensk förvaltning. Källa: Svenskt Näringsliv 2024-08-19, https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html","affects":"B70-G050, B70-060 (loop) och B70-G140 (praktisk byggstart blockeras trots legala förutsättningar).","impact":"Stillastående projektorganisation och entreprenad under väntan på godkännande; uppskjuten byggstart om veckor till månader per godkännandeärende.","mitigation":"Lämna in förstartshandlingar långt före planerad start med komplett underlag från första inlämningen. Avtal om möte med handläggaren före inlämning för att kalibrera kravbilden. Bygg tidsbuffert i byggprogrammet för godkännandeledtider och eskalera via myndighetens ledning vid överdrift.","source_refs":["MB","EXT: Svenskt Näringsliv – Lantmäteriets handläggningstider https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html","EXT: Publikt – JO-kritik mot Lantmäteriet https://www.publikt.se/nyhet/jo-kritik-mot-lantmateriet-langsam-handlaggning-25837"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-G050-03","node_id":"B70-G050","chart_key":"B70","node_label":"Är säkerheter och förhandsbesked godkända?","title":"Tillståndshavarens ekonomiska svikt underminerar säkerhets- och garantistrukturen","category":"Extern händelse","trigger":"Projektbolaget eller garantiställaren drabbas av ekonomisk kris eller rekonstruktion, vilket gör att ställda säkerheter måste omförhandlas eller att myndigheten kräver förstärkt säkerhet mitt i förstartsfasen.","description":"Säkerhets- och garantikraven förutsätter en solvent motpart. Om tillståndshavaren hamnar i rekonstruktion eller om moderbolagsgarantier dras tillbaka kan myndigheten ifrågasätta säkerhetsarrangemangets hållbarhet och kräva byte av garantiform eller höjt belopp. Samtidigt försvåras förhandlingen av nya bankgarantier när bolagets kreditvärdighet fallit. För storskaliga anläggningar – gruvor, vindparker, vattenverk – är återställningsåtagandena mycket stora, och en finansiell kris i projektbolaget skapar därför en reell osäkerhet kring om förstartsvillkoren alls kan uppfyllas.","motivation":"Markbygden Ett AB – bolaget bakom Europas största landbaserade vindpark – ansökte om rekonstruktion 2023 och klarade sig först efter ägartillskott om nära två miljarder kronor; affärsmediers granskning visade dessutom på utflöden till ägarbolag före rekonstruktionen. Det visar att även mycket stora tillståndshavares bärkraft kan svikta efter tillståndet. Källa: Affärsvärlden 2025-07-24, https://www.affarsvarlden.se/artikel/markbygden-ett-konkursmassigt-trots-agartillskott-pa-tva-miljarder","affects":"B70-G050, B70-060 och B70-G140; vid konkurs riskerar även själva tillstånds- och säkerhetsstrukturen att behöva omförhandlas.","impact":"Fördröjda eller omöjliga godkännanden av säkerheter, krav på nya garantier under pressade villkor, och i värsta fall omöjlighet att ta tillståndet i anspråk.","mitigation":"Strukturera säkerheter oberoende av projektbolagets kreditstatus (bank- eller försäkringsgarantier i stället för moderbolagsborgen). Följ bolagets finansiella utveckling som en riskindikator i B70-arbetet. Upprätta kontaktyta med tillsynsmyndigheten tidigt om finansieringsläget förändras.","source_refs":["MB","EXT: Affärsvärlden – Markbygden Ett https://www.affarsvarlden.se/artikel/markbygden-ett-konkursmassigt-trots-agartillskott-pa-tva-miljarder","EXT: Sveriges Radio – Rekonstruktionen för Markbygden Ett klar https://www.sverigesradio.se/artikel/rekonstruktionen-for-markbygden-ett-klar-ingen-konkurs"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G070-01","node_id":"B70-G070","chart_key":"B70","node_label":"Är markåtkomst och genomföranderätt säkrad?","title":"Markägare vägrar avtal – förrättnings- och expropriationskö stoppar genomföranderätten","category":"Intressekonflikt & markåtkomst","trigger":"En eller flera fastighetsägare vägrar frivilliga avtal om mark, servitut eller ledningsrätt, och projektet tvingas till lantmäteriförrättning eller expropriation.","description":"Noden kontrollerar att ägande, servitut, ledningsrätt, markanvisning, rådighet och tvångsrätt är säkrade för byggskedet. När frivilliga avtal inte nås måste rättigheter tvångsvis etableras genom ledningsrättsförrättning, fastighetsbildning eller expropriation, processer som ligger utanför projektets kontroll och hos myndigheter med dokumenterade köer. Förrättningsbeslut kan dessutom överklagas, vilket förlänger tiden ytterligare. Eftersom miljötillstånd och koncessioner kan vara i laga kraft utan att markåtkomsten är löst blir denna gate ofta den reella kritiska linjen även när alla miljöbeslut är klara.","motivation":"Svenskt Näringsliv har dokumenterat att Lantmäteriets långa handläggningstider fördröjer företagsprojekt (2024-08-19), och Eis rapport R2023:09 om elnätsutbyggnad pekar ut ledningsrättsförrättningar som en flaskhals. Källor: https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html och https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf","affects":"B70-G070, B70-080 (tvungna rättighetsprocesser aktiveras) och via handoff B50-START även sektorsspårens genomförandedelar.","impact":"Fördröjning om månader till flera år för berörda sträckor eller områden; projektet kan tvingas etappera byggstarten eller omprojektera runt motståndsfastigheter.","mitigation":"Påbörja avtalsförhandlingar parallellt med tillståndsprocessen, inte efter laga kraft. Ansök om förrättning tidigt där motstånd är känt, och körbana-separera projektet så att osäkrade fastigheter inte ligger på kritiska linjen. Budgetera för överklagade förrättningsbeslut i tidplanen.","source_refs":["LVV","EI_GRID","EXT: Svenskt Näringsliv 2024-08-19 https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html","EXT: Ei R2023:09 https://ei.se/download/18.43e19b9d18779705cf7b0b2/1682595042339/Kortare-ledtider-för-elnätsutbyggnad-Ei-R2023-09.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G070-02","node_id":"B70-G070","chart_key":"B70","node_label":"Är markåtkomst och genomföranderätt säkrad?","title":"Samebyrättigheter och renskötselns rådighet är inte hanterade i genomförandeplanen","category":"Intressekonflikt & markåtkomst","trigger":"Projektområdet ligger inom renskötselområde och tillståndsprocessen har visserligen prövat frågan materiellt, men den praktiska rådighets- och samexistensregleringen med berörd sameby saknas eller är omtvistad inför byggstart.","description":"Markåtkomst i renskötselområden är inte bara en fråga om fastighetsrättsliga rättigheter utan också om samerna urfolksrättigheter, rennäringslagens skydd och praktiska samverkansformer under bygg- och drifttid. Även där tillstånd beviljats kan brist på fungerande överenskommelser om betesperioder, ledningar, vägar och störningsfria zoner leda till tvister, blockader eller nya rättsprocesser. Nodens kontroll av \"rådighet\" måste därför omfatta mer än lagfarter och servitut; den måste täcka de faktiska brukarförhållanden som tillståndet prövat.","motivation":"Kallak/Gállok-processen visar djupet i konflikten: trots att regeringen i mars 2022 beviljade bearbetningskoncession och Högsta förvaltningsdomstolen 2024-06-25 lämnade laglighetsprövningen utan åtgärd kvarstår samebyarnas motstånd och praktiska genomförandefrågor. Källor: NSD 2024-06-25, https://www.nsd.se/nyheter/jokkmokk/artikel/domstolen-ger-gront-ljus-for-gruvbeslut-i-kallak/lw4z5e1r och Sveriges Natur, https://www.sverigesnatur.org/aktuellt/gront-ljus-for-omstridda-gruvplaner-i-kallak/","affects":"B70-G070, B70-080 och B70-G110 (förenlighet mellan tillståndsvillkor om renskötselhänsyn och fysiskt genomförande).","impact":"Konfliktyta kvarstår efter laga kraft med risk för fysiska blockader, medial uppmärksamhet, nya rättsprocesser och försenad eller dyrare etappering av bygget.","mitigation":"Upprätta formella samverkansavtal med berörda samebyar före byggstart, med tidsplaner anpassade till betes- och flyttperioder. Verifiera att tillståndets samtliga renskötselvillkor är omsatta i entreprenadavtal och arbetsplaner. Utse dedikerad samverkansansvarig med mandat att lösa konflikter operativt.","source_refs":["MINERALLAG","EXT: NSD – Domstolen ger grönt ljus för gruvbeslut i Kallak https://www.nsd.se/nyheter/jokkmokk/artikel/domstolen-ger-gront-ljus-for-gruvbeslut-i-kallak/lw4z5e1r","EXT: Sveriges Natur – Kallak https://www.sverigesnatur.org/aktuellt/gront-ljus-for-omstridda-gruvplaner-i-kallak/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G070-03","node_id":"B70-G070","chart_key":"B70","node_label":"Är markåtkomst och genomföranderätt säkrad?","title":"Rättighetsbilden visar sig vara felaktig eller ofullständig i lagfarts- och servitutsgranskningen","category":"Underlagsbrist & data","trigger":"Den slutliga rättighetskontrollen avslöjar okända servitut, gemensamhetsanläggningar, tomträtter eller ägarförhållanden som inte fångats i tidigare skeden.","description":"Noden förutsätter att den konsoliderade rättighetsbilden är komplett, men äldre servitut kan vara ohäftade, gemensamhetsanläggningar kan ha egna beslutsorgan, och ägarbyten under den fleråriga tillståndsprocessen kan ha ändrat förutsättningarna. Upptäcks sådana brister först här måste nya avtal eller förrättningar till, ibland med nya parter som inte deltagit i processen och som därför saknar incitament att medverka snabbt. Risken är störst i projekt med många berörda fastigheter, som ledningsprojekt, vägar och storskalig vindkraft.","motivation":"Erfarenheten från svenska lednings- och infrastrukturprojekt visar att fastighetsrättsliga överraskningar – ohäftade servitut, oklara gränser och gemensamhetsanläggningar – är en återkommande förseningsfaktor; Lantmäteriets roll i förrättningar och den dokumenterade kritiken mot handläggningstiderna gör att sent upptäckta brister är särskilt kostsamma. Källa: Svenskt Näringsliv 2024-08-19, https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html","affects":"B70-G070, B70-080 (nya rättighetsprocesser) och indirekt B70-130 (ofullständig byggberedskap).","impact":"Oplanerade rättighetsprocesser med fördröjning; i ogynnsamma fall omprojektering av anläggningsdelar som kolliderar med nyligen upptäckta rättigheter.","mitigation":"Beställ en oberoende fastighetsrättslig slutgranskning (lagfarts-, servituts- och gemensamhetsanalys) som en egen leverans i B70, inte som en del av tillståndsarbetet. Håll rättighetsdatabasen levande under hela processen med återkommande utdrag ur fastighetsregistret.","source_refs":["LVV","EXT: Svenskt Näringsliv 2024-08-19 https://www.svensktnaringsliv.se/regioner/dalarna/lantmateriets-langa-handlaggningstider-och-regelverk-fordrojer-fa_1218639.html"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G090-01","node_id":"B70-G090","chart_key":"B70","node_label":"Är PBL- och sektorsspecifika startgates klara?","title":"Startbesked kan inte meddelas trots beviljat bygglov","category":"Överklagande & rättsprocess","trigger":"Bygglov eller förhandsbesked är beviljat men överklagat, verkställbarheten inhiberad, eller tekniska förutsättningar för startbesked (kontrollplan, ansvariga, utredningar) är inte uppfyllda.","description":"PBL-spårets startbesked är ett eget beslut som kräver att bygglovet fått laga kraft eller är verkställbart och att byggnadsnämndens tekniska krav är uppfyllda. I praktiken kan startbeskedet utebli trots att bygglovet vunnit laga kraft, till exempel för att kontrollplanen inte godkänts eller att grannars överklagande av detaljplanen påverkar förutsättningarna. Eftersom startbeskedet är ett hårt krav för att påbörja arbetet blockerar ett uteblivet besked hela byggstarten även när miljö- och sektorsbesluten är klara. Nodens kontroll måste därför skilja på bygglovets laga kraft och startbeskedets faktiska meddelande.","motivation":"Boverkets vägledning om startbesked visar att startbesked är en separat gate med egna förutsättningar, och verkställbarhetspropositionen för bygglovsbeslut visar att överklagade beslut kan inhiberas även efter att startbesked getts – kedjan bygglov → laga kraft → startbesked har flera brytpunkter. Källor: Boverket, https://www.boverket.se/sv/PBL-kunskapsbanken/lov--byggande/byggprocessen/startbesked/ och https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/verkstallbarhet-av-beslut-om-bygglov-rivningslov_h503240/html/","affects":"B70-G090, B70-100 (återöppnat B50-spår) och B70-130.","impact":"Byggstarten blockeras trots att huvudtillstånden är klara; fördröjning motsvarande överklagande- och inhibitionshantering plus byggnadsnämndens handläggningstid.","mitigation":"Förbered startbeskedsunderlaget (kontrollplan, teknisk beskrivning, ansvariga) parallellt med bygglovsprocessen. Bevaka överklaganden av både detaljplan och bygglov. Ansök om startbesked så snart förutsättningarna uppfylls och följ upp byggnadsnämndens handläggning aktivt.","source_refs":["PBL","PBL_START","EXT: Prop. verkställbarhet av bygglovsbeslut https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/verkstallbarhet-av-beslut-om-bygglov-rivningslov_h503240/html/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G090-02","node_id":"B70-G090","chart_key":"B70","node_label":"Är PBL- och sektorsspecifika startgates klara?","title":"Detaljplanens laga kraft saknas eller planen överprövas av länsstyrelsen","category":"Överklagande & rättsprocess","trigger":"Detaljplanen som projektet bygger på är antagen men överklagad, eller länsstyrelsen beslutar att överpröva planen inom sin tidsfrist.","description":"Planfastställelsen är en egen startgate: en antagen detaljplan får inte tillämpas som underlag förrän den vunnit laga kraft, och länsstyrelsen kan överpröva p
