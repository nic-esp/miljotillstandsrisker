n":"Extern & omvärld"},{"risk_id":"R-B60-070-01","node_id":"B60-070","chart_key":"B60","node_label":"Fastställ handläggningsplan och förbered deltagande","title":"Utebliven eller slarvig tidsplan urholkar handläggningstempot","category":"Myndighetskapacitet & handläggning","trigger":"Instansen fastställer ingen tidsplan enligt MB 22 kap. 11 b § trots att förutsättningar finns, eller planen sätts men hålls inte på grund av resursbrist.","description":"I mål och ärenden av större omfattning kan instansen fastställa en tidsplan för beredningen. Utan en sådan plan saknar sökanden styrinstrument när handläggningen drar ut, och remissinstanser planerar inte sitt arbete. Resursbrist hos mark- och miljödomstolarna eller delegationerna – särskilt brist på tekniska råd och specialister – gör att även fastställda planer spricker. För projekt med externa finansieringsvillkor är en osäker beslutstidpunkt ofta lika skadlig som ett sent avslag.","motivation":"Naturvårdsverkets årliga statistik över miljötillståndsprövningen visar stora skillnader i handläggningstid mellan instanser och måltyper, och att de längsta målen tar flera år i första instans; SOU 2025:122 om kortare instanskedja bygger på att ledtiderna är ett strukturellt problem.","affects":"B60-070 och hela den efterföljande beredningskedjan B60-080 till B60-190.","impact":"Oplanerbar fördröjning, kostnader för uppehåll i projektorganisationen och risk att finansierings- eller leveransvillkor förfaller.","mitigation":"Aktivera möjligheten till tidsplan enligt 22 kap. 11 b § MB i god tid; föreslå själv en realistisk tidsplan; eskalera via instansens ledning och följ upp avvikelser skriftligt.","source_refs":["MB","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/","EXT: SOU 2025:122 En kortare instanskedja för mark- och miljöärenden https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/en-kortare-instanskedja-for-mark-och-miljoarenden_hdb3122/html/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-080-01","node_id":"B60-080","chart_key":"B60","node_label":"Kungör och remittera ansökan","title":"Kungörelse- eller delgivningsfel gör prövningen sårbar för ogiltighet","category":"Överklagande & rättsprocess","trigger":"Kungörelsen når inte alla sakägare, annonseringen eller delgivningen görs på fel sätt, eller sakägarförteckningen är ofullständig.","description":"Kungörandet är den processuella nyckelhändelse som ger berörda rätt att yttra sig och senare överklaga. Om en sakägare missas, adresserna är fel eller annonseringen inte sker enligt föreskrift kan utfallet angripas med processfel, och överinstansen kan upphäva och återförvisa målet. Felet upptäcks ofta först när den berörda sakägaren aktiverar sig sent, ibland först i överprövningen. I vattenmål med många fastighetsberörda är felkällorna särskilt många.","motivation":"Deltagandereglerna i MB 19 och 22 kap. är tvingande; erfarenheten från vatten- och vindkraftsmål visar att brister i sakägarunderrättelse är en återkommande grund för återförvisning, eftersom varje missad sakägare bär en egen talerätt.","affects":"B60-080, B60-090 och i förlängningen B60-G210 (överklaganden) samt återförvisningsrisk i B60-G290.","impact":"Upphävande och återförvisning sent i kedjan, med förnyad kommunicering och förlorad tid trots i övrigt korrekt sakprövning.","mitigation":"Kvalitetssäkra sakägarförteckningen mot fastighetsregister och lantmäteriet före kungörande; dokumentera varje delgivningsmoment; använd kompletterande personlig delgivning för kritiska sakägare.","source_refs":["MB","NV_PERMIT"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-080-02","node_id":"B60-080","chart_key":"B60","node_label":"Kungör och remittera ansökan","title":"Remissinstansernas kapacitet sätter takten, inte instansens plan","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelser, kommuner, Naturvårdsverket, Havs- och vattenmyndigheten eller Försvarsmakten svarar inte inom utsatt remisstid, eller begär upprepade förlängningar.","description":"Kungörelsen initierar en remissrunda där varje instans svarar i egen takt. Stora remissinstanser med hög belastning begär regelbundet förlängd svarstid, och instansen kan sällan gå vidare utan centrala myndigheters yttranden. I projekt där Försvarsmakten eller infrastrukturmyndigheter har intressen kan yttrandena dessutom vara avvaktande eller villkorade, vilket förlänger rundan. Varje förlängning förskjuter hela den efterföljande beredningen.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att remisstider för större mål regelmässigt förlängs; Markbygden-ärendena visar dessutom att Försvarsmaktens besked kan komma i etapper och förändras under processens gång (se bl.a. bevakningen av Markbygden där Försvarsmakten motsatt sig ett stort antal verk).","affects":"B60-080, B60-090 och förskjuter B60-100 samt beslutstidpunkten i B60-190.","impact":"Fördröjning om månader per remissrunda utan att sökanden kan påverka takten.","mitigation":"Bedriv förhandsdialog med nyckelremissinstanser före kungörandet så att yttrandena är förberedda; håll ansökningsunderlaget direkt svarbart för myndigheternas frågeställningar; bevaka remisstider och påminn via instansen.","source_refs":["MB","NV_PERMIT","EXT: VINDKRAFTSnyheter om Försvarsmaktens besked i Markbygden https://www.vindkraftsnyheter.se/20190804/248/over-200-vindkraftverk-stoppas-i-markbygden"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-090-01","node_id":"B60-090","chart_key":"B60","node_label":"Inhämta yttranden och invändningar","title":"Motstridiga myndighetsyttranden låser beredningen","category":"Intressekonflikt & markåtkomst","trigger":"Remissinstanser ställer oförenliga krav – till exempel naturvård mot näringsliv, eller Försvarsmakten mot energipolitiska mål – och lämnar villkorssynpunkter som inte kan kombineras.","description":"I denna nod samlas sak- och villkorssynpunkter från prövningsmyndigheter, tillsynsmyndigheter, kommuner och organisationer. När yttrandena är motstridiga måste första instans göra en egen intresseavvägning, men beredningen kan inte avslutas förrän konfliktytorna är klarlagda. Särskilt känsligt är när en myndighet reserverar sig eller kräver avslag på delar som andra myndigheter vill tillgodose. Sökanden tvingas då driva förhandlingslösningar parallellt med den formella processen.","motivation":"Riksintressekonflikter är ett genomgående drag i svensk miljöprövning; i Markbygden-ärendena stod Försvarsmaktens invändningar mot kommunala och regionala utbyggnadsintressen, och i Kallak stod rennäring och naturvård mot minerallagens intressen ända upp till regeringsnivå (HFD 2024 not. 36).","affects":"B60-090, bemötandenoden B60-100 och den materiella prövningen i B60-180 där avvägningen landar.","impact":"Förlängd beredning, skärpta eller oförenliga villkorsförslag och ökad överklaganderisk oavsett utfall.","mitigation":"Identifiera konfliktlinjerna redan i samrådsfasen (B20) och arbeta fram kompromissvillkor i förväg; begär särskilda sammanträden mellan motstridiga myndigheter; dokumentera egen avvägningsanalys som stöd för instansen.","source_refs":["MB","NV_PERMIT","EXT: HFD 2024 not. 36 (Kallak) https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2024/notiser/hfd-2024-not.-36.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-090-02","node_id":"B60-090","chart_key":"B60","node_label":"Inhämta yttranden och invändningar","title":"Massivt engagemang från allmänhet och organisationer överlastar hanteringen","category":"Samråd & motstånd","trigger":"Projektet är kontroversiellt och genererar tusentals insändare, namninsamlingar och organiserade invändningar från miljöorganisationer och allmänhet.","description":"När kungörelsen möter stark lokal eller nationell opinion kan inflödet av yttranden bli mycket stort. Varje saklig invändning måste bemötas, och organisationer med talerätt kan lägga fram egna expertrapporter som kräver motexpertis. Det påverkar både handläggningstiden och sannolikheten att utfallet överklagas. Engagemanget kan också påverka politiska beslutsfattare i parallella processer, till exempel kommunala planbeslut eller regeringens tillåtlighetsprövning.","motivation":"Preemraff visar mönstret: utbyggnaden överklagades av ett stort antal enskilda och organisationer, och det organiserade motståndet var en väsentlig del av processens dynamik (KU 2020/21:KU10). Även vindkraftsetapper i Markbygden har drivits vidare av samebyar och föreningar genom flera instanser.","affects":"B60-090, B60-100 (bemötandebördan) och B60-G210 (sannolikhet för överklaganden).","impact":"Förlängd beredning, behov av motexpertis och kostnader samt höjd sannolikhet för flerinstansprocess.","mitigation":"Ta opinionen på allvar redan i samrådet; etablera löpande dialog med nyckelorganisationer; förbered bemötandestruktur och expertresurser innan kungörelsen går ut.","source_refs":["MB","EXT: Betänkande 2020/21:KU10 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/granskningsbetankande-hosten-2020_h801ku10/html/","EXT: Sveriges Radio om samebyns överklagande i Markbygden https://www.sverigesradio.se/artikel/6697781"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-100-01","node_id":"B60-100","chart_key":"B60","node_label":"Sökanden bemöter och justerar","title":"Justerade yrkanden underminerar den processuella ramen","category":"Rättslig osäkerhet","trigger":"Sökanden svarar på invändningar genom att justera yrkanden, villkorsförslag eller projektbeskrivningen så pass mycket att frågan uppstår om det fortfarande är samma ansökan som prövas.","description":"Bemötandefasen är sökandens möjlighet att anpassa projektet till synpunkterna, men justeringar som går utöver det kommunicerade kan skapa processuell osäkerhet. Instansen måste avgöra om ändringarna kräver ny kommunicering, och motparter kan invända att de inte fått tala över den slutliga utformningen. Samtidigt kan passiva bemötanden lämna bristande bevisning kvar till den materiella prövningen. Balansen mellan att anpassa och att hålla ramen är nodens kärnrisk.","motivation":"Processuell princip: avgörandet får inte gå utöver eller avvika väsentligt från det som varit föremål för kommunicering; praxis från mark- och miljödomstolarna visar att ändrade yrkanden sent i processen återkommande leder till kompletterande kommunicering eller avslag i delar.","affects":"B60-100, med loop till B60-G110 och möjlig återgång till B60-080.","impact":"Förnyad kommunicering eller delavslag, med fördröjning och begränsat tillståndsutfall.","mitigation":"Testa varje justering mot det ursprungliga kommuniceringsunderlaget; kommunicera väsentliga ändringar frivilligt och riktat; behåll en versionsstyrd yrkandelogg som visar att ramen hålls.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-120-01","node_id":"B60-120","chart_key":"B60","node_label":"Genomför sakkunnig-, plats- eller annan utredning","title":"Instansens egen sakkunnigutredning flyttar bevisbördan och tidplanen","category":"Teknisk komplexitet","trigger":"Instansen inhämtar särskild utredning eller sakkunnig på eget initiativ, eller genomför syn, för att parternas underlag inte räcker.","description":"När underlaget är otillräckligt kan instansen själv komplettera bevisningen. Det är rättssäkert men tar tid: upphandling eller utnämning av sakkunnig, utredningsarbete och ny kommunicering av resultatet. Sökanden förlorar delvis kontrollen över bevisbilden, och utredningens resultat kan peka åt annat håll än ansökan. Utredningskostnader kan dessutom komma att belasta sökanden eller komplicera fördelningen av processkostnader.","motivation":"Instansens officiella utredningsskyldighet inom miljöprocessen innebär att domstolen/delegationen kan inhämta sakkunnig utan parternas medverkan; erfarenheten från komplexa vatten- och industrimål visar att sådana utredningar regelmässigt förlänger beredningen med ett halvår eller mer.","affects":"B60-120 och förskjuter B60-G130 samt den materiella prövningen i B60-180.","impact":"Fördröjning om månader, merkostnader och risk för ett beslutsunderlag som inte stödjer ansökan.","mitigation":"Leverera från början ett underlag som gör extern utredning onödig; erbjud välrenommerade experter och gemensamma faktaunderlag; följ upp sakkunnigutredningens direktiv och delta aktivt vid syn.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-120-02","node_id":"B60-120","chart_key":"B60","node_label":"Genomför sakkunnig-, plats- eller annan utredning","title":"Väder och årstid försenar syn och platsbesök","category":"Klimat & naturhändelse","trigger":"Planerad syn eller platsbesök kan inte genomföras på grund av snö, översvämning, brandrisk eller säsongsbundna förhållanden som gör platsen otillgänglig eller missvisande.","description":"Syn och platsbesök ska ge instansen en riktig bild av förhållandena på platsen. Vinterförhållanden kan dölja markförhållanden, medan översvämningar eller torka kan förvrida bilden av vattenförhållanden. Ett inställt besök i fel säsong kan behöva vänta till nästa år för att bli rättvisande. För fjäll- och kustprojekt är fönstren ibland mycket korta.","motivation":"Välgrundat praktiskt resonemang: instansens beslutsunderlag ska spegla verkliga förhållanden, och svenska klimat- och säsongsförhållanden begränsar när platser kan besiktigas meningsfullt; extremväder har blivit vanligare och påverkar fältarbete i allt fler prövningar.","affects":"B60-120 och förskjuter förhandlings- och beslutstidpunkter i B60-140 och B60-190.","impact":"Fördröjning om veckor till ett år beroende på säsongsfönster.","mitigation":"Planera syn tidigt i beredningen med säsongsmarginal; komplettera med drönar- och fotodokumentation från rätt årstid; ha reservdatum inbokade.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-140-01","node_id":"B60-140","chart_key":"B60","node_label":"Håll huvudförhandling eller sammanträde","title":"Sakkunniga ledamöters tillgång och jäv stoppar sammanträdet","category":"Myndighetskapacitet & handläggning","trigger":"Domstolen kan inte sätta sammanträde för att tekniska eller sakkunniga ledamöter saknas, blir sjuka eller anses jäviga.","description":"Mark- och miljödomstolarna dömer med lagdomare och tekniska/sakkunniga ledamöter. Om en ledamot inte kan tillsättas, avgår eller anmäls för jäv måste sammanträdet flyttas, ibland flera månader. Jävsanmälningar kan dessutom komma från motparter som vill pröva ledamotens opartiskhet, vilket skapar en mellanprocess. I myndighetsärenden motsvaras risken av delegationssammansättning och beslutsförhet.","motivation":"Rekryteringsläget för tekniskt sakkunniga inom miljörätt och processindustri är ansträngt, och jävsprövningar förekommer i uppmärksammade mål; Nordkalk/Ojnare-målen visar också hur expertmyndigheters roller ifrågasatts (JO granskade SGU:s dubbla roller i den kedjan).","affects":"B60-140 och förskjuter avgörandet i B60-190.","impact":"Fördröjning om månader vid inställt eller uppskjutet sammanträde och risk för jävsprövning som extra processsteg.","mitigation":"Bevaka sammanträdesbokning aktivt och begär reservtid; granska ledamöternas tilldelning tidigt och anmäl jävsskäl omedelbart i stället för vid sammanträdet; håll förhandlingsmaterialet färdigt så att ny tid kan tas snabbt.","source_refs":["MB","MMDL","EXT: Bevara Ojnareskogen om JO-kritiken mot SGU https://www.ojnareskogen.se/author/hans/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-140-02","node_id":"B60-140","chart_key":"B60","node_label":"Håll huvudförhandling eller sammanträde","title":"Nya yrkanden och bevis vid förhandlingen spränger ramen","category":"Överklagande & rättsprocess","trigger":"Motparter eller sökanden lägger fram nya omständigheter, alternativ eller villkorsyrkanden först vid huvudförhandlingen.","description":"Vid huvudförhandlingen kan partstrycket leda till att nytt material presenteras sent. Domstolen måste då välja mellan att vägra materialet, skjuta upp förhandlingen för kommunicering eller pröva det direkt med processuell risk. För sökanden kan sent framträdande invändningar – till exempel nya alternativplatser eller nya expertvärden – omöjliggöra ett rimligt bemötande. Uppskjuten förhandling innebär att hela sammanträdesprocessen börjar om.","motivation":"Dispositionsprincipen i miljöprocessen tillåter parterna att vid vissa punkter komplettera, men praxis kräver att motparten får reell möjlighet att bemöta; uppskjutna huvudförhandlingar på grund av nytt material är ett känt fenomen i stora miljömål.","affects":"B60-140, med återkoppling till skriftväxlingen (B60-G110) och förskjutning av B60-180/B60-190.","impact":"Uppskjuten förhandling med förlust av inbokad tid, förlängd beredning och merkostnader för ombud och experter.","mitigation":"Begär att domstolen sätter en sista tidpunkt för nytt material före förhandlingen; förbered bemötanden även för tänkbara nya invändningar; dokumentera invändningar mot sent material direkt på protokollet.","source_refs":["MB","COURT_MFV"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-160-01","node_id":"B60-160","chart_key":"B60","node_label":"Regeringen prövar tillåtligheten","title":"Regeringsprövningen saknar tidsfrist och kan ta år","category":"Politisk & policyrisk","trigger":"Tillåtlighetsfrågan hamnar hos regeringen, där beredningen inte styrs av processuella tidsfrister utan av politisk prioritet och departementsberedning.","description":"Regeringens tillåtlighetsprövning enligt 17 kap. MB har ingen lagstadgad handläggningstid. Ärendet bereds på departementet, kan inhämta nya yttranden, avvakta utredningar eller helt enkelt ligga. Under tiden kan prövningsinstansen visserligen förbereda villkorsfrågor men inte meddela slutligt tillstånd. Politiska skift, ministerskiften och ändrade prioriteringar kan förändra utgången för ett oförändrat projekt. För sökanden är detta den minst styrbara noden i hela processen.","motivation":"Kallak är det tydliga exemplet: beredningen av bearbetningskoncessionen och tillåtlighetsfrågorna tog omkring ett decennium från ansökan till regeringens beslut 2022, som sedan fastställdes av Högsta förvaltningsdomstolen 2024 (HFD 2024 not. 36). Även Blekinge offshore visar tidsaspekten: regeringens avslagsbeslut om Hanöbukten kom först 2016-12-20 efter år av beredning (M2013/00540/Me).","affects":"B60-160 och blockerar B60-170, B60-180, B60-190 samt hela nedströmskedjan till B70.","impact":"Fördröjning om flera år utan styrbar tidplan, med föränderlig politisk riskprofil under väntetiden.","mitigation":"Bygg affärsplanen med scenario för flerårig regeringsväntan; håll underlaget aktuellt genom planerade uppdateringar; upprätthåll dialog med departementet och berörda myndigheter under beredningen.","source_refs":["MB","EXT: HFD 2024 not. 36 (Kallak) https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2024/notiser/hfd-2024-not.-36.pdf","EXT: Uppsala universitet Working Paper 2009:17 om Blekinge offshore/regeringsbeslutet 2016-12-20 https://www.uu.se/download/18.13dafd7219b37889ddf80be3/1768999300671/c_563862-l_3-k_wps-2020_1.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-160-02","node_id":"B60-160","chart_key":"B60","node_label":"Regeringen prövar tillåtligheten","title":"Regeringen säger nej trots positiv prövning i instanserna","category":"Politisk & policyrisk","trigger":"Regeringen gör en egen politisk intresseavvägning och finner verksamheten otillåtlig trots att prövningsinstansens sakprövning pekat mot bifall.","description":"Tillåtlighetsprövningen är en politisk avvägning, inte en rättslig domstolsprövning. Regeringen kan väga in hänsyn som inte prövats av instansen – totalförsvar, nationell säkerhet, energipolitik – och avslå verksamheten även när det tekniska underlaget stödjer bifall. Ett avslag är i praktiken slutgiltigt för den aktuella lösningen: rättsprövning i Högsta förvaltningsdomstolen prövar bara lagligheten, inte lämpligheten. Projektet måste då omformas eller avvecklas.","motivation":"Blekinge offshore illustrerar risken: efter lång prövning beslutade regeringen 2016-12-20 att inte tillåta vindkraftparken i Hanöbukten med hänsyn till totalförsvarsintressen, trots att projektet kommit långt i tillståndsprocessen (M2013/00540/Me).","affects":"B60-160 och hela projektet; nedströms noder B60-170–B60-190 får aldrig en chans att producera tillstånd.","impact":"Slutligt avslag på tillåtlighetsnivå; investerat utrednings- och processarbete förfaller.","mitigation":"Kartlägg de politiska motintressena (totalförsvar, riksintressen) tidigt och anpassa lokalisering och utformning innan ansökan; bedriv förhand med Försvarsmakten och berörda sektorsmyndigheter; överväg alternativa lokaliseringar som kan läggas fram vid avslag.","source_refs":["MB","EXT: Uppsala universitet Working Paper 2009:17 om regeringsbeslutet Hanöbukten 2016-12-20 https://www.uu.se/download/18.13dafd7219b37889ddf80be3/1768999300671/c_563862-l_3-k_wps-2020_1.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-160-03","node_id":"B60-160","chart_key":"B60","node_label":"Regeringen prövar tillåtligheten","title":"Regeringsbeslutet angrips med rättsprövning och förblir öppet i åratal","category":"Överklagande & rättsprocess","trigger":"Motståndare ansöker om rättsprövning av regeringens tillåtlighetsbeslut i Högsta förvaltningsdomstolen, med påståenden om lag- eller EU-rättsstridighet.","description":"Även ett positivt regeringsbeslut kan dras in i en ny rättslig process. Rättsprövningen enligt regeringsformen är begränsad till lagligheten, men beredningen kan ta lång tid och under tiden lever osäkerheten kvar om beslutet består. Beslutet vinner inte den slags trygghet ett domstolsavgörande ger förrän rättsprövningen är avslutad eller fristen passerat. För finansiering och byggbesked är detta en reell blockerare.","motivation":"Kallak visar mönstret: efter regeringens beslut 2022 ansökte Naturskyddsföreningen och samebyar om rättsprövning, och Högsta förvaltningsdomstolen avgjorde frågan först 2024 (HFD 2024 not. 36). Totalt sträckte sig den rättsliga osäkerheten över mer än två år efter själva regeringsbeslutet.","affects":"B60-160 och indirekt B70-byggberedskapen som inte kan fastställas med säkerhet under pågående rättsprövning.","impact":"Fördröjd slutlighet om år efter regeringsbeslutet och osäker finansieringsgrund under tiden.","mitigation":"Bevaka rättsprövningsfristen och alla inkomna ansökningar; förbered finansieringsarrangemang med villkor som tål öppen rättsprövning; dokumentera regeringsbeslutets laglighetsförutsättningar noggrant.","source_refs":["MB","EXT: HFD 2024 not. 36 (Kallak) https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2024/notiser/hfd-2024-not.-36.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-170-01","node_id":"B60-170","chart_key":"B60","node_label":"Slutför och godkänn miljöbedömningen","title":"MKB:n godkänns inte – återförvisning eller avslag i stället för villkor","category":"Underlagsbrist & data","trigger":"Instansen finner att MKB:n inte uppfyller kraven i MB 6 kap. – otillräcklig alternativbeskrivning, saknade kumulativa effekter eller bristande redovisning av skyddsåtgärder.","description":"Miljöbedömningen ska inte bara finnas utan vara tillräcklig för att ligga till grund för avgörandet. Om instansen bedömer MKB:n som otillräcklig kan den inte kompensera det med villkor; bristen får i stället konsekvensen att ansökan inte kan bifallas utan komplettering. EU-rättens krav på miljöbedömningar har skärpt granskningen, särskilt av alternativ och kumulativa effekter. En MKB som klarat förhandsgranskningen kan alltså ändå falla i slutbedömningen när motparter riktat in sig på svagheterna.","motivation":"MB 6 kap. 42–44 §§ ålägger instansen att säkerställa att miljöbedömningen är tillräcklig; erfarenheten från stora mål visar att MKB-kvaliteten är en av de mest framgångsrika angreppspunkterna i överprövning, och Naturvårdsverkets vägledning betonar sambandet mellan MKB-innehåll och avgörandets hållbarhet.","affects":"B60-170, B60-180 (materiell prövning kan inte avslutas) och risk för återförvisning via B60-G290.","impact":"Kompletteringskrav sent i processen, upphävande i överprövning eller avslag på grund av otillräckligt underlag.","mitigation":"Granska MKB:n mot MBD:s innehållskrav och EU-domstolens krav före ingivning; låt oberoende granskare testa alternativ- och kumulativdelarna; håll MKB:n levande och uppdatera den under handläggningen.","source_refs":["MB","MBD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-170-02","node_id":"B60-170","chart_key":"B60","node_label":"Slutför och godkänn miljöbedömningen","title":"Samrådsresultatet beaktas inte dokumenterbart i avgörandet","category":"Överklagande & rättsprocess","trigger":"Avgörandet saknar synlig koppling mellan samrådssynpunkterna och det slutliga ställningstagandet, vilket gör det sårbart för angrepp om bristande beaktande.","description":"Instansen ska beakta både MKB:ns innehåll och resultatet av samrådet. Om avgörandet inte visar hur väsentliga synpunkter hanterats kan överinstansen finna att beaktandekravet inte uppfyllts, även om sakbedömningen i sig är riktig. Detta är en vanlig form av processangrepp där motparten inte behöver ha fel i sak utan bara peka på att deras synpunkter inte synts i motiveringen. Konsekvensen blir upphävande och återförvisning trots i övrigt hållbar prövning.","motivation":"Beaktandekravet i miljöbedömningsreglerna är ett självständigt rättssäkerhetskrav med stöd i EU-rätten; överinstanspraxis visar att otillräckliga motiveringar om hur synpunkter hanterats kan leda till upphävande.","affects":"B60-170, B60-190 (avgörandets motivering) och överprövningskedjan B60-250–B60-270.","impact":"Upphävande i överprövning med återförvisning för ny motivering eller ny prövning.","mitigation":"Bygg en synpunktsmatris som spårar varje väsentlig invändning till avgörandets resonemang; kräv att förslaget till avgörande refererar samrådsredogörelsen uttryckligen; kvalitetssäkra motiveringen före beslut.","source_refs":["MB","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-180-01","node_id":"B60-180","chart_key":"B60","node_label":"Pröva tillåtlighet, villkor, säkerhet och genomförandetid","title":"Natura 2000- eller artskyddskollision kollapsar prövningen i slutskedet","category":"Rättslig osäkerhet","trigger":"Prövningen når fram till att projektet inte kan förenas med Natura 2000-skyddet eller artskyddsförordningen, och dispensförutsättningarna (synnerliga skäl, inga alternativ, kompensation) inte är tillräckligt utredda.","description":"I den materiella prövningen möts alla hänsynsregler samtidigt, och skyddsreglerna är de minst förhandlingsbara. Om instansen finner att påverkan på ett Natura 2000-område eller en skyddad art inte kan avfärdas måste den tunga dispensvägen prövas, med krav på alternativanalys, tvingande allmänintresse och kompensationsåtgärder. Ett projekt som byggt sin ansökan på att kollisionen skulle lösas med skyddsåtgärder kan då stå utan rättslig väg framåt. Sent upptäckta kollisioner kan inte repareras med villkor.","motivation":"Nordkalk/Ojnarefjärden är referensfallet: efter Högsta domstolens remittering 2010 och år av omprövning avslog MÖD 2018 (mål M 5375-14 och M 5431-14) ansökningarna om Natura 2000-tillstånd och kalkstensbrytning, efter en kedja där artskydds- och Naturafrågorna aldrig löstes tillräckligt.","affects":"B60-180, B60-190 (avslag i stället för tillstånd) och återförvisningsloopen B60-G290.","impact":"Avslag eller upphävande trots i övrigt genomförd prövning; projektet måste omformas grundläggande eller läggas ned.","mitigation":"Pröva Natura 2000- och artskyddsfrågorna först i utredningsordningen, inte sist; utred alternativ och kompensation på allvar redan i B20; överväg omprövning av lokalisering innan ansökan om kollisionen är verklig.","source_refs":["MB","NATURA","ART","ARTSKYDD","EXT: MÖD M 5431-14 (Nordkalk) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5431-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-180-02","node_id":"B60-180","chart_key":"B60","node_label":"Pröva tillåtlighet, villkor, säkerhet och genomförandetid","title":"BAT-/IED-nivån flyttas under pågående prövning","category":"Teknisk komplexitet","trigger":"Nya BAT-slutsatser eller sektorsregler träder i kraft medan målet handläggs, och instansen måste ta ställning till om den nya nivån ska läggas till grund.","description":"För IED-anläggningar ska villkoren spegla bästa tillgängliga teknik. När BAT-slutsatser revideras under en flerårig handläggning uppstår frågan om ansökan ska bedömas mot den nivå som gällde vid ingivningen eller vid beslutet. En skärpning kan göra den tekniska lösningen otillräcklig och kräva kostsamma omkonstruktioner mitt i processen. Osäkerheten försvårar också villkorsförslagen, som kan behöva skrivas om.","motivation":"IED:s krav på att villkoren ska baseras på BAT-slutsatser är ett rörligt mål eftersom slutsatserna revideras cykliskt; erfarenheten från industrip rövningar visar att revideringar under handläggningen tvingar fram kompletteringar av teknikbeskrivning och utsläppsnivåer.","affects":"B60-180, villkorsformuleringen i B60-190 och kompletteringsloopen B60-050.","impact":"Fördröjning och merkostnad för teknisk omarbetning; risk för avslag om tekniken inte kan anpassas.","mitigation":"Bevaka kommande BAT-revideringar och designa tekniken med marginal mot förväntade nivåer; formulera villkorsförslag dynamiskt; föra dialog med instansen om vilken BAT-nivå som ska gälla så tidigt som möjligt.","source_refs":["MB","SEVESO"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-180-03","node_id":"B60-180","chart_key":"B60","node_label":"Pröva tillåtlighet, villkor, säkerhet och genomförandetid","title":"Säkerhets- och efterbehandlingsfrågor underblåser oenighet om vem som bär risken","category":"Rättslig osäkerhet","trigger":"Storleken på ekonomisk säkerhet för efterbehandling, ansvarstiden och uppföljningskraven är omdiskuterade mellan instans, sökande och motparter.","description":"Beslutet om ekonomisk säkerhet enligt MB 5 kap. är ofta en av de mest tvistiga punkterna i den materiella prövningen. För låg säkerhet riskerar att lämna staten med kostnader vid konkurs; för hög binder kapital som gör projektet olönsamt. Beräkningsgrunderna för gruvor, täkter och industriavfall är osäkra och kan ändras över tid, och efterbehandlingsteknikens långsiktiga funktion är sällan bevisad. Tvisten kan drivas av miljöorganisationer med egen expertkalkyl.","motivation":"Cementa- och Nordkalk-ärendena på Gotland visar att säkerhetsbelopp och efterbehandlingsansvar blivit självständiga stridsfrågor som överklagats ända till Högsta förvaltningsdomstolen (se HFD-mål rörande Cementa AB, aktbilaga 7208-21).","affects":"B60-180, B60-190 (säkerhetsvillkoret) och överprövningskedjan där beloppet prövas om.","impact":"Fördröjning genom tvist om beräkning, samt väsentlig påverkan på projektekonomin oavsett utfall.","mitigation":"Presentera en transparent, konservativt räknad efterbehandlingskalkyl med känslighetsanalys; föreslå trappstegsvis säkerhetsställande kopplat till verifierbar efterbehandlingsframdrift; engagera oberoende kalkylexpert tidigt.","source_refs":["MB","EXT: HFD-mål om Cementa AB, aktbilaga 7208-21 https://byggforetagen.se/app/uploads/2021/12/HFD-7208-21-Aktbil-1.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-190-01","node_id":"B60-190","chart_key":"B60","node_label":"Meddela beslut eller dom","title":"Otydliga eller verkställbara villkor föder nya processer efter beslutet","category":"Rättslig osäkerhet","trigger":"Villkoren formuleras så generellt eller tekniskt tvetydigt att de inte kan följas upp, eller att parterna får olika uppfattning om vad som krävs.","description":"Avgörandets villkorsdel ska vara tillräckligt preciserad för tillsyn och uppföljning. Otydliga villkor – om spridningsområden, bullergränser, efterbehandlingskrav eller uppskjutna frågor – skapar konflikter vid tillsyn, ändringsanmälningar och omprövningar år efter beslutet. De kan också angripas i överprövning som otillräckligt motiverade. En skyndsam slutformulering under tidspress är därför en risk som materialiseras långt efter laga kraft.","motivation":"Erfarenheten från svensk miljötillsyn visar att otydliga villkor är en återkommande källa till senare tvister mellan verksamhetsutövare och tillsynsmyndighet; mark- och miljödomstolarnas praxis om villkors precision och motiveringskrav understryker att villkoren måste vara kontrollerbara.","affects":"B60-190 och hela eftermarknaden: B70-byggberedskap samt framtida tillsyns- och omprövningsärenden.","impact":"Framtida tvister, tillsynsförelägganden och omprövningsrisker; i överprövning risk för upphävande av villkorsdelen.","mitigation":"Förhandla fram konkreta, mätbara villkorsformuleringar under beredningen; testa varje villkor mot frågan 'hur kontrolleras detta?'; begär domstolens/instansens villkorsutkast i god tid före beslutet om möjligt.","source_refs":["MB","COURT_MFV"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-190-02","node_id":"B60-190","chart_key":"B60","node_label":"Meddela beslut eller dom","title":"Fel i överklagandehänvisning eller verkställighetsbesked skapar fristkaos","category":"Överklagande & rättsprocess","trigger":"Beslutet innehåller felaktig hänvisning om överklagandeväg, frist eller forum, eller saknar korrekta verkställighetsbesked om vad som får påbörjas.","description":"Överklagandehänvisningen styr parternas möjligheter att angripa beslutet i rätt tid och forum. En felaktig hänvisning kan förlänga överklagandefönstret eller leda till att överklaganden ges in till fel instans med rättidighetsstrider som följd. Saknas tydliga besked om vad som får verkställas före laga kraft kan sökanden heller inte planera tidiga förberedande åtgärder utan risk. Felen upptäcks ofta först när överklaganden ska hanteras.","motivation":"Naturvårdsverkets och domstolarnas vägledningar betonar att överklagandehänvisningen ska ange rätt instans och treveckorsfrist; felaktiga hänvisningar hanteras i praxis till klagandens fördel, vilket förlänger osäkerheten för sökanden.","affects":"B60-190, B60-200 (delgivning och fristberäkning) och B60-220 (rättidighetskontroll).","impact":"Fördröjd laga kraft, rättidighetsprocesser om överklaganden och osäkerhet om byggstart.","mitigation":"Granska hänvisningen mot aktuell instanskedja direkt vid beslutet; begär rättelse av uppenbara fel enligt rättelsebestämmelserna; dokumentera beslutets exakta delgivnings- och kungörelsedatum.","source_refs":["MB","MMDL","NV_PERMIT"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-200-01","node_id":"B60-200","chart_key":"B60","node_label":"Delge/kungör avgörandet och beräkna överklagandetid","title":"Delgivningsfel gör att fristen aldrig börjar löpa","category":"Överklagande & rättsprocess","trigger":"Avgörandet delges inte alla parter på rätt sätt, eller kungörelsen för allmänheten blir felaktig, så att överklagandefristens start blir omdiskuterad.","description":"Överklagandefristen räknas olika för parter (från delgivning) och för allmänheten (från kungörelse). Om delgivningen brister för en part kan den parten överklaga långt senare än planerat, och laga kraft kan inte konstateras. I mål med många sakägare – typiskt i vatten- och vindkraftsmål – är varje delgivningsbevis en potentiell felkälla. Osäkerheten om när avgörandet verkligen vunnit laga kraft blockerar byggberedskapen i B70.","motivation":"Naturvårdsverkets vägledning anger att överklagandetiden är tre veckor från delgivning respektive kungörelse; erfarenheten visar att just delgivningskedjan i mål med många berörda är den vanligaste orsaken till att laga kraft inte kan fastställas vid planerad tidpunkt.","affects":"B60-200, B60-G210 (laga kraft-kontrollen) och B70-G020 (finalitetsstatus).","impact":"Fördröjd eller otydbar laga kraft, med spärr mot byggstart och finansieringsbesked.","mitigation":"Följ upp varje delgivningsbevis aktivt; begär att instansen bekräftar när alla delgivningar skett; räkna laga kraft från den senast dokumenterade delgivningen, inte från beslutsdagen.","source_refs":["MB","MMDL","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-200-02","node_id":"B60-200","chart_key":"B60","node_label":"Delge/kungör avgörandet och beräkna överklagandetid","title":"Helger, semester och postlogistik rubbar fristberäkningen","category":"Myndighetskapacitet & handläggning","trigger":"Kungörelsen publiceras nära helgdagar eller semesterperioder, eller delgivningshandlingar fastnar i post- och e-tjänstflöden, vilket förskjuter eller förlänger fristerna.","description":"Fristberäkningen ser enkel ut på pappret men påverkas av helgdagsregler, allmänna helger och hur myndigheten hanterar elektronisk kontra fysisk delgivning. Ett avgörande som kungörs mitt i sommarperioden ger motparter mer effektiv tid att organisera överklaganden, medan ett felaktigt hanterat e-delgivningskvitto kan ogiltigförklara hela friststarten. För projekt med säsongsberoende bygglogistik kan några veckors förskjutning av laga kraft flytta byggstarten ett helt år.","motivation":"Välgrundat praktiskt resonemang: fristreglerna i förvaltningsprocessen är formbundna och dokumenterade fel i delgivnings- och kungörelsemoment hanteras alltid till den enskildes fördel; erfarenheten visar att sommar- och julkungörelser regelbundet förlänger den effektiva överklagandeperioden.","affects":"B60-200 och B70:s byggberedskapsbedömning.","impact":"Förskjuten laga kraft med effekter på bygg- och leveransplaner.","mitigation":"Planera för att beslut som kommer nära semesterperioder har fördröjd laga kraft; samla alla delgivnings- och kungörelsebevis i projektets beslutslogg; räkna konservativt på tidigast möjliga byggstart.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-220-01","node_id":"B60-220","chart_key":"B60","node_label":"Kontrollera rättidighet och överlämna akten","title":"Rättidighetsprövningen blir en juridisk sidoprocess","category":"Överklagande & rättsprocess","trigger":"Överklaganden kommer in nära fristgränsen, via fel kanal eller från personer vars delgivnings- eller talerättstatus är omdiskuterad.","description":"Beslutsinstansen ska pröva om varje överklagande kommit in i rätt tid och i övrigt är behörigt innan akten överlämnas. Gränsfallsprövningar – poststämpel kontra e-post, delgivningsdatum, ställföreträdares behörighet – kan själva bli föremål för överklagande om instansen avvisar ett överklagande som sent ankommet. Varje sådan sidoprocess fördröjer överlämnandet av huvudärendet och skapar osäkerhet om vilka klagogrupper som faktiskt är med i nästa instans.","motivation":"Praxis är strikt på rättidighet men ger samtidigt skydd för klaganden som följt en felaktig överklagandehänvisning; länsstyrelsernas rutiner beskriver uttryckligen att länsstyrelsen först prövar rättidigheten innan överklagandet skickas vidare till mark- och miljödomstolen, vilket visar att detta är ett standardiserat men felbenäget moment.","affects":"B60-220 och förskjuter B60-G230 samt hela överprövningens start.","impact":"Fördröjning om veckor till månader innan överprövningen ens påbörjas, plus risk för separata rättidighetsprocesser.","mitigation":"Dokumentera ingivningsdatum och kanal för varje överklagande; begär att instansen hanterar rättidighetsprövningen samlat och skyndsamt; bevaka om avvisade överklaganden överklagas separat.","source_refs":["MB","MMDL","EXT: Länsstyrelsen Norrbotten om överklagande av MPD-beslut https://www.lansstyrelsen.se/norrbotten/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/overklaga-beslut-fran-miljoprovningsdelegationen.html"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-220-02","node_id":"B60-220","chart_key":"B60","node_label":"Kontrollera rättidighet och överlämna akten","title":"Akten överlämnas ofullständig eller till fel instans","category":"Myndighetskapacitet & handläggning","trigger":"Överlämnandet till överinstansen sker utan komplett akt, med fel målnummer eller till fel överinstans i en instanskedja som påverkas av sektorssplittring.","description":"Överlämnandet är en administrativ nyckelpunkt: överinstansen kan inte börja handlägga förrän hela akten finns på plats. Vid kombinerade mål kan delar av överklagandet höra till olika instanser, och ett felriktat överlämnande måste korrigeras med nytt överlämnande. I övergången till Miljöprövningsmyndigheten finns dessutom risk att rutiner för aktöverlämning mellan länsstyrelse, ny myndighet och domstol inte är etablerade. Varje administrativt avbrott ger överinstansen skäl att parkera målet.","motivation":"Välgrundat praktiskt resonemang: handläggning i överinstans förutsätter fullständig akt, och erfarenheten från flerinstanssystemet visar att överlämningsmoment regelbundet orsakar dödtid; reformen med ny prövningsmyndighet (SFS 2026:1442–1444) lägger ytterligare ett organisationsbyte ovanpå detta.","affects":"B60-220, B60-G230 och mottagande instans B60-240/B60-250.","impact":"Fördröjning i överprövningens start och risk att målet får ny placeringsplats i överinstansens kö.","mitigation":"Begär skriftlig bekräftelse från överinstansen att akten mottagits komplett; säkerställ att beslutsinstansen känner till rätt överprövningsväg för varje del av målet; följ upp status aktivt efter överlämnandet.","source_refs":["MB","MMDL","SFS2026_1442"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-240-01","node_id":"B60-240","chart_key":"B60","node_label":"Länsstyrelsen överprövar kommunalt beslut","title":"Länsstyrelsens dubbla roller försvagar överprövningens legitimitet","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen ska överpröva ett kommunalt beslut i ett ärende där den själv varit remissinstans, samrådspart eller drivande i frågan, vilket skapar jävskänsla och motiveringstryck.","description":"Som överinstans för kommunala beslut ska länsstyrelsen göra en fristående prövning, men den har ofta redan yttrat sig i ärendet eller lett regionala processer som berör frågan. Även utan formellt jäv kan upplevd partiskhet leda till att utfallet överklagas vidare på ren misstro. Länsstyrelsernas begränsade kapacitet gör dessutom att överprövningen av kommunala miljöbeslut konkurrerar med ordinarie tillsyns- och prövningsarbete.","motivation":"Välgrundat resonemang: länsstyrelsens samlade roller – remissinstans, samordnare, tillsynsmyndighet och överinstans – är ett känt strukturellt spänningsfält i svensk miljöförvaltning, och SOU 2024:98 diskuterar uttryckligen rollkonflikter i den samordnade prövningen.","affects":"B60-240 och vidare till B60-250 där utfallet kan prövas om.","impact":"Fördröjning genom ytterligare instans oavsett utfall, samt risk för upphävande på grund av misstänkt jäv.","mitigation":"Kartlägg länsstyrelsens tidigare engagemang i ärendet och anmäl jävsskäl tidigt om de finns; bygg beslutsunderlaget så att det håller oavsett överinstans; förbered alltid för vidare överklagande i denna kedja.","source_refs":["MB","PBL","EXT: SOU 2024:98 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/en-ny-samordnad-miljobedomnings-och_hcb398/html/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-240-02","node_id":"B60-240","chart_key":"B60","node_label":"Länsstyrelsen överprövar kommunalt beslut","title":"Återförvisning till kommunen startar om den lokala politiska processen","category":"Överklagande & rättsprocess","trigger":"Länsstyrelsen upphäver det kommunala beslutet och återförvisar ärendet till nämnden för omprövning.","description":"Vid återförvisning ska kommunen pröva om frågan, ofta med ny handläggning och nytt kommunalrådsläge. Lokalpolitiska majoriteter kan ha skiftat sedan det ursprungliga beslutet, och nämnden kan komma fram till ett annat utfall än det som överklagats. Varje återförvisning innebär dessutom nya kungörelser och nya överklagandefrister. Kedjan kommun – länsstyrelse – domstol kan därmed repeteras.","motivation":"Erfarenheten från kommunala miljö- och hälsoskyddsärenden visar att återförvisningar till nämnder ofta resulterar i helt ny beredning snarare än punktvisa korrigeringar, särskilt när upphävandegrunden varit processuell; den lokala politiska dimensionen tillkommer jämfört med domstolsprocessen.","affects":"B60-240 med loop utanför diagrammet till kommunens förstainstansprocess, och indirekt B70:s byggberedskap för kommunala delbeslut.","impact":"Fördröjning om månader till år och risk för förändrat lokalt utfall.","mitigation":"Följ upp återförvisningsdirektiven punkt för punkt med nämnden; säkerställ att den nya beredningen korrigerar exakt det länsstyrelsen pekat ut; upprätthåll dialog med kommunens politiska ledning om projektets betydelse.","source_refs":["MB","PBL"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-250-01","node_id":"B60-250","chart_key":"B60","node_label":"MMD prövar överklagat myndighetsbeslut","title":"Domstolens fulla omprövning gör beslutet förutsägbart oförutsägbart","category":"Överklagande & rättsprocess","trigger":"Mark- och miljödomstolen prövar målet i sak oavsett vad klaganden anfört, och kan både skärpa och mildra villkor utöver yrkandena.","description":"MMD är inte bunden av klagandenas yrkanden på samma sätt som i tvistemål: domstolen prövar tillståndsfrågan i helhet och kan komma fram till villkor som är strängare än förstainstansbeslutet även där bara sökanden överklagat för att mildra dem. Omvänt kan ett tillstånd upphävas helt trots att bara en marginell invändning förts fram. För sökanden är det därför inte självklart att överklaga ens ett delvis negativt beslut – risken kan överstiga vinsten.","motivation":"Officialprincipen i miljöprocessen ger domstolen ett brett prövningsutrymme; praxis visar att MMD regelbundet ändrar villkorsbilder i båda riktningarna, och att överklaganden i stora mål sällan leder till punktvisa justeringar utan till nya helhetsbedömningar (jfr Nordkalk- och Cementa-kedjorna).","affects":"B60-250, B60-260 (MÖD-steget) och utfallet som matas till B70.","impact":"Oförutsägbart villkorsutfall; risk för försämrat tillstånd eller upphävande även vid eget överklagande.","mitigation":"Gör en äkta kostnads-nytta-analys av att själv överklaga; begär processuell avgränsning där det är möjligt; presentera i MMD en komplett villkorsbild i stället för isolerade invändningspunkter.","source_refs":["MB","MMDL","EXT: MÖD M 5431-14 (Nordkalk) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5431-14.pdf"],"scenario_tags":"S0_current_2026 | S1_appeal_actor_delta_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-250-02","node_id":"B60-250","chart_key":"B60","node_label":"MMD prövar överklagat myndighetsbeslut","title":"Domstolskö och specialistbrist gör överprövningen till flerårsväntan","category":"Myndighetskapacitet & handläggning","trigger":"Mark- och miljödomstolarna har långa handläggningstider i stora mål, förvärrade av brist på miljörättsliga och tekniska specialister.","description":"Överprövningen i MMD omfattar ny beredning, ofta med förhandling och förnyad kommunicering. Handläggningstiderna för komplicerade miljömål mäts i år, och den årliga statistiken visar stor spridning mellan domstolar. Rekryteringen av lagmän med miljörättslig erfarenhet och tekniska råd är ansträngd, och stora mål binder ledamöter under långa sammanträdesperioder. För sökanden är MMD-steget ofta den längsta enskilda vänteperioden i hela processen.","motivation":"Naturvårdsverkets samlade statistik över miljötillståndsprövningen och regeringens årliga uppdrag om handläggningstider dokumenterar att domstolsledtiderna i större mål ligger på flera år; SOU 2025:122 om kortare instanskedja utgår från att instanskedjans längd är ett erkänt problem.","affects":"B60-250 och förskjuter B60-260 samt hela B70-byggberedskapen.","impact":"Fördröjning om ett till flera år i överprövning, med löpande kostnader och försvagad projektekonomi.","mitigation":"Leverera ett direkt prövbart underlag till domstolen för att undvika förnyade kommuniceringsrundor; begär tidsplan och sammanträdestid tidigt; bygg finansiering som tål flerårig överprövning.","source_refs":["MMDL","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/","EXT: SOU 2025:122 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/en-kortare-instanskedja-for-mark-och-miljoarenden_hdb3122/html/"],"scenario_tags":"S0_current_2026 | S1_appeal_actor_delta_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-250-03","node_id":"B60-250","chart_key":"B60","node_label":"MMD prövar överklagat myndighetsbeslut","title":"Ny myndighetsmotpart saknar processvana i domstol","category":"Politisk & policyrisk","trigger":"Från 2027-07-01 är det Miljöprövningsmyndigheten som försvarar de överklagade besluten i domstol, en roll som delegationerna tidigare inte haft på samma sätt.","description":"Nodens s1_delta visar att den nya myndigheten blir motpart vid enskildas överklaganden. En nybildad myndighet ska då bygga upp processjuridisk kompetens, ombudsstruktur och rutiner för att föra talan i domstol – samtidigt som länsstyrelsen kvarstår med talerätt för allmänna intressen. Rollfördelningen mellan myndigheten och länsstyrelsen kan bli omdiskuterad i konkreta mål, och en ovan motpart kan försvara besluten svagt eller inkonsekvent, vilket paradoxalt nog kan skada även sökanden som vunnit i första instans.","motivation":"Välgrundat resonemang utifrån SFS 2026:1442–1444: att överföra beslutsfunktionen till en ny myndighet innebär att även försvaret av besluten i domstol flyttas, och myndighetsuppbyggnader tar historiskt flera år innan processkompetensen är stabil (jfr betänkandet 2025/26:MJU24 om uppbyggnadsfasen).","affects":"B60-250 och indirekt B60-260/B60-270 där myndighetens processuella agerande följer med uppåt.","impact":"Osäker partskonstellation, risk för svagt försvar av beviljade tillstånd och processuella fel i övergångsperioden.","mitigation":"Förbered egna processombud på att bära bevisbördan även om myndigheten är svag motpart; bevaka myndighetens publicerade processrutiner från start; dokumentera förstainstansbeslutets grunder så att de kan återanvändas oavsett motpartens insats.","source_refs":["SFS2026_1442","SFS2026_1443","SFS2026_1444","NEW_AUTH"],"scenario_tags":"S0_current_2026 | S1_appeal_actor_delta_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-260-01","node_id":"B60-260","chart_key":"B60","node_label":"MÖD meddelar prövningstillstånd?","title":"PT-filtret avslår utan att saken prövats – beslutet låses på mellannivå","category":"Överklagande & rättsprocess","trigger":"MÖD finner inte skäl för prövningstillstånd, varvid MMD:s avgörande blir slutgiltigt utan att överinstansen prövat sakfrågan.","description":"Prövningstillståndet är tänkt som ett filter, men för parten innebär ett avslag att överprövningsvägen stängs trots att invändningarna aldrig prövats i sak av MÖD. PT-prövningen är summarisk och ger ingen motivering i djupet, vilket gör utgången svår att förutse. För sökanden som vunnit i MMD är avslaget på andras PT-ansökan en seger – men först efter väntetiden på PT-beskedet, som själv kan ta månader. För förlorande part är filtret en definitiv spärr.","motivation":"MMDL:s prövningstillståndskrav är en etablerad spärr; Naturvårdsverkets statistik visar att MÖD:s handläggningstid fram till beslut att inte bevilja prövningstillstånd utgör en egen, inte obetydlig vänteperiod i kedjan, och erfarenheten visar att endast en mindre andel ansökningar leder till sakprövning.","affects":"B60-260; utgången styr om B60-270 aktiveras eller om målet går till B60-END/B70.","impact":"Månader av väntan på PT-besked; vid avslag slutligt besked utan sakprövning i överinstans.","mitigation":"Räkna PT-väntan in i laga kraft-planeringen; som klagande: fokusera PT-ansökan på prejudikatintresse och processfel som faller inom PT-grunderna; som vinnande part: bevaka inkomna PT-ansökningar aktivt.","source_refs":["MMDL","COURT_APPEAL","EXT: Naturvårdsverket – samlad statistik om miljöprövning https://www.naturvardsverket.se/49e4ea/globalassets/vagledning/miljobalken/miljoprovning/samlad-statistik-om-miljoprovning-for-ar-2024.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-260-02","node_id":"B60-260","chart_key":"B60","node_label":"MÖD meddelar prövningstillstånd?","title":"Uppskjutet PT-besked håller målet svävande","category":"Myndighetskapacitet & handläggning","trigger":"MÖD avvaktar PT-besked i avvaktan på annat avgörande, EU-domstolsutveckling eller samordnade mål, så att filtret självt blir en lång vänteperiod.","description":"MÖD kan skjuta upp prövningstillståndsbeslutet när utgången beror på pågående rättsutveckling. Under uppskovet vet ingen part om målet över huvud taget kommer att prövas i överinstans, och projektet står still trots att förstainstans- och MMD-leden är avslutade. Uppskovet är inte tidsreglerat och kan förlängas vid nya avgöranden i EU-domstolen eller Högsta domstolen som berör samma rättsfråga.","motivation":"I Preemraff-ärendet sköt MÖD upp beslutet om prövningstillstånd och meddelade besked först senare, vilket dokumenterats i nyhetsbevakningen (bl.a. rapporteringen om MÖD:s uppskjutna PT-besked 2019) – ett direkt exempel på att filtret kan bli en egen väntefas i uppmärksammade mål.","affects":"B60-260 och hela kedjan eftersom inget nedströms kan avgöras förrän PT-frågan är löst.","impact":"Obestämd väntetid om månader till över ett år utan möjlighet att påverka takten.","mitigation":"Bevaka MÖD:s och HD:s pågående mål inom samma rättsområde för att förutse uppskov; håll underlag och organisation redo för båda utfallen; räkna aldrig med laga kraft förrän PT-frågan formellt är avslutad.","source_refs":["MMDL","COURT_APPEAL","EXT: Rapportering om MÖD:s uppskjutna PT-besked i Preemraff https://landetsfria.nu/2019/nummer-30/domstolen-skjuter-upp-preemraff-beslutet/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-270-01","node_id":"B60-270","chart_key":"B60","node_label":"MÖD prövar saken","title":"Återförvisning från MÖD startar om hela domstolsledet","category":"Överklagande & rättsprocess","trigger":"MÖD finner processfel eller otillräcklig utredning och upphäver underinstansens avgörande med återförvisning för ny handläggning.","description":"MÖD:s återförvisningsalternativ innebär att målet skickas tillbaka, ofta efter flera års handläggning, för att göras om i den del som brustit. Återförvisningen kan gälla en begränsad fråga men leder i praktiken till ny beredning, ny kommunicering och nya beslut som i sin tur kan överklagas. För projektet är återförvisningen ofta den mest kostsamma enstaka händelsen i överprövningen eftersom den nollställer all processuell framdrift utan att ge besked i sak.","motivation":"Nordkalk/Ojnarefjärden-kedjan visar mekanismen i extremform: HD:s beslut 2010 att inte bevilja prövningstillstånd innebar att ansökan återfördes till miljödomstolen, och efter ny handläggning avslog MÖD 2018 ansökningarna i mål M 5375-14 och M 5431-14 – över ett decennium av återförvisningar och omprövningar.","affects":"B60-270, B60-G290 (återförvisningsbeslutet) och loopen tillbaka till B60-030.","impact":"Flera års omhandläggning, förnyade kommuniceringsrundor och risk för ändrat rättsläge under tiden.","mitigation":"Kvalitetssäkra den processuella kedjan i första instans (kungörelse, kommunicering, motivering) eftersom återförvisningsgrunderna oftast är processuella; vid återförvisning: avgränsa den nya handläggningen strikt till upphävandegrunden.","source_refs":["MMDL","COURT_APPEAL","EXT: MÖD M 5375-14 (Nordkalk) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-270-02","node_id":"B60-270","chart_key":"B60","node_label":"MÖD prövar saken","title":"Prejudicerande avgörande flyttar rättsläget för hela branschen","category":"Rättslig osäkerhet","trigger":"MÖD prövar målet som prejudikat och etablerar en ny tolkning av hänsynsregler, riksintresseavvägning eller villkorsteknik som påverkar både det egna projektet och liknande pågående ansökningar.","description":"När MÖD väljer att pröva ett mål i sak är det ofta för att klargöra rättsläget. Ett prejudikat kan då ändra förutsättningarna inte bara för det överklagade beslutet utan för hela projektets regelram – till exempel hur kumulativa effekter ska bedömas eller hur riksintressen ska vägas. Projekt som byggt sin ansökan på den tidigare tolkningen kan behöva komplettera mitt i processen. Prejudikatets exakta räckvidd är dessutom ofta omdiskuterad i efterhand.","motivation":"MÖD:s roll är uttryckligen prejudikatbildande; exempel som prövningen av kumulativa effekter i Ojnare-målen och villkorspraxis i gruv- och täktmål visar att enskilda avgöranden får direkt genomslag i efterföljande prövningar.","affects":"B60-270, B60-180 (materiell prövning vid eventuell återförvisning) och parallella projekt utanför nodlistan.","impact":"Ändrade rättsliga förutsättningar som kan kräva kompletterande utredning eller omformulering av yrkanden.","mitigation":"Bevaka MÖD:s prövningstillståndsbesked inom branschen löpande; bygg ansökningar på konservativa tolkningar där rättsläget är i rörelse; analysera snabbt prejudikatets konsekvenser för det egna målet.","source_refs":["MMDL","COURT_APPEAL"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-270-03","node_id":"B60-270","chart_key":"B60","node_label":"MÖD prövar saken","title":"EU-rättslig osäkerhet tvingar fram förhandsavgörande eller avvaktan","category":"Rättslig osäkerhet","trigger":"Målet aktualiserar tolkningen av EU-direktiv (habitat, SEA/EIA, IED) där svensk rättstillämpning kan strida mot unionsrätten, och frågan om förhandsavgörande aktualiseras.","description":"I mål med EU-rättsliga tvistefrågor kan MÖD behöva förhålla sig till EU-domstolens praxis eller överväga förhandsavgörande. Själv beslutet att avslå ett förhandsavgörandeyrkande skapar diskussion om målets unionsrättsliga hållbarhet, och en verklig förhandsfråga förlänger processen med år. Motparter med internationella nätverk driver medvetet unionsrättsliga argument för att öka trycket på den nationella prövningen.","motivation":"I Nordkalk/Ojnare-målen yrkades förhandsavgörande från EU-domstolen, vilket MÖD avslog (M 5431-14); Preemraff-kedjan präglades av EU-rättsliga frågor om utsläppsredovisning; erfarenheten visar att unionsrätten är ett växande argumentationsfält i svensk miljöprövning.","affects":"B60-270 och i förlängningen alla EU-berörda materiella frågor i B60-180.","impact":"Fördröjning om ett till flera år vid förhandsavgörande, eller bestående osäkerhet om avgörandets unionsrättsliga hållbarhet.","mitigation":"Analysera EU-rättsliga argument redan i första instans och bemöt dem där; bedöm strategiskt om förhandsavgörande ska yrkas eller motarbetas; följ EU-domstolens praxis inom habitat- och EIA-området löpande.","source_refs":["MMDL","EXT: MÖD M 5431-14 (Nordkalk) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5431-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-280-01","node_id":"B60-280","chart_key":"B60","node_label":"Eventuell HD-prövning för MMD som första instans","title":"HD-spåret lägger ännu ett år på de största målen","category":"Överklagande & rättsprocess","trigger":"MMD har varit första instans (A-verksamheter, stora vattenmål) och MÖD:s dom överklagas med prövningstillstånd till Högsta domstolen.","description":"När MMD prövat ansökningsmålet i första instans finns ett extra instanssteg kvar. HD beviljar prövningstillstånd sparsamt, men själva ansöknings- och PT-fasen tar tid, och beviljas PT kan hela sakfrågan prövas om. Under HD-fasen är rättsläget öppet på nytt, och byggberedskapen kan inte anses slutlig. För A-verksamheter – de största industri- och gruvprojekten – är detta en systematiskt möjlig förlängning som måste räknas in.","motivation":"Nordkalk-kedjan nådde Högsta domstolen, som 2010 avslog prövningstillstånd men därmed effektivt remitterade ansökan till ny handläggning (återkommer i MÖD M 5375-14); Cementa-frågorna nådde Högsta förvaltningsdomstolen (HFD 7208-21); de största miljömålen är precis de som söker sig till sista instans.","affects":"B60-280, B60-G290 och B70:s slutliga finalitetsbedömning.","impact":"Ytterligare ett till två års osäkerhet för de största projekten; vid beviljat PT risk för ändrat rättsläge.","mitigation":"Räkna med HD-fasen i tidplanen för A-mål; som vinnande part: argumentera aktivt mot PT med hänvisning till avsaknad av prejudikatintresse; håll finansieringsavtal öppna för slutinstansväntan.","source_refs":["MMDL","COURT_APPEAL","EXT: MÖD M 5375-14 (Nordkalk) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-280-02","node_id":"B60-280","chart_key":"B60","node_label":"Eventuell HD-prövning för MMD som första instans","title":"HD-prejudikat kan upphäva åratal av handläggning i efterhand","category":"Rättslig osäkerhet","trigger":"HD beviljar prövningstillstånd och finner att rättsläget tillämpats felaktigt genom hela kedjan, med upphävande och återförvisning som följd.","description":"Ett HD-avgörande i miljömål är sällsynt men får därför desto större genomslag. Om HD finner att underinstanserna tolkat miljöbalken eller EU-rätten fel kan hela prövningen – från samråd till MÖD-dom – behöva göras om under den nya tolkningen. Eftersom HD-prövningen kommer sist upptäcks felet först när hela kedjan är genomförd. Det är den mest extrema formen av rättslig osäkerhet i processen.","motivation":"Välgrundat resonemang: HD:s prejudikatfunktion innebär att avgöranden per definition kan förändra rättstillämpningen retroaktivt för det egna målet; Nordkalk-kedjan, där processen sträckte sig över mer än ett decennium med HD-inslag, visar vad det betyder i praktiken för projektets tidslinje.","affects":"B60-280 och via B60-G290 potentiellt hela kedjan från B60-030.","impact":"Total omprövning efter många års process; i praktiken ofta projektets slutpunkt eller full omstart.","mitigation":"Bygg underlaget så att det håller under flera tänkbara rättstolkningar; bevaka HD:s miljömål löpande; vid återförvisning efter HD: gör en ärlig omvärdering av projektets bärkraft innan omstart.","source_refs":["MMDL","COURT_APPEAL"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G020-01","node_id":"B60-G020","chart_key":"B60","node_label":"Är instansen och prövningsramen rätt?","title":"Fel första instans leder till överlämnande eller avvisning","category":"Rättslig osäkerhet","trigger":"Ansökan ges in till fel instans, eller behörighetsfrågan för kombinerade mål (A/B-verksamhet med vatten- eller annan sektorsdel) är omdiskuterad.","description":"Instansen ska kontrollera behörighet och prövningsram innan handläggningen fortsätter. För kombinerade mål – till exempel en A-verksamhet med vattenverksamhet eller strandskyddsdispens – kan det vara oklart om hela målet hör till mark- och miljödomstolen eller om delar ska splittras till delegation eller kommun. En felaktig bedömning leder till överlämnande enligt förvaltningsprocessreglerna eller avvisning, och tiden i fel instans är förlorad. Behörighetsgränserna mellan MMD och delegation påverkas dessutom av kommande följdändringar för Miljöprövningsmyndigheten.","motivation":"Behörighetsfördelningen mellan mark- och miljödomstol och miljöprövningsdelegation följer av miljöprövningsförordningen och lagen om mark- och miljödomstolar; i praktiken prövas behörigheten först i målet och fel leder till överlämnande, vilket Naturvårdsverkets statistik över prövningstider visar fördyrar totala ledtider för komplexa mål.","affects":"B60-G020 själv samt nedströms B60-030 och B60-060 (avvisning som alternativutgång).","impact":"Förlorade månader vid överlämnande, risk för avvisning och omstart av hela ansökningskedjan i rätt forum.","mitigation":"Låt juridisk sakkunskap verifiera instanskarta och sambandsprövningsmöjligheter innan ingivning (jfr B10-080); begär förhandsbesked från tänkt instans om behörigheten är tveksam; dokumentera behörighetsanalysen i ansökan.","source_refs":["MB","MMDL","MPF","MPD","SFS2026_1442"],"scenario_tags":"S0_current_2026 | S1_optional_joint_handling_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G020-02","node_id":"B60-G020","chart_key":"B60","node_label":"Är instansen och prövningsramen rätt?","title":"Utesluten sambandsprövning splittrar målet i parallella processer","category":"Sektorssamordning","trigger":"Instansen bedömer att vatten-, strandskydds-, Natura 2000- eller sektorsdelar inte kan prövas samman, eller att samband enligt MB 21 kap. 3 § inte fyller förutsättningarna.","description":"Vägvalet avgör om ansökan kan hanteras samlat eller om delar måste brytas ut till egna spår. Om sambandsprövning avslås måste sökanden driva flera ansökningar parallellt med olika instanser, kommuniceringar och överklagandekedjor. Det ökar både ledtid och risken för motstridiga utfall – till exempel att huvudtillståndet beviljas medan dispensdelen avslås. S1:s möjlighet till gemensam handläggning hos den nya myndigheten (framtida MB 19 kap. 2 a §) kan mildra detta men är frivillig och villkorad.","motivation":"Sambandsbestämmelsen i MB 21 kap. 3 § är undantagspräglad och kräver att målen har nära samband; erfarenheten från stora infrastruktur- och industrimål visar att splittring mellan MB-, PBL- och sektorsspår är regel snarare än undantag, vilket SOU 2024:98 om samordnad prövning konstaterar.","affects":"B60-G020, nedströms B60-030 och indirekt hela parallella spår (B40, B50) vars utfall ska konsolideras i B70.","impact":"Fördröjning och merkostnad genom dubblerade kommuniceringar och risk för inkonsistenta villkor mellan besluten.","mitigation":"Ansök uttryckligen om sambandsprövning med motivering; samordna tidplaner med berörda instanser via tidig dialog; håll tekniska beskrivningar identiska mellan spåren så att villkor inte kolliderar.","source_refs":["MB","SFS2026_1442","EXT: SOU 2024:98 En ny samordnad miljöbedömnings- och tillståndsprövningsprocess https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/en-ny-samordnad-miljobedomnings-och_hcb398/html/"],"scenario_tags":"S0_current_2026 | S1_optional_joint_handling_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G040-01","node_id":"B60-G040","chart_key":"B60","node_label":"Är ansökan tillräckligt komplett?","title":"Kompletteringskraven blir en ändlös pingisrunda","category":"Myndighetskapacitet & handläggning","trigger":"Instans och sökande har olika uppfattning om när underlaget är komplett, så att nya kompletteringsförelägganden utfärdas efter varje inskick.","description":"Beslutspunkten styr mellan komplettering och att gå vidare mot kungörelse. Om bristerna är diffust angivna, eller om sökandens svar skapar nya frågor, kan rundan upprepas flera gånger utan tydlig slutpunkt. Varje runda binder projektorganisationen och kan trigga behov av nya fältundersökningar om säsongen hinner passera. Instansen har samtidigt diskretionärt utrymme att kräva det som behövs för prövningen, vilket gör att sökanden sällan kan tvinga fram ett avslut på rundan.","motivation":"MB 22 kap. 2 § ger instansen rätt att förelägga komplettering; erfarenheten från svenska tillståndsprocesser visar att flervarvs-kompletteringar är vanliga i stora mål och att kompletteringsfasen ofta är den enskilt mest tidskrävande delen av förstainstanshandläggningen (jfr Naturvårdsverkets statistik över handläggningstider).","affects":"B60-G040 med loop via B60-050 tillbaka till B60-030; blockerar B60-070 och all efterföljande beredning.","impact":"Fördröjning om månader till år, upplupna konsultkostnader och risk att daterade utredningar måste göras om.","mitigation":"Begär skriftliga, specificerade kompletteringsförelägganden; genomför statusmöten med handläggaren efter varje inskick; sätt intern spärr: inga delvisa svar som skapar nya rundor utan samlad komplettering.","source_refs":["MB","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G040-02","node_id":"B60-G040","chart_key":"B60","node_label":"Är ansökan tillräckligt komplett?","title":"Avvisning efter upprepade brister tvingar full omstart","category":"Överklagande & rättsprocess","trigger":"Sökanden lämnar inte efterfrågade kompletteringar inom förelagd tid, eller bristerna bedöms som så genomgripande att ansökan inte kan läggas till grund för prövning.","description":"Om kompletteringen uteblir kan instansen avvisa eller avskriva ansökan. En avvisning innebär att allt arbete i nodkedjan förfaller och att ansökan måste ges in på nytt – ofta med förnyat samråd och uppdaterade utredningar. För sökanden uppstår dessutom osäkerhet om huruvida en avvisning går att överklaga och om en ny ansökan bedöms mot ett ändrat rättsläge eller uppdaterade BAT-slutsatser. Avvisningsutfallet påverkar också relationen till parallella spår som byggt på huvudansökans tidplan.","motivation":"Förvaltningsprocessuella regler om förelägganden och avvisning tillämpas i miljöprövningen; rättspraxis visar att avvisning efter utebliven komplettering godtas när föreläggandet varit tydligt, vilket gör tidsfristerna i kompletteringsnoden verkliga sanktionspunkter.","affects":"B60-G040 och B60-060 (processavslut); indirekt B70-byggberedskapen som då saknar huvudbeslut.","impact":"Avbrott av hela prövningsspåret, förlorad handläggningsplats och merkostnad för omstart av ansökan.","mitigation":"Hantera kompletteringsfrister som kritiska milstolpar med intern marginal; begär förlängning skriftligt i god tid om utredningar inte hinner slutföras; eskalera till instansens ledning vid otydliga krav.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-G110-01","node_id":"B60-G110","chart_key":"B60","node_label":"Behövs ytterligare skriftväxling?","title":"Skriftväxlingsloopen etablerar sig som permanent beredningstillstånd","category":"Myndighetskapacitet & handläggning","trigger":"Varje nytt bemötande genererar nya invändningar eller nya sakfrågor, så att instansen upprepade gånger bedömer att ytterligare kommunicering behövs.","description":"Beslutspunkten kan i stor mål mål fungera som en loopmaskin: ny skriftväxling leder tillbaka till kungörande eller yttrandenas nod, och rundan kan upprepas så länge nya frågor dyker upp. Utan en aktiv handläggningsledning som avgränsar vad som är tillräckligt utrett finns ingen inbyggd stoppregel. För sökanden är det avgörande att instansen någon gång konstaterar att underlaget räcker, annars konsumerar loopen både tidplan och fältdata som hinner åldras.","motivation":"Erfarenheten från större miljömål visar att skriftväxlingen är den del av förstainstanshandläggningen som oftast överskrider ursprungliga tidplaner, särskilt när många organisationer och sakägare deltar; Naturvårdsverkets handläggningstidsstatistik visar att spridningen mellan mål är stor just i denna fas.","affects":"B60-G110 med loop till B60-080/B60-090; blockerar B60-120 och allt efterföljande.","impact":"Fördröjning om flera kvartal till år, åldrande utredningsdata och upplupna kostnader.","mitigation":"Begär att instansen fastställer en slutpunkt för skriftväxlingen i tidsplanen; lämna fullständiga samlade bemötanden i stället för delvisa svar; föreslå sammanträde för att samla upp kvarstående frågor muntligt.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G130-01","node_id":"B60-G130","chart_key":"B60","node_label":"Ska avgörandet föregås av förhandling/sammanträde?","title":"Fel avgörandeform blir ett processfel i efterhand","category":"Överklagande & rättsprocess","trigger":"Målet avgörs skriftligt trots att parter begärt huvudförhandling eller att muntlig beredning varit påkallad, eller tvärtom hålls onödiga sammanträden som drar ut tiden.","description":"Valet av avgörandeform påverkar både rättssäkerhet och tempo. Om parter inte beretts muntlig behandling där det varit nödvändigt för att utreda tvistiga bevisfrågor kan utfallet angripas som processfel i överprövningen. Å andra sidan låser ett beslut om huvudförhandling målet till domstolens sammanträdeskalender, som i mark- och miljödomstolarna kan vara bokad långt fram. Valet är därmed både en rättssäkerhets- och en tidsplanfråga.","motivation":"Muntlighets- och kommuniceringsprinciperna är grundläggande i miljöprocessen; överinstanser har upphävt avgöranden där parter inte beretts tillfredsställande tillfälle att utveckla sin talan, medan erfarenheten samtidigt visar att sammanträdesledigheten hos mark- och miljödomstolarna är en reell flaskhals.","affects":"B60-G130, B60-140 och risk för återförvisning via B60-G290.","impact":"Fördröjning genom lång väntan på sammanträde, alternativt upphävande i högre instans med omprövning.","mitigation":"Yrka uttryckligen på lämplig avgörandeform med motivering; begär sammanträdestid tidigt; säkerställ att alla bevisfrågor redovisats skriftligt så att skriftlig handläggning inte riskerar processfel.","source_refs":["MB","COURT_MFV","COURT_WV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G150-01","node_id":"B60-G150","chart_key":"B60","node_label":"Krävs regeringens tillåtlighetsprövning?","title":"Sent förbehåll från regeringen kastar om hela beslutskedjan","category":"Politisk & policyrisk","trigger":"Regeringen förbehåller sig prövningen enligt MB 17 kap. 3 § mitt i eller sent i förstainstansprocessen, efter anmälan eller efter eget initiativ.","description":"Förbehållsbeslutet kan komma när som helst innan tillståndet avgjorts och flyttar då den avgörande tillåtlighetsfrågan från prövningsinstansen till regeringen. Hela det handläggningsarbete som lagts på tillåtligheten omvandlas till underlag för en politisk prövning utan tidsfrist. För projekt i känsliga områden – totalförsvarsintressen, riksintressen, Natura 2000 – är risken reell även när projektet initialt bedömts som en normal delegationssak. Förbehållet kan dessutom signalera att regeringen är skeptisk, vilket påverkar finansiärers bedömning.","motivation":"Lunnekullen-fallet (HFD 2014 not. 23) visar mekanismen: regeringen förbehöll sig prövningen av en vindkraftgruppstation efter kommunens ansökan, och frågan hamnade därmed på regeringens bord i stället för delegationens. I Markbygden prövade regeringen tillåtligheten för hela 1101-verksprojektet (regeringsbeslut 2010-03-04).","affects":"B60-G150 och B60-160; avbryter den normala kedjan B60-170/B60-180/B60-190 tills regeringen avgjort.","impact":"Odefinierad fördröjning utan processuell tidsram och osäkerhet om vem som slutligt avgör tillåtligheten.","mitigation":"Analysera 17 kap.-risken redan i förstudien (B10) för projekt i känsliga lägen; bedriv tidig dialog med berört departement via länsstyrelsen; håll ansökningsunderlaget regeringsklart så att inget extra underlagsarbete behövs om förbehåll sker.","source_refs":["MB","EXT: HFD 2014 not. 23 (Lunnekullen) https://lagen.nu/dom/hfd/2014/not/23","EXT: Regeringsbeslut Markbygden 2010-03-04 https://cdn.birdlife.se/wp-content/uploads/2018/12/Regeringsbeslut_Markbygden.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B60-G150-02","node_id":"B60-G150","chart_key":"B60","node_label":"Krävs regeringens tillåtlighetsprövning?","title":"Oklar avgränsning av obligatorisk tillåtlighetsprövning skapar behörighetsstrid","category":"Rättslig osäkerhet","trigger":"Det är omdiskuterat om verksamheten omfattas av MB 17 kap. 1 § – till exempel gränsdragningen för anläggningar i territorialhavet eller verksamheter som rubbar riksintressen.","description":"Om prövningsinstansen felaktigt bedömer att regeringens prövning inte krävs kan ett meddelat tillstånd angripas med att behörig instans inte prövat tillåtligheten. Omvänt kan en onödig hänvisning till regeringen kosta år. Gränsdragningsfrågorna är delvis outredda för nya verksamhetstyper som havsbaserad vindkraft och storskalig energilagring. Striden kan drivas av motparter som ett medvetet tidsdragsinstrument.","motivation":"MB 17 kap. 1 § innehåller kvalificerade rekvisit där praxis är begränsad; erfarenheten visar att tillåtlighetsfrågan ofta aktualiseras först under handläggningen när motparter lyfter riksintressekonflikter, och att felet då inte kan korrigeras utan att målet stannar.","affects":"B60-G150, B60-160 samt risk för upphävande av B60-190:s avgörande i överprövningen.","impact":"Fördröjning i väntan på regeringsbeslut, alternativt upphävande av tillståndet i efterhand.","mitigation":"Låt göra en särskild 17 kap.-analys av verifierad juridisk sakkunskap; anmäl självmant till regeringen i tveksamma fall för att skapa processuell tydlighet; dokumentera analysen i ansökan.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-G210-01","node_id":"B60-G210","chart_key":"B60","node_label":"Överklagas avgörandet i tid?","title":"Organiserade massöverklaganden är utgångsläget, inte undantaget","category":"Samråd & motstånd","trigger":"Kontroversiella projekt möter koordinerade överklaganden från miljöorganisationer, samebyar, föreningar och enskilda – var och en med egen talerätt att hantera.","description":"Beslutspunkten avgör om tillståndet vinner laga kraft eller dras in i överprövning. För större energi-, industri- och gruvprojekt är överklagande nästan normen, ofta från flera olika klagogrupper samtidigt. Varje överklagande måste hanteras individuellt, och det räcker att ett enda är rättidigt och behörigt för att hela överprövningskedjan ska starta. Motståndsgrupper kan dessutom samordna överklaganden för att maximera tidsutdräkten oavsett saklig styrka.","motivation":"Preemraff-ärendet överklagades av ett stort antal enskilda och organisationer (KU 2020/21:KU10); i Markbygden överklagade samebyar etappbeslut (Sveriges Radio 2017); i Kallak drevs rättsliga angrepp mot regeringsbeslutet av Naturskyddsföreningen och samebyar (HFD 2024 not. 36).","affects":"B60-G210 och hela överprövningskedjan B60-220 till B60-G290; blockerar B70:s byggberedska
