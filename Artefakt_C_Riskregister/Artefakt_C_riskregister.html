lanen även utan överklagande. Projekt där miljötillståndet vunnit laga kraft före planen kan hamna i det absurda läget att det miljörättsliga spåret är klart men det planrättsliga är öppet. Länsstyrelsens överprövning kan dessutom upphäva planen delvis, vilket kan skapa oförenlighet mot redan klara tillstånd och tvinga fram ny planläggning.","motivation":"Boverkets vägledning om detaljplaners laga kraft beskriver uttryckligen att planen inte får tillämpas förrän överklagandetiden löpt ut utan överklagande och länsstyrelsen avstått från överprövning – båda brytpunkterna är reella i svensk planpraxis. Källa: Boverket, https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/detaljplaneprocessen/laga-kraft/","affects":"B70-G090, B70-100 (B50-spåret återöppnas) och B70-G110 (oförenlighet om planen ändras i överprövningen).","impact":"Hela byggberedskapen väntar på planfinalitet; delvis upphävd plan kan kräva omarbetade tillstånd eller nytt planarbete med åtskilliga månaders fördröjning.","mitigation":"Synkronisera plan- och tillståndsprocesserna tidigt så att finalitet uppnås ungefär samtidigt. Bevaka länsstyrelsens överprövningsfrist aktivt efter antagandet. För projekt på obebyggd mark, bedöm om planläget kan säkras på annat sätt (t.ex. områdesbestämmelser) för att minska ensidigt PBL-beroende.","source_refs":["PBL","PBL_PLAN","EXT: Boverket – När en detaljplan får laga kraft https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/detaljplaneprocessen/laga-kraft/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G090-03","node_id":"B70-G090","chart_key":"B70","node_label":"Är PBL- och sektorsspecifika startgates klara?","title":"Sektorskoncession är inte slutlig – nätkoncession, koncession eller regeringsbeslut saknar finalitet","category":"Rättslig osäkerhet","trigger":"En för byggstarten nödvändig koncession eller ett regeringsbeslut är fattat men inte slutligt, eller ett nytt laglighetsprövnings-/rättsprövningsspår öppnas mot beslutet.","description":"Noden ska verifiera alla beslut som faktiskt blockerar byggarbetet, inklusive ellagens nätkoncession, minerallagens bearbetningskoncession och särskilda regeringsbeslut. Dessa kan vara föremål för överklagande, laglighetsprövning eller vara beroende av villkor hos annan myndighet (t.ex. nätanslutningsavtal som ännu inte tecknats). Dessutom kan policy- eller säkerhetsläget förändra regeringsnivåns bedömningar sent i processen, vilket erfarenhetsmässigt drabbat havsbaserad vindkraft. En gate-status som baseras på att beslutet \"är fattat\" men inte verifierat dess finalitet eller villkorlighet ger en falsk bild av byggberedskapen.","motivation":"Regeringen avslog i november 2024 tretton havsbaserade vindkraftsprojekt i Östersjön med hänvisning till Försvarsmaktens intressen, och 2016 avslogs Blekinge Offshore efter en tioårig process – båda visar att sektors- och regeringsbeslut kan falla sent och oväntat. Källor: SVT 2024-11-01, https://www.svt.se/nyheter/inrikes/forsvarsmakten-vill-stoppa-planerad-vindkraft-i-ostersjon och Sveriges Radio 2016-12-20, https://www.sverigesradio.se/artikel/6592674","affects":"B70-G090, B70-100 (parallellspår måste slutföras) och B70-130; vid avslag kan hela projektet fallera.","impact":"Byggberedskap kan inte fastställas; vid slutligt avslag eller upphävd koncession upphör projektets genomförbarhet helt eller delvis.","mitigation":"Verifiera för varje sektorsbeslut tre status separat: fattat, slutligt (laga kraft/motsvarande), och villkorsuppfyllt. Bevaka policy- och säkerhetsläget för projekttypen och försök få skriftliga besked från sektorsmyndigheterna om kvarstående hinder. Bygg beslutsberoendekedjan explicit så att sammankopplade beslut (t.ex. koncession ↔ nätanslutning) inte rapporteras som klara var för sig.","source_refs":["ELLAG","MINERALLAG","EI_GRID","EXT: SVT – Försvarsmakten vill stoppa vindkraft i Östersjön https://www.svt.se/nyheter/inrikes/forsvarsmakten-vill-stoppa-planerad-vindkraft-i-ostersjon","EXT: Sveriges Radio – Blekinge Offshore avslag oväntat https://www.sverigesradio.se/artikel/6592674"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G110-01","node_id":"B70-G110","chart_key":"B70","node_label":"Är samtliga beslut och villkor inbördes förenliga?","title":"Geografisk eller kapacitetsmässig konflikt mellan tillstånd, plan och koncession","category":"Sektorssamordning","trigger":"Förenlighetskontrollen visar att två slutliga beslut täcker olika områden eller kapaciteter – t.ex. att miljötillståndets verksamhetsområde delvis ligger utanför detaljplanens eller koncessionens gällande gränser.","description":"Noden kontrollerar att geografisk omfattning, kapacitet, tidplan och skyddsåtgärder är förenliga mellan besluten. Konflikter uppstår typiskt för att besluten prövats vid olika tidpunkter mot olika projektversioner, eller för att ett beslut ändrats i överinstans utan att parallellbesluten följt med. Eftersom besluten är slutliga kan ingen enskild instans lösa konflikten administrativt; den måste lösas genom villkorsändring, ny prövning eller omprojektering i B70-120. Kontrollen är dessutom metodkänslig: utan koordinatsatt jämförelse kan gränsavvikelser passera obemärkta.","motivation":"MÖD 2016:13 (felaktigt angiven strandlinje i detaljplanen med större exploatering i strandskyddat område än planen täckte) är ett direkt prejudicerande exempel på att plan- och genomförandegränser kan skilja sig åt med rättsliga följder. Källa: MÖD 2016:13, https://lagen.nu/dom/mod/2016:13","affects":"B70-G110, B70-120 (tvungen konfliktlösning) och B70-130; vid behov av ny prövning återkoppling till B30/B40/B50.","impact":"Konfliktlösning via villkorsändring eller ny prövning innebär fördröjning från månader till år och kan tvinga fram kapning av projektets omfattning.","mitigation":"Genomför den geografiska förenlighetskontrollen koordinatsatt (GIS) mot samtliga besluts kartbilagor, inte mot textbeskrivningar. Jämför kapacitetstal i en strukturerad tabell per beslut. Eskalera varje avvikelse, även små, till juridisk bedömning innan B70-130.","source_refs":["MB","PBL","ELLAG","EXT: MÖD 2016:13 https://lagen.nu/dom/mod/2016:13"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-G110-02","node_id":"B70-G110","chart_key":"B70","node_label":"Är samtliga beslut och villkor inbördes förenliga?","title":"Igångsättningstid eller arbetstid löper ut innan de övriga gates är klara","category":"Rättslig osäkerhet","trigger":"Förenlighetskontrollen visar att något besluts tidsfrist – igångsättningstid, arbetstid eller ianspråktagandetid – hinner passera innan de kvarstående gaten kan slutföras.","description":"Varje tillstånd kan ha egna tidsvillkor, och de löper oberoende av varandra från respektive laga kraft. I multiprojekt där en gate dröjer (markåtkomst, startbesked, koncession) kan ett tidigare klart tillstånd hålla på att förfalla enligt 24 kap. 2 § MB. Förlängning är möjlig men diskretionär och kan överklagas; den beviljas inte automatiskt. Om tillståndet förfaller måste en helt ny prövning genomföras, trots att projektet i övrigt är byggberett. Tidskonflikten upptäcks ofta sent eftersom fristerna bevakas per beslut av olika personer.","motivation":"24 kap. 2 § MB föreskriver att tillstånd förfaller om arbeten eller igångsättning inte sker inom föreskriven tid; MÖD 2016-05-17 (mål M 9024-15) avslog förlängd igångsättningstid för en vindkraftspark som inte börjat uppföras och inte skulle fått tillstånd vid dagens prövning. Källor: Jordbruksverkets vägledning om 24 kap. 2 §, https://jordbruksverket.se/download/18.448459fe1958aa6ee59291c2/1742387587266/Trelleborg-varlingegardens-kyckling-ab-2025-03-13-tga.pdf och MÖD M 9024-15, https://cdn.birdlife.se/wp-content/uploads/2018/12/Mark-och-milj%C3%B6%C3%B6verdomstolen_ig%C3%A5ngs%C3%A4ttningstid_2016-05-17.pdf","affects":"B70-G110, B70-120 (förlängningsansökan eller omprojektering) och B70-130; vid förfall återgång till B30/B40.","impact":"Risk för förfallet tillstånd och därmed behov av helt ny prövning; även beviljad förlängning kostar handläggningstid och kan överklagas.","mitigation":"Upprätta en samlad fristkalender över alla besluts tidsvillkor med larm minst ett år före utgång. Ansök om förlängning i god tid med dokumenterade giltiga skäl (koppla dröjsmålet till objektiva gate-fördröjningar). Överväg att ta tillståndet i anspråk genom ett tidigt, reversibelt moment där det är möjligt och försvarbart.","source_refs":["MB","EXT: Jordbruksverket – tillståndsmyndighetsbeslut om 24 kap. 2 § MB https://jordbruksverket.se/download/18.448459fe1958aa6ee59291c2/1742387587266/Trelleborg-varlingegardens-kyckling-ab-2025-03-13-tga.pdf","EXT: MÖD M 9024-15 https://cdn.birdlife.se/wp-content/uploads/2018/12/Mark-och-milj%C3%B6%C3%B6verdomstolen_ig%C3%A5ngs%C3%A4ttningstid_2016-05-17.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B70-G110-03","node_id":"B70-G110","chart_key":"B70","node_label":"Är samtliga beslut och villkor inbördes förenliga?","title":"Skyddsåtgärd i ett beslut blockerar fysiskt genomförande i ett annat","category":"Sektorssamordning","trigger":"Ett villkor om skydds- eller kompensationsåtgärd (biotopskydd, fiskpassage, störningsfri zon) kräver mark eller utformning som ett annat beslut disponerar för byggnad eller ledning.","description":"Skyddsåtgärder prövas inom respektive spår men verkställs på samma fysiska mark. En kompensationsåtgärd i Natura 2000-spåret kan kräva ytor som detaljplanen avsett för anläggning, eller ett bullervillkor kan kräva avstånd som kolliderar med ledningssträckan i koncessionen. Eftersom villkoren är bindande i båda besluten uppstår en genuin oförenlighet som inte kan lösas genom att prioritera det ena framför det andra. Konflikten kräver att något beslut ändras, vilket alltid innebär ny myndighetskontakt och ofta ny prövning.","motivation":"Kumulativa och korsande skyddskrav är ett välkänt genomförandeproblem i svenska Natura 2000- och artskyddsprocesser; Naturvårdsverkets vägledningar om Natura 2000 och artskydd i specifik miljöbedömning betonar att skyddsåtgärder måste vara genomförbara och förenliga med verksamhetens utformning. Strikt välgrundat resonemang kopplat till MB 7 kap. och artskyddsförordningen. Källor: NATURA och ART/ARTSKYDD i källregistret.","affects":"B70-G110, B70-120 och B70-130; potentiellt även Natura 2000- och artskyddsspåren i B40/B50.","impact":"Villkorsändring eller ny dispens-/tillståndsprövning med fördröjning; i ogynnsamma fall omprojektering av både skyddsåtgärd och anläggning.","mitigation":"Verkställbarhetsgranska alla skydds- och kompensationsvillkor mot genomförandegeometrin redan när besluten fattas. Kräv att villkorsförslagen i ansökningsfasen åtföljs av en genomförandeplan. Involvera både ekologisk och konstruktionssakkunskap i förenlighetskontrollen.","source_refs":["MB","NATURA","ARTSKYDD","ART"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B70-G140-01","node_id":"B70-G140","chart_key":"B70","node_label":"Är även praktiska tillståndsförutsättningar uppfyllda?","title":"Villkorskrav på teknisk utrustning eller övervakning kan inte levereras i tid","category":"Teknisk komplexitet","trigger":"Förstartsvillkoren kräver installerad mät-, övervaknings- eller skyddsutrustning (emissionsmätare, bullervallar, fiskpassager, dammsäkerhetsanordningar) vars leverans- eller installationstid överstiger planen.","description":"Legal byggberedskap innebär inte att villkoren praktiskt kan efterlevas vid planerad start. Villkorad utrustning kan ha långa leveranstider, kräva egen myndighetsgodkänd placering eller vara beroende av andra entreprenader. Om den praktiska kontrollen avslöjar att ett villkor inte kan uppfyllas vid start skjuts byggstarten upp trots att alla beslut är i laga kraft – en situation som ofta överraskar projektledningen eftersom legala och praktiska förutsättningar hanterats av olika team.","motivation":"Erfarenheten från svenska anläggningsprojekt visar att efterlevnad av tekniska villkor (kontrollprogram, mätutrustning, skyddsanordningar) regelmässigt blir kritisk linje i byggstarten även när tillstånden är klara; detta följer av att villkor enligt 16 kap. MB ofta är tekniskt specificerade och tidsbundna. Strikt välgrundat resonemang kopplat till MB 16 kap. och tillståndsbeslutens utformning (jfr MÖD M 4304-23).","affects":"B70-G140, B70-150 (restpunktsloop) och B70-END.","impact":"Uppskjuten byggstart trots legal byggberedskap; merkostnader för expressleveranser eller omplanering av entreprenadsekvensen.","mitigation":"Beställ villkorad utrustning med lång ledtid direkt efter laga kraft, inte efter readiness-beslutet. Verifiera i den praktiska kontrollen att varje förstartsvillkor har en namngiven leveransväg och ett datum. Planera byggsekvensen så att villkorsberoende moment startar sist.","source_refs":["MB","EXT: MÖD M 4304-23 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2025/m-4304-23-dom-2025-02-10.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-G140-02","node_id":"B70-G140","chart_key":"B70","node_label":"Är även praktiska tillståndsförutsättningar uppfyllda?","title":"Klimat- eller säsongsfönster för villkorad fältverifiering missas","category":"Klimat & naturhändelse","trigger":"Ett förstartsvillkor kräver verifiering i fält under en specifik säsong eller vid specifika flöden (t.ex. lekvandring, vegetationsperiod, lågvatten), och fönstret passeras eller slås ut av extremt väder innan verifieringen skett.","description":"Många villkor förutsätter att vissa kontroller eller åtgärder genomförs vid rätt tid på året: efterkontroll av kompensationsåtgärder, fältverifiering av artförekomster eller hydrologiska kontroller vid bestämda flöden. Klimatförändringar har gjort dessa fönster mer ostabila – tidiga vårar, skyfall och torkperioder kan förskjuta eller utplåna förutsättningarna. Missas fönstret kan verifieringen inte göras förrän nästa år, och byggstarten försenas trots att alla beslut är klara och utrustningen levererad.","motivation":"Säsongsberoendet i ekologisk och hydrologisk verifiering är etablerat i Naturvårdsverkets vägledning om specifik miljöbedömning, och svenska vatten- och naturvårdsprocesser visar att flödes- och säsongsvillkor regelmässigt styr genomförandetidpunkter (jfr vattenkraftens omprövning där flödes- och lekvandringsvillkor är centrala). Källor: NV_EIA och COURT_WV i källregistret.","affects":"B70-G140, B70-150 och B70-END; indirekt tidplanen för hela byggfasen.","impact":"Fördröjning upp till ett helt år vid missat säsongsfönster; risk för att fältvillkor aldrig kan verifieras som planerat vid extremväder.","mitigation":"Kartlägg alla säsongs- och väderberoende villkor i en egen fönsterkalender med marginaler. Genomför verifieringar i första möjliga fönster hellre än i det sista. Förhandla med tillsynsmyndigheten om alternativa verifieringsmetoder när fönstret missats.","source_refs":["MB","NV_EIA","COURT_WV"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B70-START-01","node_id":"B70-START","chart_key":"B70","node_label":"Slutliga utfall från huvud- och parallellspår","title":"Spår rapporterar \"slutligt\" beslut som fortfarande är överklagbart","category":"Underlagsbrist & data","trigger":"Ett parallellspår (B30, B40, B50 eller B60) lämnar in ett beslut till byggberedskapskontrollen som flaggas som slutligt fastän överklagandefristen fortfarande löper eller beslutet faktiskt är överklagat.","description":"Noden förutsätter att alla prövningsspår levererar beslut, rättigheter, villkor och status på ett korrekt och jämförbart sätt. I praktiken saknar processkartan en gemensam statusdefinition, och olika spår hanteras av olika organisationer och konsulter med olika rutiner. Ett miljötillstånd kan ha vunnit laga kraft medan den tillhörande nätkoncessionen eller strandskyddsdispensen fortfarande är överklagbar, men båda rapporteras som \"klara\". Felaktig status i startnoden förs vidare till beslutsmatrisen och kan leda till att projektet planerar byggstart på ett beslut som sedan rivs upp. Risken förstärks av att överklaganden ofta inkommer den sista fristdagen.","motivation":"Svenska tillståndsprocesser visar återkommande att överklaganden kommer in i slutet av fristen och ändrar projektets förutsättningar; Boverkets PBL-vägledning understryker att ett planbeslut först får laga kraft när överklagandetiden gått ut utan överklagande och utan länsstyrelseöverprövning. Att status måste kontrolleras per beslut och inte per spår är ett välgrundat praktiskt resonemang kopplat till MB 16 kap. 5 § och MMDL. Källa: Boverket, \"När en detaljplan får laga kraft\", https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/detaljplaneprocessen/laga-kraft/","affects":"Noden själv samt B70-010 (felaktiga indata till beslutsmatrisen) och B70-G020 (finalitetskontroll på felaktig grund).","impact":"Finalitetskontrollen i B70-G020 måste göras om, byggberedskapen försenas och i värsta fall påbörjas förberedande arbeten på ett beslut som upphävs, vilket skapar återställnings- och vitesskador.","mitigation":"Inför en gemensam statusdefinition (beslut fattat / överklagbar / överklagat / laga kraft / verkställbart) som varje spår måste använda. Kräv dokumenterad finalitetsverifiering per beslut, inte per spår, med datum för delgivning och kungörelse. Låt juridisk sakkunnig signera statusrapporten innan B70-010 påbörjas.","source_refs":["MB","MMDL","EXT: Boverket – När en detaljplan får laga kraft https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/detaljplaneprocessen/laga-kraft/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"}],"nodesByChart":{"B10":[{"node_id":"B10-START","chart_key":"B10","chart_name":"B10 – Förstudie och prövningsväg","phase":"Start","label":"Konkret projekt/förändring initierad","node_type":"start","description":"Invest // ---- helpers ----
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text, q){
  const e = esc(text);
  if (!q) return e;
  const parts = q.trim().split(/\s+/).filter(Boolean).map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!parts.length) return e;
  return e.replace(new RegExp('(' + parts.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function refLink(s){
  if (s.startsWith('EXT:')) {
    const m = s.slice(4).trim().match(/^(.*?)\s*(https?:\/\/\S+)$/);
    if (m) return `<a class="ref" href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[1])} ↗</a>`;
    return `<span class="ref plain">${esc(s.slice(4).trim())}</span>`;
  }
  const src = SOURCES[s];
  if (src && src.url) return `<a class="ref" href="${esc(src.url)}" target="_blank" rel="noopener" title="${esc(src.title)} — ${esc(src.authority)}">${esc(s)} ↗</a>`;
  return `<span class="ref plain">${esc(s)}</span>`;
}
function affectsCount(r){ return (String(r.affects).match(/B\d{2}-[A-Z]*\d+/g) || []).length; }

// ---- CSV export ----
function csvCell(v){
  v = v == null ? '' : String(v);
  return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function csvDownload(filename, header, rows){
  const lines = [header, ...rows].map(r => r.map(csvCell).join(';'));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

// ---- filtering ----
function filtered(){
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  return RISKS.filter(r => {
    if (!state.charts.has(r.chart_key)) return false;
    if (!state.cats.has(r.category)) return false;
    if (!state.origins.has(r.origin)) return false;
    if (state.node && r.node_id !== state.node) return false;
    if (terms.length){
      const hay = (r.risk_id+' '+r.title+' '+r.node_id+' '+r.node_label+' '+r.description+' '+r.motivation+' '+r.trigger+' '+r.affects+' '+r.impact+' '+r.mitigation+' '+r.category+' '+r.origin).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
}
function sorted(rs){
  const arr = [...rs];
  if (state.sort === 'category') arr.sort((a,b)=>a.category.localeCompare(b.category,'sv') || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'origin') arr.sort((a,b)=>ORIGINS.indexOf(a.origin)-ORIGINS.indexOf(b.origin) || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'node') arr.sort((a,b)=>a.node_label.localeCompare(b.node_label,'sv') || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'affects') arr.sort((a,b)=>affectsCount(b)-affectsCount(a));
  else arr.sort((a,b)=>a.risk_id.localeCompare(b.risk_id,'sv'));
  return arr;
}

  if (!state.selNode || !ns.some(n => n.node_id === state.selNode)) state.selNode = ns[0]?.node_id;
  const list = ns.map(x => `<div class="nodeitem ${x.node_id===state.selNode?'sel':''}" data-nid="${esc(x.node_id)}">
      <div class="nid">${esc(x.node_id)} · ${RISK_COUNT[x.node_id]||0} risker</div>${esc(x.label)}</div>`).join('');
  $('#main').innerHTML = `<div class="resultline">Nodbläddrare
      <button class="btn" id="csvNodes">Exportera alla noder (CSV)</button></div>
    <div class="nodeview"><div class="nodelist">${list}</div><div class="nodedetail" id="nodeDetail">${nodeDetailHTML(state.selNode)}</div></div>`;
  $('#csvNodes').onclick = exportNodes;
  document.querySelectorAll('.nodeitem').forEach(el => el.onclick = () => {
    state.selNode = el.dataset.nid;
    document.querySelectorAll('.nodeitem').forEach(x => x.classList.toggle('sel', x === el));
    $('#nodeDetail').innerHTML = nodeDetailHTML(state.selNode);
    bindDetail($('#nodeDetail'));
  });
  bindDetail($('#nodeDetail'));
}

// ---- view: stats ----
function bar(label, val, max){
  const pct = max ? Math.max(2, Math.round(val/max*100)) : 0;
  return `<div class="bar"><span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="val">${val}</span></div>`;
}
function renderStats(){
  const byChart = {}, byCat = {}, byOrg = {}, byNode = {};
  for (const r of RISKS){ byChart[r.chart_key]=(byChart[r.chart_key]||0)+1; byCat[r.category]=(byCat[r.category]||0)+1; byOrg[r.origin]=(byOrg[r.origin]||0)+1; byNode[r.node_id]=(byNode[r.node_id]||0)+1; }
  const maxC = Math.max(...Object.values(byChart));
  const maxK = Math.max(...Object.values(byCat));
  const maxO = Math.max(...Object.values(byOrg));
  const topNodes = Object.entries(byNode).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const avg = (RISKS.length / NODES.length).toFixed(1);
  $('#main').innerHTML = `
    <div class="resultline">Statistik <button class="btn" id="csvStats">Exportera statistik (CSV)</button></div>
    <div class="statbox"><h3>Risker per ursprung</h3>
      ${ORIGINS.map(o => bar(o, byOrg[o]||0, maxO)).join('')}
      <p style="color:var(--muted);font-size:12.5px;margin-top:8px">Ursprunget anger vems handlande eller underlåtenhet som i första hand orsakar risken — vägledning för var processförbättringar kan göra skillnad.</p></div>
    <div class="statbox"><h3>Risker per delprocess</h3>
      ${CHARTS.map(c => bar(CHART_NAME[c], byChart[c]||0, maxC)).join('')}</div>
    <div class="statbox"><h3>Risker per kategori</h3>
      ${CATEGORIES.map(c => bar(c, byCat[c]||0, maxK)).join('')}</div>
    <div class="statbox"><h3>Noder med flest risker (topp 15)</h3>
      ${topNodes.map(([id,v]) => bar(id+' – '+(NODE_BY_ID[id]?.label||''), v, topNodes[0][1])).join('')}</div>
    <div class="statbox"><h3>Täckning</h3>
      <p style="color:var(--muted);font-size:14px">${NODES.length} av ${NODES.length} riskmappbara noder täckta · i snitt ${avg} risker per nod · B00 (masterprocess) samt handoffs/slutnoder är av design inte riskmappade.</p></div>`;
  $('#csvStats').onclick = exportStats;
}

// ---- view: process map ----
function nodeGeom(n){ return PROCESS_GEOMETRY.nodeGeometry(n); }
function riskFill(cnt, rma){
  if (!rma) return '#eef0f3';
  if (cnt >= 3) return '#7d9cbb';
  if (cnt === 2) return '#b7cbdd';
  return '#dfe8f1';
}
function wrapText(s, max, maxLines=4){
  const words = String(s).split(/\s+/); const lines = []; let cur = '';
  for (const w of words){
    if (cur && (cur + ' ' + w).length > max){ lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  if (lines.length <= maxLines) return lines;
  const visible = lines.slice(0, maxLines);
  visible[maxLines-1] = visible[maxLines-1].replace(/[….]*$/, '') + '…';
  return visible;
}
function processLayout(ck){
  if (!PROC_GEOMETRY_CACHE[ck]) {
    const raw = PROC[ck];
    const nodes = PROCESS_GEOMETRY.layoutNodes(raw.nodes);
    const routes = PROCESS_GEOMETRY.routeEdges(nodes, raw.edges);
    PROC_GEOMETRY_CACHE[ck] = {
      nodes,
      routes,
      bounds: PROCESS_GEOMETRY.diagramBounds(nodes, routes),
    };
  }
  return PROC_GEOMETRY_CACHE[ck];
}
function renderProcess(){
  const ck = state.selChart;
  const chart = PROC[ck];
  const { nodes, routes, bounds: b } = processLayout(ck);
  const tabs = PROC_CHARTS.map(c =>
    `<button class="btn ${c===ck?'active':''}" data-chart-tab="${c}">${c}<span class="cnt">${CHART_RISKS[c]||0} risker</span></button>`).join('');

  // Edges use display-only geometry. Raw PROC coordinates remain untouched for CSV export.
  const renderedRoutes = routes.map(route => ({
    route,
    d: PROCESS_GEOMETRY.roundedPath(route.points),
    labelBox: route.labelBox,
  }));
  const edgeHaloSvg = renderedRoutes.map(({route,d}) =>
    `<path class="pedge-halo" data-eid="${esc(route.edge.id)}" d="${esc(d)}"/>`).join('');
  const edgeLineSvg = renderedRoutes.map(({route,d}) =>
    `<path class="pedge" data-eid="${esc(route.edge.id)}" d="${esc(d)}" marker-end="url(#arr)"/>`).join('');
  const edgeLabelSvg = renderedRoutes.filter(({labelBox}) => labelBox).map(({route,labelBox:box}) => {
    const lines = box.lines || wrapText(route.edge.label, 24, 2);
    const firstY = box.y + box.h/2 - (lines.length-1)*6.5 + 3.8;
    return `<g class="pedge-label" data-eid="${esc(route.edge.id)}">
      <title>${esc(route.edge.label)}</title>
      <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="6"/>
      ${lines.map((line,i) => `<text x="${box.x+box.w/2}" y="${firstY+i*13}" text-anchor="middle">${esc(line)}</text>`).join('')}
    </g>`;
  }).join('');

  // nodes
  let nodeSvg = '';
  for (const n of nodes){
    const { w, h } = nodeGeom(n);
    const cnt = RISK_COUNT[n.id] || 0;
    const fill = riskFill(cnt, n.rma);
    const isDec = n.type === 'decision';
    const isStart = n.type === 'start';
    const isEnd = n.type === 'end';
    const isSE = isStart || isEnd;
    const selCls = state.selProcNode === n.id ? ' sel' : '';
    const typeCls = isStart ? ' start-node' : (isEnd ? ' end-node' : '');
    const dash = n.rma ? '' : ' stroke-dasharray="5,4"';
    const stroke = n.rma ? '#7a8ca0' : '#b6bfc9';
    const shape = isDec
      ? `<polygon class="node-shape" points="${n.x+w/2},${n.y} ${n.x+w},${n.y+h/2} ${n.x+w/2},${n.y+h} ${n.x},${n.y+h/2}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"${dash}/>`
      : `<rect class="node-shape" x="${n.x}" y="${n.y}" width="${w}" height="${h}" rx="${isSE?h/2:9}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"${dash}/>`;
    const endFrame = isEnd
      ? `<rect class="end-frame" x="${n.x+5}" y="${n.y+5}" width="${w-10}" height="${h-10}" rx="${h/2-5}"/>` : '';
    const cx = n.x + w/2;
    const maxCh = isDec ? 21 : (isSE ? 24 : 28);
    const lines = wrapText(n.label, maxCh, isSE ? 2 : 4);
    const fs = isDec ? 11 : (isSE ? 11.5 : 12);
    const lineH = fs + 2.5;
    const blockH = lines.length * lineH;
    const idY = isSE ? n.y+18 : n.y+h/2-blockH/2-7;
    const textStartY = isSE ? n.y+(lines.length===1 ? 43 : 38) : n.y+h/2-blockH/2+fs/2+2;
    const terminalTag = isSE
      ? `<text class="terminal-tag" x="${n.x+15}" y="${n.y+18}">${isStart?'START':'SLUT'}</text>` : '';
    const idTxt = `<text x="${cx}" y="${idY}" text-anchor="middle" font-size="9" fill="#5d6a78" font-family="ui-monospace,Menlo,Consolas,monospace" opacity=".9">${esc(n.id)}</text>`;
    const labelTxt = lines.map((ln,i) =>
      `<text x="${cx}" y="${textStartY+i*lineH}" text-anchor="middle" font-size="${fs}" fill="#212a35">${esc(ln)}</text>`).join('');
    const badgeX = isDec ? cx+42 : n.x+w-18;
    const badgeY = isDec ? n.y+35 : n.y+18;
    const badge = cnt
      ? `<circle class="risk-badge" cx="${badgeX}" cy="${badgeY}" r="11"/>
         <text class="risk-badge-text" x="${badgeX}" y="${badgeY+3.5}" text-anchor="middle">${cnt}</text>`
      : '';
    const handoff = (n.ht.length || n.hf.length)
      ? `<text x="${n.x+12}" y="${n.y+h-8}" font-size="10.5" fill="#6e7f90">⇄</text>` : '';
    nodeSvg += `<g class="pnode${typeCls}${selCls}" data-nid="${esc(n.id)}">${shape}${endFrame}${terminalTag}${handoff}${idTxt}${labelTxt}${badge}
      <title>${esc(n.id)} – ${esc(n.label)}${cnt ? ` · ${cnt} risker` : (n.rma ? '' : ' · ej riskmappbar')}</title></g>`;
  }

  $('#main').innerHTML = `
    <div class="charttabs">${tabs}</div>
    <div class="proctoolbar">
      <button class="btn" id="zoomOut" aria-label="Zooma ut">−</button>
      <button class="btn" id="zoomIn" aria-label="Zooma in">+</button>
      <button class="btn active" id="zoomReadable">Läsbar</button>
      <button class="btn" id="zoomFit">Översikt</button>
      <span class="viewmode" id="procViewMode">Läsbart läge</span>
      <button class="btn" id="csvPNodes">Noder (CSV)</button>
      <button class="btn" id="csvPEdges">Kanter (CSV)</button>
      <span style="color:var(--muted);font-size:13px">${esc(chart.name)} — klicka på en nod för fakta och risker. Mörkare blå ton = fler mappade risker; streckade grå noder är inte riskmappbara.</span>
      <div class="legend">
        <span class="li"><span class="sw" style="background:#dfe8f1"></span>1 risk</span>
        <span class="li"><span class="sw" style="background:#b7cbdd"></span>2 risker</span>
        <span class="li"><span class="sw" style="background:#7d9cbb"></span>3+ risker</span>
        <span class="li"><span class="sw" style="background:#eef0f3;border-style:dashed"></span>ej riskmappbar</span>
        <span class="li"><span class="dia" style="background:#fff;border:1px solid #7a8ca0"></span>beslut</span>
        <span class="li"><span class="terminal"></span>START / SLUT</span>
      </div>
    </div>
    <div class="procwrap">
      <svg id="procSvg" viewBox="${b.x0} ${b.y0} ${b.x1-b.x0} ${b.y1-b.y0}" preserveAspectRatio="xMidYMid meet">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0L10,5L0,10z" fill="#a7b3bf"/></marker></defs>
        <g id="procG">
          <g class="pedge-halos">${edgeHaloSvg}</g>
          <g class="pedges">${edgeLineSvg}</g>
          <g class="pedge-labels">${edgeLabelSvg}</g>
          <g class="pnodes">${nodeSvg}</g>
        </g>
      </svg>
      <div class="zoomhint">Läsbar = arbetsvy · Översikt = hela flödet · Scrolla = zoom · Dra = panorera</div>
    </div>
    <div id="procDetail">${state.selProcNode ? nodeDetailHTML(state.selProcNode) : ''}</div>`;

  // chart tabs
  document.querySelectorAll('[data-chart-tab]').forEach(bt => bt.onclick = () => {
    state.selChart = bt.dataset.chartTab; state.selProcNode = null; renderProcess();
  });
  $('#csvPNodes').onclick = () => exportProcNodes(ck);
  $('#csvPEdges').onclick = () => exportProcEdges(ck);

  // zoom/pan via viewBox manipulation; context shared with one-time global listeners
  const svg = $('#procSvg');
  const vb = { x: b.x0, y: b.y0, w: b.x1-b.x0, h: b.y1-b.y0 };
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const setModeButtons = mode => {
    $('#zoomReadable').classList.toggle('active', mode === 'readable');
    $('#zoomFit').classList.toggle('active', mode === 'overview');
    $('#procViewMode').textContent = mode === 'overview' ? 'Översiktsläge' : (mode === 'readable' ? 'Läsbart läge' : 'Egen zoom');
  };
  const positionView = (center, width, height) => {
    const fullW = b.x1-b.x0, fullH = b.y1-b.y0;
    vb.w = width; vb.h = height;
    vb.x = width >= fullW ? b.x0-(width-fullW)/2 : Math.max(b.x0, Math.min(b.x1-width, center.x-width/2));
    vb.y = height >= fullH ? b.y0-(height-fullH)/2 : Math.max(b.y0, Math.min(b.y1-height, center.y-height/2));
    apply();
  };
  const setOverview = () => {
    vb.x=b.x0; vb.y=b.y0; vb.w=b.x1-b.x0; vb.h=b.y1-b.y0;
    apply(); setModeButtons('overview');
  };
  const setReadable = () => {
    const cw = Math.max(svg.clientWidth, 1), chh = Math.max(svg.clientHeight, 1);
    const focus = nodes.find(n => n.id === state.selProcNode) || nodes.find(n => n.type === 'start') || nodes[0];
    const center = PROCESS_GEOMETRY.nodeCenter(focus);
    const targetNodeWidth = cw < 700 ? 150 : 190;
    const width = Math.min(b.x1-b.x0, cw*PROCESS_GEOMETRY.dimensions.process.w/targetNodeWidth);
    positionView(center, width, width*chh/cw);
    setModeButtons('readable');
  };
  procCtx = { svg, vb, b, drag: null, moved: false, setModeButtons };
  const zoom = f => {
    const cw = Math.max(svg.clientWidth, 1), chh = Math.max(svg.clientHeight, 1);
    const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
    const width = Math.max(320, Math.min((b.x1-b.x0)*1.35, vb.w*f));
    positionView({x:cx,y:cy}, width, width*chh/cw);
    setModeButtons(null);
  };
  $('#zoomIn').onclick = () => zoom(0.8);
  $('#zoomOut').onclick = () => zoom(1.25);
  $('#zoomReadable').onclick = setReadable;
  $('#zoomFit').onclick = setOverview;
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.15 : 0.87); }, { passive:false });
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    procCtx.drag = { x:e.clientX, y:e.clientY, pointerId:e.pointerId };
    procCtx.moved = false;
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
  });
  setReadable();

  // node click
  const g = $('#procG');
  g.querySelectorAll('.pnode').forEach(el => el.addEventListener('click', () => {
    if (procCtx && procCtx.moved) return;
    state.selProcNode = el.dataset.nid;
    g.querySelectorAll('.pnode').forEach(x => x.classList.toggle('sel', x === el));
    const det = $('#procDetail');
    det.innerHTML = nodeDetailHTML(state.selProcNode);
    bindDetail(det);
    det.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }));

  if (state.selProcNode) bindDetail($('#procDetail'));
}

// one-time global pan listeners, acting on the active process-view context
let procCtx = null;
window.addEventListener('pointermove', e => {
  if (!procCtx || !procCtx.drag || procCtx.drag.pointerId !== e.pointerId) return;
  const { svg, vb } = procCtx;
  const dx = e.clientX - procCtx.drag.x, dy = e.clientY - procCtx.drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { procCtx.moved = true; procCtx.setModeButtons(null); }
  vb.x -= dx * vb.w / svg.clientWidth;
  vb.y -= dy * vb.h / svg.clientHeight;
  procCtx.drag = { x:e.clientX, y:e.clientY, pointerId:e.pointerId };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
});
function endProcessPan(e){
  if (!procCtx || !procCtx.drag || procCtx.drag.pointerId !== e.pointerId) return;
  if (procCtx.svg.hasPointerCapture(e.pointerId)) procCtx.svg.releasePointerCapture(e.pointerId);
  procCtx.drag = null;
  procCtx.svg.classList.remove('dragging');
}
window.addEventListener('pointerup', endProcessPan);
window.addEventListener('pointercancel', endProcessPan);

function renderMain(){
  $('#layout').classList.toggle('full', state.view === 'process');
  if (state.view === 'risks') renderRisks();
  else if (state.view === 'process') renderProcess();
  else if (state.view === 'nodes') renderNodes();
  else renderStats();
}

// ---- events ----
let deb;
$('#search').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(() => { state.q = e.target.value; renderMain(); }, 120); });
$('#sort').onchange = e => { state.sort = e.target.value; renderMain(); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#expandAll').onclick = () => {
  state.expandAll = !state.expandAll;
  $('#expandAll').textContent = state.expandAll ? 'Minimera alla' : 'Expandera alla';
  if (state.view === 'risks') renderRisks();
};

$('#search').value = state.q;
if (state.expandAll) $('#expandAll').textContent = 'Minimera alla';
renderHead(); renderSidebar(); renderMain();
if (requestedRisk) requestAnimationFrame(() => {
  const card = document.querySelector(`[data-rid="${CSS.escape(requestedRisk.risk_id)}"]`);
  if (card) card.scrollIntoView({ block:'start' });
});
</script>
</body>
