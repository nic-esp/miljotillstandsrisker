gledning om anmälningsärenden slår fast att tillsynsmyndigheten ska förelägga tillståndsansökan om verksamheten kan antas medföra betydande miljöpåverkan – en bedömning som görs på anmälningsunderlaget. Erfarenheten från kommunal tillsyn visar att kompletteringskrav i anmälningsärenden är regel snarare än undantag när underlaget är tekniskt tunt.","affects":"Noden B30-C100 samt nedströms B30-C110, B30-C120 och B30-GC140 (BMP-bedömningen); vid fel kan B30-060-spåret aktiveras.","impact":"Kompletteringskrav och försenat startbesked, eller omvandling av ärendet till tvingande tillståndsansökan med helt annan tid- och kostnadsbild.","mitigation":"Använd tillsynsmyndighetens checklistor för anmälningsinnehåll, bifoga kvantifierade utsläpps- och störningsdata även när lagen inte uttryckligen kräver det, och låt en miljötekniker granska underlaget mot BMP-kriterierna innan inlämning.","source_refs":["FMH","MPF","EXT: Naturvårdsverket, Anmälningsärenden https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/tillsyn-enligt-miljobalken/genomfora-tillsyn/anmalningsarenden/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-C110-01","node_id":"B30-C110","chart_key":"B30","node_label":"Lämna anmälan till tillsynsmyndigheten","title":"Anmälan registreras hos fel tillsynsmyndighet","category":"Rättslig osäkerhet","trigger":"Tillsynsansvaret för verksamhetstypen är fördelat mellan kommunal nämnd, länsstyrelse och i vissa fall Havs- och vattenmyndigheten eller Strålsäkerhetsmyndigheten, och anmälan lämnas till fel mottagare eller när kommunen delegerat vidare.","description":"Tillsynsfördelningen för miljöfarlig verksamhet är inte entydig utan följer verksamhetsslag, prövningsnivå och lokala delegationer. En anmälan som registreras hos fel myndighet måste överlämnas, vilket fördröjer både utredningen och det rättsliga startdatumet. I det sämsta fallet tolkar verksamhetsutövaren tystnaden från fel mottagare som att inga åtgärder behövs och påbörjar verksamheten, trots att ärendet aldrig utretts av behörig myndighet.","motivation":"FMH 26–28 §§ och kommunala delegationsordningar skapar en splittrad tillsynsbild som regeringen i prop. 2023/24:152 beskrivit som svåröverskådlig; att anmälan saknar rättskraft gör att ett registreringsbevis hos fel instans inte ger något skydd. Praktiska exempel från kommunala miljöförvaltningar visar att överlämnanden mellan nämnder och länsstyrelser är en återkommande fördröjningskälla.","affects":"Noden B30-C110 samt nedströms B30-C120, B30-GC130 och B30-C170 (startkraven).","impact":"Fördröjd utredning, osäkerhet om när verksamheten får påbörjas och risk att drift startar utan att behörig myndighet prövat ärendet.","mitigation":"Verifiera tillsynsmyndigheten mot FMH:s fördelningsregler och kommunens delegationsordning före inlämning, begär skriftlig bekräftelse på registrering hos behörig instans, och dokumentera vem som mottagit vad.","source_refs":["FMH","MPF","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-C120-01","node_id":"B30-C120","chart_key":"B30","node_label":"Utred, komplettera och kommunicera anmälan","title":"Utredningen utan slutdatum","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten saknar tid eller kompetens att slutföra utredningen, och eftersom anmälningsärenden inte omges av samma frister som tillståndsprövning ligger ärendet utan avgörande.","description":"Enligt FMH 26–27 §§ ska tillsynsmyndigheten utreda anmälan, inhämta kompletteringar och ge berörda tillfälle att yttra sig, men processen saknar de tidsramar och rättskraft som kännetecknar tillståndsprövningen. Kommuner med hög tillsynsbelastning kan låta anmälningsärenden vila, och eftersom en anmälan aldrig vinner rättskraft finns inget naturligt slut som sökanden kan stämma av mot. Verksamhetsutövaren står då utan det besked som behövs för att tryggt påbörja verksamheten.","motivation":"Regeringen konstaterar i prop. 2023/24:152 att 'en anmälan av en miljöfarlig verksamhet ... inte [medför] rättskraft' och att tillsynsmyndigheten kan återkomma med förelägganden om försiktighetsmått när som helst – en strukturell osäkerhet som förstärks när utredningen dröjer. Naturvårdsverkets vägledning om anmälningsärenden bekräftar att myndigheten kan låta ärendet resultera i underrättelse, försiktighetsmått eller föreläggande, utan formell tidsgräns.","affects":"Noden B30-C120 samt nedströms B30-GC130, B30-GC160 och B30-C170.","impact":"Projektet kan inte säkert sätta startdatum, investerings- och entreprenadavtal fördröjs, och det rättsliga läget förblir öppet för senare ingripanden.","mitigation":"Håll strukturerad kontakt med handläggaren, begär underrättelse enligt FMH 26 d § om myndigheten inte avser vidta åtgärd, och eskalera via överordnad nämnd eller länsstyrelse vid långvarig passivitet.","source_refs":["FMH","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/","EXT: Naturvårdsverket, Anmälningsärenden https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/tillsyn-enligt-miljobalken/genomfora-tillsyn/anmalningsarenden/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-C120-02","node_id":"B30-C120","chart_key":"B30","node_label":"Utred, komplettera och kommunicera anmälan","title":"Yttranden från berörda eskalerar ärendet","category":"Samråd & motstånd","trigger":"Grannar, miljöorganisationer eller andra sakägare som bereds tillfälle att yttra sig framför invändningar om buller, lukt, trafik eller hälsofaror, vilket får myndigheten att bredda utredningen.","description":"När tillsynsmyndigheten ger berörda möjlighet att yttra sig över anmälan kan även ett i övrigt okomplicerat C-ärende bli föremål för organiserat motstånd. Invändningar om störningar tvingar myndigheten att fördjupa utredningen, inhämta expertkunskap eller överväga försiktighetsmått, och kan i förlängningen leda till BMP-bedömning eller tillståndsföreläggande. Lokal opinion påverkar inte myndighetens rättsliga bedömning direkt men ökar utredningskraven och den politiska temperaturen kring ärendet.","motivation":"Erfarenheten från svenska miljöärenden – från verksamheter som väckt grannprotester till stora mål som Cementa i Slite där miljöorganisationer och privatpersoner överklagade – visar att sakägarengagemang regelmässigt förlänger och fördjupar handläggningen. Att berörda ska höras är ett uttryckligt led i FMH:s anmälningsprocess.","affects":"Noden B30-C120 samt nedströms B30-GC130, B30-GC140 och B30-GC160; vid eskalation även tillståndsspåret från B30-060.","impact":"Fördjupad utredning, försiktighetsmått eller tillståndsföreläggande i stället för underrättelse, samt försämrat grannsämjsklimat inför kommande tillståndsprocesser.","mitigation":"Informera berörda grannar proaktivt innan anmälan lämnas, adressera uppenbara störningskällor (buller, lukt, trafik) med konkreta åtgärder redan i underlaget, och svara sakligt och fullständigt på inkomna yttranden.","source_refs":["FMH","EXT: Byggföretagen, Cementkrisen https://byggforetagen.se/cementkrisen/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B30-C170-01","node_id":"B30-C170","chart_key":"B30","node_label":"Uppfyll anmälningsspårets startkrav","title":"Verksamheten startar utan att startkraven uppfyllts","category":"Rättslig osäkerhet","trigger":"Verksamhetsutövaren påbörjar driften innan anmälningsspårets samtliga startkrav – försiktighetsmått, starttid och eventuell uttrycklig negativ BMP-bedömning – är uppfyllda.","description":"Startkraven i FMH 26 e–f §§ reglerar när en anmäld verksamhet eller ändring tidigast får påbörjas, bland annat kopplat till försiktighetsmåttens ikraftträdande och i vissa fall krav på att en negativ bedömning av betydande miljöpåverkan ska föreligga. Att starta för tidigt – till exempel innan vitesförsatta åtgärder installerats eller innan angiven starttid passerats – utgör ett överträdelse som kan ge sanktionsavgift, straffansvar enligt 29–30 kap. miljöbalken och skadat förtroende hos tillsynsmyndigheten inför framtida ansökningar.","motivation":"Att tidpunkten för när anmäld verksamhet får påbörjas är reglerad och villkorad framgår av FMH 26 e–f §§; överträdelser av startkrav är ett återkommande sanktionsområde i kommunal miljötillsyn. Kopplingen mellan startkrav och negativ BMP-bedömning är dessutom relativt ny i regelverket och lätt att missa i praktiken.","affects":"Noden B30-C170 samt B30-END70 (anmälningsspårets slut) och indirekt kommande tillstånds- och tillsynsärenden för samma verksamhet.","impact":"Sanktionsavgifter eller straffansvar, möjligt driftstopp, och försämrad trovärdighet som försvårar kommande tillståndsprövningar.","mitigation":"Upprätta en startchecklista per anmälningsärende där varje startkrav bockas av med datum och ansvarig, och verifiera mot myndighetens beslut att samtliga villkor för start är uppfyllda innan driftsättning.","source_refs":["FMH","MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-C170-02","node_id":"B30-C170","chart_key":"B30","node_label":"Uppfyll anmälningsspårets startkrav","title":"Parallella beslut osynkade med anmälningsspåret","category":"Sektorssamordning","trigger":"Anmälningsspåret är klart, men parallella beslut som bygglov, strandskyddsdispens, Seveso-anmälan eller livsmedelsgodkännande saknas eller håller på att löpa ut.","description":"Noden kräver att parallella beslut följer med innan start. Ett C-anmälningsärende kan vara fullständigt utrett samtidigt som bygglovet överklagats, strandskyddsdispens saknas för kajen som anmälan gäller, eller Seveso-klassificeringen ändrats av den nya lagringen. Startar verksamheten på miljöanmälan men utan de övriga besluten blir etableringen olaglig trots att 9 kap.-spåret är rent – en klassisk samordningsfälla där varje regelverk har egen aktör och egen tid.","motivation":"Erfarenheten från svenska etableringsprojekt visar att parallella tillståndsregimer (PBL, strandskydd, Seveso) sällan är synkroniserade med miljöanmälningar; strandskyddsdispenser enligt 7 kap. miljöbalken och bygglov enligt PBL har egna processer och överklagandemöjligheter som regelbundet fördröjer i övrigt färdigprövade projekt.","affects":"Noden B30-C170 samt B30-END70 och parallella spår i B50 (PBL, strandskydd, Seveso).","impact":"Utskjuten eller olaglig start, förlorade byggsäsonger och avtalsbrottsrisker mot entreprenörer och kunder.","mitigation":"Upprätta en sammanställd beslutsmatris över samtliga regelverk som måste vara i hamn före start, med ansvarig per beslut och statusuppföljning, och synka ansökningstidpunkterna så att besluten förfaller i samma fönster.","source_refs":["FMH","PBL","STRAND","SEVESO"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-G020-01","node_id":"B30-G020","chart_key":"B30","node_label":"Klassificera A-, B-, C- eller U-verksamhet","title":"Felaktig verksamhetskod väljs","category":"Rättslig osäkerhet","trigger":"Projektets anläggningsdelar matchar flera verksamhetskoder i miljöprövningsförordningens sektorskapitel, eller ligger nära en tröskel i den mängd- eller kapacitetsgräns som skiljer tillståndsplikt A, tillståndsplikt B och anmälningsplikt C åt.","description":"Klassificeringen sker genom att identifiera samtliga tillämpliga verksamhetskoder och den högsta relevanta prövningsnivån. Sektorskapitlen i miljöprövningsförordningen är tekniskt detaljerade med kapacitets- och mängdtrösklar, och moderna anläggningar – till exempel energianläggningar med flera bränslen, logistikverksamhet eller kemisk industri med delprocesser – kan träffas av flera koder samtidigt. Väljs fel kod eller fel prövningsnivå kan hela ansökan komma att handläggas i fel spår eller av fel instans, och felet kan aktualiseras först när motparter eller domstolen granskar ansökan.","motivation":"Miljöprövningsförordningens sektorskapitel ändras löpande och tröskelvärdena kräver tolkning mot anläggningens faktiska utformning; att gränsdragningen mellan tillstånds- och anmälningsplikt är svårtillämpad är ett återkommande tema i regeringens reformarbete (prop. 2023/24:152). Felklassificering leder i praktiken till att ansökan måste göras om eller att instansvalet i B30-G110 blir felaktigt.","affects":"Noden B30-G020 samt nedströms B30-G030 (spårval), B30-G110 (instansval) och B30-C100 (anmälningsspår).","impact":"Fel spår och fel instans, avvisning eller återförvisning, omarbetad ansökan och förlorad tid i handläggningskön.","mitigation":"Låt både teknisk och juridisk sakkunskap gemensamt gå igenom samtliga potentiella koder, dokumentera tröskelberäkningar (kapacitet, mängder, bränslen), och verifiera klassificeringen med länsstyrelsen eller kommunen vid gränsfall innan spår låses.","source_refs":["MPF","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G020-02","node_id":"B30-G020","chart_key":"B30","node_label":"Klassificera A-, B-, C- eller U-verksamhet","title":"Kombinationsverksamhet höjer prövningsnivån oväntat","category":"Rättslig osäkerhet","trigger":"En verksamhet som var för sig är B- eller C-klassad blir genom sammanslagning, funktionellt samband med annan anläggning eller ny tolkning av MPF 1 kap. 6 och 10 §§ bedömd som A-verksamhet.","description":"Miljöprövningsförordningens regler om verksamheters omfattning och sammanslagning innebär att delar som tillhör samma funktionella verksamhet ska bedömas gemensamt. Ett projekt som planerats som B-verksamhet kan därmed – om en intilliggande enhet räknas in, eller om produktionsvolymen aggregeras – plötsligt falla under tillståndsplikt A med mark- och miljödomstol som första instans. Konsekvensen blir ett helt annat processpår med längre handläggningstider, högre kostnader och andra krav på ansökningsunderlag än projektet budgeterat för.","motivation":"Domstolsstatistiken från Naturvårdsverket visar att mål om miljöfarlig verksamhet i mark- och miljödomstol 2024 hade en medianhandläggningstid på 474 dagar i första instans – en väsentligt tyngre process än hos miljöprövningsdelegation. Att funktionell avgränsning av verksamheter är tolkningskrävande framgår av förordningens systematik och har behandlats i flera mål om anläggningsavgränsning.","affects":"Noden B30-G020 samt nedströms B30-G110 (instansval) och B30-100 (ansökningsunderlagets omfattning).","impact":"Byte av första instans från delegation till domstol, väsentligt längre handläggningstid, behov av fullskalig MKB i stället för förenklat underlag och omprävling av projektets tidplan och budget.","mitigation":"Analysera det funktionella sambandet med intilliggande anläggningar redan vid klassificeringen, simulera alternativa kodtillämpningar, och begär in myndighetens preliminära syn på prövningsnivå vid osäkerhet.","source_refs":["MPF","MMDL","EXT: Naturvårdsverket, Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G030-01","node_id":"B30-G030","chart_key":"B30","node_label":"Fastställ 9 kap.-spår","title":"Fel spår väljs mellan nytt, frivilligt och förelagt tillstånd","category":"Rättslig osäkerhet","trigger":"Verksamhetsutövaren missförstår skillnaden mellan obligatorisk tillståndsplikt (9 kap. 6 §), frivillig ansökan (9 kap. 6 b §) och förelagd tillståndsplikt (9 kap. 6 a §), eller väljer strategiskt ett spår som inte håller vid prövning.","description":"Spårvalet styr hela den fortsatta processen: nytt tillstånd, frivillig ansökan för att få rättsskydd för en anmälningspliktig verksamhet, förelagt tillstånd från tillsynsmyndigheten, ändringstillstånd, anmälan eller omprövning. Väljs fel spår – till exempel en anmälan där tillstånd krävs, eller en frivillig ansökan där en obligatorisk prövning snart blir aktuell – kan projektet hamna i dubbla processer eller få ett rättsskydd som snabbt urholkas av omprövningsgrunder. Spårvalet är dessutom svårt att backa ur utan att handläggningen börjar om.","motivation":"Systematiken i 9 kap. 6–6 b §§ miljöbalken med tre parallella vägar in i tillståndsprövningen är ett känt komplexitetsområde; regeringen konstaterade i prop. 2023/24:152 att gränserna mellan spåren är otydliga och föreslog förtydliganden som delvis genomförts genom SFS 2026:400. Vägledningen från Naturvårdsverket om anmälningsärenden visar att förelägganden om tillståndsansökan regelbundet förekommer när verksamhetsutövare valt anmälningsspåret för snävt.","affects":"Noden B30-G030 samt samtliga fyra nedströms spår: B30-060 (tillståndsspår), B30-G040 (ändringsavgränsning), B30-C100 (anmälningsspår) och B30-O100 (omprövning).","impact":"Dubbelarbete, omstart i annat spår, förlorade handläggningsmånader och i värsta fall drift utan rättsskydd under mellantiden.","mitigation":"Gör ett dokumenterat spårvalsresonemang med juridisk sakkunskap som prövar alla alternativ mot 9 kap. 6–6 b §§, väg in tillsynsmyndighetens inställning och kommande omprövningsgrunder, och säkra att spårvalet är förenligt med projektets övriga tillståndsbehov.","source_refs":["MB","MPF","NV_PERMIT","EXT: Naturvårdsverket, Anmälningsärenden https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/tillsyn-enligt-miljobalken/genomfora-tillsyn/anmalningsarenden/","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-G030-02","node_id":"B30-G030","chart_key":"B30","node_label":"Fastställ 9 kap.-spår","title":"Tillsynsmyndigheten förelägger tillstånd mitt i anmälningsstrategin","category":"Myndighetskapacitet & handläggning","trigger":"Medan projektet förbereder en anmälan eller avvaktar, bedömer tillsynsmyndigheten att verksamheten medför risk för betydande föroreningar eller betydande olägenheter och förelägger tillståndsansökan enligt 9 kap. 6 a § miljöbalken.","description":"Vid förelagd tillståndsplikt styr myndigheten takten och inriktningen: verksamhetsutövaren måste inom förelagd tid lämna in en fullständig ansökan, ofta med kortare framförhållning än den egna planeringen byggt på. Underlag som tänkts för anmälan – som inte uppfyller kraven på ansökningshandlingar enligt 22 kap. miljöbalken – måste då byggas om, och samråd och MKB kan behöva göras i andra former. Ett föreläggande kan dessutom vitesförsättas och är överklagbart, vilket lägger en rättsprocess ovanpå projektchemat.","motivation":"Naturvårdsverkets vägledning om anmälningsärenden och om ansvar för avhjälpande av miljöskador beskriver att tillsynsmyndigheter i enskilda fall kan förelägga tillståndsansökan även för pågående verksamhet, och att sådana förelägganden regelbundet används i tillsynen. Spårväxlingen från anmälan till förelagd ansökan är en av de vanligaste strukturella störningarna i 9 kap.-processen.","affects":"Noden B30-G030, anmälningsnoderna B30-C100–B30-C170 som kan falla bort, samt B30-060 och B30-070 som måste aktiveras med nytt underlagsbehov.","impact":"Tvångsomställning av processen, bortkastat anmälningsarbete, tidspress från vitesföreläggande och risk för sanktionsavgift eller straffansvar vid för sen ansökan.","mitigation":"Håll löpande dialog med tillsynsmyndigheten om verksamhetens störningsbild, dokumentera proaktivt försiktighetsmått, och förbered ett fallback-upplägg där anmälningsunderlaget är strukturerat så att det kan uppgraderas till ansökningshandlingar.","source_refs":["MB","FMH","EXT: Naturvårdsverket, Ansvar för avhjälpande av miljöskador – vägledning https://www.naturvardsverket.se/49f10b/contentassets/051d56e60c9e4ab5b75c90fb231547a0/ansvar-for-avhjalpande-av-miljoskador-vagledning-om-miljobalkens-regler-och-rattspraxis.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G040-01","node_id":"B30-G040","chart_key":"B30","node_label":"Ändring: tillstånd, anmälan eller ingen ny plikt?","title":"Gränsdragningen mellan tillstånd och anmälan vid ändring brister","category":"Rättslig osäkerhet","trigger":"Ändringen av en tillståndspliktig verksamhet ligger i gränslandet mellan ändringstillståndsplikt enligt MPF 1 kap. 11 § och anmälningsplikt, och verksamhetsutövaren och tillsynsmyndigheten gör olika bedömningar.","description":"MPF 1 kap. 11 § anger när en ändring av en tillståndspliktig verksamhet kräver nytt tillstånd och när det räcker med anmälan. Bedömningen bygger på om ändringen kan medföra ökade utsläpp eller andra betydande effekter, vilket är en kvalitativ och ofta tekniskt komplex prognosfråga. Om verksamhetsutövaren anmäler i stället för att söka – och myndigheten eller domstolen senare gör en annan bedömning – kan ändringen ha genomförts utan rättsskydd. Omvänt leder en onödigt försiktig tillståndsansökan till en betydligt tyngre process än lagen kräver.","motivation":"Regeringen slår i prop. 2023/24:152 uttryckligen fast att gränsen mellan tillstånds- och anmälningsplikt vid ändring behöver tydliggöras, och reformpaketet (bl.a. SFS 2026:400) syftar till att skärpa dessa gränsdragningar – ett besked om att nuvarande regler i praktiken skapar felbedömningar. IVA:s rapport om vägval för metaller och mineral lyfter samma problemställning ur industrins perspektiv.","affects":"Noden B30-G040 samt nedströms B30-G050 (ändringstillståndsspår), B30-C100 (anmälningsspår) och B30-END70.","impact":"Rättsosäkerhet om rättsskyddet för genomförd ändring, risk för föreläggande eller straffansvar i efterhand, alternativt onödigt kostsam full tillståndsprövning.","mitigation":"Kvantifiera ändringens utsläpps- och effektförändringar tekniskt, dokumentera bedömningen mot MPF 1 kap. 11 § med referens till tröskelvärden, och inhämta tillsynsmyndighetens skriftliga inställning innan ändringen genomförs.","source_refs":["MPF","MB","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/","EXT: IVA, Vägval för metaller och mineral (2024) https://www.iva.se/contentassets/545315af77354408a81ad8c91979b516/202411-iva-vagval-for-metaller-och-mineral-rapport3-rev4-d.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G040-02","node_id":"B30-G040","chart_key":"B30","node_label":"Ändring: tillstånd, anmälan eller ingen ny plikt?","title":"Kumulativa ändringar glider över tillståndströskeln","category":"Teknisk komplexitet","trigger":"En serie var för sig små produktions- eller processjusteringar – ofta hanterade som interna tekniska beslut – har sammantaget ökat utsläppen eller ändrat verksamhetens karaktär utan att någon gjort den samlade juridiska bedömningen.","description":"Noden kräver bedömning av ändringens kumulativa relation till tidigare ändringar. I praktiken sker justeringar löpande i driftsorganisationer: nya recept, förändrade torktemperaturer, ökade batchvolymer, nya lagertankar. Varje enskilt steg kan ligga under anmälnings- eller tillståndströskeln, men den samlade effekten kan innebära att verksamheten över tid avviker från det tillstånd som prövats. När detta uppdagas – vid tillsyn, klagomål eller nästa ansökan – saknas rättsskydd för den faktiska driften, och den rättsliga återställningen kan bli både dyr och dröjande.","motivation":"Att ändringstillstånd staplade på varandra försvårar överblicken av vad som faktiskt gäller är precis det problem regeringen beskriver i prop. 2023/24:152 ('svårt att överblicka vilka villkor som gäller för verksamheten'). Erfarenheten från svensk miljötillsyn visar att avvikelser mellan tillstånd och faktisk drift är ett återkommande fynd vid tillsynsinspektioner av äldre anläggningar.","affects":"Noden B30-G040 samt B30-010 (tillståndshistoriken måste revideras) och B30-O100 (omprövning eller föreläggande kan utlösas).","impact":"Drift utan täckande tillstånd, tvingande efterhandsansökan eller omprövning, möjliga sanktioner och förlorat förtroende hos tillsynsmyndigheten inför kommande ansökningar.","mitigation":"Inför en intern ändringshanteringsprocess där varje teknisk justering juridiskt flaggas mot tillståndet, upprätta en löpande ändringslogg som årligen stäms av mot tillstånds- och anmälningsplikten, och gör en samlad kumulativ analys inför varje ny ansökan.","source_refs":["MPF","MB","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-G040-03","node_id":"B30-G040","chart_key":"B30","node_label":"Ändring: tillstånd, anmälan eller ingen ny plikt?","title":"Saknat förhandsbesked gör avgränsningen oenig","category":"Myndighetskapacitet & handläggning","trigger":"Tillsynsmyndigheten avböjer att lämna ett bindande eller ens skriftligt besked om hur ändringen bör hanteras, eller olika handläggare ger motstridiga muntliga signaler.","description":"Avgränsningsbeslutet i denna nod görs av verksamhetsutövaren och tillsynsmyndigheten i samspel, men det finns ingen formell förhandsprövningsinstans för frågan om tillstånds- eller anmälningsplikt vid ändring. Kommunala miljöförvaltningar och länsstyrelser har varierande kapacitet och praxis för att lämna vägledande besked, och ett muntligt besked har inget rättsligt värde när frågan senare prövas. Projektet kan därför tvingas fatta spårbeslutt på osäker grund, med risk att prövningsinstansen eller domstolen längre fram drar gränsen annorlunda.","motivation":"Att tillgången till tidig och enhetlig myndighetsvägledning varierar mellan kommuner och län är ett välbelagt strukturproblem i svensk miljöprövning; kommunernas och länsstyrelsernas remissvar på SOU 2024:98 pekar på obligatoriska handläggningsmoment och kapacitetsvariationer som styr utfallet. Avsaknaden av rättskraft hos anmälningsbeslut (prop. 2023/24:152) gör att även ett positivt besked inte skyddar mot senare omprövning.","affects":"Noden B30-G040 samt nedströms B30-G050, B30-C100 och indirekt B30-G110 (instansval bygger på avgränsningen).","impact":"Fördröjt spårval, försiktighetsdriven överansökan eller tvärtom en anmälan som senare ogiltigförklaras, samt svårighet att lägga fast projektets tidplan.","mitigation":"Begär skriftliga besked, boka förhandling eller möte med protokoll, eskalera till länsstyrelsen när kommunens besked är oklart, och bygg in marginal i tidplanen för en eventuell uppgradering till tillståndsansökan.","source_refs":["MPF","FMH","EXT: Uppsala kommuns yttrande över SOU 2024:98 https://www.uppsala.se/contentassets/fc9507c4427642ac895d7069a2e164dc/9.-yttrande-over-sou-2024-98---en-ny-samordnad-miljobedomnings-och-tillstandsprovningsprocess-mhn-2025-1997.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G050-01","node_id":"B30-G050","chart_key":"B30","node_label":"Ändringstillstånd eller nytt samlat tillstånd?","title":"Domstolen finner avgränsningen olämplig","category":"Rättslig osäkerhet","trigger":"Sökanden avgränsar ändringsprövningen till en del av verksamheten, men prövningsmyndigheten eller domstolen bedömer att ändringen har sådant samband med övriga delar att hela verksamheten måste prövas.","description":"Enligt 16 kap. 2 a § miljöbalken ska prövningen vid ändring avgränsas när det är lämpligt, men hela verksamheten prövas om sökanden begär det eller om avgränsning är olämplig. Lämplighetsbedömningen är prognosbaserad och rymmer ett reellt skönsmässigt utrymme. Om domstolen under handläggningen kommer fram till att avgränsningen inte håller – till exempel för att utsläppen från olika anläggningsdelar påverkar samma recipient – kan målet behöva kompletteras med underlag för hela verksamheten eller delvis återförvisas, med kraftigt utökad process som följd.","motivation":"SOU 2022:33 och prop. 2023/24:152 behandlar utförligt svårigheterna att avgränsa ändringsprövningar, och miljööverdomstolens praxis visar mål där prövningens omfattning utvidgats när sambandet mellan anläggningsdelar visat sig kräva en samlad bedömning. Regeringen framhåller samtidigt att samlad prövning ökar överblickbarheten men kräver större underlag – en avvägning som gör valet i denna nod strategiskt känsligt.","affects":"Noden B30-G050 samt nedströms B30-060 (prövningsram måste ritas om) och B30-070 (MKB-underlagets omfattning kan bli otillräcklig).","impact":"Återförvisning eller utvidgad komplettering, nya utredningar för hela verksamheten, och månader till år av extra handläggningstid i domstol.","mitigation":"Analysera det miljömässiga sambandet mellan ändringen och övriga anläggningsdelar recipientvis, dokumentera lämplighetsbedömningen, och överväg proaktivt samlad prövning när verksamheten ändå står inför omprövning eller har många gamla villkor.","source_refs":["MB","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-G050-02","node_id":"B30-G050","chart_key":"B30","node_label":"Ändringstillstånd eller nytt samlat tillstånd?","title":"Sent byte till samlad prövning spräcker underlaget","category":"Underlagsbrist & data","trigger":"Sökanden inser först sent i processen – eller efter påpekande från prövningsinstans – att ett nytt samlat tillstånd är att föredra, men MKB:n och teknikunderlaget är bara framtaget för ändringen.","description":"Ett nytt samlat tillstånd kräver fullständigt underlag för hela verksamheten: komplett miljöbedömning, BAT-bedömning för samtliga processer, och förslag till samtliga villkor. Det är en väsentligt större uppgift än det förenklade underlag som räcker för en avgränsad ändringsprövning. Byts strategin efter att samrådet genomförts eller ansökan lämnats in kan både samrådsunderlag och ansökningshandlingar behöva göras om, och i värsta fall måste ett nytt samråd hållas eftersom samrådskretsen och störningsbilden ändrats.","motivation":"Mark- och miljööverdomstolens avgörande MÖD 2022:27 understryker att avgränsningen av samrådskretsen och samrådets form måste anpassas till vad som ska prövas; en utvidgad prövning efter genomfört samråd kan därför underminera samrådets giltighet. Erfarenheten från stora industrimål visar att underlagsbygget för hela verksamheter tar avsevärt längre tid än för avgränsade ändringar.","affects":"Noden B30-G050 samt uppströms B30-070 (miljöunderlag) och nedströms B30-060, B30-100 och B30-G110.","impact":"Omarbetat samråd och MKB, ny ansökningsrunda, förskjutet instansval och fördröjning i storleksordningen ett eller flera år för större anläggningar.","mitigation":"Fatta valet mellan ändrings- och samlad prövning innan samrådet inleds, väg in kommande omprövnings- och BAT-aktuella frågor i beslutet, och strukturera underlaget modulärt så att det kan skalas upp till hela verksamheten vid behov.","source_refs":["MB","NV_EIA","EXT: MÖD 2022:27 https://lagen.nu/dom/mod/2022:27"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-G050-03","node_id":"B30-G050","chart_key":"B30","node_label":"Ändringstillstånd eller nytt samlat tillstånd?","title":"Reformskiftet gör ändringsprövning till huvudregel","category":"Politisk & policyrisk","trigger":"De nya reglerna i miljöbalken enligt SFS 2026:400 gör ändringsprövning obligatorisk när sökanden inte själv begär prövning av hela verksamheten, och det finns en prövningshake för nya prövningshinder.","description":"Reformpaketet om effektivare miljöprövning förändrar spelreglerna i just denna nod: ändringsprövning blir huvudregel, prövningsmyndigheten ska själv avgränsa vilket beslutsunderlag som behövs och vilka villkor som har miljömässigt samband med ändringen, och ett nytt prövningshinder för ändringar införs. Pågående ansökningar och processer som förberetts under de gamla reglerna kan träffas av övergångsregler eller behöva ompröva sin strategi. Osäkerheten om hur de nya begreppen – särskilt det miljömässiga sambandet – ska tillämpas kommer att prövas i praxis under flera år framöver.","motivation":"Proposition 2023/24:152 'Steg på vägen mot en mer effektiv miljöprövning' med tillhörande lagändringar (SFS 2026:400) genomför just dessa förändringar, och riksdagens betänkande 2024/25:MJU4 beskriver avsikten att göra ändringsprövning obligatorisk om inte hela verksamheten ansöks om. Historiskt har större miljöbalksreformer alltid skapat flerårig rättslig osäkerhet innan praxis etablerats.","affects":"Noden B30-G050 samt nedströms B30-060 och B30-G110, och uppströms B30-G040 där ändringsavgränsningen görs.","impact":"Strategiska vägval måste omprövas, risk att underlag framtaget under gamla regler inte matchar nya krav, och tolkningstvister om övergångsbestämmelser.","mitigation":"Följ ikraftträdande- och övergångsreglerna i SFS 2026:400 noga, låt juristen avgöra vilken lag som ska tillämpas på det konkreta ärendet, och dokumentera valet av regelverk i ansökan för att förebygga formella invändningar.","source_refs":["SFS2026_400","MB","EXT: Betänkande 2024/25:MJU4 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hc01mju4/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B30-G110-01","node_id":"B30-G110","chart_key":"B30","node_label":"Behörig första instans?","title":"Kombinerade mål hamnar i fel instans","category":"Rättslig osäkerhet","trigger":"Verksamheten omfattar både miljöfarlig verksamhet och vattenverksamhet, eller A- och B-klassade delar, och ansökan lämnas till miljöprövningsdelegation trots att målet ska upp i mark- och miljödomstol – eller tvärtom.","description":"Instansvalet följer den högsta prövningsnivån: A-verksamhet och vissa kombinerade mål prövas av mark- och miljödomstol, medan B-verksamhet i S0 går till länsstyrelsens miljöprövningsdelegation. Vid kombinationsmål – till exempel en industri med damm, kaj eller vattenuttag – kan behörighetsfrågan vara genuint svårbedömd, och ett felaktigt val upptäcks ibland först efter att ansökan registrerats och delvis handlagts. En avvisning eller överlämnande innebär att handläggningskön i rätt instans börjar om från noll.","motivation":"Preemraff Lysekil prövades som kombinerat mål i mark- och miljödomstolen i Vänersborg, och mål med både miljöfarlig verksamhet och vattenverksamhet är ett återkommande behörighetsproblem enligt domstolarnas och Naturvårdsverkets vägledningar. Lagen (2010:921) om mark- och miljödomstolar styr målfördelningen, men gränsdragningsfrågor mot delegationernas kompetens återkommer i praktiken.","affects":"Noden B30-G110 samt nedströms B30-END60, och indirekt B40-spåret för vattenverksamhet som kan behöva sammankopplas.","impact":"Avvisning eller överlämnande mellan instanser, förlorad kötid på månader till över ett år, och behov av omarbetad ansökan för domstolens formkrav.","mitigation":"Gör behörighetsanalysen parallellt med klassificeringen i B30-G020, kontrollera mot MPF:s sektorskapitel och MMD-lagens målfördelningsregler, och begär instansens preliminära behörighetsbesked vid gränsfall före formell inlämning.","source_refs":["MPF","MPD","MMDL","COURT_MFV","COURT_WV"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G110-02","node_id":"B30-G110","chart_key":"B30","node_label":"Behörig första instans?","title":"Miljöprövningsmyndighetens övertagande skapar övergångskaos","category":"Myndighetskapacitet & handläggning","trigger":"Från 2027-07-01 övertar den nya Miljöprövningsmyndigheten miljöprövningsdelegationernas B-ärenden, inklusive överföring av pågående handläggning från länsstyrelserna.","description":"I S1-scenariot ska ansökningar om B-tillstånd lämnas till en helt ny myndighet som samtidigt bygger upp organisation, ledningssystem, IT-stöd och beslutsrutiner. Överföringen av pågående ärenden från länsstyrelsernas delegationer är en stor logistik- och kvalitetsrisk: handläggare byts, lokal kunskap om verksamheter kan gå förlorad, och nya arbetssätt kan innebära omtag på delvis handlagda ärenden. För sökanden är det dessutom osäkert vart ansökan ska lämnas i övergångsfasen och vilka avgifts- och handläggningsrutiner som gäller.","motivation":"Riksdagen beslutade 2026 om den nya myndigheten för miljöprövning (betänkande 2025/26:MJU24), med ikraftträdande 1 juli 2027 enligt SFS 2026:1442–1444; berörda länsstyrelser har redan fått uppdrag att förbereda ärendeöverföringen (KN2026/00526), vilket visar att övergångsrisken är erkänd av staten själv. Historiska myndighetsreformer i Sverige – som bildandet av mark- och miljödomstolarna 2011 – innebar fleråriga handläggningsstörningar under uppbyggnadsskedet.","affects":"Noden B30-G110 samt nedströms B30-END60 och alla B-ärenden i hela B30, samt omprövningsinstansvalet i B30-GO130.","impact":"Förlängda handläggningstider under övergången, förlorad ärendekontinuitet, osäkerhet om rätt mottagare och i värsta fall omtag av kompletterings- och yttrandemoment.","mitigation":"Tidigarelägg inlämning före 2027-07-01 om möjligt, håll ansökningshandlingarna kompletta och portabla så att de kan tas över utan omarbete, och bevaka övergångsregler och myndighetens vägledning löpande.","source_refs":["SFS2026_1442","SFS2026_1443","SFS2026_1444","NEW_AUTH","EXT: Svenskt Vatten, Riksdagen beslutar om ny myndighet för miljöprövning https://www.svensktvatten.se/om-oss/nyheter-och-press/nyheter/riksdagen-beslutar-om-ny-myndighet-for-miljoprovning/"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-G110-03","node_id":"B30-G110","chart_key":"B30","node_label":"Behörig första instans?","title":"Delegationsköerna bromsar B-ärenden","category":"Myndighetskapacitet & handläggning","trigger":"Miljöprövningsdelegationerna vid länsstyrelserna har begränsad handläggarkapacitet, hög belastning och i vissa län organiserade sam delegationer för flera län, vilket bygger upp köer före beslut.","description":"I S0 prövas B-verksamheter av miljöprövningsdelegationer som i flera fall täcker flera län (till exempel hanterar delegationen i Uppsala även Södermanlands och Västmanlands ärenden). Brist på sakkunniga handläggare och ledamöter, i kombination med det obligatoriska momenten i handläggningen – granskning, komplettering, kungörelse, beslut – gör att även formellt enkla ärenden kan dröja. Eftersom delegationen sammanträder periodiskt kan ett enda missat sammanträde skjuta beslutet flera månader.","motivation":"Naturvårdsverkets samlade statistik över miljöprövning 2020–2024 redovisar handläggningstiderna hos miljöprövningsdelegationerna som ett återkommande förbättringsområde, och länsstyrelsernas egna sidor visar den geografiska sammanslagningen av delegationer. Kommuner och näringsliv har i remisser (t.ex. till SOU 2024:98) pekat ut handläggningsmomentens styvhet som en drivande orsak till långa tider.","affects":"Noden B30-G110 samt nedströms B30-END60; fördröjningen propagerar till projektets byggstart och finansieringsbeslut.","impact":"Månader av kötid utöver själva prövningen, skjutna investeringsbeslut och risk att fönster för entreprenad och byggsäsong missas.","mitigation":"Skicka in komplett ansökan för att undvika kompletteringsvarv, följ upp plats i delegationens sammanträdescykel, och väg in kötiden i projektets kritiska linje redan vid tidplaneringen.","source_refs":["MPD","NV_PERMIT","EXT: Naturvårdsverket, Samlad statistik om miljöprövning 2024 https://www.naturvardsverket.se/49e4ea/globalassets/vagledning/miljobalken/miljoprovning/samlad-statistik-om-miljoprovning-for-ar-2024.pdf","EXT: Länsstyrelsen Uppsala, Tillstånd och ändringstillstånd för miljöfarlig verksamhet https://www.lansstyrelsen.se/uppsala/miljo-och-vatten/miljofarlig-verksamhet/provning-av-miljofarlig-verksamhet/tillstand-och-andringstillstand-for-miljofarlig-verksamhet.html"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GC130-01","node_id":"B30-GC130","chart_key":"B30","node_label":"Krävs beslut om betydande miljöpåverkan?","title":"Obligatorisk BMP-bedömning förbises","category":"Rättslig osäkerhet","trigger":"Tillsynsmyndigheten handlägger anmälan som ett rutinärende utan att kontrollera om verksamhetsslaget omfattas av den obligatoriska bedömningen av betydande miljöpåverkan i FMH 26 a §.","description":"Vissa anmälningsärenden – främst anmälningar om ändring av tillståndspliktig verksamhet – kräver att myndigheten uttryckligen prövar om verksamheten kan antas medföra betydande miljöpåverkan. Om detta moment hoppas över är beslutet eller underrättelsen rättsligt bristfälligt: det kan sakna det obligatoriska bedömningsmomentet och därmed inte ge det rättsskydd verksamhetsutövaren tror sig ha. Felet kan uppdagas först när en senare ändring eller ett klagomål aktualiserar ärendet på nytt.","motivation":"FMH 26 a § infördes för att skärpa kontrollen av ändringar i tillståndspliktiga verksamheter, och momentet är obligatoriskt – inte skönsmässigt. Erfarenheten från tillsynsvägledningar visar att rutinpressade kommuner ibland behandlar anmälningar enhetligt utan att skilja ut de BMP-pliktiga fallen, vilket skapar dolda rättsosäkerheter i verksamhetsbeståndet.","affects":"Noden B30-GC130 samt nedströms B30-GC140 och B30-GC160; ett bristfälligt utfall påverkar B30-C170 (startkrav).","impact":"Ogiltig eller angripbar underrättelse, förlorad rättslig trygghet för driften, och risk att ärendet måste tas upp på nytt med BMP-bedömning och eventuellt tillståndsföreläggande.","mitigation":"Kontrollera vid inlämningen om verksamhetsslaget faller under BMP-plikten, begär uttryckligt ett dokumenterat ställningstagande till betydande miljöpåverkan, och arkivera myndighetens beslut som bevis för att momentet genomförts.","source_refs":["FMH","EXT: Naturvårdsverket, Anmälningsärenden https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/tillsyn-enligt-miljobalken/genomfora-tillsyn/anmalningsarenden/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GC130-02","node_id":"B30-GC130","chart_key":"B30","node_label":"Krävs beslut om betydande miljöpåverkan?","title":"Okart vilka anmälningar som är BMP-pliktiga","category":"Rättslig osäkerhet","trigger":"Gränsdragningen för vilka anmälningsärenden som omfattas av obligatorisk BMP-bedömning tolkas olika av olika kommuner och länsstyrelser, särskilt för ändringar som ligger nära gränsen mellan C-anmälan och ändringsanmälan för tillståndspliktig verksamhet.","description":"BMP-plikten i FMH 26 a § är knuten till vissa anmälningspliktiga ändringar, men tillämpningsområdet förutsätter att både verksamhetsutövaren och myndigheten klassificerat ändringen rätt i MPF:s system. När klassificeringen är osäker – vilket den ofta är vid kombinationsändringar – blir även frågan om BMP-plikt osäker. Olika myndigheters praxis varierar, vilket gör att samma anmälan kan handläggas med obligatoriskt beslut i en kommun och med enkel underrättelse i en annan.","motivation":"Att gränsen mellan anmälnings- och tillståndsplikt vid ändringar är otydlig är erkänt i lagstiftningsarbetet (prop. 2023/24:152), och osäkerheten fortsätter ned i frågan om vilka anmälningar som kräver BMP-beslut. Vägledningar från Naturvårdsverket visar att tillämpningen förutsätter noggrann sektorsklassificering – samma klassificering som är tvistig i noden B30-G020.","affects":"Noden B30-GC130 samt uppströms B30-G020/B30-G040 (klassificering och ändringsavgränsning) och nedströms B30-GC140.","impact":"Inkonsekvent handläggning, risk för felsortering av ärendet och efterföljande rättslig osäkerhet om startbeskedets giltighet.","mitigation":"Låt klassificeringen av anmälan granskas mot MPF 1 kap. 10–11 §§ innan BMP-frågan avgörs, och dokumentera myndighetens motivering för varför obligatorisk bedömning krävs eller inte krävs.","source_refs":["FMH","MPF","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GC140-01","node_id":"B30-GC140","chart_key":"B30","node_label":"Kan betydande miljöpåverkan antas?","title":"Positiv BMP kastar om projektet till tillståndsspåret","category":"Extern händelse","trigger":"Tillsynsmyndigheten bedömer vid BMP-prövningen att verksamheten eller ändringen kan antas medföra betydande miljöpåverkan och förelägger tillståndsansökan enligt 9 kap. 6 a § miljöbalken.","description":"Ett positivt BMP-beslut omvandlar hela projektets rättsliga väg: i stället för att starta på anmälan måste verksamhetsutövaren inom förelagd tid lämna en fullständig tillståndsansökan med MKB, samråd och kompletta handlingar. Allt arbete i anmälningsspåret blir delvis förfallet, tidplanen förskjuts med en till flera år beroende på prövningsinstans, och projektets finansiella förutsättningar kan förändras fundamentalt. Föreläggandet kan dessutom förenas med vite och begränsningar av pågående drift.","motivation":"Naturvårdsverkets vägledning om anmälningsärenden bekräftar att positiv BMP-bedömning leder till föreläggande om tillståndsansökan. Spåromvandlingen från anmälan till förelagd tillståndsansökan är en av de mest ingripande enskilda händelserna i 9 kap.-systemet och har i praktiken drabbat både mindre anläggningar och större industrier vars ändringar visat sig kräva full prövning.","affects":"Noden B30-GC140 samt nedströms B30-C150 (föreläggandespår) och hela tillståndsspåret från B30-060 och B30-070 som måste aktiveras; anmälningsnoderna B30-C170 och B30-END70 faller bort.","impact":"Obligatorisk omställning till tillståndsprocess med ny MKB och samråd, förlorad möjlighet att starta på anmälan, viteshot och försening i storleksordningen år.","mitigation":"Bedöm BMP-risken redan vid spårvalet i B30-G030, överväg frivillig ansökan (9 kap. 6 b §) i stället för anmälan vid gränsfall, och håll ett uppgraderingsbart underlag som snabbt kan omvandlas till ansökningshandlingar.","source_refs":["FMH","MB","EXT: Naturvårdsverket, Anmälningsärenden https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/tillsyn-enligt-miljobalken/genomfora-tillsyn/anmalningsarenden/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GC140-02","node_id":"B30-GC140","chart_key":"B30","node_label":"Kan betydande miljöpåverkan antas?","title":"BMP-bedömningen blir överklagandets måltavla","category":"Överklagande & rättsprocess","trigger":"Beslutet om betydande miljöpåverkan – oavsett riktning – överklagas av verksamhetsutövaren som anser bedömningen felaktig, eller av sakägare och miljöorganisationer som anser att påverkan underskattats.","description":"BMP-beslutet är ett enskilt beslut som kan angripas rättsligt, och bedömningen av 'betydande miljöpåverkan' är en normativ prognosfråga med utrymme för olika meningar. Överklagas föreläggandet om tillståndsansökan står projektet still i väntan på länsrättens och eventuellt kammarrättens prövning. Överklagas i stället en negativ bedömning kan starttiden för verksamheten bli osäker även om myndigheten gett klartecken, eftersom utgången kan upphäva underrättelsen.","motivation":"Att myndighetsbeslut i anmälningsärenden kan överklagas framgår av FMH:s bestämmelser om överklagande, och tvister om bedömningen av betydande miljöpåverkan förekommer i förvaltningsrättslig praxis. Precedensen är inte den enskilda domen utan strukturen: ett skönsmässigt prognosbeslut med stora ekonomiska konsekvenser är en klassisk överklagandemagnet i svensk miljöförvaltning.","affects":"Noden B30-GC140 samt nedströms B30-C150, B30-GC160 och B30-C170.","impact":"Förvaltningsrättslig prövning i ett till två led, osäkerhet om startbeskedets bestånd och försening av både anmälnings- och tillståndsspår.","mitigation":"Säkerställ att underlaget till BMP-bedömningen är tekniskt robust och transparent, motivera egen ståndpunkt skriftligt gentemot myndigheten, och bedöm överklaganderisken från berörda sakägare vid valet av spår.","source_refs":["FMH","MB"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B30-GC160-01","node_id":"B30-GC160","chart_key":"B30","node_label":"Anmälningsutfall","title":"Försiktighetsmått och förbud överklagas","category":"Överklagande & rättsprocess","trigger":"Tillsynsmyndigheten beslutar om förbud eller föreläggande om försiktighetsmått som verksamhetsutövaren anser vara oproportionerliga eller tekniskt omöjliga, och beslutet överklagas.","description":"Anmälningsutfallet enligt FMH 26 d och 27–27 c §§ kan bli förbud, försiktighetsmått, tillståndsföreläggande eller underrättelse om att ingen åtgärd vidtas. Försiktighetsmått kan vara vitesförsatta och långtgående – exempelvis krav på reningsteknik eller driftbegränsningar – och eftersom de inte vinner rättskraft kan myndigheten skärpa dem löpande. Ett överklagande binder projektet i förvaltningsprocess och skapar osäkerhet om vilka villkor som faktiskt ska gälla under bygg- och uppstartsfasen.","motivation":"Regeringen framhåller i prop. 2023/24:152 att beslut om försiktighetsmått saknar rättskraft och att tillsynsmyndigheten kan återkomma med nya krav – en pågående, inte engångs-, risk. Att försiktighetsmåttsförelägganden överklagas är vanligt i kommunal miljötillsyn, särskilt när kostnaden för åtgärderna är betydande.","affects":"Noden B30-GC160 samt nedströms B30-C150 och B30-C170, där startkraven hänger på utfallet.","impact":"Rättsprocess om åtgärdskraven, osäkra driftsvillkor under överklagandetiden och risk för skärpta krav även efter det att verksamheten startat.","mitigation":"Förhandla om försiktighetsmåttens utformning innan beslut, visa teknisk och ekonomisk proportionalitet, och överväg om en frivillig tillståndsansökan ger ett stabilare rättsligt läge än att driva verksamhet på löpande försiktighetsmått.","source_refs":["FMH","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GC160-02","node_id":"B30-GC160","chart_key":"B30","node_label":"Anmälningsutfall","title":"Underrättelse om 'ingen åtgärd' ger falsk trygghet","category":"Rättslig osäkerhet","trigger":"Verksamhetsutövaren tolkar myndighetens underrättelse att ingen åtgärd avses vidtas som ett slutgiltigt godkännande och investerar på den grunden – trots att underrättelsen saknar rättskraft.","description":"När tillsynsmyndigheten beslutar att inte vidta någon åtgärd med anledning av anmälan är detta bara en ståndpunkt för tillfället. Myndigheten kan vid nya omständigheter – förändrad teknikbedömning, klagomål, ny kunskap om farligheter – ta upp ärendet på nytt och meddela försiktighetsmått eller tillståndsföreläggande. Verksamheter som investerat tungt på en underrättelse om ingen åtgärd står utan det rättsskydd som ett tillstånd skulle ha gett, och omprövningsgrunderna i 24 kap. miljöbalken är inte tillämpliga som spärr eftersom inget tillstånd finns.","motivation":"Prop. 2023/24:152 är explicit: 'En anmälan av en miljöfarlig verksamhet ... medför inte rättskraft. Tillsynsmyndigheten kan göra bedömningen att en anmälan inte leder till någon åtgärd ... Tillsynsmyndigheten kan även besluta om föreläggande av försiktighetsmått. Ett sådant beslut har ingen rättskraft.' Detta är en av de mest förbisedda strukturella riskerna i anmälningsspåret.","affects":"Noden B30-GC160 samt nedströms B30-C170 (start) och B30-END70; berör indirekt framtida omprövnings- och föreläggandespår från B30-O100.","impact":"Investeringar utan varaktigt rättsskydd, möjlighet för myndigheten att när som helst återöppna ärendet med nya krav, och försämrad förhandlingsposition vid framtida tillståndsbehov.","mitigation":"Väg in rättskraftsbristen i investeringsbeslutet, överväg frivillig ansökan enligt 9 kap. 6 b § för verksamheter med lång avskrivningstid, och upprätthåll drift- och utsläppsdata som visar att verksamheten fortlöpande håller sig inom anmäld omfattning.","source_refs":["FMH","MB","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-GO110-01","node_id":"B30-GO110","chart_key":"B30","node_label":"Vem initierar och på vilken grund?","title":"Talerätt och behörighet tvistas vid omprövning","category":"Rättslig osäkerhet","trigger":"Det är oklart om den myndighet som vill initiera omprövningen finns i 24 kap. 7 §:s uppräkning, om kommunen är tillståndsmyndighet och därmed själv kan ta upp frågan, eller om tillståndshavarens ansökan enligt 24 kap. 13 § hamnat hos rätt instans.","description":"Omprövning kan initieras av tillståndshavaren eller av de myndigheter som räknas upp i 24 kap. miljöbalken, och när en statlig myndighet eller kommun är tillståndsmyndighet kan den självmant ta upp frågan. Behörighetsfrågorna är differentierade efter tillståndsslag, prövningsinstans och vem som agerar, och fel initierare eller fel mottagarinstans kan leda till avvisning. I praktiken uppstår tvister när tillsynsmyndigheter som inte är tillståndsmyndighet försöker driva omprövning, eller när ansökningar om villkorslättnad enligt 24 kap. 13 § lämnas till fel instans.","motivation":"SOU 2014:35 beskriver systemen: omprövning i mark- och miljödomstol initieras av tillståndshavaren eller någon av myndigheterna i 24 kap. 7 §, medan statliga tillståndsmyndigheter och kommuner kan ta upp frågan självmant. Den differentierade behörighetsbilden är en vedertagen felkälla i svensk omprövningspraxis.","affects":"Noden B30-GO110 samt nedströms B30-O120 och B30-GO130 (instansvalet).","impact":"Avvisning på behörighetsgrunder, förlorad tid och kostnader för omgjord ansökan, samt fördröjd reglering av de miljöfrågor omprövningen avsåg att lösa.","mitigation":"Gör en uttrycklig behörighets- och talerättsanalys mot 24 kap. 7, 11 och 13 §§ innan initiativ tas, och låt parterna skriftligt bekräfta vem som är tillståndsmyndighet för det aktuella tillståndet.","source_refs":["MB","EXT: SOU 2014:35 I vått och torrt https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/i-vatt-och-torrt-forslag-till-andrade-vattenrattsliga_h2b335/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GO110-02","node_id":"B30-GO110","chart_key":"B30","node_label":"Vem initierar och på vilken grund?","title":"Återkallelsehotet hänger över driften","category":"Rättslig osäkerhet","trigger":"Tillsynsmyndigheten misstänker att tillståndshavaren grovt åsidosatt villkor eller bestämmelser, vilket aktiverar återkallelsegrunden i 24 kap. 3 § miljöbalken.","description":"Återkallelse är det ingripande yttersta steget: ett tillstånd kan återkallas om tillståndshavaren grovt åsidosatt villkor eller förfarit menligt, och grunden utlöses ofta av tillsynsfynd, utsläppsöverträdelser eller bristande kontrollprogram. Redan hotet om återkallelse skapar en pressad situation där driften måste försvaras samtidigt som det juridiska läget är osäkert, och en påbörjad återkallelseprocess kan förlamra investerings- och avtalsbeslut i flera år. Gränsen för 'grov' åsidosättelse är praxisbildad och omdiskuterad.","motivation":"24 kap. 3 § miljöbalken är ett reellt verktyg i tillsynsmyndigheternas arsenal; SOU 2022:33 behandlar förhållandet mellan återkallelse och mildare ingripanden, och tillsynspraxis visar att återkallelse aktualiseras i allvarliga villkorsöverträdelser, särskilt vid upprepade utsläppsöverträdelser eller underlåten kontroll. För kapitalintensiva verksamheter är hotet existentiellt även när det sällan fullföljs.","affects":"Noden B30-GO110 samt nedströms B30-O120 och B30-GO130, och direkt verksamhetens drift som kan inskränkas under processen.","impact":"Risk för förlorat tillstånd och driftstopp, flerårig rättsprocess, försämrad finansierings- och försäkringsbild under pågående ärende.","mitigation":"Upprätthåll dokumenterad villkorsföljsamhet och fungerande kontrollprogram, agera omedelbart och transparent på tillsynsavvikelser, och föregrip återkallelse genom frivilliga åtgärds- och villkorsförslag.","source_refs":["MB","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-GO110-03","node_id":"B30-GO110","chart_key":"B30","node_label":"Vem initierar och på vilken grund?","title":"Äldre tillstånd saknar tydlig tillståndsmyndighet","category":"Myndighetskapacitet & handläggning","trigger":"Tillståndet meddelades under äldre lagstiftning av länsstyrelse, miljödomstol eller koncessionsjury, och det är omtvistat vilken nuvarande instans som ska hantera omprövningen.","description":"Behörigheten vid omprövning följer i huvudsak det ursprungliga tillståndet och motsvarande tillståndsslag, men för beslut från tiden före miljöbalken – naturvårdslagen, miljöskyddslagen, än äldre regimer – kan kedjan av övergångsbestämmelser vara svår att följa. Om det ursprungliga beslutet dessutom klassificerats om genom ändringar i miljöprövningsförordningen över tid, kan rätt instans (MPD, länsstyrelse eller MMD) behöva härledas ur flera historiska regelverk. Tvisten måste lösas innan sakprövningen ens kan börja.","motivation":"SOU 2022:33 ägnar ett eget avsnitt åt hur behörigheten för omprövning knyts till ursprunglig tillståndsmyndighet och tillståndsslag, och visar att övergångsproblematiken är reell för det stora beståndet av äldre tillstånd. Noden B30-010:s inventeringsrisk slår igenom direkt här: utan identifierade originalbeslut kan behörighetsfrågan inte besvaras.","affects":"Noden B30-GO110 samt uppströms B30-010 (tillståndshistoriken) och nedströms B30-GO130 (instansvalet).","impact":"Fördröjd process medan behörigheten klarläggs, risk för fel instans och avvisning, samt osäkerhet om vilka handläggningsregler som gäller.","mitigation":"Spåra originalbeslutet och dess klassificering genom samtliga övergångsbestämmelser, inhämta rådgivande utlåtande från berörda instanser, och dokumentera behörighetskedjan i själva omprövningsframställan.","source_refs":["MB","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GO130-01","node_id":"B30-GO130","chart_key":"B30","node_label":"Behörig omprövningsinstans?","title":"Instansvalet följer en tillståndskedja ingen längre överblickar","category":"Rättslig osäkerhet","trigger":"Behörigheten ska följa ursprungligt och motsvarande tillståndsslag, men verksamhetens kod har ändrats genom successiva revisioner av miljöprövningsförordningen så att 'motsvarande' tillståndsslag är omtvistat.","description":"Om ett äldre länsstyrelsetillstånd gäller en verksamhet som i dag skulle prövats som A-verksamhet i domstol – eller tvärtom – måste instansvalet härledas ur vad som är 'motsvarande' tillstånd i dagens klassificering. När MPF:s sektorskapitel reviderats flera gånger sedan tillståndet meddelades kan denna översättning vara genuint osäker. Fel instansval leder till avvisning eller behörighetsprövning som skjuter sakfrågan på framtiden, samtidigt som miljöfrågan som motiverade omprövningen förblir oreglerad.","motivation":"SOU 2022:33 beskriver att behörigheten vid efterföljande prövning knyts till ursprungligt tillstånd och motsvarande tillståndsslag – en konstruktion som förutsätter att klassificeringen är stabil över tid, vilket den inte är. Varje revidering av miljöprövningsförordningen skapar potentiella behörighetsglapp för det äldre tillståndsbeståndet.","affects":"Noden B30-GO130 samt uppströms B30-010 och B30-G020 (klassificerings- och historikfrågorna) och nedströms B30-ENDO.","impact":"Avvisning eller behörighetsöverlämnande, förlorad process tid och fortsatt oreglerat villkorläge för verksamheten.","mitigation":"Gör en uttrycklig 'motsvarighetsanalys' som översätter det ursprungliga tillståndsslaget till dagens MPF-koder, och begär rådgivande behörighetsbesked från aktuella instanser före inlämning.","source_refs":["MB","MPF","MPD","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GO130-02","node_id":"B30-GO130","chart_key":"B30","node_label":"Behörig omprövningsinstans?","title":"Miljöprövningsmyndigheten tar över omprövningar mitt i reformen","category":"Politisk & policyrisk","trigger":"Från 2027-07-01 övertar Miljöprövningsmyndigheten efterföljande prövningar för tillstånd som motsvarande skulle ges av myndigheten, vilket flyttar omprövningsärenden från delegationer och länsstyrelser till en ny organisation.","description":"Omprövningsinstansvalet i S1 påverkas direkt av myndighetsreformen: ärenden om omprövning, villkorsändring och återkallelse för B-tillstånd flyttas till Miljöprövningsmyndigheten. För pågående omprövningar uppstår frågor om överföring, fortsatt handläggning och om nya myndighetens rutiner ska tillämpas på halvfärdiga ärenden. För tillståndshavare är det dessutom osäkert hur den nya myndigheten kommer att prioritera obligatoriska omprövningar och vilken praxis som byggs upp – en nystartad myndighet saknar etablerad beslutstradition.","motivation":"Riksdagens beslut 2026 om Miljöprövningsmyndigheten (betänkande 2025/26:MJU24, SFS 2026:1442–1444) fastställer övertagandet den 1 juli 2027, och regeringen har gett länsstyrelserna förberedelseuppdrag för ärendeöverföring (KN2026/00526) – ett erkännande av att övergången är riskfylld. Erfarenheten från tidigare svenska myndighetsbildningar visar att beslutspraxis tar flera år att stabilisera.","affects":"Noden B30-GO130 samt hela omprövningsspåret B30-O100–B30-ENDO och anmälnings- och tillståndsärenden som pågår vid övergången.","impact":"Handläggningsavbrott vid överföring, osäker praxis hos ny myndighet, och fördröjning av omprövningsbeslut som hänger ihop med drift- och investeringsbeslut.","mitigation":"Kartlägg om verksamhetens tillstånd omfattas av övertagandet, säkra att ärendets handlingar är kompletta och överförbara, och följ Miljöprövningsmyndighetens föreskrifter och vägledningar från start.","source_refs":["SFS2026_1442","SFS2026_1443","NEW_AUTH","EXT: Riksdagen, Ny myndighet för miljöprövning https://data.riksdagen.se/fil/E10BD546-3340-455A-82D5-68C77C6C960D"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-GO130-03","node_id":"B30-GO130","chart_key":"B30","node_label":"Behörig omprövningsinstans?","title":"Omprövningsmål konkurrerar med vattenkraftens återprövning om domstolskapacitet","category":"Myndighetskapacitet & handläggning","trigger":"Mark- och miljödomstolarnas kapacitet belastas av det stora beståndet omprövningsmål – inte minst vattenkraftens återprövning för moderna miljövillkor – vilket skjuter miljöfarliga verksamheters omprövningar längre fram i tiden.","description":"Omprövningar som hör hemma i domstol hamnar i samma kösystem som övriga miljömål. Vattenkraftens nationella återprövningsplan genererar många och tekniskt tunga mål som binder domstolsresurser under lång tid, och medeltiden för miljömål i mark- och miljödomstol är redan lång. En omprövning av ett industriellt tillstånd kan därmed dröja år innan avgörande, under vilken tid verksamheten drivs på gamla villkor eller under hot om kommande skärpningar – en osäkerhet som försvårar investeringsbeslut.","motivation":"Naturvårdsverkets statistik visar en medianhandläggningstid på 474 dagar för tillståndsmål om miljöfarlig verksamhet i första instans 2024, och omprövningsmål är ofta tyngre. Havs- och vattenmyndighetens nationella plan innebär en flerårig, domstolsbunden återprövningsvåg för vattenkraften som drabbar samma fem domstolar.","affects":"Noden B30-GO130 samt B30-ENDO och alla domstolsbundna mål i delprocesserna B30 och B40.","impact":"Flerårig väntan på omprövningsbeslut, förlängd osäkerhet om villkorsläget och försening av teknikinvesteringar som hänger på utgången.","mitigation":"Initiera omprövning tidigt i stället för att invänta tvingande initiativ, överväg tillståndshavarstyrda ansökningar om villkorsändring där det passar, och planera investeringar med scenarier för olika omprövningsutfall.","source_refs":["MB","MMDL","EXT: Naturvårdsverket, Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/","EXT: Havs- och vattenmyndigheten, Nationella planen (NAP) https://www.havochvatten.se/arbete-i-vatten-och-energiproduktion/vattenkraftverk-och-dammar/nationella-planen-nap/fragor-och-svar-om-den-nationella-planen-nap.html"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B30-O100-01","node_id":"B30-O100","chart_key":"B30","node_label":"Omprövningsgrund initierad","title":"Miljökvalitetsnormsöverträdelse tvingar fram omprövning","category":"Extern händelse","trigger":"Övervakning visar att en miljökvalitetsnorm överträds och att verksamheten 'med någon betydelse' medverkat till överträdelsen, vilket aktiverar omprövningsgrunden i 24 kap. 5 § miljöbalken.","description":"Omprövning enligt 24 kap. 5 § förutsätter att normen faktiskt överträtts och att verksamhetens bidrag inte är bagatellartat – men båda leden är tolkningsöppna. I luft- och vattenrecipienter med flera bidragsgivare blir fördelningen av 'betydelse' en teknisk och juridisk tvistefråga. När grunden väl anses föreligga kan myndigheten eller tillståndshavaren tvingas in i en omprövning som omfattar villkorsändringar eller i värsta fall återkallelse, med alla konsekvenser det får för driften.","motivation":"Miljösamverkan Sveriges handläggarstöd för omprövning beskriver precis denna tolkningsproblematik: lagtexten kräver faktisk överträdelse och mer än bagatellartat bidrag, vilket i praktiken kräver bidragsfördelande beräkningar. Normer som skärpts på EU-nivå gör att fler verksamheter löpande hamnar i detta läge utan att ha ändrat sin drift.","affects":"Noden B30-O100 samt nedströms B30-GO110, B30-O120 och B30-GO130; påverkar även befintliga villkor och driften under prövningen.","impact":"Tvingande omprövningsprocess, risk för skärpta villkor eller begränsad drift, och osäkerhet om verksamhetens långsiktiga tillståndsstatus.","mitigation":"Bedriv egen recipient- och utsläppsövervakning som kan visa verksamhetens andel av normläget, följ normskärpningar proaktivt och simulera deras effekt på tillståndet, och överväg frivillig villkorsmodernisering före tvingande omprövning.","source_refs":["MB","EXT: Miljösamverkan Sverige, Handläggarstöd för omprövning av vattenverksamheter https://www.miljosamverkansverige.se/wp-content/uploads/Handlaggarstod-for-omprovning-av-vattenverksamheter.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B30-O100-02","node_id":"B30-O100","chart_key":"B30","node_label":"Omprövningsgrund initierad","title":"Reformdriven omprövningsplikt träffar äldre tillstånd","category":"Politisk & policyrisk","trigger":"Lagstiftningsreformer inför eller utvidgar obligatorisk omprövning av äldre tillstånd för att förse verksamheter med moderna miljövillkor, och verksamhetens tillstånd omfattas av det nya åtgärdsprogrammet.","description":"Staten har de senaste åren byggt upp en politik av obligatoriska omprövningar – vattenkraftens återprövning för moderna miljövillkor enligt den nationella planen är förebilden – och SOU 2022:33 föreslog motsvarande obligatorisk omprövning av äldre tillstånd för miljöfarlig verksamhet. För innehavare av gamla tillstånd innebär detta att prövningen inte längre är en engångshändelse utan en återkommande cyklisk exponering: BAT-utveckling och skärpta normer kan när som helst göra ett gällande tillstånd till omprövningsobjekt, oavsett hur väl villkoren följts.","motivation":"SOU 2022:33 'Om prövning och omprövning' föreslog uttryckligen att obligatorisk omprövning för moderna miljövillkor ska införas för tillståndspliktiga miljöfarliga verksamheter prövade av länsstyrelse eller mark- och miljödomstol. Vattenkraftens nationella plan (Havs- och vattenmyndigheten) visar hur en sådan återprövningsregim fungerar i praktiken: sektorsvis, domstolsbunden och mångårig.","affects":"Noden B30-O100 samt hela omprövningsspåret B30-GO110–B30-GO130 och indirekt alla befintliga tillstånd som hanteras i B30-010.","impact":"Planeringsosäkerhet för kapitalintensiva verksamheter, behov av nya investeringar i reningsteknik, och resursbindning i fleråriga domstolsprocesser.","mitigation":"Bevaka genomförandet av SOU 2022:33-förslagen och tidplaner för obligatorisk omprövning, modernisera villkor frivilligt i god tid före tvingande prövning, och bygg in BAT-följsamhet i verksamhetens teknikplanering.","source_refs":["MB","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/","EXT: Havs- och vattenmyndigheten, Nationella planen (NAP) https://www.havochvatten.se/arbete-i-vatten-och-energiproduktion/vattenkraftverk-och-dammar/nationella-planen-nap/fragor-och-svar-om-den-nationella-planen-nap.html"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B30-O120-01","node_id":"B30-O120","chart_key":"B30","node_label":"Fastställ omprövningsram och underlag","title":"Sambandskravet begränsar vilka villkor som får röras","category":"Rättslig osäkerhet","trigger":"Vid omprövning får endast villkor som har samband med omprövningsgrunden ändras, och parterna tvistar om vilka av tillståndets villkor som omfattas av ramen.","description":"Omprövningsramen avgränsar vilka bestämmelser och villkor som får tas upp. Enligt praxis och förarbeten krävs att ett villkor som ska ändras har samband med den grund på vilken omprövningen sker – en grund om utsläpp till luft öppnar inte automatiskt för ändring av vattenvillkor. Både myndigheter som vill dra in fler villkor och tillståndshavare som vill stänga ute dem har incitament att tvista om ramen, och en felaktigt dragen ram kan fälla hela omprövningsbeslutet vid överklagande.","motivation":"SOU 2014:35 sammanfattar förarbetsläget: 'En förutsättning för att villkor i grundtillståndet ska få ändras är att de har ett samband med ändringen.' Sambandskravet är återkommande i omprövningspraxis och har i flera mål avgjort vilka delar av ett tillstånd som stått till prövningens förfogande.","affects":"Noden B30-O120 samt nedströms B30-GO130 och det slutliga omprövningsutfallet vid B30-ENDO.","impact":"Delvis ogiltigförklarade omprövningsbeslut, återförvisning efter överklagande, och villkor som trots processen lämnas oförändrade med kvarstående miljö- eller driftproblem.","mitigation":"Kartlägg villkor för villkor vilket samband varje föreslagen ändring har med omprövningsgrunden, och formulera ramavgränsningen explicit i ansökan eller beslutet så att den håller vid överklagande.","source_refs":["MB","EXT: SOU 2014:35 I vått och torrt https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/i-vatt-och-torrt-forslag-till-andrade-vattenrattsliga_h2b335/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-O120-02","node_id":"B30-O120","chart_key":"B30","node_label":"Fastställ omprövningsram och underlag","title":"Tekniskt underlag för årtionden gammal anläggning saknas","category":"Underlagsbrist & data","trigger":"Omprövningen kräver aktuella data om processer, utsläpp och BAT-nivå, men anläggningens tekniska dokumentation är föråldrad, spridd mellan ägargenerationer eller aldrig upprättad i modern form.","description":"En komplett omprövningsram kräver förutom villkorshistorik ett tekniskt underlag som håller för jämförelse mot dagens bästa möjliga teknik och moderna villkorsnivåer. För anläggningar byggda på 1960–1980-talen saknas ofta dimensionerande data, utsläppsmätserier och processbeskrivningar i detalj som en modern prövning kräver. Att rekonstruera underlaget kan kräva omfattande mätprogram och utredningar som tar flera säsonger, särskilt om recipientdata eller grundvattenförhållanden måste etableras från noll.","motivation":"Erfarenheten från vattenkraftens återprövning enligt nationella planen visar att underlagsbrist för gamla anläggningar är den enskilt största fördröjningsfaktorn i obligatoriska omprövningar; motsvarande problematik drabbade Cementa i Slite, där bristen på grundvattendata fällde ansökan om fortsatt drift 2021. 22 kap. 1 d och 2 a §§ miljöbalken ställer dessutom formella krav på underlagets koppling till villkorshistoriken.","affects":"Noden B30-O120 samt nedströms B30-GO130 och B30-ENDO; underlagsarbetet kan även kräva nytt fältarbete kopplat till B20-liknande insatser.","impact":"Fleråriga mätprogram och utredningar innan prövningen kan slutföras, risk för avslag på grund av otillräckligt underlag, och osäkra villkor under mellantiden.","mitigation":"Påbörja teknisk dokumentationsinsamling och mätprogram långt innan omprövningstidpunkten, rekonstruera processdata ur driftjournaler och leverantörsarkiv, och förhandla om etappvis underlagslämning med prövningsinstansen.","source_refs":["MB","EXT: Byggföretagen, Cementkrisen https://byggforetagen.se/cementkrisen/","EXT: Havs- och vattenmyndigheten, Nationella planen (NAP) https://www.havochvatten.se/arbete-i-vatten-och-energiproduktion/vattenkraftverk-och-dammar/nationella-planen-nap/fragor-och-svar-om-den-nationella-planen-nap.html"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-START-01","node_id":"B30-START","chart_key":"B30","node_label":"9 kap.-variant initierad","title":"Tillståndsmatrisen missar 9 kap.-plikten","category":"Underlagsbrist & data","trigger":"Tillståndsmatrisen i förstudien (B10/B20) tolkar verksamheten som fallande utanför miljöfarlig verksamhet eller som ren anmälningspliktig, trots att den i själva verket är tillståndspliktig enligt 9 kap. miljöbalken.","description":"Hela delprocessen B30 initieras först när tillståndsmatrisen visar att projektet omfattar miljöfarlig verksamhet eller en ändring av sådan. Om klassificeringen i uppströms noder är felaktig – till exempel för att verksamhetskoderna i miljöprövningsförordningen tolkats snävt, eller för att en mindre ändring av en befintlig anläggning inte identifierats som anmälnings- eller tillståndspliktig – startar spåret aldrig. Felet upptäcks ofta först vid tillsyn, klagomål från allmänheten eller i samband med en senare ansökan, och kan då ha lett till att verksamhet bedrivits utan lagligt stöd.","motivation":"Att driva tillståndspliktig miljöfarlig verksamhet utan tillstånd är straffbelagt enligt 29 kap. miljöbalken och utgör ett återkommande tillsynsproblem; Naturvårdsverkets vägledning om anmälningsärenden beskriver att tillsynsmyndigheter kan förelägga tillståndsansökan när en verksamhet kan antas medföra betydande miljöpåverkan. Gränsdragningen mellan tillståndsplikt, anmälningsplikt och fri verksamhet är en känd tolkningssvårighet som regeringen i proposition 2023/24:152 själv pekat ut som oklar och i behov av tydliggörande.","affects":"Noden B30-START samt hela delprocessen B30 nedströms (B30-010 och vidare); vid utebliven initiering även B10 och B20 som får felaktiga förutsättningar.","impact":"Olaglig drift, risk för förelägganden och rättsliga påföljder, omstart av processen med full tillståndsansökan i efterhand och betydande fördröjning av projektet.","mitigation":"Låt juridisk sakkunskap dubbelkontrollera tillståndsmatrisens klassificering mot miljöprövningsförordningens sektorskapitel, dokumentera avsteg från tillståndsplikt med motivering, och inhämta tillsynsmyndighetens syn i tveksamma fall innan spårval låses.","source_refs":["MB","MPF","FMH","EXT: Regeringens proposition 2023/24:152 Steg på vägen mot en mer effektiv miljöprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-010-01","node_id":"B40-010","chart_key":"B40","node_label":"Avgränsa vattenåtgärden","title":"Salami-slicing: åtgärden delas upp och undgår prövning","category":"Rättslig osäkerhet","trigger":"Projektägaren avgränsar prövningsobjektet för snävt, t.ex. genom att söka för huvudåtgärden men inte för tillfälliga arbeten, schaktmassor eller följdåtgärder.","description":"Enligt 11 kap. 2–6 §§ MB ska fysiskt och funktionellt sammanhängande arbeten bedömas tillsammans. Om avgränsningen delar upp ett i praktiken sammanhängande projekt i flera mindre åtgärder kan varje del verka ofarlig, medan den samlade effekten hade krävt tillstånd. Tillsynsmyndigheten eller en motpart kan senare hävda att uppdelningen var konstlad och att tillståndsplikt förelåg. Det kan leda till förbud, föreläggande att söka tillstånd i efterhand och i värsta fall straffrättsligt ansvar för olaglig vattenverksamhet. Även välmenande snäva avgränsningar kan slå tillbaka om domstolen vid överklagande vidgar prövningsobjektet.","motivation":"Praxis om prövningsobjektets avgränsning är strikt inom miljöbalken; i prövningen av olagliga vattenanläggningar (t.ex. MÖD:s avgöranden om lagligförklaring av dammar, bl.a. mål M 455-20, dom 2021-03-19) framhålls att hela anläggningen och dess funktion ska bedömas samlat. Välgrundat rättsligt resonemang kopplat till 11 kap. 2–6 §§ MB.","affects":"B40-010 samt B40-G020 och B40-G070; felaktig avgränsning smittar hela vägvalet nedströms till B40-P110/B40-P120.","impact":"Återförvisning eller omprövning, i efterhand påtvingad tillståndsprocess, möjliga vite och straffansvar samt förlorad trovärdighet inför myndigheter.","mitigation":"Dokumentera avgränsningsresonemanget skriftligt med kartor över samtliga arbeten inklusive tillfälliga och följdåtgärder. Ta in sakkunnig och håll tidig dialog med tillsynsmyndigheten om avgränsningen.","source_refs":["MB","EXT: MÖD mål M 455-20 dom 2021-03-19 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2021/m-455-20-dom-2021-03-19.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-010-02","node_id":"B40-010","chart_key":"B40","node_label":"Avgränsa vattenåtgärden","title":"Tillfälliga arbeten och grundvattenbortledning faller utanför avgränsningen","category":"Underlagsbrist & data","trigger":"Byggskedets tillfälliga grundvattensänkning, spontningsinvallningar eller arbetsgropor betrak
