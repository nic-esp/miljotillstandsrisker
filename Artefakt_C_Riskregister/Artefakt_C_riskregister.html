ription":"Dispens från markavvattningsförbudet kräver särskilda skäl enligt 11 kap. 14 § MB, och förarbeten och vägledning slår fast att prövningen ska vara restriktiv: området ska i princip sakna betydelse från naturvårdssynpunkt. En avslagen dispens är ofta projektavgörande, eftersom tillstånd då inte kan meddelas överhuvudtaget. Dispensbeslutet kan dessutom överklagas av naturvårdsintressen, så även en beviljad dispens är osäker tills den vunnit laga kraft.","motivation":"MÖD 2007:11 visar att dispensprövningen leder till domstolsavgöranden om förbudets räckvidd, och Naturvårdsverkets vägledning betonar att dispens ska meddelas restriktivt; våtmarkernas ökande klimat- och naturvärde (SOU 2026:18) pekar mot skärpt restriktivitet. Källa: MÖD 2007:11 och Naturvårdsverket.","affects":"B40-M120 och B40-M130; vid avslag faller hela markavvattningsgrenen.","impact":"Projektstopp för avvattningsåtgärden, behov av omprojektering till lösning utan dikning och förlorade utredningskostnader.","mitigation":"Utred områdets naturvårdsvärden i förväg och bygg dispensansökan på att området saknar betydelse från naturvårdssynpunkt. Ha en färdig alternativlösning utan avvattning.","source_refs":["MB","EXT: MÖD 2007:11 https://lagen.nu/dom/mod/2007:11","EXT: SOU 2026:18 Odlingstorv och klimatet https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/odlingstorv-och-klimatet_heb318/html/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-M120-02","node_id":"B40-M120","chart_key":"B40","node_label":"Sök dispens från markavvattningsförbud","title":"Dispensbeslutet misstas vara ett tillstånd","category":"Rättslig osäkerhet","trigger":"Projektet påbörjar avvattningen efter beviljad dispens utan att ha sökt och fått markavvattningstillstånd.","description":"Dispensen upphäver bara förbudet – den ersätter aldrig tillståndsprövningen enligt 11 kap. 13 § MB. Missförståndet är begripligt eftersom båda besluten fattas av länsstyrelsen, men konsekvensen av att slå samman dem är att arbeten utförs utan lagligt tillstånd. Tillsynen kan då förbjuda fortsatt arbete och kräva återställning trots att dispens faktiskt beviljats. Besluten måste hållas isär i tidplanen: först dispens, sedan ansökan och tillstånd.","motivation":"Naturvårdsverkets vägledning om markavvattning slår uttryckligen fast att dispens inte ersätter tillstånd, och samma princip bekräftas i SOU 2026:18:s genomgång av regelsystemet. Källa: Naturvårdsverket – Markavvattning.","affects":"B40-M120 och B40-M130 samt hela genomförandet i förbudsområde.","impact":"Förbud mot pågående arbete, återställningskrav och tvungen tillståndsprocess mitt i genomförandet.","mitigation":"Inför två tydliga milstolpar i tidplanen – dispensbeslut och tillståndsbeslut – med startspärr tills båda föreligger och har vunnit laga kraft.","source_refs":["MB","FVV","EXT: Naturvårdsverket – Markavvattning https://www.naturvardsverket.se/vagledning-och-stod/branscher-och-verksamheter/markavvattning/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-M130-01","node_id":"B40-M130","chart_key":"B40","node_label":"Ge in markavvattningsansökan","title":"Länsstyrelsens handläggningskapacitet för markavvattning är begränsad","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen har få specialister på markavvattning och ärendet köar bakom tillsyn, Natura 2000 och vattenkraftsomprövning.","description":"Markavvattningsansökningar är relativt sällsynta och kräver särskild kompetens i vattenrätt och hydrologi som inte alla länsstyrelser har tillgänglig. Handläggningstiden blir därför ofta lång och svårprognostiserad, och det finns ingen domstols bakre gräns som disciplinerar myndigheten på samma sätt som i ansökningsmål. För jordbruks- och skogsprojekt med säsongbundna arbeten kan en vintern försvinnas medan ansökan ligger i kö.","motivation":"Välgrundat resonemang: länsstyrelsernas resurs- och kompetensläge i vattenärenden är återkommande belyst i myndigheternas egna årsredovisningar och i Naturvårdsverkets handläggningstidsstatistik; sällsynta ärendetyper som markavvattning drabbas mest när specialister saknas. Källa: Naturvårdsverket – Handläggningstid för miljötillståndsprövning.","affects":"B40-M130 och nedströms B40-GM140, B40-M150/B40-M160 samt B40-ENDM.","impact":"Lång och oförutsägbar handläggningstid med förlorade arbetsfönster som följd.","mitigation":"Lämna komplett ansökan för att undvika kompletteringsköer, håll löpande kontakt med handläggaren och planera genomförandet med minst ett års marginal.","source_refs":["FVV","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-M130-02","node_id":"B40-M130","chart_key":"B40","node_label":"Ge in markavvattningsansökan","title":"Miljöbedömningen i markavvattningsansökan möter strängare krav på våtmarks- och klimatanalys","category":"Underlagsbrist & data","trigger":"Ansökans miljöbedömning saknar analys av våtmarkens naturvärden, klimatpåverkan från dränerad torvmark och effekter på vattenkvalitet nedströms.","description":"Markavvattning berör ofta våtmarker och organogen mark där kunskapsläget har skärpts: dränering av torvmarker ger växthusgasutsläpp, och avvattning påverkar vattenkvalitet och näringsläckage i recipienten. En ansökan byggd på äldre analysnivå – bara lokal avvattningseffekt – möter numera förväntningar på klimat- och recipientanalys. Bristerna leder till kompletteringskrav eller, vid överklagande, till att beslutet undermineras av nya kunskapslägen.","motivation":"SOU 2026:18 (Odlingstorv och klimatet) och Naturvårdsverkets omprövningsvägledning för markavvattning visar att klimat- och våtmarksfrågorna nu är centrala i prövningen; markavvattning kan enligt 24 kap. MB omprövas med hänsyn till nya miljöförhållanden. Källa: SOU 2026:18 och Naturvårdsverket.","affects":"B40-M130 och B40-M150 samt i förlängningen risk för framtida omprövning av beviljat tillstånd.","impact":"Komplettering, fördröjning och ett tillstånd som kan omprövas tidigare än projektet räknat med.","mitigation":"Inkludera våtmarksinventering, klimatberäkning för organogen mark och recipientanalys i ansökan från början. Beskriv återvätning eller kompensationsåtgärder där det är relevant.","source_refs":["MB","FVV","EXT: SOU 2026:18 Odlingstorv och klimatet https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/odlingstorv-och-klimatet_heb318/html/","EXT: Naturvårdsverket – Omprövning och återkallelse av tillstånd till markavvattning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/omprovning-och-aterkallelse-av-tillstand-till-markavvattning/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-M150-01","node_id":"B40-M150","chart_key":"B40","node_label":"Länsstyrelsens prövning och beslut","title":"Beslutet överklagas av sakägare eller miljöorganisationer","category":"Överklagande & rättsprocess","trigger":"Berörda fastighetsägare, väghållare eller naturvårdsorganisationer överklagar länsstyrelsens markavvattningsbeslut till MMD.","description":"Markavvattningsbeslut berör per definition flera fastighetsägares intressen – både dem som vill ha avvattningen och dem som drabbas av sänkta grundvattennivåer eller ändrade flöden. Överklagande flyttar prövningen till MMD med domstolens ledtider, och frågan kan därefter gå vidare till MÖD. Beslutets villkor kan ändras väsentligt i överinstansen, och projektet kan inte räkna med att länsstyrelsens utgång består. Under överklagandet råder osäkerhet om arbetet får påbörjas.","motivation":"Välgrundat resonemang: markavvattningsbeslut är enligt MB 16 kap. överklagbara till MMD av sakägare och i vissa fall organisationer, och erfarenheten från överklagade naturvårds- och vattenbeslut (jfr strandskyddsdispenspraxis och vattenmål) visar att motståndet ofta aktiveras först vid beslutet. Källa: MB 16 kap. och LVV.","affects":"B40-M150 och B40-ENDM samt överlämningen till B70.","impact":"Fördröjning om ett till flera år genom domstolsinstanserna, osäkra startvillkor och möjlig ändring av beslutets villkor.","mitigation":"Förankra beslutet hos berörda fastighetsägare före beslutet, dokumentera avvägningen noggrant för att stå emot överklagande och invänta lagakraft före arbetsstart där det är möjligt.","source_refs":["MB","FVV","LVV","COURT_APPEAL"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-M150-02","node_id":"B40-M150","chart_key":"B40","node_label":"Länsstyrelsens prövning och beslut","title":"Villkoren för avvattningen blir tekniskt ogenomförbara eller kostsamma","category":"Teknisk komplexitet","trigger":"Länsstyrelsen förenar tillståndet med villkor om flödesbegränsning, återvätning, skyddszoner eller övervakning som projektet inte räknat med.","description":"Prövningen enligt 11 kap. 13 § MB väger avvattningens nytta mot skador på allmänna och enskilda intressen, och länsstyrelsen kan föreskriva villkor för att begränsa skadorna. Villkor om anläggningsdimensionering, skydd av kvarvarande våtmarksdelar eller långsiktig övervakning kan förändra projektets ekonomi och teknik i grunden. Ett tillstånd med tung villkorsbörda kan vara värt mindre än inget tillstånd, men att överklaga för att få villkoren lindrade kostar ytterligare tid.","motivation":"Välgrundat resonemang kopplat till MB 11 kap. 13 § och 16 kap.: villkorsprövningen är verktyget för intresseavvägningen, och erfarenheten från vattenärenden generellt visar att villkoren – inte själva ja/nej-frågan – ofta avgör projektets genomförbarhet (jfr vattenkraftens omprövning där villkoren om minsta vattenföring varit den centrala tvistefrågan).","affects":"B40-M150 och B40-ENDM samt genomförandeekonomin i B70.","impact":"Fördyrat eller tekniskt förändrat genomförande, eventuellt överklagande för villkorsändring med ytterligare fördröjning.","mitigation":"Föreslå själv realistiska villkor i ansökan, förankrade i underlaget, så att beslutet bygger på genomförbara nivåer. Simulera villkorskänslighet i projektets ekonomi före beslutet.","source_refs":["MB","FVV"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-M160-01","node_id":"B40-M160","chart_key":"B40","node_label":"MMD prövar överlämnat ärende","title":"Kostnadsfördelning och deltagandefrågor blåser upp processen","category":"Intressekonflikt & markåtkomst","trigger":"Fastighetsägare som ska delta i avvattningen bestrider nyttan, kostnadsfördelningen eller själva deltagandet, och väghållare dras in som part.","description":"När ärendet överlämnats till MMD prövas deltagande och kostnadsfördelning enligt LVV 3 kap. i tvistemålsliknande form. Varje deltagare kan bestrida sin andel, nyttan måste bevisas fastighet för fastighet, och väghållares inverkan kan vara tekniskt komplicerad att beräkna. Domstolen ska vid tillstånd fördela kostnaderna efter skälighet, vilket kräver ett omfattande bevisprogram. Processen kan därmed bli betydligt tyngre än själva miljöprövningen och domineras av privaträttsliga intressekonflikter.","motivation":"MÖD M 4651-18 exemplifierar precis denna dynamik: deltagandet och kostnadsfördelningen enligt LVV 3 kap. 1 §, inklusive väghållares ställning, var kärnfrågorna i målet. Kostnadsfördelningsregeln i LVV 7 kap. 10 § för överlämnade mål förstärker ekonomin i tvisten. Källa: MÖD M 4651-18 och LVV.","affects":"B40-M160 och B40-ENDM; utfallet avgör projektets ekonomi och genomförbarhet.","impact":"Lång och dyr domstolsprocess, osäker kostnadsbild och risk att deltagandet inte kan styrkas för nyckelfastigheter.","mitigation":"Bygg deltagande- och nyttoanalysen på fastighetsspecifika hydrogeologiska data, förhandla om samverkansavtal före överlämnandet och anlita sakkunnig för kostnadsfördelningsberäkning.","source_refs":["LVV","COURT_WV","EXT: MÖD M 4651-18 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2019/m-4651-18.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-M160-02","node_id":"B40-M160","chart_key":"B40","node_label":"MMD prövar överlämnat ärende","title":"Överlämnat ärende hamnar sist i MMD:s målkö","category":"Myndighetskapacitet & handläggning","trigger":"Ärendet kommer in i domstolen mitt i en pågående belastning av tillståndsmål och vattenkraftsomprövningar och prioriteras inte högre än nya ansökningar.","description":"Ett överlämnat markavvattningsärende har redan gått igenom länsstyrelsens handläggning, men det ger ingen förtur i domstolen. Ärendet konkurrerar om samma resurser som alla andra vattenmål, och den ackumulerade tiden blir summan av länsstyrelse- och domstolsledet. Länsstyrelsens bifogade yttrande hjälper domstolen men ersätter inte dess egen prövning med kungörelse och partshänseenden. Projektet kan därmed uppleva att ärendet 'börjar om' trots att det varit under handläggning i över ett år.","motivation":"Naturvårdsverkets handläggningstidsstatistik visar långa ledtider i MMD för vattenverksamhetsmål, och domstolarnas handläggarstöd bekräftar att överlämnade ärenden handläggs enligt samma ordning som ansökningsmål. Källa: Naturvårdsverket och Miljösamverkan Sverige.","affects":"B40-M160 och B40-ENDM samt hela markavvattningsspårets totala ledtid.","impact":"Ackumulerad fördröjning om flera år från ansökan till lagakraftvunnet beslut.","mitigation":"Räkna från början med det kombinerade ledet (länsstyrelse + MMD) i tidplanen. Förbered domstolsunderlaget redan under länsstyrelsehandläggningen så att överlämnandet blir en formalitet, inte en omstart.","source_refs":["LVV","COURT_WV","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-M160-03","node_id":"B40-M160","chart_key":"B40","node_label":"MMD prövar överlämnat ärende","title":"Tvångsrätt, ersättning och inlösen prövas i samma mål och gör domen oförutsägbar","category":"Rättslig osäkerhet","trigger":"Målet omfattar samtidigt tillstånd, deltagande, tvångsrätt enligt 28 kap. MB och ersättning eller inlösen enligt 31 kap. MB, med motstridiga yrkanden.","description":"De överlämnade ärendena är just de som innehåller de rättsligt tyngsta instituten: tvångsrätt att få använda annans mark, ersättning för skador och inlösen av fastigheter eller rättigheter. Dessa frågor har egna beviskrav och prejudikat, och domstolen måste avgöra dem sammanhängande med tillståndsfrågan. Kombinationen gör utfallet svårprognostiserat – ett tillstånd kan förenas med ersättningsnivåer som underminerar ekonomin, eller tvångsrätten kan avslås trots beviljat tillstånd. Förlusten av en enda delfråga kan fälla hela genomförandet.","motivation":"LVV 7 kap. 19 § samlar uttryckligen dessa institut i domstolens händer, och kostnadsfördelningsregeln i 7 kap. 10 § (kostnaderna fördelas mellan deltagarna, eller på sökanden vid avslag) visar att lagstiftaren förutsatt tunga, tvistiga mål; ersättningsreglerna i 31 kap. MB har en omfattande praxis. Källa: LVV och MB 28, 31 kap.","affects":"B40-M160 och B40-ENDM samt projektets ekonomi och rättighetsläge i B70.","impact":"Oförutsägbar dom där delutfall kan underminera hela projektet; vid avslag står sökanden normalt för kostnaderna.","mitigation":"Gör en scenarieanalys av möjliga domutfall per delfråga innan överlämnandet, och överväg att söka frivilliga lösningar (avtal, samverkan) som minskar antalet tvistiga institut i målet.","source_refs":["LVV","MB","COURT_WV"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-N110-01","node_id":"B40-N110","chart_key":"B40","node_label":"Upprätta anmälan","title":"Anmälningsunderlaget underdimensioneras i tron att 'det är bara en anmälan'","category":"Underlagsbrist & data","trigger":"Projektet satsar minimalt på kartor, ritningar och miljöeffektbeskrivning eftersom anmälan uppfattas som enklare än en ansökan.","description":"FVV 20 § och MBD 8–9 §§ ställer krav på att anmälan ska innehålla de uppgifter som behövs för att bedöma art, omfattning, sakägare och miljöeffekter. Ett tunt underlag leder nästan alltid till kompletteringskrav i B40-GN130, med loop tillbaka till denna nod. Dessutom är det anmälningsunderlaget som tillsynsmyndigheten använder för BMP-bedömningen – ett underlag som inte visar effekterna tydligt kan paradoxalt leda till ett positivt BMP-beslut (tillståndstvång) eftersom myndigheten inte kan utesluta betydande påverkan.","motivation":"HaV:s vägledning om anmälan av vattenverksamhet betonar att underlaget måste möjliggöra en fullständig bedömning, och erfarenheten från länsstyrelsernas handläggning visar att kompletteringskrav är regel snarare än undantag vid bristfälliga miljöeffektbeskrivningar. Källa: HaV – Anmälan om vattenverksamhet.","affects":"B40-N110 och loopen B40-GN130→B40-N110 samt B40-GN150 (BMP-beslutet).","impact":"Kompletteringsloopar som fördröjer start, eller ett onödigt tillståndsföreläggande som tvingar fram domstolsprocess.","mitigation":"Upprätta anmälan med samma struktur som ett tillståndsunderlag: tydliga kartor, åtgärdsbeskrivning, sakägarförteckning och egen BMP-analys. Låt sakkunnig kvalitetsgranska före inlämning.","source_refs":["FVV","MBD","HAV_WV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-N110-02","node_id":"B40-N110","chart_key":"B40","node_label":"Upprätta anmälan","title":"Sakägar- och fastighetsuppgifter i anmälan är inaktuella eller felaktiga","category":"Underlagsbrist & data","trigger":"Fastighetsförteckningen bygger på äldre registerutdrag och ägarbyten eller nya avstyckningar har hunnit ske.","description":"Anmälan ska ange berörda fastigheter och särskilt berörda, och dessa ska ges möjlighet att yttra sig vid remissen. Felaktiga uppgifter innebär att fel personer hörs – eller att verkligt berörda inte hörs alls – vilket kan ogiltigförklara myndighetens ställningstagande om det överklagas. I vattenmiljö är fiskerättigheter och samfällda rättigheter särskilt svårkartlagda. Registerutdrag blir dessutom snabbt inaktuella i projekt med lång framdrift.","motivation":"Välgrundat resonemang: rätten för särskilt berörda att höras är en processuell grundprincip i miljöbalken; fel i kungörelse och remiss är en vedertagen återförvisningsgrund i mark- och miljödomstolarnas praxis.","affects":"B40-N110, B40-N120 och B40-N140 (remissen) samt B40-N180 vid överklagande.","impact":"Återförvisning eller upphävt ställningstagande, förlängd process och skärpt lokal opinion.","mitigation":"Beställ färska registerutdrag nära inlämningen och komplettera med lokalkännedom om samfällda rättigheter. Dubbelkolla ägarläget vid varje processteg.","source_refs":["FVV","MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-N120-01","node_id":"B40-N120","chart_key":"B40","node_label":"Lämna anmälan till tillsynsmyndigheten","title":"Anmälan lämnas till fel tillsynsmyndighet","category":"Myndighetskapacitet & handläggning","trigger":"Behörighetsfördelningen mellan länsstyrelse, kommunal nämnd och Försvarsinspektören för hälsa och miljö feltolkas för åtgärdens plats eller karaktär.","description":"Tillsynsmyndighet för anmälda vattenverksamheter varierar: länsstyrelsen är huvudregel, men kommuner kan ha övertagit tillsynen i vissa fall, och försvarsverksamheter anmäls till Försvarsinspektören enligt förordningen (2024:1212). En anmälan till fel myndighet registreras inte i rätt ärendebana, och väntetiderna i MB 11 kap. 9 b § börjar inte löpa. Projektet kan därigenom tro att åtgärden är startklar när anmälan i själva verket aldrig kommit in i rätt process.","motivation":"Välgrundat resonemang kopplat till MB 11 kap. 9 b § och FVV:s behörighetsregler, kompletterat med förordningen (2024:1212) om försvarsverksamheter som visar att behörighetsfrågan blivit mer komplex genom nya anmälningsvägar. Källa: FVV och SFS 2024:1212.","affects":"B40-N120 och B40-GN130 samt tidskraven i B40-N180.","impact":"Fördröjning och rättsosäkerhet om när åtgärden får påbörjas; i värsta fall olagligt påbörjat arbete.","mitigation":"Verifiera behörig tillsynsmyndighet mot FVV:s behörighetsföreskrifter och kommunens delegeringsbeslut. Begär skriftlig bekräftelse på registrering och diarienummer.","source_refs":["MB","FVV","HAV_WV","EXT: Förordning (2024:1212) om anmälan av vissa försvarsverksamheter https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-20241212-med-sarskilda-bestammelser_sfs-2024-1212/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-N120-02","node_id":"B40-N120","chart_key":"B40","node_label":"Lämna anmälan till tillsynsmyndigheten","title":"Registrering och handläggningsstart dröjer hos tillsynsmyndigheten","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen eller kommunen har handläggarkö och prioriterar tillståndsärenden och tillsyn före anmälningar.","description":"Anmälningsärenden ska vara det snabba spåret, men registrering och första granskning kan dröja när tillsynsmyndigheten är belastad. Länsstyrelserna har under lång tid rapporterat resursbrist inom vatten- och naturområdet, och anmälningar saknar ofta intern prioritering eftersom de inte är mål med lagfästa handläggningstider på samma sätt som domstolsärenden. För projekt med säsongbundet arbetsfönster kan några veckors kö innebära ett års förskjutning.","motivation":"Naturvårdsverkets statistik över handläggningstider för miljötillståndsprövning visar stora variationer och långa ledtider i systemet, och länsstyrelsernas egna årsredovisningar beskriver återkommande rekryterings- och kompetensproblem inom vattensektorn. Källa: Naturvårdsverket – Handläggningstid för miljötillståndsprövning.","affects":"B40-N120 och alla efterföljande noder i anmälningsgrenen (B40-GN130–B40-N180).","impact":"Förskjuten byggstart, förlorat arbetsfönster och osäkerhet i entreprenadplaneringen.","mitigation":"Lämna anmälan med god marginal före planerad start, följ upp registreringen aktivt och eskalera via myndighetens ledning vid onormal dröjsmål.","source_refs":["FVV","HAV_WV","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-N140-01","node_id":"B40-N140","chart_key":"B40","node_label":"Remittera och inhämta yttranden","title":"Fiske- och naturintressen mobiliserar motstånd vid remissen","category":"Samråd & motstånd","trigger":"HaV, fiskevårdsorganisationer, Naturskyddsföreningen eller särskilt berörda lämnar negativa yttranden med krav på omprojektering eller tillståndsprövning.","description":"Remissen enligt FVV 21–22 §§ ger fiskemyndigheter, kommuner, organisationer och berörda ett formellt tillfälle att påverka. Vid fiskeintressen ska HaV höras, och fiskerelaterade invändningar (vandringshinder, lekgrusl, vattenföring) är ofta väl underbyggda och svåra att värja sig mot. Negativa yttranden tvingar tillsynsmyndigheten att antingen ställa försiktighetsvillkor, begära komplettering eller gå vidare mot tillståndsföreläggande. Lokal opinion som mobiliseras här följer ofta med ärendet vidare till överklagande av beslutet.","motivation":"Erfarenheten från svenska vattenärenden visar att fiske- och vandringshinderfrågor är bland de mest framträdande remisskonflikterna; vattenkraftens omprövning och den nationella planen för moderna miljövillkor har ytterligare skärpt fokus på vandringshinder och minsta vattenföring i alla vattenärenden. Källa: Energimyndigheten – Tillstånd för vattenkraft och FVV 21–22 §§.","affects":"B40-N140 och B40-GN150 samt B40-N180 (överklaganderisk).","impact":"Tyngre villkor, omarbetad åtgärdsutformning eller tvingad övergång till tillståndsspår; fördröjning och ökad konfliktnivå.","mitigation":"Involvera fiskevårds- och naturintressen före den formella remissen, anpassa åtgärden (t.ex. lektider, vandringsvägar) proaktivt och bemöt remisspunkter sakligt i kompletteringar.","source_refs":["FVV","HAV_WV","EXT: Energimyndigheten – Tillstånd för vattenkraft https://www.energimyndigheten.se/energisystem-och-analys/tillstand-och-provning/tillstandsprocesser/tillstand-for-vattenkraft/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-N140-02","node_id":"B40-N140","chart_key":"B40","node_label":"Remittera och inhämta yttranden","title":"Remissinstanser svarar sent eller inte alls","category":"Myndighetskapacitet & handläggning","trigger":"Kommunal nämnd, HaV eller berörda myndigheter saknar kapacitet att yttra sig inom utsatt tid, och tillsynsmyndigheten förlänger eller inväntar svar.","description":"Remisstiderna i FVV 21–22 §§ ska hålla processen snabb, men i praktiken dröjer svar från belastade kommuner och myndigheter. HaV:s handläggning av fiskefrågor är resurskänslig, och uteblivna svar skapar osäkerhet om myndigheten kan gå vidare eller måste vänta. Varje förlängd remisstid förskjuter BMP-beslutet och därmed hela anmälningsspårets slutpunkt. Motparter som missar remisstillfället kan dessutom återkomma med synpunkter sent i processen.","motivation":"Välgrundat resonemang: remissförskjutningar är ett känt handläggningsproblem i svensk miljöförvaltning; Naturvårdsverkets handläggningstidsstatistik och länsstyrelsernas rapportering visar att remissledet ofta är den minst förutsägbara delen av anmälningsärenden. Källa: Naturvårdsverket.","affects":"B40-N140 och nedströms B40-GN150, B40-GN170 och B40-N180.","impact":"Fördröjt beslut, förlorat arbetsfönster och osäker tidplan för byggstart.","mitigation":"Förankra remissinstanserna informellt före remissen så att svaren kommer snabbt. Be tillsynsmyndigheten sätta korta, realistiska remisstider och följ upp uteblivna svar.","source_refs":["FVV","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-N180-01","node_id":"B40-N180","chart_key":"B40","node_label":"Uppfyll startvillkor och hantera överklagande","title":"Överklagande av 23 §-beslutet stoppar starten","category":"Överklagande & rättsprocess","trigger":"En granne, fiskevårdsförening eller miljöorganisation överklagar ställningstagandet eller BMP-beslutet till mark- och miljödomstolen.","description":"Beslut i anmälningsärenden kan överklagas, och överklagandetiden löper efter kungörande. Ett överklagande flyttar ärendet till MMD och kan förlänga processen med ett år eller mer, särskilt om prövningstillstånd krävs i MÖD. Under tiden står ofta frågan om inhibition – får arbetet påbörjas trots överklagandet? Projekt som planerat byggstart direkt efter underrättelsen utan att bevaka överklagandefönstret kan hamna i en situation där entreprenaden är beställd men arbetet juridiskt osäkert.","motivation":"Handläggningstiderna i mark- och miljödomstolarna är väldokumenterat långa – Naturvårdsverkets statistik och exempel som Lidköpings VA-projekt (där MÖD-handläggning uppskattades till cirka ett år) visar att överklaganden regelbundet förskjuter vattenrelaterade projekt med årsskiften. Källa: Naturvårdsverket och Lidköpings kommun.","affects":"B40-N180 och B40-ENDN samt överlämning till B70.","impact":"Fördröjning om månader till över ett år, kostnader för stillastående entreprenad och osäkerhet om åtgärden överhuvudtaget kan genomföras.","mitigation":"Bevaka kungörande och överklagandetid aktivt, invänta lagakraft där det är möjligt och förbered inhibitions- och sakargument inför eventuell domstolsprocess.","source_refs":["FVV","COURT_APPEAL","EXT: Lidköpings kommun – Överklagande till MÖD (Ångens ärv) https://lidkoping.se/lidkoping-miljo-och-teknik-ab/start/vatten-och-avlopp/vi-bygger-nytt-reningsverk---angens-arv/nyheter-angens-arv/2022-01-01-overklagande-till-mark--och-miljooverdomstolen"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-N180-02","node_id":"B40-N180","chart_key":"B40","node_label":"Uppfyll startvillkor och hantera överklagande","title":"Tidskraven för start förbises och anmälan blir ogammal","category":"Rättslig osäkerhet","trigger":"Arbetet påbörjas för tidigt (innan tidskraven i FVV 22 e–22 f §§ löpt ut) eller för sent (efter att anmälningens aktualitet ifrågasatts).","description":"Anmälda vattenverksamheter får inte påbörjas förrän viss tid gått eller beslut meddelats, och omvänt kan en gammal anmälan ifrågasättas om förhållandena ändrats. Start i otid är ett formellt fel som kan utlösa tillsyn även om åtgärden i övrigt är korrekt anmäld. Vid långa projektförskjutningar – vanliga vid entreprenadomplanering – kan myndigheten kräva att anmälan förnyas om underlaget inte längre speglar aktuella förhållanden i vattendraget.","motivation":"Välgrundat resonemang kopplat till MB 11 kap. 9 b § och FVV 22 e–22 f §§: starttiderna är obligatoriska och tillsynspraxis visar att påbörjande före utgången av väntetiden behandlas som en överträdelse oavsett åtgärdens storlek.","affects":"B40-N180 och B40-ENDN samt starten av byggberedskap i B70.","impact":"Tillsynsärende, möjligt vite och krav på förnyad anmälan med förnyad väntetid.","mitigation":"Lägg starttiderna som formella spärrar i projektets tidplan. Vid lång förskjutning: kontrollera med tillsynsmyndigheten att anmälan fortfarande är aktuell.","source_refs":["MB","FVV"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-N180-03","node_id":"B40-N180","chart_key":"B40","node_label":"Uppfyll startvillkor och hantera överklagande","title":"Parallella beslut och rättigheter är inte synkade vid start","category":"Sektorssamordning","trigger":"Anmälningsbeslutet är klart men strandskyddsdispens, rättighetsavtal eller andra sektorsbeslut saknas eller är överklagade.","description":"Startvillkorsnoden samlar alla parallella krav: negativ BMP, 23 §-utfall, tidskrav, försiktighetsmått, rättigheter och parallella beslut. Ett vanligt misslyckande är att anmälningsspåret löper färdigt snabbt medan sektorsspåren (strandskydd, artskydd, ledningsrätt) hänger efter. Startar projektet med bara anmälningsbeslutet i hand begås samma misstag som i undantagsspåret – arbeten som är olagliga trots att vattenspåret är avslutat. Koordinationen kräver en samlad startspärr, inte bara en färdig anmälan.","motivation":"Välgrundat resonemang: erfarenheten från strandskydds- och artskyddsområdet (MÖD 2020:2, MÖD 2024:20) visar att parallella dispensbeslut ofta avgörs senare än huvudbeslutet och att förhastade byggstarter lett till upphävda beslut och återställningskrav. Källa: lagen.nu och Naturvårdsverkets vägledning.","affects":"B40-N180 och B40-ENDN samt B40-060 (matrisen) i efterhand.","impact":"Olagligt påbörjade arbeten i strandskyddat eller skyddat område, återställningskrav och försening.","mitigation":"Upprätta en samlad startspärrlista där varje parallellt beslut och varje rättighet bockas av med lagakraftstatus innan entreprenören får startbesked.","source_refs":["FVV","MB","STRAND","ARTSKYDD","EXT: MÖD 2024:20 https://legaldigm.se/rattsfall/4bfdd51d-fff6-4018-a7d3-d486c34cde61"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-P100-01","node_id":"B40-P100","chart_key":"B40","node_label":"Verifiera specifik miljöbedömning eller förenklat underlag","title":"B20:s miljöunderlag är föråldrat eller fel avgränsat för vattenfrågorna","category":"Underlagsbrist & data","trigger":"Tillståndsvägen återanvänder B20:s miljöbedömning, men den gjordes innan åtgärdens vattenpåverkan var känd eller med en avgränsning som inte täcker hydrologiska effekter.","description":"Noden bygger på att B20:s miljöunderlag kan återanvändas, men en generell miljöbedömning täcker sällan vattenrättens specifika krav: skador och olägenheter för allmänna och enskilda intressen, effekter på vattenförhållanden, brunnar och fiske. Om underlaget dessutom är äldre kan artdata, hydrologiska serier och Natura 2000-läget ha förändrats. En ansökan byggd på föråldrat underlag möter kompletteringskrav från MMD eller bryts ned av motparter som påvisar att data inte speglar dagens läge.","motivation":"Välgrundat resonemang: MMD-praxis om kompletteringskrav i vattenmål visar att miljökonsekvensbeskrivningen måste vara aktuell och objektspecifik; kravet på skriftlig MKB-avgränsning vid avgränsningssamråd (32 a § MB i lydelse enligt SFS 2026:400) skärper dessutom kravet på spårbarhet mellan avgränsning och innehåll. Källa: SFS 2026:400 och MB 6 kap.","affects":"B40-P100 och B40-P110; brister följer med till B40-P120 och MMD:s prövning.","impact":"Kompletteringstvång i domstolen, fördröjning om månader till år och försvagad bevisställning i sak.","mitigation":"Gör en gap-analys av B20-underlaget mot vattenrättens krav innan det återanvänds. Förnya kritiska data (grundvatten, arter, recipients) om underlaget är mer än ett par år gammalt.","source_refs":["MB","SFS2026_400","NV_EIA","EXT: Lag (2026:400) om ändring i miljöbalken https://www.laglig.se/lagar/andringar/lag-om-andring-i-miljobalken-2026-400"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-P100-02","node_id":"B40-P100","chart_key":"B40","node_label":"Verifiera specifik miljöbedömning eller förenklat underlag","title":"Nya 2026-regler om skriftlig MKB-avgränsning tillämpas fel","category":"Politisk & policyrisk","trigger":"Projektet startat före ikraftträdandet möter nya krav på skriftlig avgränsningsredovisning (32 a § MB) utan att ha dokumenterat avgränsningssamrådet enligt den nya modellen.","description":"SFS 2026:400 inför skyldighet för länsstyrelsen att vid avgränsningssamråd skriftligt redovisa bedömningen av MKB:ns innehåll, särskilt för förnybar energi men med systemeffekter för alla specifika miljöbedömningar. Övergångsfrågorna är delvis otydliga: pågående projekt kan behöva komplettera dokumentationen retroaktivt, och praxis för vad en tillräcklig skriftlig avgränsning är finns ännu inte. Felaktig tillämpning kan ge motparter en formell angreppspunkt mot MKB:n i domstolsprövningen.","motivation":"Lag (2026:400) trädde i kraft 2026 och inför just 32 a § om skriftlig redovisning vid avgränsningssamråd; som med all ny lagstiftning saknas vägledande praxis det första året, vilket erfarenhetsmässigt ger tolkningstvister i de första målen. Källa: SFS 2026:400 och lagtexten hos riksdagen.","affects":"B40-P100 och B40-P110 samt indirekt MMD-prövningen efter B40-P120.","impact":"Formella invändningar mot MKB:n, komplettering eller återförvisning och osäkerhet om vilket regelverk som ska tillämpas.","mitigation":"Dokumentera avgränsningssamrådet skriftligt även för äldre projekt, följ länsstyrelsens nya rutiner och begär skriftlig avgränsningsredovisning där samråd sker efter ikraftträdandet.","source_refs":["SFS2026_400","MB","EXT: Miljöbalk (1998:808) aktuell lydelse https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/miljobalk-1998808_sfs-1998-808/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-P110-01","node_id":"B40-P110","chart_key":"B40","node_label":"Färdigställ vattenansökan","title":"Oprecist yrkande försvårar eller fäller ansökan","category":"Teknisk komplexitet","trigger":"Yrkandet beskriver åtgärden vagt ('dammbyggnad och reglering') utan exakta mått, nivåer, flöden och tidsgränser, eller omfattar inte hela avgränsade prövningsobjektet.","description":"Vattenansökan ska enligt MB 22 kap. och LVV 7 kap. innehålla ett precist yrkande med den tekniska beskrivning som domen sedan kan bindas vid. Domstolen kan inte meddela tillstånd utöver eller vid sidan av yrkandet, och en vag ansökan ger en dom som inte täcker det projektet faktiskt behöver göra – eller som måste tolkas i tvist. Yrkandet måste också täcka både arbeten och drift, inklusive arbetstid och kontrollprogram. Att färdigställa detta kräver att projekteringen är tillräckligt långt driven, vilket ofta kolliderar med önskan att komma in i domstolskön tidigt.","motivation":"Domstolarnas handläggarstöd för vattenverksamheter (Miljösamverkan Sverige) betonar att yrkandet styr prövningens ram och att brister i yrkandet är en av de vanligaste orsakerna till komplettering; MB 22 kap. 1 § listar detaljerade innehållskrav inklusive arbetstid för vattenverksamheter (högst tio år). Källa: Miljösamverkan Sverige och MB 22 kap.","affects":"B40-P110 och B40-P120 samt den slutliga domens användbarhet i B70.","impact":"Komplettering, förskjuten huvudförhandling eller en dom som inte täcker hela behovet och tvingar fram ny ansökan om ändring.","mitigation":"Låt jurist och tekniker formulera yrkandet gemensamt, med exakta nivåer, flöden, mått och tidsgränser. Kontrollera att yrkandet täcker hela det avgränsade prövningsobjektet från B40-010.","source_refs":["MB","LVV","COURT_WV","EXT: Miljösamverkan Sverige – Handläggarstöd domstolsprövning vattenverksamheter https://www.miljosamverkansverige.se/wp-content/uploads/handlaggarstod-domstolsprovning-vattenverksamheter.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B40-P110-02","node_id":"B40-P110","chart_key":"B40","node_label":"Färdigställ vattenansökan","title":"Ersättnings- och sakägaravsnitt provocerar fram motstånd","category":"Samråd & motstånd","trigger":"Ansökan måste redovisa berörda fastigheter och ersättningsfrågor, och sakägare som ser sina intressen beskrivna mobiliserar invändningar.","description":"Till skillnad från anmälan exponerar vattenansökan hela rättighets- och ersättningsbilden: vilka fastigheter som berörs, vilka skador som kan uppstå och vilken ersättning som erbjuds. Det är i detta steg som latent motstånd ofta aktiveras – grannar, fiskerättsinnehavare och samfälligheter får för första gången konkret besked om påverkan. En ansökan som bagatelliserar skador eller ersättningar skapar skarpa motparter som driver processen mot huvudförhandling och överklagande. Väl hanterat kan ersättningsavsnittet i stället användas för att bygga acceptans.","motivation":"Välgrundat resonemang: vattenmål är i praktiken tvistemål mellan sökanden och sakägare, och ersättningsreglerna i 31 kap. MB gör ekonomiska intressen till en central processfråga; domstolspraxis visar att ersättnings- och deltagandefrågor är de vanligaste tvistepunkterna i både tillstånds- och markavvattningsmål (jfr MÖD M 4651-18 om kostnadsfördelning).","affects":"B40-P110 och MMD-processen efter B40-P120; överklaganderisken påverkar hela nedströms flödet mot B70.","impact":"Förlängd domstolsprocess, fördyrad ersättningsbild och ökad risk för överklagande av domen.","mitigation":"Förhandla ersättningsfrågor före ansökan där det är möjligt, presentera påverkan ärligt med planerade kompensationsåtgärder och använd sakkunnigvärdering som underlag.","source_refs":["MB","LVV","EXT: MÖD M 4651-18 https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2019/m-4651-18.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B40-P110-03","node_id":"B40-P110","chart_key":"B40","node_label":"Färdigställ vattenansökan","title":"Kollision med pågående vattenkraftsomprövning i samma vattensystem","category":"Sektorssamordning","trigger":"Ansökan berör ett vattensystem där vattenkraftens miljötillstånd samtidigt omprövas, och villkoren för det egna projektet hänger på omprövningens utfall.","description":"Sedan 2019 pågår en nationell omprövning av vattenkraftens miljötillstånd i en 20-årsperiod, där MMD ändrar vattenföring, regleringsgränser och miljövillkor för hela älvar. Ett projekt i samma vattensystem – t.ex. ett utskov, en vattentäkt eller en bro – kan få sina hydrologiska förutsättningar ändrade av omprövningen, och domstolen kan vilja avvakta eller samordna. Ansökan som inte tar höjd för detta riskerar att prövas mot förhållanden som snart ändras, med en dom som blir inaktuell eller som måste omprövas.","motivation":"Den nationella planen för moderna miljövillkor (regeringsbeslut 25 juni 2020) och MB 11 kap. 27 § innebär att i princip alla större reglerade vattensystem är eller blir föremål för omprövning; Energimyndighetens och SEI:s analyser visar att omprövningarna påverkar samtliga intressenter i avrinningsområdet. Källa: Energimyndigheten och SEI 2022:015.","affects":"B40-P110 och B40-P120 samt villkorsbilden för hela projektets livslängd.","impact":"Avvaktan eller samordning i domstolen, fördröjning och risk att domen måste ändras när omprövningen av vattenkraften är klar.","mitigation":"Kontrollera om vattendraget omfattas av den nationella planen och pågående omprövningsmål. Dimensionera åtgärden för förväntade framtida vattenföringsvillkor.","source_refs":["MB","EXT: Energimyndigheten – Tillstånd för vattenkraft https://www.energimyndigheten.se/energisystem-och-analys/tillstand-och-provning/tillstandsprocesser/tillstand-for-vattenkraft/","EXT: SEI – Sames vattenkraft https://www.sei.org/wp-content/uploads/2022/05/entrugo-samers-vattenkraft-sei2022.015.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B40-P120-01","node_id":"B40-P120","chart_key":"B40","node_label":"Ge in ansökan till MMD och betala avgift","title":"MMD:s handläggningskö förlänger processen med år","category":"Myndighetskapacitet & handläggning","trigger":"Mark- och miljödomstolen har hög belastning av tillståndsmål, och vattenmål köar bakom miljöfarlig verksamhet och omprövningar av vattenkraft.","description":"Handläggningen hos MMD startar formellt när avgiften är fastställd och betald, men den reella väntan på kompletteringsbesked, kungörelse och huvudförhandling är betydligt längre. Vattenkraftens omprövningsmål är mycket resurskrävande för domstolarna och konkurrerar om samma domare och tekniska råd. Projekt som bygger tidplanen på teoretiska handläggningstider får regelmässigt fel; statistiken visar att vattenverksamhetsmål ofta tar flera år från ansökan till dom, och överklagande till MÖD förlänger ytterligare.","motivation":"Naturvårdsverkets handläggningstidsstatistik och branschanalyser (bl.a. Paneos genomgång av MMD, med 193 vattenverksamhetsmål i första instans under en studerad period) visar långa och växande ledtider; MÖD-handläggning tillkommer med cirka ett år vid överklagande. Källa: Naturvårdsverket och Paneo.","affects":"B40-P120 och hela tillståndsspåret fram till laga kraft; byggberedskapet i B70 förskjuts.","impact":"Fördröjning om flera år, kapitalbindning och risk att marknads- eller finansieringsförutsättningar hinner ändras.","mitigation":"Planera med realistiska ledtider från Naturvårdsverkets statistik, lämna fullständiga ansökningar för att undvika kompletteringsköer och följ upp ärendet aktivt hos domstolen.","source_refs":["COURT_WV","EXT: Naturvårdsverket – Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/","EXT: Paneo – Tillståndsprövning hos mark- och miljödomstolen https://paneo.se/kunskapsbank/tillstandsprovning-hos-mmd/"],"scenario_tags":"S0_current_2026 | S1_no_actor_change","origin":"Myndighet & prövning"},{"risk_id":"R-B40-P120-02","node_id":"B40-P120","chart_key":"B40","node_label":"Ge in ansökan till MMD och betala avgift","title":"Avgiftstvist eller underbetalning stoppar handläggningsstarten","category":"Myndighetskapacitet & handläggning","trigger":"Domstolens fastställda ansökningsavgift är högre än projektet budgeterat, eller betalningen dröjer, så att handläggningen inte formellt påbörjas.","description":"Handläggningen av vattenmål startar inte förrän avgiften är fastställd och betald. Avgiften kan vara betydande för stora vattenverksamheter, och osäkerhet om avgiftsgrund eller interna budgetprocesser hos sökanden kan fördröja starten utan att någon märker det – ärendet ligger still trots att projektet tror att klockan tickar. Avgiftsfrågan kan också bli tvistig om domstolen bedömer målet som mer omfattande än sökanden.","motivation":"Välgrundat resonemang: avgiftskravet är en formell förutsättning för handläggning enligt gällande avgiftsordning för mark- och miljödomstolarna, och domstolarnas praxis är att ärenden inte förs vidare förrän avgiften erlagts; för stora vattenmål kan avgiften uppgå till betydande belopp. Källa: Sveriges Domstolar – Vattenverksamhet, så prövas ansökan.","affects":"B40-P120 och hela den fortsatta domstolsprocessen.","impact":"Tyst fördröjning om veckor till månader innan ärendet ens börjar handläggas.","mitigation":"Budgetera avgiften tidigt, betala omedelbart vid fastställelse och bekräfta skriftligt att handläggningen påbörjats.","source_refs":["COURT_WV","MB"],"scenario_tags":"S0_current_2026 | S1_no_actor_change","origin":"Myndighet & prövning"},{"risk_id":"R-B40-P120-03","node_id":"B40-P120","chart_key":"B40","node_label":"Ge in ansökan till MMD och betala avgift","title":"Behörighets- och kungörelsefel ger återförvisning efter överklagande","category":"Överklagande & rättsprocess","trigger":"Ansökan registreras vid fel domstol, eller kungörandet når inte alla särskilt berörda, vilket motparter driver i överinstansen.","description":"Vattenmål prövas av den mark- och miljödomstol som är behörig för området, och ansökan ska kungöras så att sakägare och allmänheten kan yttra sig. Fel i behörighet eller kungörelse är klassiska processfel som MÖD återförvisar för – ibland efter att målet redan hunnit avgöras i sak. Återförvisning innebär att handläggningen görs om från ett tidigt steg, ofta med förnyat kungörande och nya yttrandetider, vilket kan kosta ett år eller mer av redan lång process.","motivation":"Välgrundat resonemang: återförvisning på grund av kungörelse- och delgivningsfel är ett återkommande motiv i MÖD:s avgöranden i både vatten- och övriga miljömål; domstolarnas handläggarstöd betonar att kungörandet är en av de mest felkänsliga delarna av vattenmålshanteringen. Källa: Miljösamverkan Sverige – Handläggarstöd.","affects":"B40-P120 och förnyad handläggning med påverkan på alla nedströms steg mot B70.","impact":"Återförvisning, omhandläggning och fördröjning om minst ett år samt fördyrad process för alla parter.","mitigation":"Verifiera behörig domstol mot lagen om mark- och miljödomstolar, granska kungörelsen mot sakägarförteckningen och protestera själv tidigt om fel upptäcks.","source_refs":["MMDL","COURT_WV","COURT_APPEAL","EXT: Miljösamverkan Sverige – Handläggarstöd domstolsprövning vattenverksamheter https://www.miljosamverkansverige.se/wp-content/uploads/handlaggarstod-domstolsprovning-vattenverksamheter.pdf"],"scenario_tags":"S0_current_2026 | S1_no_actor_change","origin":"Myndighet & prövning"},{"risk_id":"R-B40-START-01","node_id":"B40-START","chart_key":"B40","node_label":"Vattenåtgärd initierad","title":"Vattenpåverkan upptäcks för sent i genomförandekonceptet","category":"Underlagsbrist & data","trigger":"Projektets genomförandekoncept fastställs utan att någon vattenrättslig screening görs av grundvatten, diken, våtmarker eller vattenområden som berörs.","description":"När åtgärden initieras handlar fokus ofta om teknik och markåtkomst, inte om att även mindre ingrepp i vatten kan utlösa tillståndsplikt eller anmälningsplikt enligt 11 kap. miljöbalken. Om grundvattenbortledning, tillfälliga sänkningar eller arbete i vattenområde inte identifieras i detta läge byggs projektets tidplan på antagandet att inget vattenrättsligt spår behövs. Upptäcks påverkan först i samband med bygglov eller upphandling måste hela spårvalet göras om. Kostnader för redan beställda utredningar och projektering kan behöva kasseras. Åtgärden blir då också utsatt för tillsynsrisk om arbeten hunnit påbörjas.","motivation":"Erfarenheten från svenska infrastrukturprojekt visar att vattenfrågor återkommande upptäcks sent; Trafikverkets MKB:er för järnvägsprojekt (t.ex. Ostlänken och Norrbotniabanan) visar att i princip allt arbete i vattenområde och all grundvattenbortledning kräver separat tillståndsprövning, vilket tvingat fram omfattande kompletterande ansökningar när omfattningen initialt underskattats. Källa: Trafikverkets MKB-underlag och 11 kap. 3 § MB.","affects":"Noden själv och B40-010, med risk för återkoppling till B10/B20 om projektets omfattning ändras.","impact":"Fördröjning genom omgjord avgränsning, merkostnad för kompletterande utredningar och risk för anmälnings- eller tillståndstvång mitt i genomförandet.","mitigation":"Gör en enkel vattenrättslig checklista redan vid initiering (vattenområde, grundvattennivå, diken, våtmarker). Involvera hydrogeolog tidigt och dokumentera screeningen som beslutsunderlag.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-E010-01","node_id":"B50-E010","chart_key":"B50","node_label":"Nätutredning, korridorstudier och miljöbedömning","title":"Korridorvalet kolliderar med riksintressen, rennäring eller Natura 2000","category":"Intressekonflikt & markåtkomst","trigger":"De tekniskt och ekonomiskt optimala ledningssträckningarna passerar områden med riksintressen för naturvård, rennäring eller totalförsvar, eller Natura 2000-områden som inte kan undvikas.","description":"Nätutredningen enligt 2 kap. ellagen ska pröva behov, teknik och alternativa sträckningar, och miljöbedömningen ska göras samtidigt som verkliga alternativ fortfarande finns kvar. I praktiken är antalet framkomliga korridorer ofta starkt begränsat av befintlig infrastruktur, fjällterräng, skyddade områden och sammanhängande renskötselområden. Om korridorsstudien underlagts upptäcker motstridiga intressen sent, tvingas nätföretaget till nya sträckningsalternativ med nya inventeringar och nytt samråd – och hela ledningsprojektet blir beroende av Natura 2000-spåret och koncessionärens möjligheter att få markåtkomst.","motivation":"Erfarenheten från svenska stamnätsutbyggnader visar att sträckningsvalet är den mest konfliktfyllda fasen: Svenska kraftnäts projekt genom renskötselområden och fjällnatur har upprepade gånger lett till omsträckningar och förlängda utredningar. Rättsligt förstärks risken av att MB 2 kap. 6 § (lokaliseringshänsyn) och art/habitatdirektivets krav ställer stränga krav på alternativanalysen när skyddade områden berörs.","affects":"B50-E010, nedströms B50-E020 (ansökan fördröjs eller måste göras om), samt korsvis B50-N010/B50-N020 i Natura-spåret och B50-G900.","impact":"Fördröjning om flera år vid omsträckning, ökade utredningskostnader, samt risk att projektets övriga tillstånd (t.ex. för ansluten produktion eller industrianläggning) hinner åldras eller behöva kompletteras.","mitigation":"Starta korridorstudierna med full GIS-konfliktanalys mot samtliga riksintressen, skyddade områden och renskötselområden innan en huvudsträckning förankras. Involvera länsstyrelsen, samebyar och berörda kommuner tidigt. Dokumentera alternativprövningen spårbart så att den håller vid både Ei:s prövning och överklagande.","source_refs":["ELLAG","EI_GRID","MB"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E010-02","node_id":"B50-E010","chart_key":"B50","node_label":"Nätutredning, korridorstudier och miljöbedömning","title":"Anslutningskö och osäker framkomlighet underminerar nätutredningens antaganden","category":"Sektorssamordning","trigger":"Nätutredningen bygger på anslutningsvolymer eller en systemutveckling (andra ledningar, ställverk, produktion) som inte realiseras i den takt som antagits.","description":"En linjekoncession förutsätter ett påvisat behov: nya produktionsanläggningar, industrietableringar eller förstärkning av transmissionssystemet. I dagens läge är anslutningsköerna till stamnätet långa och flera stora industrisatsningar har skjutits upp eller dragits tillbaka. Om det underliggande behovet förändras under utredningstiden kan koncessionsansökans behovsgrund urholkas, och Ei kan ställa frågan om ledningen alls är lämplig ur allmän synpunkt. Nätföretaget riskerar då att ha investerat år av utredningsarbete i en ledning vars behov inte längre kan styrkas.","motivation":"Välgrundat resonemang utifrån ellagens behovsprövning (2 kap. 1 §) och den välkända situationen med långa anslutningsköer hos Svenska kraftnät: flera uppmärksammade industrisatsningar i norra Sverige har pausats eller avbrutits 2023–2025, vilket direkt påverkar behovsunderlaget för planerade ledningar. Det är en strukturell systemrisk, inte en enskild händelse.","affects":"B50-E010 och nedströms B50-E020–B50-E040 (behovsgrunden prövas av Ei och vid överklagande), samt B50-G900.","impact":"Omprövning av projektets grund, risk för avslag eller återtagen ansökan, samt förlorade utredningskostnader och skadad planeringssäkerhet för anslutna verksamheter.","mitigation":"Förankra behovsunderlaget med skriftliga anslutningsbesked eller avtal med anslutande kunder. Bygg in scenarieanalys i nätutredningen (vad händer om anslutande produktion halveras eller försenas?) och håll löpande dialog med Svenska kraftnät om systemutvecklingsplanens status.","source_refs":["ELLAG","EI_GRID"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E020-01","node_id":"B50-E020","chart_key":"B50","node_label":"Ansök om nätkoncession för linje","title":"Ansökan underkänns som ofullständig och måste kompletteras innan registrering","category":"Underlagsbrist & data","trigger":"Koncessionsansökan till Ei saknar erforderlig MKB/förenklat underlag, tekniska bilagor eller sakägaruppgifter enligt Eis kravbild.","description":"Ei ställer krav på att ansökan om nätkoncession ska innehålla miljöbeskrivning eller MKB, teknisk beskrivning av ledningen, uppgifter om berörda fastigheter och underlag om behov och alternativ. Om ansökan inte uppfyller Eis fullständighetskrav inleds en kompletteringsslinga innan ärendet ens kommer till remiss, vilket förskjuter hela koncessionsprocessen. För långa ledningar genom många fastigheter är sakägaravgränsningen i sig ett omfattande arbete där fel fastighetsbeteckningar eller saknade brukningsenheter ger omarbetning.","motivation":"Ei:s vägledning om tillståndsprocessen för kraftledning beskriver uttryckligen att komplett ansökan är en förutsättning för effektiv handläggning och att kompletteringar är vanliga. Välgrundat slutsats: efter prop. 2020/21:188 om moderna tillståndsprocesser för elnät har kraven på ansökans innehåll och processens struktur skärpts, vilket höjer ribban för första inlämningen.","affects":"B50-E020, nedströms B50-E030 (remissen startar först vid komplett ärende) och därmed B50-E040, B50-E050 och B50-G900.","impact":"Fördröjning av hela koncessionsspåret, med följd att parallella spår (miljötillstånd, PBL, KML) kan hinna före och tvingas vänta på ledningsbeslutet.","mitigation":"Använd Eis checklista och ansökningsvägledning vid sammanställningen och begär ett förhandsmöte med Ei innan inlämning. Verifiera fastighetsuppgifterna mot Lantmäteriets register i förväg. Kvalitetssäkra att MKB/förenklat underlag följer MBD:s krav redan i ansökningsversionen.","source_refs":["ELLAG","EI_GRID","MBD"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-E030-01","node_id":"B50-E030","chart_key":"B50","node_label":"Komplettering, remiss och bemötande","title":"Remissvaren kräver nya utredningar och omstart av materialet","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelse, kommuner eller andra remissinstanser riktar krav på kompletterande utredningar – t.ex. om kumulativ påverkan, alternativa sträckningar eller sakägare – som Ei tillmötesgår.","description":"Ei remitterar koncessionsärendet till berörda myndigheter, kommuner, organisationer och sakägare. Remissinstanserna har ofta själva begränsad kapacitet och svarar sent, och deras krav kan vara omfattande: nya artinventeringar i rätt säsong, fördjupad alternativanalys eller omarbetad MKB. Varje kompletteringsrunda ska i sin tur bemötas och kan ge upphov till nya remisser. För långa ledningar som berör flera län multipliceras problemet – varje länsstyrelse har egna krav och egen kö.","motivation":"Välgrundat resonemang utifrån förvaltningsprocesslagens och ellagens krav på utredning och kännedom för sakägare, förstärkt av den dokumenterade resursbristen hos länsstyrelsernas naturvårdsenheter. Erfarenheten från svenska koncessionsärenden visar att remiss- och kompletteringsfasen ofta är den tidsmässigt största delen av handläggningen.","affects":"B50-E030, med återkoppling till B50-E020 (ansökan kan behöva byggas om) och nedströms B50-E040, B50-E050 och B50-G900.","impact":"Utdraget handläggningsförlopp om ofta flera år, växande utredningskostnader och osäkerhet om ledningens slutliga sträckning och villkor.","mitigation":"Genomför informella förhandlingar med länsstyrelserna före remissen så att kravbilden är känd. Säkerställ att inventeringar täcker alla berörda län från start och att alternativanalysen redovisar förkastade sträckningar transparent. Planera säsongsberoende inventeringar med marginal så att kompletteringar inte kostar ett helt fältår.","source_refs":["ELLAG","EI_GRID"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-E030-02","node_id":"B50-E030","chart_key":"B50","node_label":"Komplettering, remiss och bemötande","title":"Sakägare nås inte – kännedomsprocessen haltar","category":"Samråd & motstånd","trigger":"Berörda fastighetsägare eller brukare kan inte identifieras eller nås, eller vägrar ta del av handlingarna, vilket tvingar fram särskilda delgivningsåtgärder.","description":"Sakägare ska beredas tillfälle att yttra sig, och för en lång ledningsgata kan det röra sig om hundratals fastigheter, samfälligheter och renbeteslag. Felaktiga adresser, dödsbon, ägare bosatta utomlands och komplicerade samfällighetsförhållanden gör att kännedomen måste säkras med utdrag ur fastighetsregister, stämningar eller i sista hand kungörelseförfarande. Varje avbrott i kedjan ger Ei skäl att avvakta, och klagomål på bristande kännedom kan senare utgöra processrättslig grund i överklagande.","motivation":"Välgrundat resonemang utifrån förvaltningslagen och ellagens sakägarregler: i stora ledningsärenden är sakägarhanteringen en känd flaskhals, och processrättsliga fel i kännedomen är en klassisk återförvisningsgrund i överinstans. Erfarenheten från stamnätsprojekt bekräftar att delgivnings- och samfällighetsfrågor regelmässigt förlänger handläggningen.","affects":"B50-E030, nedströms B50-E040 (processfel kan återförvisa beslutet) och B50-E050 samt B50-G900.","impact":"Fördröjning av beslutet och risk för återförvisning vid överklagande, med förlorad tid och försämrat förtroende hos berörda markägare.","mitigation":"Beställ aktuella fastighets- och samfällighetsutdrag tidigt, använd specialiserad delgivningshantering för svårnådda sakägare, och dokumentera varje kännedomsåtgärd. Överväg personliga informationsmöten längs sträckningen – de minskar både motstånd och senare överklaganden.","source_refs":["ELLAG","EI_GRID"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E040-01","node_id":"B50-E040","chart_key":"B50","node_label":"Koncessionsbeslut och överklagande","title":"Koncessionsbeslutet överklagas – lång överprövning hos regering eller domstol","category":"Överklagande & rättsprocess","trigger":"Markägare, kommuner, organisationer eller länsstyrelser överklagar Ei:s beslut om nätkoncession, antingen för att stoppa ledningen eller för att få ändrad sträckning eller villkor.","description":"Ei:s beslut om nätkoncession överklagas enligt 13 kap. ellagen, beroende på beslutets art till allmän förvaltningsdomstol eller till regeringen, via Ei. En överklagad koncession vinner inte laga kraft förrän överprövningen är slutförd, och överprövningen kan omfatta både processfel och sakfrågan (lämplighet, sträckning, skyddsåtgärder). För samhällsviktiga ledningar finns ofta motstånd längs hela sträckningen, och även om överklagandena till slut ogillas binder de projektet under hela handläggningstiden.","motivation":"Verifierbart exempel: Ei beslutade i december 2024 att meddela Svenska kraftnät nätkoncession för 420 kV-ledningen Munga–Hamra, och beslutet överklagades till regeringen 2025 (KN2025-00130). Detta är det normala mönstret för nya 400 kV-ledningar: praktiskt taget varje större stamnätskoncession överklagas. Källa: Svenska kraftnät, projekt Munga–Hamra, överklagande av Ei:s beslut.","affects":"B50-E040, nedströms B50-E050 (ledningsrätt och byggstart kan inte slutföras före laga kraft) och B50-G900.","impact":"Flerårig fördröjning av ledningsbygget, osäkerhet för anslutande verksamheter som planerat efter ledningen, och i värsta fall upphävande med återförvisning till Ei.","mitigation":"Bygg beslutsunderlaget så att det tål överprövning: motivera sträckningsvalet, bemöt varje remisskritik skriftligt och dokumentera alternativprövningen. Förbered överklagandeskedet parallellt med ansökan (svarsmodeller, juridiskt team) och kommunicera tidigt med sannolika klagogrupper för att avskilja och lösa enskilda sträckningskonflikter före beslut.","source_refs":["ELLAG","EI_GRID","EXT: Svenska kraftnät – Överklagande KN2025-00130 av Ei:s nätkoncessionsbeslut Munga–Hamra https://www.svk.se/49c69c/siteassets/2.utveckling-av-kraftsystemet/transmissionsnatet/utbyggnadsprojekt/munga-hamra/regeringsbeslut-koncession/kn2025-00130-overklagande-av-energimarknadsinspektionens-beslut-att-meddela-natkoncession-for-linje-for-en-420-kv-luftledning-fran-munga-till-hamra.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E040-02","node_id":"B50-E040","chart_key":"B50","node_label":"Koncessionsbeslut och överklagande","title":"Lämplighetsprövningen urholkas av förändrat behov eller ny politik","category":"Politisk & policyrisk","trigger":"Under handläggningen förändras förutsättningarna för behovs- och lämplighetsprövningen: anslutande produktion ställs in, energipolitiken skiftar, eller nya föreskrifter om nätutbyggnad träder i kraft.","description":"Koncessionsprövningen enligt 2 kap. ellagen innebär en lämplighetsbedömning ur allmän synpunkt där behovet är centralt. Energisystemet förändras snabbt: stora industrikunder avböjer anslutningar, regeringen ändrar regelverk för nätutbyggnad (jfr prop. 2020/21:188) och nya överföringsprojekt kan förändra behovsbilden. Om underlaget blir inaktuellt under processen kan Ei eller överinstans ifrågasätta själva grunden för koncessionen, och projektet måste antingen omutredas eller dras tillbaka.","motivation":"Välgrundat resonemang utifrån 2 kap. ellagen och den påvisade volatiliteten i svensk energipolitik och industriutveckling 2023–2026, där flera stora förbruknings- och produktionsprojekt pausats. Proposition 2020/21:188 om moderna tillståndsprocesser visar dessutom att regelverket för nätkoncession är i rörelse, med bl.a. femårig lagakraftsfrist för att påbörja byggandet.","affects":"B50-E040, uppströms B50-E010–B50-E030 (behovet kan behöva utredas om) och nedströms B50-E050 samt B50-G900.","impact":"Avslag, återtagen ansökan eller behov av omarbetad behovsanalys – med flera års tidsförlust och förlorade utredningsinvesteringar.","mitigation":"Håll behovsunderlaget levande: uppdatera anslutningsavtal och prognoser under handläggningen och lämna kompletteringar proaktivt när förutsättningarna ändras. Följ lagstiftnings- och policyarbetet om elnätsutbyggnad och anpassa ansökningstidpunkten till regelverkets skick.","source_refs":["ELLAG","EI_GRID","EXT: Prop. 2020/21:188 Moderna tillståndsprocesser för elnät https://lagen.nu/prop/2020/21:188"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E040-03","node_id":"B50-E040","chart_key":"B50","node_label":"Koncessionsbeslut och överklagande","title":"Villkor om skyddsåtgärder eller sträckning blir ogenomförbara i byggskedet","category":"Teknisk komplexitet","trigger":"Koncessionsbeslutet förenas med villkor om sträckningsdetaljer, kabel i stället för luftledning, eller skyddsåtgärder som visar sig tekniskt eller ekonomiskt svårgenomförbara.","description":"Ei kan förena koncessionen med villkor som väsentligt påverkar konstruktionen: partiell kabelläggning, omläggning av delsträckor, säsongsbegränsningar eller omfattande kompensationsåtgärder. Om villkoren inte prövats tekniskt under utredningen kan de i byggskedet kräva ny projektering, nya tillstånd (t.ex. vattenverksamhet för kabelgravar över vattendrag) eller ändringsansökan. Därmed uppstår en fördröjning efter det att koncessionen redan är vunnen.","motivation":"Välgrundat resonemang: ellagens villkorsbefogenhet (2 kap.) kombinerad med att miljöprövningen av ledningen delvis sker i koncessionsärendet innebär att villkor ofta formuleras på övergripande nivå utan full teknisk prövning. Erfarenheten från svenska ledningsprojekt visar att kabelkrav och sträckningsvillkor är återkommande fördyringar i genomförandefasen.","affects":"B50-E040, nedströms B50-E050 (markåtkomst och ledningsrätt måste anpassas till villkoren), samt parallella spår B40 (vattenverksamhet) och B50-G900.","impact":"Merkostnader, fördröjning av byggstart, behov av kompletterande tillstånd eller ändringsprövning av koncessionen.","mitigation":"Låt konstruktörer granska tänkbara villkor redan i ansökningsskedet och lämna tekniska bilagor som visar genomförbarheten av både luftlednings- och kabelalternativ. Begär dialog med Ei om utkast till villkor före beslut och förbehåll möjligheten att precisera genomförandet i ledningsrättsskedet.","source_refs":["ELLAG","EI_GRID"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-E050-01","node_id":"B50-E050","chart_key":"B50","node_label":"Säkra markåtkomst och koncessionsgate","title":"Ledningsrätt eller traktat fastställs inte i tid – byggstart blockerad trots koncession","category":"Intressekonflikt & markåtkomst","trigger":"Överenskommelser med markägare nås inte, och ledningsrätts- eller traktatförrättningen hos Lantmäteriet tar lång tid eller möter motstånd i överprövning.","description":"Koncessionen ger rätt att bygga men inte markåtkomst i sig: nätföretaget måste teckna avtal eller, vid misslyckande, ansöka om ledningsrätt respektive begära traktat hos Lantmäteriet. Förrättningsprocessen med utredning, sammanträde och beslut kan ta lång tid för en lång ledning med många ägare, och förrättningsbeslut kan överklagas. Parallellt måste kompletterande beslut – strandskyddsdispenser, KML-tillstånd, eventuell vattenverksamhet – vara verkställbara för berörda delsträckor. Byggstart förutsätter att hela paketet är klart, sträcka för sträcka.","motivation":"Välgrundat resonemang utifrån ledningsrättslagen och ellagens traktatregler: förrättningsprocessen är en självständig formell process med egen överklagandekedja, och erfarenheten från svenska stamnätsprojekt visar att markåtkomsten regelmässigt är den kritiska linjen i byggprogrammet, inte koncessionen. Femårsfristen i ellagen (påbörjat byggande inom fem år från lagakraftvunnen koncession) gör att förseningar i markåtkomsten kan hota koncessionens värde.","affects":"B50-E050 och B50-G900; risken är direkt kopplad till byggberedskapen för hela ledningsprojektet och för anslutande verksamheter.","impact":"Fördröjd byggstart trots lagakraftvunnen koncession, risk att femårsfristen för påbörjat byggande inte hålls, samt tvister med markägare som fördyrar och fördröjer.","mitigation":"Starta avtalsförhandlingar med markägare parallellt med koncessionsprocessen, inte efter den. Förbered ledningsrätts-/traktatansökningar för de sträckor där motstånd är känt. Skapa en sträckvis byggberedskapsmatris som kopplar varje delsträckas dispenser, KML-beslut och ledningsrätt till byggprogrammet.","source_refs":["ELLAG","EI_GRID"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-E050-02","node_id":"B50-E050","chart_key":"B50","node_label":"Säkra markåtkomst och koncessionsgate","title":"Kompletterande miljö-, PBL- och KML-beslut faller inte på plats sträckvis","category":"Sektorssamordning","trigger":"Koncessionen är klar men enstaka delsträckor saknar verkställbara beslut om strandskyddsdispens, ingrepp i fornlämning, bygglov för ställverk eller tillstånd för åtgärder i vatten.","description":"Ledningsbygget kan bara starta där samtliga tillämpliga beslut är verkställbara. Ställverk kräver ofta detaljplan eller bygglov, ledningsgator över vattendrag kan kräva prövning av vattenverksamhet, fornlämningar längs sträckan kräver KML-beslut, och strandskyddsområden kräver dispens. Eftersom besluten ligger hos olika myndigheter (kommun, länsstyrelse, mark- och miljödomstol) med olika handläggningstider och överklagandevägar blir den sista delsträckan hela projektets flaskhals. En gate är inte klar förrän samtliga komponenter är det.","motivation":"Välgrundat resonemang utifrån nodens egen logik och erfarenheten från svenska ledningsprojekt, där ställverksplanering och strandskyddsdispenser återkommande legat efter koncessionsbeslutet. Preemraff-förloppet (upphävd detaljplan 2023) visar generellt hur ett sent upphävt plan- eller tillståndsbeslut kan fälla ett i övrigt färdigt beslutspaket.","affects":"B50-E050, B50-G900, samt uppströms kopplingar till B50-P040/B50-P070 (PBL-spåret), B50-K010 (KML) och B40 (vatten).","impact":"Sträckvisa byggförbud, splittrat byggprogram med dyrare logistik och mobilisering, samt risk för totalprojektfördröjning om en kritisk nod (t.ex. ett ställverk) blockeras.","mitigation":"Upprätta tidigt en beslutsmatris per delsträcka och anläggningsdel med ansvarig myndighet, status och överklaganderisk. Driv PBL- och KML-ärendena parallellt med koncessionen. Prioritera besluten för kritiska noder (ställverk, stationer) före linjära sträckor.","source_refs":["ELLAG","EI_GRID","PBL","KML"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-G010-01","node_id":"B50-G010","chart_key":"B50","node_label":"Vilka tvärgående spår är tillämpliga?","title":"Ofullständig tillämpbarhetsmatris lämnar obligatoriska spår utanför","category":"Rättslig osäkerhet","trigger":"Projektets juridiska och tekniska sakkunskap missbedömer vilka regelverk som aktiveras av lokaliseringsvalet eller projektets utformning.","description":"I noden ska samtliga tillämpliga spår – Natura 2000, art- och områdesskydd, kulturmiljö, PBL, ellag, minerallag, väg- och järnvägslag och Seveso – startas parallellt. Trösklarna är olika formulerade i varje regelverk: ett projekt kan t.ex. ligga utanför ett Natura 2000-område men ändå träffas av tillståndsplikt enligt MB 7 kap. 28 a § genom indirekt påverkan, eller omfattas av strandskyddsdispens trots att den tillståndspliktiga verksamheten inte behöver det. En felaktig matris gör att spår startar för sent eller aldrig, och bedömningen är beroende av specialiserad kompetens som många projektorganisationer saknar internt.","motivation":"Nordkalk/Ojnarefjärden visar hur gränsdragningen för Natura 2000-prövningens omfattning – inklusive påverkan utanför områdesgränsen och kumulativa effekter – blev föremål för årslång process upp till Högsta domstolen (bl.a. MÖD 2016:1 och MÖD:s dom 2018 i mål M 5375-14). Regelrådets yttrande 2024 om Natura 2000-prövning i Sveriges ekonomiska zon visar dessutom att även behörighetsfrågan för screeningen är rättsligt omtvistad. Källor: lagen.nu/dom/mod/2016:1, Sveriges Domstolar, Regelrådet rr 2024:085.","affects":"B50-G010 och alla åtta grenar nedströms (B50-N010, B50-X010, B50-K010, B50-P010, B50-E010, B50-M010, B50-T010, B50-S010) samt samlingsgaten B50-G900.","impact":"Sena omstarter av hela grenar, förskjutna ansökningar, risk för retroaktiva tillståndskrav och i värsta fall olagligt påbörjade arbeten med tillsynsingripande.","mitigation":"Arbeta med en checklista per regelverk och dokumentera varför varje spår bedöms icke tillämpligt, inte bara vilka som är tillämpliga. Låt extern expertis kvalitetssäkra matrisen i gränsfall och stäm av den med länsstyrelsens enheter för naturvård och kulturmiljö.","source_refs":["MB","NATURA","PBL","KML","ELLAG","MINERALLAG","EXT: MÖD 2016:1 https://lagen.nu/dom/mod/2016:1","EXT: Regelrådet, yttrande om Natura 2000-tillstånd i ekonomisk zon https://www.regelradet.se/download/18.5933842b191974d80396ac/1725527853531/rr_2024_085.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-G010-02","node_id":"B50-G010","chart_key":"B50","node_label":"Vilka tvärgående spår är tillämpliga?","title":"Reformläget ändrar spårens regler och instanser mitt i processen","category":"Politisk & policyrisk","trigger":"SFS 2026:400, lagen om förnybar energi (2026:399) och den beslutade Miljöprövningsmyndigheten förändrar trösklar, avgränsningsbeslut och behörigheter efter att spåren startats.","description":"Screeningen görs mot gällande rätt (S0), men flera tvärgående spår påverkas av pågående reformer. SFS 2026:400 ändrar delar av miljöbalken, lagen om verksamheter och åtgärder för förnybar energi (2026:399) inför särskilda regler som kan påverka vilka bedömningar som görs i resp. spår, och Miljöprövningsmyndigheten tar från 2027 över ärenden (S1). En matris som låser rättsläge och instanser vid ett tillfälle kan bli felaktig innan ansökningarna hinner lämnas, särskilt i långsamma spår som detaljplanering. S1-deltan är tom i noden men reformpaketets följdändringar (SFS 2026:1442–1444) kan ändå beröra samordningen.","motivation":"De nyligen beslutade förändringarna i miljöbalken (SFS 2026:400), lagen om förnybar energi (2026:399) och inrättandet av Miljöprövningsmyndigheten (SFS 2026:1442–1444) är dokumenterade reformer som träder i kraft stegvis. Övergångsregler för pågående ärenden är historiskt en återkommande källa till tolkningstvister vid svenska miljöreformer. Källor: svenskforfattningssamling.se.","affects":"B50-G010 med samtliga nedströms spår; särskilt B50-N010–B50-N060 (förnybar energi och Natura 2000) och instansvalet i B50-N030.","impact":"Behov att göra om klassificering och ansökningsstrategi, risk för avvisning eller återförvisning vid instansbyte, samt fördröjning vid omdisposition av underlag till nya krav.","mitigation":"Håll en levande rättslägesbevakning per spår med tydliga träd- och övergångsdatum. Dokumentera vilket rättsläge varje ansökan grundas på och begär skriftlig bekräftelse från berörd myndighet vid gränsfall om övergångsregler.","source_refs":["SFS2026_400","RENEWABLE","SFS2026_1442","SFS2026_1443","NEW_AUTH"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-G900-01","node_id":"B50-G900","chart_key":"B50","node_label":"Är alla tillämpliga parallellspår klara?","title":"AND-gatens sista spår blir projektets kritiska linje","category":"Sektorssamordning","trigger":"Ett enda aktiverat spår – ofta ett överklagat lov, en ledningsrätt eller ett kompletterande vattentillstånd – är inte slutligt när alla andra är klara, och hela projektets byggstart väntar på det.","description":"Konvergensnoden är uttryckligen en AND-gate: avslut i en gren räcker inte. Det betyder att projektets totala tid till byggstart bestäms av det långsammaste spåret, inte av huvudprövningen. Erfarenhetsmässigt är det sällan miljötillståndet som är sist klart utan ett sekundärt beslut: en strandskyddsdispens i länsstyrelsens granskning, ett överklagat bygglov, en markanvisning eller en nätkoncession. Om projektledningen inte aktivt styr mot gaten uppstår en dold kritisk linje som upptäcks först när huvudspåret är klart – då utan återstående tid att påverka.","motivation":"Välgrundat resonemang förstärkt av verifierade mönster: Munga–Hamra-koncessionen (överklagad till regeringen 2025) visar hur ett elnätsspår kan ligga år efter övriga beslut, och Preemraff-förloppet visar hur en detaljplanefråga kan fälla ett i övrigt färdigprövat industriprojekt. I båda fallen var det sidospåret, inte huvudtillståndet, som satte tidpunkten.","affects":"B50-G900 och därmed B50-END (hela delprocessens utflöde); risken materialiseras i det spår som är svagast – typiskt B50-P050, B50-E040, B50-M040 eller B50-T030.","impact":"Total fördröjning av byggstart trots att huvudtillstånden är vunna, med följder för finansiering, entreprenadmarknad och politiskt stöd.","mitigation":"Driv gaten som ett aktivt program: en samlad spårstatus med veckovis uppföljning, där varje spår har en prognos för 'slutligt eller byggstartsklart'. Identifiera det långsammaste spåret tidigt och omfördela resurser dit. Överväg etapperad byggstart där delar av projektet kan starta med en delmängd av spåren klara.","source_refs":["MB","PBL","ELLAG","MINERALLAG"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-G900-02","node_id":"B50-G900","chart_key":"B50","node_label":"Är alla tillämpliga parallellspår klara?","title":"Återkoppling till G010: nya spår aktiveras sent och startar om klockan","category":"Rättslig osäkerhet","trigger":"Vid konvergensgranskningen visar det sig att tillämpbarhetsmatrisen var ofullständig – ett nytt spår (t.ex. ett artskyddsärende efter nyinventering, eller ett vattenverksamhetsspår efter omprojektering) måste aktiveras, och noden skickar processen tillbaka till B50-G010.","description":"Gatens nedströmsloop till B50-G010 innebär att varje nyupptäckt krav startar ett helt nytt spår med egen ansökan, prövning och överklagandeexponering. Typiska scenarier: en förundersökningsfynd av fridlyst art under senare designfas, en omprojektering som förflyttar åtgärder in i strandskyddat område, eller en växtlig från 'anmälan' till 'tillstånd' i vattenspåret. Eftersom huvudprojektet vid det laget ofta är färdigprojekterat blir den tvungna anpassningen dyr och konfliktfylld, och det nya spårets handläggningstid läggs oavkortat på totalen.","motivation":"Välgrundat resonemang utifrån flödesstrukturen: nyskapade spår sent i processen är en återkommande orsak till fördröjning i svenska tillståndsprojekt, eftersom designutveckling och djupare inventeringar löpande avslöjar nya konflikter. Artskydds- och strandskyddsfrågor är de vanligaste sentida upptäckterna, just därför att de är plats- och detaljnivåberoende på ett sätt som tidiga screeningar inte fångar.","affects":"B50-G900 med återkoppling till B50-G010 och aktivering av B50-X-, B50-K-, B40- eller B50-P-spåren; förskjuter B50-END.","impact":"Start om prövning i nytt spår med full handläggnings- och överklagandetid, omprojektering av färdigdesign, och försening som kan mätas i år beroende på spår.","mitigation":"Frys designens yttergränser sent: behåll marginalzoner runt planerade åtgärder i tidiga screeningar så att små omflyttningar inte aktiverar nya spår. Gör uppföljande naturinventeringar i detaljprojekteringen, inte bara i MKB-skedet. Håll en levande tillämpbarhetsmatris som omprövas vid varje väsentlig designändring.","source_refs":["MB","ARTSKYDD","STRAND"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-G900-03","node_id":"B50-G900","chart_key":"B50","node_label":"Är alla tillämpliga parallellspår klara?","title":"Tidsglapp mellan spåren urholkar tidiga beslut","category":"Extern händelse","trigger":"Det sista spåret drar ut så länge att beslut i de först klara spåren hinner åldras: dispenser förverkas, MKB-underlag blir inaktuellt, eller villkor förutsätter en teknik som projektet inte längre kan leverera.","description":"Eftersom gaten kräver att alla spår är klara samtidigt skapar ett enda långsamt spår ett tidsglapp för alla andra. Strandskyddsdispenser ska utnyttjas inom två år, miljöb
