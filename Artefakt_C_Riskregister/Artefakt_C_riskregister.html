fall är rättsligt verifierbara, och den beslutade reformen om Miljöprövningsmyndigheten (SFS 2026:1442–1444) visar att aktörs- och instansantaganden har bäst-före-datum – en profil som inte versionshanteras mot rättsläget blir stillastående fel.","affects":"Samtliga slutgrenar B10-END20, B10-END30, B10-END40 och B10-END50 samt allt nedströms artefaktarbete (B20–B70) som bygger på typfallets metadata.","impact":"Felstyrda nedströms analyser och riskmappningar, behov av att uppdatera typfall och beroende artefakter i efterhand samt försämrat förtroende för kartans tillämpbarhet.","mitigation":"Låt oberoende sakkunniga granska typfallet mot gällande rätt per låsningsdatum, dokumentera antaganden och kända osäkerheter i profilen, och koppla profilen till en versionsregel som tvingar fram omvalidering vid relevanta lagändringar.","source_refs":["MB","MPF","SFS2026_1442"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B10-090-02","node_id":"B10-090","chart_key":"B10","node_label":"Lås representativt typfall och variantmetadata","title":"Företagsspecifik data smyger in i det generiska typfallet","category":"Rättslig osäkerhet","trigger":"Sakvalideringen bygger på verkliga projekt, och detaljer från dessa – namn, kapaciteter, geografiska pekare – lämnas kvar i typfallets metadata trots att noden uttryckligen ska vara fri från företagsspecifik processdata.","description":"Typfallets värde ligger i att vara generiskt och fritt från enskilda aktörers affärshemligheter och personuppgifter. Om valideringsmaterialet inte saneras kan profilen indirekt avslöja vilka projekt som legat till grund för kartan, vilket skapar affärsjuridiska och eventuellt dataskyddsrättsliga problem för artefaktens ägare. Åt andra hållet kan överdriven sanering göra profilen meningslös som styrning: utan tillräcklig konkretion om kapacitet och tillståndskombination kan inte nedströms noder bedöma tillämplighet. Balansfelet i endera riktningen försvagar artefaktens funktion som processunderlag.","motivation":"Välgrundat resonemang: nodens egen beskrivning ställer krav på dokumentation 'utan företagsspecifik processdata', vilket markerar att risken är inbyggd i uppgiften; svensk offentlighets- och sekretesspraxis kring tillståndsärenden visar att projektuppgifter i tidiga skeden ofta är affärskänsliga, och att läckage av lokaliseringsplaner kan påverka markpriser och förhandlingslägen.","affects":"B10-090 själv och nedströms artefaktanvändning i samtliga grenar (B10-END20–END50) samt extern spridning av processkartan.","impact":"Risk för otillåten röjande av affärsuppgifter, krav på återkallande eller omarbetning av artefakten, eller alternativt en så urvattnad profil att nedströms analys inte kan nyttja den.","mitigation":"Upprätta en sanerings- och granskningsrutin med två steg: teknisk sanering av identifierande uppgifter och sakgranskning av att profilen fortfarande är tillämpbar; dokumentera vilka generaliseringar som gjorts så att nedströms användare kan bedöma osäkerheten.","source_refs":["MB","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B10-START-01","node_id":"B10-START","chart_key":"B10","node_label":"Konkret projekt/förändring initierad","title":"Projektet initieras utan tillräcklig konkretion eller för sent","category":"Underlagsbrist & data","trigger":"Tillståndsarbetet startas innan investeringsbeslut, teknikval och kapacitetsmål är tillräckligt stabila, eller tvärtom så sent att upparbetade rättigheter och kommersiella åtaganden redan låst utformningen.","description":"Noden kräver att initiativet är tillräckligt konkret för tillståndsförberedelse, men det finns ingen formell kontrollstation som avgör detta. Om projektet startar för tidigt byggs förstudien på föränderliga antaganden, och basutredningar, samråd och MKB-arbete måste göras om när designen ändras. Om projektet i stället initieras för sent har markoptioner, leverantörsavtal eller finansieringsvillkor redan låst en utformning som kan visa sig svår att få tillstånd för. Båda felen försvagar projektets förhandlingsläge mot myndigheter och sakägare i efterföljande noder.","motivation":"Välgrundat resonemang kopplat till nodens karaktär av startvillkor, styrkt av svensk praxis: i Preemraff-målet vid Vänersborgs tingsrätts mark- och miljödomstol (dom 2020-06-15) tvingades bolaget justera sin ansökan under målets gång, vilket visar att en bristfälligt låst projektdefinition följer med hela vägen in i domstolsprövningen och skapar omarbetning även i sena skeden.","affects":"Noden själv och alla nedströms noder i B10 (B10-010, B10-020, B10-030, B10-040, B10-050, B10-060, B10-070, B10-080, B10-090) samt indirekt samtliga delprocesser B20–B70.","impact":"Omarbetning av projektdefinition, förbrukade utredningskostnader utan processvärde, försenad ansökan och i värsta fall behov av att starta om förstudien på nytt beslutsunderlag.","mitigation":"Upprätta en formell initieringspunkt med checklista: fastställt investeringsbehov, preliminär teknik- och kapacitetsram, ägarbeslut om tillståndsarbetets omfattning och budget. Dokumentera antaganden och beslutslogg så att senare förändringar kan spåras och hanteras som styrda revideringar i stället för omstarter.","source_refs":["NV_PERMIT","COURT_MFV","EXT: Domstolen anser att verksamheten vid Preemraff i Lysekil kan tillåtas https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-010-01","node_id":"B20-010","chart_key":"B20","node_label":"Ta fram undersökningsunderlag","title":"Undersökningsunderlaget räcker inte för BMP-bedömningen","category":"Underlagsbrist & data","trigger":"Beskrivningen av projekt, lokalisering, alternativ och möjliga miljöeffekter är för grov eller felriktad för att länsstyrelsen ska kunna ta ställning till om betydande miljöpåverkan kan antas.","description":"Undersökningsunderlaget enligt 6 kap. 23–25 §§ MB och 8–13 §§ MBD är det första dokumenterade greppet om projektet och ska räcka för att berörda ska kunna lämna meningsfulla synpunkter och för länsstyrelsens BMP-bedömning. Ett underlag som beskriver teknik och kapacitet vagt, eller som utelämnar uppenbara effektbärare (buller, vattenavledning, spridningsvägar, känsliga mottagare), leder till att samrådet förs på felaktiga premisser. Synpunkter som kommer in blir då riktade mot ett annat projekt än det som slutligen ansöks, och länsstyrelsens efterföljande beslut bygger på ofullständig bild. Bristen upptäcks ofta först när ansökan senare ska prövas och då är kalendertiden redan förbrukad.","motivation":"Rättspraxis fastslår att MKB:n – som bygger vidare på dessa tidiga underlag – ska vara anpassad till det enskilda fallet och kunna ligga till grund för bedömningen enligt 2 kap. MB (NJA 2009 s. 321, tillämpad bl.a. i MÖD:s dom 2024-03-06 i mål M 14424-22). En bristfällig inledande beskrivning följer med genom hela kedjan.","affects":"Noden själv, B20-020 (samrådets kvalitet), B20-030 (BMP-beslutets underlag) och vidare B20-060 samt ansökningsprocesserna i B30/B40.","impact":"Kompletterande samråd, förnyad BMP-bedömning eller krav på omarbetat underlag – fördröjning i ett tidigt led som skjuter upp hela miljöbedömningsspåret.","mitigation":"Använd MBD:s innehållskrav som checklista, låt oberoende sakkunnig granska underlaget före utskick, och stäm av underlagets detaljnivå med länsstyrelsen i förhand innan samrådet kungörs.","source_refs":["MB","MBD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-010-02","node_id":"B20-010","chart_key":"B20","node_label":"Ta fram undersökningsunderlag","title":"Säsongsberoende basdata hinner inte samlas in","category":"Klimat & naturhändelse","trigger":"Art- och naturinventeringar som kräver specifika säsonger (häckning, övervintring, vårflöde) kan inte genomföras inom projektets tidplan, eller försenas av extrema väderförhållanden.","description":"Undersökningsunderlaget ska beskriva möjliga miljöeffekter, vilket ofta kräver fältdata om arter och naturvärden som bara kan samlas in under vissa perioder av året. Om projektets tidsplan inte rymmer en full inventeringssäsong tvingas verksamhetsutövaren välja mellan att skjuta upp processen ett år eller att gå vidare med sekundärdata och antaganden. Extremväder – sen snösmältning, torka, stormar – kan dessutom förstöra planerade fältkampanjer. Ett underlag byggt på svaga basdata blir sårbart när berörda myndigheter och organisationer senare granskar det, och kan tvinga fram kompletterande inventeringar i ett betydligt obekvämare läge.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att inventeringsupplägg och inventeringarnas omfattning är återkommande stridsfrågor i domstol; i HFD 2024 not. 60 (Karlsborgs flygplats) diskuterades bl.a. underlaget för fladdermöss och skyddade arter, där återkommande inventeringstillfällen och tidpunkter var centrala för bedömningen.","affects":"Noden själv, B20-020, B20-030 och särskilt B20-060 (MKB:ns empiriska bas) samt artskydds- och Natura-frågor i nedströms prövningar.","impact":"Upp till ett års förskjutning av miljöbedömningsspåret, eller sämre underlagskvalitet som senare genererar kompletteringskrav och utredningsföreskrifter.","mitigation":"Upprätta en säsongsplan med marginaler redan i B10-040, beställ fleråriga eller upprepade inventeringar där osäkerheten är stor, och dokumentera antagandens osäkerhet öppet i underlaget.","source_refs":["MB","MBD","ART","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-020-01","node_id":"B20-020","chart_key":"B20","node_label":"Genomför undersökningssamråd","title":"Särskilt berörda missas i samrådskretsen","category":"Samråd & motstånd","trigger":"Verksamhetsutövaren gör en felaktig avgränsning av vilka enskilda som kan antas bli särskilt berörda och genomför inte riktade samrådsinsatser mot dem.","description":"Undersökningssamrådet ska enligt 6 kap. 24–25 §§ MB genomföras med länsstyrelsen, tillsynsmyndigheten och de enskilda som kan antas bli särskilt berörda. Bedömningen av vem som är särskilt berörd är projektets egen, och ett misstag här – t.ex. att inte bjuda in innehavare av angränsande tillstånd, nätkoncessioner eller fastighetsägare med indirekt påverkan – kan få långtgående konsekvenser. Mark- och miljödomstolar har avvisat ansökningar där samråd inte skett med särskilt berörda, även om Mark- och miljööverdomstolen i senare praxis nyanserat när avvisning är befogad. Även när avvisning undviks leder bristen till återförvisning och förnyad handläggning.","motivation":"I MÖD:s avgörande ÖM 12531-22 (2023-12-21, havsbaserad vindkraft) konstaterades att två bolag med angränsande tillstånd respektive nätkoncession var särskilt berörda och borde ha bjudits in till riktat samråd; mark- och miljödomstolen hade avvisat ansökan på den grunden. MÖD undanröjde avvisningen men återförvisade målet, med hänvisning till MÖD 2022:27 och MÖD 2015:35 om att avvisning sällan bör ske. Källa: Delphi Advokatfirmas analys samt domstolens avgörande.","affects":"Noden själv, B20-040 (avgränsningssamrådets krets), och nedströms hela ansökningskedjan i B30/B40 där bristen kan aktualiseras som avvisningsgrund.","impact":"Avvisningsrisk eller återförvisning, förnyat samråd med fördröjning, och försämrad trovärdighet hos berörda som upptäcker att de lämnats utanför.","mitigation":"Kartlägg systematiskt angränsande tillståndshavare, koncessionsinnehavare, fastighetsägare och nyttjanderättshavare via fastighetsregister och tillståndsregister. Dokumentera bedömningen av särskild beröring per part och rådfråga länsstyrelsen om kretsen innan inbjudan skickas.","source_refs":["MB","NV_EIA","EXT: Delphi om ÖM 12531-22 https://www.delphi.se/sv/insights/delphi-insights-brister-rorande-samrad-ar-inte-tillrackligt-skal-for-att-avsla-ansokan-om-tillstand-till-vindkraftpark/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-020-02","node_id":"B20-020","chart_key":"B20","node_label":"Genomför undersökningssamråd","title":"Lokal opinion mobiliserar och hårdnar under samrådet","category":"Samråd & motstånd","trigger":"Samrådshandlingarna gör projektets omfattning och effekter offentligt kända, vilket sätter igång lokal mobilisering, mediedriv och politisk aktivism.","description":"Undersökningssamrådet är ofta första tillfället där allmänheten ser projektets verkliga omfattning. När handlingarna sprids kan en tidig och organiserad opinion växa fram – lokalgrupper, naturskyddsföreningar och engagerade politiker – som snabbt etablerar en berättelse om projektets skadeverkningar. Det påverkar kommunens vilja att stötta projektet, vilket är avgörande för vindkraft och annan verksamhet där kommunalt tillstyrkande krävs enligt 16 kap. 4 § MB, och det höjer ribban för vad som måste utredas. Ett välorganiserat motstånd följer sedan projektet genom ansökan, kungörelse och överklagande.","motivation":"Erfarenheten från svenska vindkraftsprocesser är att tidigt mobiliserat lokalt motstånd både aktiverar kommunal vetorätt (16 kap. 4 § MB) och genererar väl underbyggda överklaganden; miljöprövningsdelegationers och domstolars beslut om vindkraft åtföljs regelbundet av omfattande enskilda och organisatoriska klagoinsatser, bl.a. i mål som MÖD 2014:34 om vindkraftverk nära bostadsort.","affects":"Noden själv, B20-040 (avgränsningssamrådets tonläge), kommunala beslutsled i B50, och överklaganderisken i B70.","impact":"Ökat utredningstryck, risk för kommunalt avstyrkande, förlängd samråds- och remissbehandling samt fler och bättre underbyggda överklaganden i slutet av processen.","mitigation":"Bedriv genuin dialog före formella samrådet, lyssna in lokala kunskaper tidigt, var transparent om osäkerheter och möt kritik med verifierbar data i stället för kommunikationskampanjer. Etablera en beredskapsplan för opinionshantering som inte trappar upp konflikten.","source_refs":["MB","NV_EIA","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-030-01","node_id":"B20-030","chart_key":"B20","node_label":"Länsstyrelsens beslut om betydande miljöpåverkan","title":"Länsstyrelsens kapacitet försenar BMP-beslutet","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen saknar handläggare eller samordningsresurser för att fatta motiverat BMP-beslut inom rimlig tid efter mottagen samrådsredogörelse.","description":"BMP-beslutet enligt 6 kap. 26–27 §§ MB och 14 § MBD är en flaskhals: länsstyrelsen ska ta ställning till samtliga inkomna synpunkter och göra en egen miljöbedömning på kort tid. Länsstyrelserna har varierande belastning mellan län, och ett stort inflöde av vindkrafts-, vatten- och infrastrukturprojekt konkurrerar om samma specialistresurser. Ett försenat eller hastigt motiverat beslut skapar osäkerhet om vilken miljöbedömningsnivå som gäller och försvårar projektets planering av det fortsatta spåret. Dessutom är BMP-beslutet inte separat överklagbart, vilket gör att ett feltänkt beslut inte kan rättas förrän i slutprövningen.","motivation":"Miljöbedömningsförordningen ställer krav på skyndsam handläggning av BMP-frågan (14 § MBD), men erfarenheten från svenska tillståndsprocesser visar återkommande kapacitetsproblem hos länsstyrelsernas miljöprövnings- och samrådsfunktioner – ett av skälen bakom reformen med en ny statlig Miljöprövningsmyndighet enligt betänkandet 2025/26:MJU24.","affects":"Noden själv, B20-G020 (vägvalet vidare), och via fördröjningen hela B20-spåret samt tidsplanen för B30/B40-ansökningar.","impact":"Fördröjning i veckor till månader, osäker planeringshorisont för utredningsarbetet och risk att projektet halkar efter parallella processer (planläggning, markåtkomst, finansiering).","mitigation":"Boka in länsstyrelsens bedömning i god tid, leverera en komplett och välstrukturerad samrådsredogörelse som gör beslutsfattandet enkelt, och följ upp formellt. Bygg in buffert för beslutstiden i projektets tidsplan.","source_refs":["MB","MBD","NEW_AUTH"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B20-030-02","node_id":"B20-030","chart_key":"B20","node_label":"Länsstyrelsens beslut om betydande miljöpåverkan","title":"BMP-beslutet visar sig ligga fel när verkligheten växer fram","category":"Rättslig osäkerhet","trigger":"Ny kunskap om effekter, utökad projektomfattning eller ändrade förutsättningar gör att ett tidigare beslut om att betydande miljöpåverkan inte kan antas blir ohållbart.","description":"Ett negativt BMP-beslut leder projektet in på spåret med förenklat miljöunderlag enligt 6 kap. 47 § MB. Men beslutet vilar på det underlag som fanns vid samrådstillfället. Om projektet senare utvecklas – större kapacitet, ny teknik, utökad anläggningsyta – eller om fältinventeringar avslöjar skyddsvärden som inte var kända, kan grunden för beslutet falla. Prövningsmyndigheten i det slutliga ärendet gör sin egen bedömning av MKB-kraven och är inte bunden av länsstyrelsens tidigare ställningstagande i sak. Projektet riskerar då att ha satsat utredningsresurser på ett förenklat spår som inte håller.","motivation":"Rättspraxis visar att prövande instans själv prövar om MKB:n uppfyller balkens krav och att bristfälliga underlag i värsta fall leder till avvisning (NJA 2009 s. 321; se även Uppsala kommuns rättsgenomgång i yttrande över SOU 2024:98 som sammanfattar praxis om avvisning vid grundläggande MKB-brister).","affects":"Noden själv, B20-G020, B20-070 (förenklat spår) och nedströms B20-090 samt ansökningsprövningen i B30/B40/B50.","impact":"Tvångsomgång till full specifik miljöbedömning med avgränsningssamråd och komplett MKB sent i processen – i praktiken en omstart av miljöbedömningsspåret.","mitigation":"Bevaka projektets utveckling mot BMP-beslutets premisser; vid väsentliga ändringar, ta initiativ till förnyad bedömning själv i stället för att låta prövningsmyndigheten upptäcka avvikelsen. Dokumentera löpande varför beslutet fortfarande håller.","source_refs":["MB","MBD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-040-01","node_id":"B20-040","chart_key":"B20","node_label":"Genomför avgränsningssamråd","title":"Avgränsningen blir för snäv – effekter dyker upp sent","category":"Underlagsbrist & data","trigger":"Samrådet avgränsar bort frågor – indirekta effekter, kumulativa effekter, alternativa lokaliseringar – som senare visar sig vara avgörande för prövningen.","description":"Avgränsningssamrådet enligt 6 kap. 28–31 §§ MB är det tillfälle där MKB:ns omfattning och detaljeringsgrad fastläggs i dialog med en bred krets av myndigheter, kommuner, sakägare och allmänhet. En verksamhetsutövare som driver processen mot minimal avgränsning för att spara tid och pengar riskerar att prövningsmyndigheten eller överklagande parter senare visar att bortavgränsade frågor var centrala. Kumulativa effekter av flera samtidiga verksamheter är ett klassiskt exempel: de lämnas ofta utanför men måste enligt praxis bedömas samlat, särskilt vid Natura 2000-beröring. Varje sent tillkommande fråga kräver ny utredning i ett läge där tidsplanen är som mest pressad.","motivation":"I HFD 2024 not. 60 (Karlsborgs flygplats) var just avgränsningen av kumulativ påverkan och Natura 2000-frågor centrala klagogrunder; NJA 2013 s. 613 fastslår att Natura 2000-prövningen ska omfatta alla effekter som verksamheten kan få, ensam eller tillsammans med andra. MÖD 2016:1 visar också hur närliggande Natura 2000-områden måste beaktas i täktprövningar.","affects":"Noden själv, B20-050 (länsstyrelsens avgränsningsbedömning), B20-060 (MKB:ns omfattning) och nedströms prövning i B30/B40/B50 samt överklagandeprocesser i B70.","impact":"Kompletteringskrav, återförvisning för förnyad utredning, utdragna domstolsprocesser och i värsta fall avslag eller avvisning på grund av otillräckligt underlag.","mitigation":"Låt avgränsningen utgå från effekterna, inte från önskad ambitionsnivå. Inkludera en strukturerad kumulativ analys och nollalternativ från början. Dokumentera motiveringen för varje bortavgränsad fråga så att den kan försvaras i rättslig prövning.","source_refs":["MB","NV_EIA","NATURA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-040-02","node_id":"B20-040","chart_key":"B20","node_label":"Genomför avgränsningssamråd","title":"Bred samrådskrets genererar oförenliga krav på MKB:n","category":"Samråd & motstånd","trigger":"Myndigheter, kommuner, organisationer och enskilda framför motstridiga synpunkter om lokalisering, utformning, miljöeffekter och MKB:ns omfattning som inte kan tillgodoses samtidigt.","description":"Avgränsningssamrådet ska omfatta en bred krets, och med bredden följer att synpunkterna drar åt olika håll: en myndighet vill ha djupare utredning om grundvatten, en annan prioriterar landskapsbild, sakägare kräver bulleråtgärder, och organisationer driver kumulativa frågor. Samrådsredogörelsen ska hantera allt detta, men resurser och tid är begränsade. Varje synpunkt som inte tillgodoses blir en potentiell klagogrund i den kommande ansökningsprocessen. Att prioritera bland motstridiga krav utan tydlig metodik skapar en godtycklighetsrisk som motståndare kan utnyttja.","motivation":"Erfarenheten från stora svenska tillståndsmål – t.ex. Markbygden vindkraftsprocesser där kumulativa effekter och landskapsfrågor drivits genom flera instanser (bl.a. MÖD:s dom 2018-05-15 i mål M 6227-17) – visar att synpunkter som inte hanterats i samråds- och MKB-ledet återkommer som strukturerade överklagandegrunder.","affects":"Noden själv, B20-050, B20-060 och nedströms ansöknings- och överklagandefaser (B30/B40/B50, B70).","impact":"Fördyrat och förlängt utredningsarbete, utökad MKB-omfattning, och ökad sannolikhet för välunderbyggda överklaganden som belastar prövningen i flera instanser.","mitigation":"Upprätta en synpunktshanteringsmatris som spårar varje framförd synpunkt till åtgärd eller motiverat avskriv. Avmystifiera prioriteringen i samrådsredogörelsen. Erbjud fördjupad dialog med de mest kritiska parterna utanför det formella samrådet.","source_refs":["MB","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-040-03","node_id":"B20-040","chart_key":"B20","node_label":"Genomför avgränsningssamråd","title":"Felbedömd samrådskrets utsätter ansökan för avvisningsrisk","category":"Överklagande & rättsprocess","trigger":"Verksamhetsutövaren bedömer att vissa aktörer inte är särskilt berörda och bjuder inte in dem till avgränsningssamrådet, trots att de enligt rättspraxis borde ha inbjudits.","description":"Avgränsningssamrådet ställer det högsta kravet på samrådskretsen: riktade insatser mot alla som kan antas bli särskilt berörda. Rättspraxis har utvecklat en vid definition – angränsande tillståndshavare, innehavare av nätkoncessioner och aktörer vars rättigheter kan påverkas av anläggningsbeslut är i regel särskilt berörda, även om de själva signalerat ointresse. En felbedömning här upptäcks typiskt först när ansökan prövas och kan leda till avvisning eller återförvisning. Eftersom felet ligger år tillbaka i tiden kan det inte alltid läkas proportionerligt.","motivation":"MÖD ÖM 12531-22 (2023-12-21): två bolag (innehavare av angränsande vindkraftstillstånd respektive nätkoncession) var särskilt berörda och borde ha bjudits in till riktat avgränsningssamråd; mark- och miljödomstolen hade avvisat ansökan. MÖD undanröjde och återförvisade med hänvisning till MÖD 2022:27 och MÖD 2015:35. Källa: domstolens avgörande via Delphi Advokatfirmas genomgång.","affects":"Noden själv och indirekt hela nedströms kedjan: B20-060, B20-090 samt ansökningsprövningen i B30/B40/B50 där avvisningsfrågan aktualiseras.","impact":"Avvisning eller återförvisning av ansökan, förnyat samråd långt efter det att utredningarna slutförts, och flera års fördröjning i domstolsled.","mitigation":"Tillämpa en expansiv tolkning av särskild beröring: sök i tillstånds- och koncessionsregister, kontakta angränsande verksamhetsutövare skriftligt även vid osäkerhet, och dokumentera uteblivet svar. Låt jurist granska kretsen före inbjudan.","source_refs":["MB","NV_EIA","EXT: Delphi om ÖM 12531-22 https://www.delphi.se/sv/insights/delphi-insights-brister-rorande-samrad-ar-inte-tillrackligt-skal-for-att-avsla-ansokan-om-tillstand-till-vindkraftpark/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-050-01","node_id":"B20-050","chart_key":"B20","node_label":"Länsstyrelsens skriftliga avgränsningsbedömning","title":"Avgränsningsbedömningen uteblir eller dröjer","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen hinner inte lämna den skriftliga bedömningen av MKB:ns innehåll inom den tid som avgränsningssamrådets upplägg förutsätter.","description":"Enligt 6 kap. 32 a § MB (införd genom SFS 2026:400) ska länsstyrelsen under avgränsningssamrådet skriftligen redovisa sin bedömning av vad MKB:n ska innehålla. Det ställer nya och konkreta krav på länsstyrelsens samrådshantering: bedömningen ska vara skriftlig, sakligt motiverad och komma i rätt tid i processen. I en uppbyggnadsfas av det nya regelverket, med hög belastning på länsstyrelsernas miljöenheter, finns en påtaglig risk att bedömningar blir försenade eller så generella att de inte styr utredningsarbetet. Projekt som väntar på bedömningen innan utredningarna fullföljs tappar kalendertid direkt i kritiska linjen.","motivation":"Bestämmelsen i 6 kap. 32 a § MB är ny och verifierad i SFS 2026:400 (publicerad i Svensk författningssamling april 2026). Erfarenheten av nya processkrav på länsstyrelser – i kombination med de kapacitetsmotiv som ligger bakom reformen med Miljöprövningsmyndigheten (betänkande 2025/26:MJU24) – gör förseningar i införlivandefasen sannolika.","affects":"Noden själv och B20-060 (utredningsarbetets styrning); via fördröjning hela B20-spåret och nedströms ansökningar.","impact":"Stillastående utredningsarbete i väntan på styrning, eller utredning utan myndighetsanknytning som sedan måste justeras – fördröjning och omarbete.","mitigation":"Begär den skriftliga bedömningen aktivt och tidsatt redan vid samrådets inledande, dokumentera muntliga ställningstaganden skriftligt mot länsstyrelsen, och ha en fallback där utredningen fortsätter efter egen bedömning med spårbar motivering.","source_refs":["MB","MBD","SFS2026_400","NEW_AUTH"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B20-050-02","node_id":"B20-050","chart_key":"B20","node_label":"Länsstyrelsens skriftliga avgränsningsbedömning","title":"Bindande 32 b-beslut för förnybar energi låser MKB:n fel","category":"Politisk & policyrisk","trigger":"För verksamheter för förnybar energi enligt lag (2026:399) fattar länsstyrelsen ett beslut som är bindande för MKB:ns omfattning – och innehållet visar sig i efterhand vara för snävt eller för brett.","description":"Det nya institutet i 6 kap. 32 b § MB, kopplat till lagen (2026:399) om verksamheter och åtgärder för förnybar energi, gör länsstyrelsens avgränsningsbeslut bindande för MKB:ns omfattning i förnybarprojekt. Syftet är att skapa förutsägbarhet och korta handläggningstiderna, men en bindande avgränsning som fattas på ett tidigt och ofullständigt kunskapsläge kan låsa fast en omfattning som inte håller när utredningarna avslöjar nya effekter. Omvänt kan en för generös bindande avgränsning tvinga fram utredningsarbete som inte behövs. Tillämpningspraxis saknas ännu – hur bindandet förhåller sig till nya omständigheter och till prövningsmyndighetens egen MKB-prövning är inte utrett i rättspraxis.","motivation":"SFS 2026:400 och lag (2026:399) är verifierade i Svensk författningssamling (april 2026); 6 kap. 32 b § MB och förnybarlagens bestämmelser är nya rättsfigurer utan etablerad praxis, vilket i sig utgör en dokumenterad rättslig osäkerhet för projekt i förnybarspåret.","affects":"Noden själv, B20-060 (MKB-arbetets ram) och nedströms prövningar av förnybarprojekt i B30/B40 samt överklaganden i B70 där bindandets räckvidd kan testas.","impact":"Låst MKB-omfattning som inte matchar verkliga effektbilden, tvister om bindandets räckvidd, och risk för antingen under- eller överutredning med efterföljande processkomplikationer.","mitigation":"Investera i ett starkt beslutsunderlag till avgränsningssamrådet så att det bindande beslutet blir rätt från början. Följ den första tillämpningspraxisen noga. Förhandla om avgränsningens avfattning under samrådet, inte efter beslutet.","source_refs":["MB","SFS2026_400","RENEWABLE"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B20-050-03","node_id":"B20-050","chart_key":"B20","node_label":"Länsstyrelsens skriftliga avgränsningsbedömning","title":"Mallstyrda avgränsningsbesked spär ut MKB:n","category":"Underlagsbrist & data","trigger":"Länsstyrelsen återanvänder standardiserade kravlistor i stället för en projektspecifik bedömning, vilket driver MKB:ns omfattning uppåt utan koppling till verkliga effekter.","description":"Den skriftliga avgränsningsbedömningen ska vara ett instrument för att fokusera MKB:n på det väsentliga. I praktiken finns en risk att länsstyrelser, av försiktighet eller tidsbrist, ställer generella krav på utredning av i princip alla tänkbara effektkategorier. Följden blir en MKB som växer i omfång utan att bli bättre: dyra utredningar av marginella frågor, långa ledtider hos specialiserade konsulter, och ett slutdokument vars omfång i sig blir en granskbarhetsrisk. Det urholkar avgränsningsinstitutets syfte och fördyrar projektet utan motsvarande miljönytta.","motivation":"Rättspraxis (NJA 2009 s. 321) fastslår att MKB:n ska anpassas till vad som krävs i det enskilda fallet – inte vara maximal. Erfarenheten från svenska tillståndsprocesser visar samtidigt att myndigheters kravlistor tenderar att växa generellt, särskilt i resursstarka sektorer som vindkraft och infrastruktur.","affects":"Noden själv och B20-060 (utrednings- och MKB-arbetets kostnad och tidsåtgång).","impact":"Fördyrat utredningsprogram, förlängd MKB-produktion, och ökad risk att det slutliga dokumentets volym försvårar prövning och granskning.","mitigation":"För en aktiv dialog med länsstyrelsen om vad som är verkligt beslutsrelevant. Åberopa proportionalitetsprincipen i 6 kap. MB och hänvisa till avgränsningsbeslutets styrande funktion. Eskalera mallkrav som saknar projektförankring via formell återkoppling.","source_refs":["MB","MBD","SFS2026_400","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B20-060-01","node_id":"B20-060","chart_key":"B20","node_label":"Slutför utredningar och MKB","title":"MKB:n brister i kumulativa effekter, nollalternativ eller sammanfattning","category":"Underlagsbrist & data","trigger":"MKB:n fokuserar på projektets egna direkta effekter men missar indirekta och kumulativa effekter, nollalternativets relevans, Natura 2000-underlaget eller den icke-tekniska sammanfattningen.","description":"MKB:n enligt 6 kap. 35–38 §§ MB och 15–19 §§ MBD ska beskriva alternativ, direkta, indirekta och kumulativa effekter, skyddsåtgärder och uppföljning – och göra det begripligt via en icke-teknisk sammanfattning. De vanligaste bristerna i praktiken är just de integrerande delarna: kumulativa effekter av andra pågående eller planerade verksamheter, en levande redovisning av nollalternativet, och det samlade underlaget för Natura 2000-prövning. Sådana brister upptäcks ofta först i den rättsliga prövningen där motparter systematiskt granskar dokumentet. En bristfällig MKB kan leda till kompletteringskrav, återförvisning eller i värsta fall avvisning.","motivation":"NJA 2009 s. 321 etablerade att MKB:n ska kunna läggas till grund för prövningen enligt 2 kap. MB. I HFD 2024 not. 60 (Karlsborgs flygplats) var påstådda brister i just kumulativ påverkan, Natura 2000-underlag, icke-teknisk sammanfattning och alternativredovisning centrala klagogrunder som HFD prövade. Praxis sammanfattad i bl.a. Uppsala kommuns yttrande över SOU 2024:98 visar att grundläggande MKB-brister kan leda till avvisning.","affects":"Noden själv, B20-090 (kvalitetssäkringen) och nedströms samtliga ansöknings- och prövningsprocesser (B30, B40, B50) samt överklaganden i B70.","impact":"Kompletteringskrav i domstols- eller delegationsled, återförvisning för ny utredning, förlängd handläggning om år, eller avvisning med krav på helt ny ansökan.","mitigation":"Strukturera MKB-arbetet efter MBD:s innehållskrav med särskilt ansvariga för de integrerande avsnitten (kumulativt, nollalternativ, Natura 2000, sammanfattning). Låt extern kvalitetsgranskare testa dokumentet mot rättspraxis innan det lämnas in.","source_refs":["MB","MBD","NV_EIA","NATURA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-060-02","node_id":"B20-060","chart_key":"B20","node_label":"Slutför utredningar och MKB","title":"Säsongs- och väderstörningar slår ut fältinventeringar","category":"Klimat & naturhändelse","trigger":"Extremväder, sen årstidsväxling eller andra naturförhållanden gör att planerade inventeringar av arter, fåglar, fladdermöss eller vattenförhållanden inte kan genomföras enligt säsongsplanen.","description":"Utredningsfasen bygger på fältdata som ofta måste samlas in under snäva fönster: häckningsperioder, övervintringslägen, vårflöde, vegetationsperioder. En försenad vår, skyfall eller stormar kan slå ut en hel inventeringsomgång, och eftersom vissa datamängder kräver upprepade säsonger för att vara statistiskt användbara kan ett missat fönster förskjuta hela MKB-arbetet med upp till ett år. Klimatförändringarna gör dessa fönster mer oregelbundna, särskilt för fjäll- och vattennära projekt. Att kompensera med modellantaganden i stället för fältdata försvagar underlagets styrka i den rättsliga prövningen.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att inventeringsuppläggets omfattning och kvalitet är stående stridsfrågor – i HFD 2024 not. 60 (Karlsborgs flygplats) prövades underlaget om fladdermuskolonier och skyddade arter, där inventeringarnas täckning var avgörande för Natura 2000- och artskyddsbedömningen.","affects":"Noden själv, B20-090 och nedströms artskydds-, Natura 2000- och tillståndsprövningar i B30/B40/B50.","impact":"Förskjutning av MKB-slutförande med upp till ett helt inventeringsår, eller försvagat underlag som genererar kompletteringskrav och utredningsföreskrifter i prövningen.","mitigation":"Planera redundans i inventeringsprogrammet: fler säsonger än minimikravet, alternativa metoder (DNA-provtagning, automatiska logger, satellitdata) som komplement, och start av fältarbete så tidigt som möjligt i B20-spåret.","source_refs":["MB","MBD","ART","ARTSKYDD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-060-03","node_id":"B20-060","chart_key":"B20","node_label":"Slutför utredningar och MKB","title":"Komplex effektmodellering ifrågasätts i prövningen","category":"Teknisk komplexitet","trigger":"Prognoser för buller, utsläppsspridning, grundvattenpåverkan eller kumulativa landskapseffekter vilar på modeller och antaganden som motparter och prövningsinstans anför tvivel om.","description":"MKB:ns effektbedömningar bygger på tekniska modeller vars osäkerheter är inneboende: spridningsmodeller för luft och vatten, bullerberäkningar, landskapsanalyser, metodval för kumulativ påverkan. När motparter anlitar egna experter blir modellval, indata och känslighetsanalyser föremål för teknisk tvist som domstolen måste ta ställning till. En verksamhetsutövare som inte kan försvara sina metodval med transparent dokumentation och känslighetsanalys förlorar trovärdighet för hela underlaget, även där det är starkt. Detta gäller särskilt projekt med många samverkande effekter – industrietableringar, gruvor, stora vindkraftsparker.","motivation":"Erfarenheten från svenska tillståndsmål visar att expertmotbevisning om modeller och prognoser är standard i större mål; i MÖD:s avgöranden om vindkraft (t.ex. MÖD 2014:34, mål M 6227-17 om Markbygden) har buller- och landskapsprognosers tillförlitlighet prövats ingående, och i NJA 2009 s. 321 poängteras att underlaget måste bära en bedömning enligt 2 kap. MB.","affects":"Noden själv, B20-090 samt prövning och överklagande i B30/B40/B50 och B70.","impact":"Förlängda domstolsprocesser med experttvister, krav på nya beräkningar och kompletterande utredningar, samt osäkerhet om villkorens utformning ända till slutbeslut.","mitigation":"Använd etablerade och granskade metoder, dokumentera osäkerheter med känslighets- och scenarieanalyser, låt oberoende experter granska modellerna före inlämning, och presentera resultaten så att icke-specialister kan följa resonemangen.","source_refs":["MB","MBD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-070-01","node_id":"B20-070","chart_key":"B20","node_label":"Ta fram förenklat miljöunderlag","title":"Det förenklade underlaget underkänns vid ansökan","category":"Rättslig osäkerhet","trigger":"Prövningsmyndigheten bedömer vid ansökningsprövningen att de väsentliga miljöeffekterna trots allt kräver en fullständig specifik miljöbedömning.","description":"Det förenklade underlaget enligt 6 kap. 47 § MB är avsett för verksamheter där betydande miljöpåverkan inte kan antas. Men den slutliga bedömningen av underlagets tillräcklighet ligger hos den myndighet eller domstol som prövar ansökan, inte hos den som tog fram det. Om underlaget är för magert – t.ex. saknar redovisning av samrådet eller av effekter som visar sig ha större räckvidd än antaget – kan prövningsmyndigheten kräva en fullständig MKB. Projektet måste då i efterhand genomföra avgränsningssamråd och komplett miljöbedömning, fast i ett läge där ansökan redan lämnats och parter engagerats.","motivation":"Rättspraxis är konsekvent med att prövande instans själv avgör om miljöunderlaget håller (NJA 2009 s. 321); praxis om att bristfälliga miljökonsekvensbeskrivningar kan leda till avvisning sammanfattas i bl.a. Uppsala kommuns rättsgenomgång i yttrandet över SOU 2024:98.","affects":"Noden själv, B20-G080, B20-090 och ansökningsprövningen i B30/B40 (inklusive C-/anmälningsspåret där underlaget används).","impact":"Tvingande uppgradering till fullt MKB-spår efter inlämnad ansökan – omstart av miljöbedömningen med avgränsningssamråd och ny utredningsfas, med fördärvad tidsplan och förtroendeskada.","mitigation":"Ta inte genvägar i det förenklade spåret: redovisa samrådet fullständigt, beskriv effekterna med samma strukturella rigor som i en MKB fast i mindre skala, och säkra att länsstyrelsens BMP-beslut dokumenterat matchar det underlag som produceras.","source_refs":["MB","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-080-01","node_id":"B20-080","chart_key":"B20","node_label":"Genomför gränsöverskridande samråd","title":"Översättnings- och remissleder i Esbo-förfarandet drar ut tiden","category":"Myndighetskapacitet & handläggning","trigger":"Underrättelse till berörd stat kräver översatt underlag, internationella remissvar inom konventionens tidsramar och samordning mellan Naturvårdsverket, UD och verksamhetsutövaren.","description":"Esbo-förfarandet innebär att den berörda staten ska underrättas så tidigt som möjligt och senast när allmänheten i det egna landet informeras, följt av överläggningar där den berörda statens och dess allmänhets synpunkter ska beaktas. Praktiskt innebär det översättning av centrala delar av MKB:n, remisstider som inte kan kortas unilateralt, och en kedja av statliga aktörer (Naturvårdsverket som kontaktpunkt, Utrikesdepartementet, motsvarigheterna i berörd stat) som alla har egna handläggningstider. Varje länk kan fördröja, och förfarandet ligger utanför verksamhetsutövarens och den svenska prövningsmyndighetens kontroll. Under tiden kan det nationella förfarandet inte slutföras utan att resultatet riskerar att undermineras.","motivation":"Esbokonventionens krav på underrättelse, överläggningar och beaktande av grannstatens synpunkter är införlivade i 6 kap. MB och dokumenterade i svensk praxis via Naturvårdsverkets kontaktpunktsroll (bl.a. Esbo-rapporten om havsbaserad vindkraft Polen/Baltyk, där översättning och internationell remissbehandling utgjorde egna processled).","affects":"Noden själv, B20-090 och hela den nedströms ansökningsprocessen (B30/B40/B50) vars slutbeslut inte bör föregå det internationella samrådets slutförande.","impact":"Fördröjning om flera månader till över ett år beroende på berörd stats engagemang, merkostnader för översättning och internationell processledning, samt osäker tidsplan gentemot finansiärer.","mitigation":"Initiera underrättelsen parallellt med nationellt samråd, översätt nyckeldokument proaktivt, håll löpande kontakt med Naturvårdsverkets kontaktpunkt och bygg Esbo-ledet in som egen deltidsplan med marginal i huvudtidsplanen.","source_refs":["MB","EXT: Naturvårdsverket Esbo-rapport Polen/Baltyk https://www.naturvardsverket.se/49f10c/globalassets/media/dokument/esbokonventionen/polen-baltyk-i/esborapport.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B20-080-02","node_id":"B20-080","chart_key":"B20","node_label":"Genomför gränsöverskridande samråd","title":"Berörd stats synpunkter tvingar fram projektändringar","category":"Samråd & motstånd","trigger":"Den underrättade staten eller dess allmänhet framför synpunkter på gränsöverskridande effekter som inte kan tillgodoses utan att projektets lokalisering, utformning eller skyddsåtgärder ändras.","description":"Esbo-förfarandet är inte bara en informationsskyldighet: den berördes synpunkter ska beaktas i beslutet, och resultatet av överläggningarna ska återkopplas i MKB och beslut. Om en grannstat – av egna miljöskäl eller efter inrikespolitiskt tryck – framför substantiella invändningar om t.ex. gränsvatten, marina livsmiljöer eller sträckande fåglar, måste projektet antingen anpassas eller underbygga sin analys betydligt bättre. Sådana invändningar kommer ofta med krav på fördjupade gemensamma utredningar eller förändrade skyddsåtgärder som påverkar projektets ekonomi och tidsplan. Invändningarna lever vidare som dokumenterat material i den nationella prövningen och eventuella överklaganden.","motivation":"Esbokonventionens överläggningsmekanism är utformad för att ge berörd stat reellt inflytande över beslutsunderlaget; svensk erfarenhet av gränsöverskridande marina projekt (Naturvårdsverkets Esbo-dokumentation för Östersjön) visar att grannstaters synpunkter kan kräva omarbetade effektanalyser och åtgärdsprogram innan det nationella beslutet kan fattas.","affects":"Noden själv, B20-060 (omarbetad MKB), B20-090 och nedströms prövning samt villkorsutformning i B30/B40/B50.","impact":"Projektändringar eller förstärkta skyddsåtgärder sent i processen, reviderad MKB, förlängd förhandlingsfas med berörd stat och försvagad förhandlingsposition gentemot finansiärer och kunder.","mitigation":"Behandla grannstaten som en strategisk part redan före formell underrättelse: informell förhandskontakt, gemensamma expertmöten om delade effektvägar, och tidig analys av vilka projektanpassningar som är rimliga om synpunkter kommer.","source_refs":["MB","EXT: Naturvårdsverket Esbo-rapport Polen/Baltyk https://www.naturvardsverket.se/49f10c/globalassets/media/dokument/esbokonventionen/polen-baltyk-i/esborapport.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-090-01","node_id":"B20-090","chart_key":"B20","node_label":"Kvalitetssäkra miljöunderlaget mot ansökningsramen","title":"Glapp mellan MKB och teknisk ansökan upptäcks i prövningen","category":"Underlagsbrist & data","trigger":"Villkorsförslag, åtgärdsprogram och teknisk beskrivning i ansökan motsvarar inte vad samråd, avgränsning och MKB har slagit fast – spårbarhetskedjan brister.","description":"Kvalitetssäkringen ska säkerställa att det finns en obruten kedja från samrådssynpunkter och avgränsningsbeslut via MKB:ns effektbedömningar till de konkreta villkorsförslag och skyddsåtgärder som ansökan yrkar på. I praktiken tas MKB och teknisk ansökan ofta fram av olika team – miljökonsulter respektive projekteringsledning – och glapp uppstår: åtgärder som MKB:n förutsätter saknas i villkorsförslagen, eller kapacitet och driftfall skiljer sig åt mellan dokumenten. Prövningsmyndigheter och klagande granskar just dessa inkonsekvenser, och ett upptäckt glapp kan diskreditera hela underlaget även där det i övrigt håller.","motivation":"Erfarenheten från svenska tillståndsmål visar att inkonsekvenser mellan ansökan och MKB är en återkommande kompletterings- och klagogrund; NJA 2009 s. 321 och efterföljande praxis (t.ex. MÖD M 14424-22, dom 2024-03-06) understryker att MKB:n måste kunna läggas till grund för själva tillåtlighetsbedömningen – vilket förutsätter att den beskriver samma verksamhet som ansökan.","affects":"Noden själv och nedströms B20-END med handoff till B30-START/B40/B50, där glappet aktualiseras som kompletteringskrav eller grund för återförvisning och överklagande.","impact":"Kompletteringskrav i prövningen, förnyad samrådsberörda-fråga vid väsentliga avvikelser, försenat beslut och i allvarliga fall avvisning eller återförvisning för ny handläggning.","mitigation":"Inför en spårbarhetsmatris som länkar varje samrådssynpunkt → avgränsningsställningstagande → MKB-avsnitt → villkorsförslag. Genomför en gemensam slutgranskning av MKB och teknisk ansökan med samma granskningslag före inlämning.","source_refs":["MB","MBD","NV_PERMIT","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-090-02","node_id":"B20-090","chart_key":"B20","node_label":"Kvalitetssäkra miljöunderlaget mot ansökningsramen","title":"Projektet har förändrats utan att samrådet förnyats","category":"Överklagande & rättsprocess","trigger":"Mellan samråd och ansökan har projektets omfattning, teknik eller lokalisering ändrats i det tysta, och kvalitetssäkringen upptäcker – eller missar – att samrådsunderlaget inte längre motsvarar verkligheten.","description":"Under utrednings- och MKB-arbetet, som kan pågå i flera år, är det vanligt att projektet justeras: fler turbiner, ändrad kabelsträckning, ny processlinje, utökad anläggningsyta. Om ändringarna är väsentliga utan att samrådet förnyats bygger hela underlagskedjan på en äldre projektversion. Frågan om förnyat samråd är en känd stridsfråga: praxis visar att förnyelse inte alltid krävs vid fördröjning, men väsentliga projektändringar är en annan sak. Om glappet upptäcks först av klagande eller prövningsmyndighet kan ansökan avvisas eller återförvisas, och förtroendet för sökanden tar skada. Om kvalitetssäkringen i denna nod missar glappet blir konsekvensen densamma fast senare och dyrare.","motivation":"I HFD 2024 not. 60 (Karlsborgs flygplats) prövades bl.a. påståendet att nytt samråd borde ha genomförts när prövningen återupptogs efter återförvisning; HFD konstaterade att förnyat samråd inte generellt krävs vid utdragen handläggning, men bedömningen är kontextberoende – väsentliga projektändringar bedöms strängare. MÖD ÖM 12531-22 visar dessutom att samrådsbrister kan leda till avvisning i första instans.","affects":"Noden själv, hela B20-spåret retroaktivt (B20-040, B20-060) och nedströms ansökningsprocesser i B30/B40/B50 samt överklaganden i B70.","impact":"Förnyat samråd och omarbetad MKB, avvisnings- eller återförvisningsrisk i prövningen, och flera års fördröjning om bristen först aktualiseras i domstol.","mitigation":"Inför en ändringslogg över projektparametrar med tröskelbedömning: varje väsentlig ändring utlöser en formell prövning av behovet av förnyat samråd, dokumenterad och avstämd med länsstyrelsen. Låt kvalitetssäkringen verifiera att ansökan och samrådsunderlag beskriver samma projekt.","source_refs":["MB","NV_EIA","EXT: Delphi om ÖM 12531-22 https://www.delphi.se/sv/insights/delphi-insights-brister-rorande-samrad-ar-inte-tillrackligt-skal-for-att-avsla-ansokan-om-tillstand-till-vindkraftpark/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-G010-01","node_id":"B20-G010","chart_key":"B20","node_label":"Hur initieras miljöbedömningen?","title":"Fel vald miljöbedömningsväg ger dubbelarbete och omstart","category":"Rättslig osäkerhet","trigger":"Verksamhetsutövaren och länsstyrelsen väljer undersökningssamråd, direkt specifik miljöbedömning eller Natura 2000-spår utan fullständig kartläggning av projektets effekter och skyddsområden i närheten.","description":"I denna vägvalsnod avgörs om miljöbedömningen ska inledas med ett undersökningssamråd och BMP-prövning, om man kan gå direkt på avgränsningssamråd och specifik miljöbedömning, eller om projektet kräver ett särskilt Natura 2000-spår. Väljer man undersökningsspåret för en verksamhet där betydande miljöpåverkan i praktiken är given tillförs ett onödigt led med eget samråd och separat beslut. Väljer man direktspåret för en verksamhet där obligatoriska undersökningskrav enligt miljöbedömningsförordningen gäller kan hela förfarandet ifrågasättas formellt. Missas att projektet ligger inom eller nära ett Natura 2000-område upptäcks tillståndsplikten enligt 7 kap. 28 a § MB först i ett senare skede.","motivation":"Praxis är tydlig med att Natura 2000-frågor måste identifieras och prövas fullständigt, exakt och slutligt i något skede av processen (NJA 2013 s. 613, återgivet bl.a. i HFD 2024 not. 60 om Karlsborgs flygplats, där avgränsningen av vilka Natura 2000-områden som skulle tillståndsprövas blev central). Att upptäcka Natura 2000-beröringen efter valt spår leder i praktiken till omläggning av hela miljöbedömningen.","affects":"Noden själv och grenvalen B20-010/B20-040; vid fel val även B20-030, B20-060 och nedströms hela ansökningsprocessen (B30/B40/B50) där underlaget ska användas.","impact":"Omläggning av förfarandet med nya samråd och nya beslut, förlorad kalendertid motsvarande ett helt processled, samt risk för formella fel som aktualiseras först vid domstolsprövning.","mitigation":"Gör en tidig screening av MBD:s obligatoriska kategorier och av Natura 2000-beröring (geografisk skärning mot förtecknade områden och bevarandeplaner) innan vägval. Beslutsunderlaget ska dokumentera varför valt spår är rätt. Ta in länsstyrelsens samrådssamordnare i själva vägvalet.","source_refs":["MB","MBD","NATURA","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-G010-02","node_id":"B20-G010","chart_key":"B20","node_label":"Hur initieras miljöbedömningen?","title":"Sektorsspår och Natura-kollisioner fångas inte i vägvalet","category":"Sektorssamordning","trigger":"Projektet omfattar delar som regleras av sektorslagstiftning (PBL, ellagen, minerallagen, väg-/järnvägslag) eller berör strandskydd och artskydd, utan att dessa gränssnitt vägs in i valet av miljöbedömningsväg.","description":"Miljöbedömningens omfattning påverkas av vilka parallella tillstånds- och dispensprocesser projektet drar med sig. Ett vägval som bara utgår från miljöbalkens 6 kapitel missar att sektorsprocesserna har egna samråds- och MKB-krav som måste samordnas för att undvika dubbelarbete eller motstridiga underlag. Ett havsbaserat eller strandnära projekt kan t.ex. kräva strandskyddsdispens, Natura 2000-tillstånd och artskyddsdispens parallellt – alla med egna underlagskrav som bör prägla miljöbedömningen redan vid initieringen. Om gränssnitten inte identifieras här blir miljöbedömningen färdig utan att täcka det underlag sektorsinstanserna behöver.","motivation":"Erfarenheten från svenska havsbaserade vindkraftsprocesser visar att nätkoncessioner, kabelkorridorer och angränsande tillstånd skapar beroenden som måste hanteras redan i samråds- och avgränsningsfasen – i MÖD:s avgörande ÖM 12531-22 (2023-12-21) var just innehavare av nätkoncession och angränsande vindkraftstillstånd att anse som särskilt berörda. Verifierat via Delphi Advokatfirmas genomgång av avgörandet.","affects":"Noden själv, B20-040 (avgränsningens bredd), B20-060 (MKB:ns innehåll) samt parallella spår i B50 (sektorstillstånd) och B60.","impact":"Kompletterande utredningar och förnyade samråd när sektorskrav upptäcks, fördröjning och risk för motstridiga bedömningar mellan instanser som måste harmoniseras i efterhand.","mitigation":"Koppla vägvalet till B10-processens tillståndsmatris så att alla identifierade tillstånd och dispenser speglas i miljöbedömningens planering. Ta fram en gränssnittslista över sektorslagstiftning och låt länsstyrelsen bekräfta samordningsbehovet.","source_refs":["MB","MBD","NATURA","PBL","STRAND","ARTSKYDD","ELLAG","MINERALLAG","EXT: Delphi om ÖM 12531-22 https://www.delphi.se/sv/insights/delphi-insights-brister-rorande-samrad-ar-inte-tillrackligt-skal-for-att-avsla-ansokan-om-tillstand-till-vindkraftpark/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-G010-03","node_id":"B20-G010","chart_key":"B20","node_label":"Hur initieras miljöbedömningen?","title":"Pågående reformer gör vägvalet rättsligt rörligt","category":"Politisk & policyrisk","trigger":"Ikraftträdande ändringar i miljöbalken (SFS 2026:400) och den nya lagen (2026:399) om verksamheter och åtgärder för förnybar energi ändrar förutsättningarna för miljöbedömningens upplägg under pågående projekt.","description":"Noden bygger på 6 kap. 20–23 §§ MB i den lydelse som gäller 2026, men regelverket har just förändrats genom SFS 2026:400 som infört bl.a. nya skriftliga avgränsningsbedömningar och särskilda regler kopplade till lagen (2026:399) om förnybar energi. Projekt som initierar miljöbedömningen nära ikraftträdandet måste avgöra vilken lydelse som ska tillämpas och hur övergångsbestämmelser slår. En verksamhetsutövare som planerar efter gamla rutiner kan välja ett upplägg som inte längre matchar de nya kraven – t.ex. missa att vissa förnybarprojekt nu får bindande avgränsningsbeslut. Osäkerheten om den kommande Miljöprövningsmyndigheten (S1) tillkommer som strukturell förändring av aktörslandskapet.","motivation":"SFS 2026:400 och lag (2026:399) är verifierade författningar publicerade i Svensk författningssamling april 2026; 6 kap. 32 a–32 b §§ MB i ny lydelse inför skriftliga och för förnybar energi delvis bindande avgränsningsbesked, vilket direkt förändrar vad vägvalet ska ta höjd för.","affects":"Noden själv och nedströms B20-040, B20-050 (avgränsningsbeslutets karaktär) samt tidsplanen för B20-060.","impact":"Omläggning av processupplägget, osäkerhet om vilka bedömningar som blir bindande, och risk för att framtaget underlag inte matchar de krav som gäller när ansökan lämnas in.","mitigation":"Gör en uttrycklig lagvalsanalys per projektstartdatum, följ Naturvårdsverkets och länsstyrelsernas tillämpningsvägledningar för de nya bestämmelserna och dokumentera vilket regelverk som tillämpas i varje led.","source_refs":["MB","MBD","SFS2026_400","RENEWABLE","NEW_AUTH"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B20-G020-01","node_id":"B20-G020","chart_key":"B20","node_label":"Betydande miljöpåverkan?","title":"Gränsdragningen mellan full MKB och förenklat underlag missbedöms","category":"Rättslig osäkerhet","trigger":"Sökandens eget antagande om betydande miljöpåverkan, eller länsstyrelsens beslut, stämmer inte med prövningsmyndighetens senare bedömning av vilken miljöbedömning som krävs.","description":"Vägvalsnoden styr om projektet ska producera en fullständig MKB med avgränsningssamråd eller räcker med det förenklade underlaget enligt 6 kap. 47 § MB. Gränsen för 'betydande miljöpåverkan' är en rättslig bedömningsfråga där praxis utvecklats genom prövning i konkreta fall, och olika instanser kan dra den olika. En verksamhetsutövare som går förenklat spår i gränslandet tar en kalkylerad risk: prövningsmyndigheten kan vid ansökan kräva fullständig miljöbedömning, vilket omintetgör det arbete som lagts. Å andra sidan kostar ett onödigt fullspår tid och pengar för projekt som inte behöver det.","motivation":"I HFD 2024 not. 60 (Karlsborgs flygplats) prövades ingående om MKB:n uppfyllde lagens krav, inklusive kumulativa aspekter och icke-teknisk sammanfattning – ett exempel på hur noga slutinstansen granskar miljöbedömningens tillräcklighet. NJA 2009 s. 321 fastslog att MKB:n ska anpassas till vad det enskilda fallet kräver.","affects":"Noden själv och grenvalen B20-040/B20-070; vid missbedömning även B20-060 och hela ansökningsprocessen nedströms.","impact":"Omläggning mellan spår med förlorade månader, eller överinvestering i utredningsarbete som inte behövts; i värsta fall kompletterings- eller avvisningskrav vid ansökan.","mitigation":"I gränsfall: välj det säkrare spåret eller avstäm uttryckligen med länsstyrelsen och dokumentera ställningstagandet. Rådfråga extern miljörättslig expertis vid oklarhet och låt beslutet vara reviderbart vid ändrade förutsättningar.","source_refs":["MB","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-G080-01","node_id":"B20-G080","chart_key":"B20","node_label":"Gränsöverskridande påverkan?","title":"Gränsöverskridande påverkan upptäcks för sent","category":"Rättslig osäkerhet","trigger":"Projektets möjliga påverkan på annan stat – via vattendrag, luftburna utsläpp, fågel- och fiskmigrationsvägar eller havsområden – bedöms som obefintlig eller oväsentlig utan ordentlig analys.","description":"Vägvalsnoden ska avgöra om internationell underrättelse och samråd enligt Esbo-regelverket (införlivat i 6 kap. MB, bl.a. 13 § om informationsutbyte) krävs. Bedömningen är inte självklar: effekter på gränsvattendrag mot Norge och Finland, på Östersjöns marina miljö gentemot grannländer, eller på sträckande arter kan kvalificera även vid måttliga nationella effekter. En missbedömning här upptäcks ofta först när underlaget är klart eller när en grannstat – via egna kanaler eller aktörer – får kännedom om projektet och kräver underrättelse. Att då börja om med Esbo-förfarandet innebär översättning, internationella remisstider och reviderad MKB mitt i processen.","motivation":"Esbokonventionen är införlivad i 6 kap. miljöbalken och verifierad som tillämplig på svenska tillståndsprocesser; Naturvårdsverket fungerar som svensk kontaktpunkt och har dokumenterad praxis från gränsöverskridande förfaranden (t.ex. Esbo-rapport om havsbaserad vindkraft i södra Östersjön, Polen/Baltyk). Att underrättelseskyldigheten bedömts fel har i internationell praxis återkommande orsakat processavbrott.","affects":"Noden själv, B20-080 (Esbo-spåret), B20-090 och nedströms ansökningsprocesser där ett sent aktiverat Esbo-förfarande bryter tidsplanen.","impact":"Sent aktiverat internationellt förfarande med översättnings- och remissleder om flera månader, reviderad MKB och risk för diplomatisk och rättslig friktion som försenar hela tillståndsprocessen.","mitigation":"Gör en dokumenterad screening av gränsöverskridande effektvägar (vatten, luft, arter, hav) redan i avgränsningsfasen och rådfråga Naturvårdsverket som kontaktpunkt vid minsta osäkerhet. Lägg Esbo-frågan som standardpunkt i avgränsningssamrådet med länsstyrelsen.","source_refs":["MB","NATURA","EXT: Naturvårdsverket Esbo-rapport Polen/Baltyk https://www.naturvardsverket.se/49f10c/globalassets/media/dokument/esbokonventionen/polen-baltyk-i/esborapport.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B20-START-01","node_id":"B20-START","chart_key":"B20","node_label":"Miljöbedömningsväg initierad","title":"Samrådet initieras för sent – alternativen är redan låsta","category":"Samråd & motstånd","trigger":"Miljöbedömningen påbörjas först när lokalisering, teknikval och utformning i praktiken är beslutade inom projektorganisationen.","description":"Samråd och miljöbedömning ska enligt miljöbalkens 6 kapitel ske medan det fortfarande finns reella alternativ kvar att välja mellan. Om verksamhetsutövaren inväntar interna investeringsbeslut, färdig projektering eller genomförda markköp innan samrådet startas blir samrådet i praktiken en informationsövning snarare än ett reellt inflytande. Sakägare och myndigheter som möter färdigkokta förslag tenderar att formalisera sitt motstånd tidigt, och alternativredovisningen i den kommande MKB:n blir retroaktiv motivering i stället för genuin jämförelse. Det underminerar både samrådets rättssäkerhet och projektets förhandlingsutrymme mot kommun och länsstyrelse. Risken förstärks av att nollalternativ och alternativa lokaliseringar då inte kan redovisas trovärdigt.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att låsta projekt som möter sent samråd får svårare att hantera krav på alternativredovisning; i HFD 2024 not. 60 (Karlsborgs flygplats) prövades bl.a. om MKB:ns alternativredovisning och samråd varit tillräckliga i ett mål där verksamheten prövats i omgångar över lång tid. Domstolarnas krav på att MKB:n ska kunna läggas till grund för bedömning enligt 2 kap. MB (NJA 2009 s. 321) förutsätter att alternativ verkligen prövats innan de omöjliggjorts.","affects":"Noden själv samt B20-G010, B20-010, B20-020, B20-040 och indirekt B20-060 (alternativredovisningen i MKB:n) och nedströms ansökningsprocesser i B30–B50.","impact":"Förnyat eller kompletterande samråd, omarbetad alternativredovisning, fördröjning av hela miljöbedömningsspåret och försämrat förtroende hos berörda som följer projektet in i ansöknings- och överklagandefasen.","mitigation":"Starta miljöbedömningsprocessen parallellt med förstudien (B10) innan lokalisering och teknikval låses. Dokumentera i ett alternativbeslut vilka alternativ som är öppna vid samrådets början. Sätt en intern spärr: inget investerings- eller markförvärvsbeslut före inlett samråd. Använd tidig dialog med länsstyrelse för att kalibrera tidpunkten.","source_refs":["MB","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-010-01","node_id":"B30-010","chart_key":"B30","node_label":"Inventera tillstånds- och ändringshistorik","title":"Oöverblickbar villkorshistorik","category":"Underlagsbrist & data","trigger":"Verksamheten har ett grundtillstånd från äldre lagstiftning (miljöskyddslagen eller naturvårdslagen) plus ett långt följd av ändringstillstånd, anmälningar och tillsynsbeslut som aldrig konsoliderats.","description":"Vid ändring och omprövning måste verksamhetsutövaren enligt 22 kap. 1 d § miljöbalken redovisa villkor som meddelats i tidigare tillstånd och ange deras samband med den aktuella ansökan. Äldre anläggningar har ofta ett flertal tillståndsbeslut utfärdade under olika rättsregimer, där vissa villkor upphävts, andra skjutits på prövotid och ytterligare andra aldrig aktualiserats. Utan en konsoliderad historik kan varken sökanden eller prövningsinstansen avgöra vilka villkor som faktiskt gäller, vilket urholkar både ansökningens kvalitet och möjligheten att göra en riktig avgränsning i senare led.","motivation":"Regeringen framhåller i proposition 2023/24:152 att upprepad användning av ändringstillstånd gör det 'svårt att överblicka vilka villkor som gäller för verksamheten' – ett erkänt strukturellt problem som motiverat reformen med ändringsprövning som huvudregel. Naturvårdsverkets vägledning om tillståndsprövning poängterar att fullständig villkorsredovisning är en förutsättning för effektiv handläggning.","affects":"Noden B30-010 samt nedströms B30-G020, B30-G030, B30-G050 och B30-O120, där historiken styr klassificering, spårval, avgränsning och omprövningsram.","impact":"Kompletteringskrav från prövningsinstans, felaktig prövningsram, risk att gamla villkor oavsiktligt lever kvar eller upphör, samt fördröjning i domstolsledet.","mitigation":"Bygg en konsoliderad tillstånds- och villkorsmatris med diarienummer, rättskraftsdatum och sambandsmarkering per villkor; stäm av mot tillsynsmyndighetens register och ansökningsarkiv innan ansökan formuleras.","source_refs":["MB","NV_PERMIT","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-010-02","node_id":"B30-010","chart_key":"B30","node_label":"Inventera tillstånds- och ändringshistorik","title":"Äldre beslut saknas i arkiv","category":"Underlagsbrist & data","trigger":"Tillståndsbeslut, domar eller tillsynsprotokoll från 1970–1990-talen har inte digitaliserats, gått förlorade vid bolagsöverlåtelser eller inte återfinns i myndigheternas register.","description":"Inventeringen förutsätter att alla relevanta handlingar faktiskt går att hitta. För verksamheter med lång historik – särskilt sådana som bytt ägare eller bolagiserats – saknas ofta originalbeslut, bilagor med tekniska beskrivningar och bevis om delgivning. När handlingarna inte kan återfinnas blir det oklart vilken 'funktionell verksamhet' som prövats, vilket försvårar såväl klassificeringen i B30-G020 som behörighetsbedömningen vid omprövning i B30-GO130, där rätt instans kan bero på vilket tillståndsslag som ursprungligen meddelades.","motivation":"Erfarenheten från svenska omprövnings- och ändringsmål visar att behörighets- och avgränsningsfrågor ofta hakar upp sig just på äldre besluts klassificering och innehåll; SOU 2022:33 'Om prövning och omprövning' beskriver utförligt hur behörigheten för efterföljande prövning knyts till det ursprungliga tillståndet och tillståndsmyndigheten, vilket förutsätter att dessa beslut kan identifieras.","affects":"Noden B30-010 samt nedströms B30-G020, B30-GO130 och B30-O120.","impact":"Behörighetstvister om rätt instans, omfattande arkivrekvisitioner och kompletteringsrundor som förlänger handläggningen, samt risk för avvisning om saken inte kan redas ut.","mitigation":"Rekvirera tidigt handlingar från länsstyrelsens, domstolens och kommunens arkiv, kartlägg ägarkedjan för verksamheten, och låt dokumentera vilka beslut som inte kunnat återfinnas med en juridisk bedömning av konsekvenserna.","source_refs":["MB","EXT: SOU 2022:33 Om prövning och omprövning https://www.riksdagen.se/sv/dokument-och-lagar/dokument/statens-offentliga-utredningar/om-provning-och-omprovning_hab333/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B30-060-01","node_id":"B30-060","chart_key":"B30","node_label":"Lås prövningsram och gränssnitt","title":"Parallella tillståndsspår missas i gränssnittsmatrisen","category":"Sektorssamordning","trigger":"Prövningsramen låses utan att kartlägga att verksamheten samtidigt kräver prövning av vattenverksamhet (B40), berör Natura 2000-områden, strandskydd, Seveso-krav eller PBL-frågor (B50).","description":"Noden ska producera en gränssnittsmatris som länkar 9 kap.-prövningen till vatten, Natura 2000, PBL, Seveso, IED och sektorsspår. Missas en koppling – till exempel att utbyggnaden kräver anläggande i vatten, eller att en kemikaliehantering höjer verksamheten över Seveso-tröskeln – kan miljödomstolen antingen inte sammanjämka målen eller tvingas skjuta upp handläggningen i väntan på parallella ansökningar. Sektorstillstånd som upptäcks sent kan också påverka lokaliserings- och utformningsfrågor som miljöprövningen redan tagit ställning till.","motivation":"Preemraff Lysekil illustrerar komplexiteten i kombinerade mål: ärendet omfattade både miljöfarlig verksamhet och vattenverksamhet, prövades av mark- och miljödomstolen i Vänersborg (beslut 15 juni 2020) och drog vidare till Mark- och miljööverdomstolen med upprepade uppskov innan slutligt avgörande. Att sammanjämka parallella rättsregimer i ett mål är en av de främsta orsakerna till förlängda handläggningstider i stora industrimål.","affects":"Noden B30-060 samt nedströms B30-070, B30-100 och B30-G110, och parallella delprocesser B40 och B50 som kan behöva initieras sent.","impact":"Uppskjuten domstolsprocess, inkonsekventa villkor mellan tillstånd, behov av kompletterande ansökningar och i värsta fall återförvisning för sammanjämkning.","mitigation":"Upprätta en obligatorisk gränssnittsmatris tidigt med checklista över samtliga tillståndsregimer (FVV/LVV, NATURA, STRAND, SEVESO, PBL, KML, ELLAG), och samordna ansökningarna så att kombinerade mål kan prövas gemensamt i mark- och miljödomstol.","source_refs":["MB","FVV","NATURA","SEVESO","PBL","EXT: Sveriges Domstolar, Preemraff Lysekil 2020-06-15 https://www.domstol.se/nyheter/2020/06/domstolen-anser-att-verksamheten-vid-preemraff-i-lysekil-kan-tillatas/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-060-02","node_id":"B30-060","chart_key":"B30","node_label":"Lås prövningsram och gränssnitt","title":"Prövningsramen låses för snävt","category":"Underlagsbrist & data","trigger":"I vilja att hålla processen smal dokumenteras en prövningsram som inte täcker de miljöeffekter och äldre villkor som motparter eller domstolen senare anser hänga samman med ansökan.","description":"Prövningsramen dokumenterar vilka delar av verksamheten och vilka äldre villkor som omfattas av prövningen. En alltför snäv ram minskar visserligen underlagsarbetet men skapar sårbarhet: sakägare, länsstyrelsen eller domstolen kan hävda att effekter eller villkor utanför ramen måste in, varvid kompletteringsförelägganden, utökad kungörelse eller återförvisning följer. I kombinerade mål kan en snäv ram dessutom bryta sammanhållningen mellan den miljöfarliga verksamheten och tillhörande vattenverksamhet.","motivation":"Domstolspraxis om sambandet mellan anläggningsdelar och villkor – bland annat i mål där miljööverdomstolen krävt att utsläppsfrågor prövas gemensamt trots avgränsade ansökningar – visar att ramen regelbundet vidgas under handläggningens gång. 22 kap. 1 d § miljöbalken ställer dessutom uttryckliga krav på redovisning av sambandet med tidigare villkor, vilket begränsar hur snäv ramen kan göras.","affects":"Noden B30-060 samt nedströms B30-070 (underlagsverifiering) och B30-100 (ansökningens innehåll).","impact":"Kompletteringskrav och utökad kungörelse i domstol, återöppnad samråds- och utredningsfas, samt förlängd handläggningstid.","mitigation":"Låt prövningsramen granskas av både jurist och teknikkonsult mot recipient- och störningsanalys, markera explicit vilka villkor som lämnas utanför och varför, och ha en förberedd plan för att bredda ramen utan att ansökan behöver göras om från grunden.","source_refs":["MB","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-070-01","node_id":"B30-070","chart_key":"B30","node_label":"Verifiera miljöbedömning och samråd","title":"MKB:n täcker inte den prövning som faktiskt krävs","category":"Underlagsbrist & data","trigger":"Miljöbedömningen från B20 är framtagen för ett annat prövningsobjekt eller en annan omfattning än den som spårvalet i B30 kräver – till exempel en förenklad ändringsbedömning när förelagt tillstånd kräver fullständig MKB.","description":"Noden ska säkerställa att B20 genomförts i rätt omfattning för det valda spåret. En MKB som saknar tillräckliga grundvatten-, recipient- eller ackumulationsdata, eller som inte behandlar alternativa utformningar, kan leda till att ansökan inte anses tillräcklig som beslutsunderlag. I domstolsprocesser är brister i MKB:n en av de vanligaste orsakerna till kompletteringsförelägganden, avvisning eller avslag, och för säsongsberoende naturinventeringar kan en brist inte rättas förrän nästa fältsäsong.","motivation":"Mark- och miljööverdomstolens avvisning av Cementas ansökan om fortsatt kalkbrytning i Slite den 6 juli 2021 – där bolaget inte visat att verksamheten kunde bedrivas utan påverkan på grundvattnet – är det mest kända moderna exemplet på hur underlagsbrister fäller en hel ansökan. Nordkalks mål om Ojnarefjärden visar samma mönster: MKB- och Natura-frågor förlängde processen i över ett decennium.","affects":"Noden B30-070 samt nedströms B30-100 (ansökan bygger på underlaget) och B30-G110/END60 (domstolsprövningen).","impact":"Avvisning eller avslag i domstol, obligatorisk ny fältsäsong för inventeringar, ny kungörelse och i allvarliga fall att hela ansökningsprocessen måste börja om.","mitigation":"Gör en formell gap-analys av MKB:n mot det valda spårets krav innan ansökan, säkra att säsongsberoende inventeringar schemalagts med god marginal, och låt en oberoende granskare pröva underlaget mot domstolarnas tillräcklighetskrav.","source_refs":["MB","NV_EIA","EXT: Byggföretagen, Cementkrisen https://byggforetagen.se/cementkrisen/","EXT: Sveriges Natur, Stopp för kalkbrytning i Ojnareskogen (2018) https://www.sverigesnatur.org/aktuellt/stopp-for-kalkbrytning-i-ojnareskogen/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-070-02","node_id":"B30-070","chart_key":"B30","node_label":"Verifiera miljöbedömning och samråd","title":"Förenklat underlag ifrågasätts vid ändring","category":"Rättslig osäkerhet","trigger":"För ändrings- eller förelagd prövning förlitar sig sökanden på det förenklade miljöunderlag som B20 tagit fram, men motparter eller prövningsinstans anser att fullständig miljöbedömning enligt 6 kap. miljöbalken krävs.","description":"Gränsen mellan förenklat underlag och fullständig MKB vid ändring av miljöfarlig verksamhet är inte skarpt reglerad och avgörs av ändringens karaktär. Om verksamhetsutövaren verifierar underlaget som tillräckligt men länsstyrelsen eller berörda sakägare gör annan bedömning, uppstår en tvist om själva beslutsunderlagets bärkraft mitt i processen. I domstol kan frågan avgöras först efter huvudförhandling, vilket innebär att hela processen kan kollapsa i slutskedet trots att den byggt på det förenklade spåret.","motivation":"Naturvårdsverkets vägledning om specifik miljöbedömning anger att bedömningens omfattning ska anpassas till verksamheten, men att prövningsmyndigheten avgör tillräckligheten. Erfarenheten från svenska tillståndsprocesser visar att just bedömningens omfattning är en av de mest frekventa tvistefrågorna i överklaganden av ändringstillstånd.","affects":"Noden B30-070 samt nedströms B30-100 och B30-END60, och uppströms B20 där underlaget producerats.","impact":"Krävda kompletteringar till MKB-nivå mitt i handläggningen, försenade författnings- och kungörelsemoment, och ökad risk för bifall till överklaganden om bristande underlag.","mitigation":"Dokumentera motiveringen för förenklat underlag med utsläpps- och effektjämförelse mot gällande tillstånd, stäm av omfattningen med prövningsinstansen före inlämning, och förbered data så att underlaget snabbt kan kompletteras om kravet höjs.","source_refs":["MB","NV_EIA","NV_PERMIT"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-100-01","node_id":"B30-100","chart_key":"B30","node_label":"Sammanställ 9 kap.-ansökan","title":"Oprecisa yrkanden stjälper handläggningen","category":"Myndighetskapacitet & handläggning","trigger":"Ansökan sammanställs utan preciserade yrkanden om verksamhetens omfattning, utsläppsnivåer och villkor, eller med inbördes motsägelser mellan teknisk beskrivning, MKB och villkorsförslag.","description":"Ansökan enligt 22 kap. 1–1 g §§ miljöbalken ska integrera yrkanden, teknik, utsläpp, miljöunderlag, skyddsåtgärder, villkorsförslag, kontrollprogram och specialunderlag. Domstolar och delegationer bygger hela handläggningen – kungörelse, komplettering, huvudförhandling – på att yrkandena är entydiga. Otydliga eller motsägelsefulla ansökningar genererar kompletteringsrundor som var och en kan ta månader, och i det sämsta fallet avvisning för att ansökan inte kan prövas. Handläggningstiden förlängs därutöver av att prövningsinstanserna har ont om kapacitet.","motivation":"Naturvårdsverkets statistik visar att mark- och miljödomstolarna 2024 hade en medianhandläggningstid på 474 dagar för tillståndsmål om miljöfarlig verksamhet i första instans – kompletteringsrundor är en huvudorsak. Preemraff-målet vid mark- och miljödomstolen i Vänersborg illustrerar hur bolaget under processens gång justerade ansökan, vilket bidrog till den utdragna handläggningen.","affects":"Noden B30-100 samt nedströms B30-G110 och B30-END60 (domstolens/delegationens handläggning).","impact":"Upprepade kompletteringsförelägganden, skjutna huvudförhandlingar, risk för avvisning och total handläggningstid som kan fördubblas.","mitigation":"Låt en dedikerad redaktör granska ansökan för inre konsistens, verifiera att varje yrkande är mätbart och villkorsbart, och använd domstolens och delegationens checklistor för ansökningshandlingar före inlämning.","source_refs":["MB","COURT_MFV","EXT: Naturvårdsverket, Handläggningstid för miljötillståndsprövning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/handlaggningstid-for-miljotillstandsprovning/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-100-02","node_id":"B30-100","chart_key":"B30","node_label":"Sammanställ 9 kap.-ansökan","title":"Villkorsförslagen krockar med tillståndshistoriken","category":"Underlagsbrist & data","trigger":"Föreslagna villkor formuleras utan full hänsyn till vilka äldre villkor som ska upphöra, ändras eller bestå, eller utan sambandsredovisning enligt 22 kap. 1 d § miljöbalken.","description":"Vid ändrings- och samlad prövning måste ansökan redovisa förhållandet till tidigare meddelade villkor. Om villkorsförslagen inte tydligt anger vilka gamla villkor som ersätts kan domstolen meddela villkor som overlappar eller motsäger tidigare beslut, eller lämna gamla villkor kvar i kraft som ingen längre vet gäller. Det skapar en osäker och ofta mer betungande villkorsbild än avsett, och kan leda till tillsynskonflikter långt efter det att domen vunnit laga kraft.","motivation":"Regeringen pekar i prop. 2023/24:152 på överblickbarhetsproblemet med staplade ändringstillstånd som ett av huvudskälen till reformen; när villkor inte konsolideras i ansökningsledet uppstår precis den oöverskådlighet som lagstiftaren vill undvika. Tillsynsmyndigheter rapporterar återkommande att oklar villkorshistorik försvårar deras arbete.","affects":"Noden B30-100 samt uppströms B30-010 (tillståndshistoriken) och nedströms hela tillsyns- och uppföljningsfasen efter B30-END60.","impact":"Dubbla eller motstridiga villkor i kraft samtidigt, tvister vid tillsyn om vad som gäller, och behov av nya ansökningar eller omprövningar för att reda ut villkorsbilden.","mitigation":"Bifoga en villkorsmatris till ansökan som villkor för villkor anger nytt villkor, ersatt villkor och motiv, och låt tillsynsmyndigheten granska matrisen innan inlämning.","source_refs":["MB","EXT: Regeringens proposition 2023/24:152 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/steg-pa-vagen-mot-en-mer-effektiv-miljoprovning_hb03152/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B30-C100-01","node_id":"B30-C100","chart_key":"B30","node_label":"Ta fram C-/ändringsanmälan","title":"Anmälan håller inte för BMP-prövningen","category":"Underlagsbrist & data","trigger":"Anmälan utformas med bristfälliga uppgifter om teknik, utsläpp eller omgivningspåverkan, så att tillsynsmyndigheten inte kan bedöma om verksamheten eller ändringen kan antas medföra betydande miljöpåverkan.","description":"En anmälan enligt 25 § FMH respektive MPF 1 kap. 10–11 §§ ska innehålla de uppgifter, ritningar och tekniska beskrivningar som behövs för att bedöma verksamhetens art, omfattning och miljöeffekter – och för de flesta anmälningar ska underlaget möjliggöra en bedömning av betydande miljöpåverkan (BMP). Ett magert underlag tvingar myndigheten till kompletteringskrav eller, värre, till en positiv BMP-bedömning i brist på bättre data, vilket kan kasta om hela projektet till tillståndsspåret. Kvaliteten på anmälningsunderlaget avgör därmed om det lätta spåret förblir lätt.","motivation":"Naturvårdsverkets vä
