sta bedömningen mot länsstyrelsens riksintressebevakning. Vid minsta tveksamhet, välj planvägen proaktivt istället för att chansa.","source_refs":["PBL","PBL_PLAN","EXT: MÖD dom P 1151-23 (2024) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/p-1151-23-dom-2024-06-05.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P020-01","node_id":"B50-P020","chart_key":"B50","node_label":"Planbesked, planförslag, samråd och granskning","title":"Lokal opinion och samrådsmotstånd förlänger eller omkullkastar planarbetet","category":"Samråd & motstånd","trigger":"Samråd och granskning genererar massivt motstånd från grannar, bybor eller opinion, och kommunen bearbetar om eller lägger planförslaget på hyllan.","description":"Planprocessens samråds- och granskningsfaser ger allmänheten formella kanaler att påverka, och för kontroversiella verksamheter (vindkraft, täkter, industri, avfallsanläggningar) mobiliseras opinion regelbundet. Kommunen måste bemöta synpunkterna sakligt, och starkt motstånd leder i praktiken till omarbetning, utdragna politiska processer eller nedlagda förslag. Eftersom kommunen driver processen är projektägarens inflytande begränsat till underlagets kvalitet och dialogens utformning.","motivation":"Fastighetsägarnas och Byggföretagens statistik över detaljplaner visar att planprocessens fjärde fas – från antagande till laga kraft – präglas av överklaganden och långa ledtider i kommuner med hög överklagandefrekvens, och att lokal konfliktnivå är den främsta drivaren. Källor: Fastighetsägarna (rapport 2023), Byggföretagen (rapport 2023).","affects":"B50-P020 med nedströms B50-P030; loop tillbaka till B50-P020 vid omarbetning och fördröjning av hela PBL-spåret.","impact":"Förlängd planprocess om ett till flera år, nedlagt eller urvattnat planförslag samt försämrat underlag för den parallella miljöprövningen.","mitigation":"Investera i tidig, genuin dialog med berörda innan formellt samråd: lokala möten, anpassningar och dokumenterad bemötande av synpunkter. Samordna budskap och underlag med miljöprövningens samråd i B20 så att allmänheten möter en enhetlig bild.","source_refs":["PBL","PBL_PLAN","EXT: Fastighetsägarna – Överklagande av detaljplaner (rapport 2023) https://www.fastighetsagarna.se/globalassets/bilder/nyheter/sverige/rapport-overklagande-av-detaljplaner-2023.pdf","EXT: Byggföretagen – Överklagande av detaljplaner (2023) https://byggforetagen.se/app/uploads/2023/04/Overklagande-av-detaljplaner-mars-2023.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-P020-02","node_id":"B50-P020","chart_key":"B50","node_label":"Planbesked, planförslag, samråd och granskning","title":"Länsstyrelsens riksintressebevakning stoppar planförslaget","category":"Intressekonflikt & markåtkomst","trigger":"Länsstyrelsen finner vid bevakningen av statliga intressen att planförslaget skadar riksintressen (naturvård, kulturmiljö, rennäring, försvar, totalförsvar) och kommunen backar eller tvingas ändra.","description":"Länsstyrelsen bevakar statliga intressen i planprocessen och kan invända – och i sista hand överklaga eller begära regeringsprövning. När projektet ligger i områden med kolliderande riksintressen (t.ex. renskötsel, försvarsområden, riksintressen för naturvård eller kulturmiljö) kan bevakningen stoppa ett förslag som kommunen själv vill driva. Kollisionerna är ofta flerdimensionella: samma plan kan skada ett riksintresse samtidigt som den tillgodoser ett annat (t.ex. riksintresse för vindbruk eller mineralutvinning).","motivation":"Kallak är exemplet: området är riksintresse både för rennäring och för fyndigheter av värdefulla ämnen, och avvägningen drevs genom Bergsstaten, regeringen och slutligen Högsta förvaltningsdomstolen (HFD 2024 not. 36, mål 801-23). MÖD P 1151-23 visar dessutom att upphävande kan följa när genomförandet skulle skada riksintressen. Källor: Sveriges Domstolar, riksdagen.se (KU20).","affects":"B50-P020, B50-P030 samt indirekt B50-G010:s bedömning av vilka sektorsspår som aktiveras (rennäring/mineral via B50-M010).","impact":"Omarbetat eller nedlagt planförslag, fördröjning om flera år samt i Kallak-liknande fall en konflikt som löper genom flera regelverk och instanser parallellt.","mitigation":"Kartlägg alla riksintressen i området redan i B10-020 och sök aktiv lösning med respektive intressemyndighet (länsstyrelse, sameby, försvar) innan planförslaget låses. Bygg in kompensations- och anpassningsåtgärder i planförslaget från början.","source_refs":["PBL","PBL_PLAN","MB","EXT: HFD 2024 not. 36 (Kallak) https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2025/vb-2024/webbversion-250220.pdf","EXT: MÖD dom P 1151-23 (2024) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/p-1151-23-dom-2024-06-05.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-P030-01","node_id":"B50-P030","chart_key":"B50","node_label":"Anta, överpröva och lagakraftvinn detaljplan","title":"Antagen detaljplan överklagas – laga kraft skjuts upp ett till flera år","category":"Överklagande & rättsprocess","trigger":"Fastighetsägare eller andra med klagorätt överklagar antagandebeslutet till mark- och miljödomstolen inom tre veckor efter kungörelsen.","description":"Antagandebeslutet kan överklagas av berörda sakägare, och MÖD-statistiken visar att en stor andel överklagade planer drivs vidare till andra instans. Överklagandet pausar i praktiken planens användbarhet för bygglov och entreprenad – ett lagakraftvunnet läge är först när överklagandetiden löpt ut eller processen avgjorts i sista instans. För tillståndsprojektet blir planens laga kraft ett beroende lika hårt som miljötillståndets, men med en helt annan processlogik och andra klaganden än i miljöspåret.","motivation":"Boverket konstaterar att antagandebeslut kan överklagas inom tre veckor från justerad kungörelse. Byggföretagens genomgång visar att av 50 till MMD överklagade planer överklagades 36 vidare, och Fastighetsägarna visar att överklagandefrekvensen är den främsta drivaren bakom kommunernas variation i ledtid från antagande till laga kraft. Källor: Boverket, Byggföretagen (2020), Fastighetsägarna (2023).","affects":"B50-P030 med nedströms B50-P040 (bygglov/startbesked) och samlingsgaten B50-G900.","impact":"Fördröjning från månader upp till flera år innan planen kan nyttjas, blockerade bygglovs- och startbeskedprocesser samt osäkerhet som fördyrar finansiering och entreprenadavtal.","mitigation":"Kvalitetssäkra planunderlaget mot de vanligaste överklagandegrunderna (förenlighet med översiktlig plan, riksintressen, buller/skuggor) före antagande. Arbeta för att berörda sakägare når uppgörelser före antagandet och planera tidplanen med explicit lagakraftpuffer.","source_refs":["PBL","PBL_PLAN","COURT_APPEAL","EXT: Boverket – Överklagande till mark- och miljödomstolen https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/overklagande/overklagande-till-mark--och-miljodomstolen/","EXT: Byggföretagen – Överklagande av detaljplaner i praktiken https://byggforetagen.se/app/uploads/2020/02/%C3%96verklagande-av-detaljplaner-i-praktiken.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-P030-02","node_id":"B50-P030","chart_key":"B50","node_label":"Anta, överpröva och lagakraftvinn detaljplan","title":"Detaljplanen upphävs i domstol och planarbetet måste göras om","category":"Överklagande & rättsprocess","trigger":"Domstolen finner att planen strider mot översiktlig plan, riksintressen eller anpassningskravet, eller att handläggningen varit bristfällig, och upphäver antagandet.","description":"Upphävande är det tyngsta utfallet i planöverprövningen: planarbetet återgår i praktiken till B50-P020 och måste göras om från förslagsstadiet. Domstolarna prövar både formella brister och materiella frågor som förenlighet med miljöbalkens hänsynsregler och riksintressen. För projektägaren innebär ett upphävt antagande att all nedströms planering – bygglov, miljöprövningsunderlag som förutsatt planen, entreprenadlogistik – måste omprövas mot ett osäkert planläge.","motivation":"MÖD upphävde i dom P 1151-23 (2024) en detaljplan som inte överensstämde med kommunens översiktliga planering, där handläggningen varit bristfällig och genomförandet skulle skada riksintressen; i dom P 5808-23 (2023) upphävdes en plan som stridde mot 3 kap. 4 § miljöbalken. Källor: Sveriges Domstolar.","affects":"B50-P030 med loop till B50-P020; indirekt alla spår vars underlag förutsatt gällande plan (B30, B40, B50-P040).","impact":"Full omgörning av planprocessen, flera års försening, ogiltiga eller omtvistade förutsättningar för parallella tillståndsärenden samt avskrivna projekteringskostnader.","mitigation":"Säkerställ formell korrekthet i varje led av handläggningen (samråd, granskning, kungörelse, justering) och dokumentera förenlighetsbedömningen mot översiktsplan och riksintressen uttryckligen. Låt extern PBL-expertis granska förslaget före antagande.","source_refs":["PBL","PBL_PLAN","MB","EXT: MÖD dom P 1151-23 (2024) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/p-1151-23-dom-2024-06-05.pdf","EXT: MÖD dom P 5808-23 (2023) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/p-5808-23-dom-2024-05-29.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P030-03","node_id":"B50-P030","chart_key":"B50","node_label":"Anta, överpröva och lagakraftvinn detaljplan","title":"Planens laga kraft avvaktar inte miljöprövningens – beroendekrock mellan spåren","category":"Sektorssamordning","trigger":"Detaljplanen vinner laga kraft efter att miljötillståndet prövats mot det gamla planläget, eller tvärtom, så att besluten bygger på inkonsekventa förutsättningar.","description":"Det finns ingen automatisk samordning mellan PBL-spårets laga kraft och miljöprövningens tidsplan. Miljötillståndet kan meddelas mot en plan som sedan upphävs, eller planen kan lagakraftvinnas för en utformning som miljöprövningen sedan villkorsändrar. När besluten i olika spår vilar på olika versioner av projektet uppstår en dokumentations- och giltighetsrisk som först uppdagas vid bygglov, startbesked eller tillsyn. Noden kräver därför en aktiv beroendehantering som inte finns inbyggd i något av regelverken.","motivation":"Svensk tillståndspraxis bygger på att PBL och miljöbalken löper parallellt utan hierarki – ett tillstånd ersätter inte det andra. Att inkonsekvens mellan lagakraftlägen skapar problem vid genomförandet är ett välgrundat resonemang utifrån systemets design, och MÖD:s praxis om planupphävanden (P 1151-23) visar hur skört planläget kan vara även efter antagande. Källor: PBL, MB, Sveriges Domstolar.","affects":"B50-P030, B50-P040 samt huvudspåren B30-END60 och B40:s motsvarigheter och samlingsgaten B50-G900.","impact":"Omprövnings- och ändringsbehov i redan vunna beslut, uppskjuten byggstart trots laga kraft i båda spåren samt risk för att bygglov eller startbesked avslås på inkonsekvensgrunder.","mitigation":"Upprätta en beroendematris som låser vilken planversion respektive tillståndsversion varje beslut vilar på, och uppdatera den vid varje händelse (antagande, överklagande, villkorsändring). Samordna beslutstidpunkterna aktivt med kommun och prövningsmyndighet.","source_refs":["PBL","PBL_PLAN","MB","EXT: MÖD dom P 1151-23 (2024) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2024/p-1151-23-dom-2024-06-05.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P040-01","node_id":"B50-P040","chart_key":"B50","node_label":"Ansök om bygg-, mark- eller rivningslov/anmälan","title":"Lovansökan krockar med icke lagakraftvunnen plan eller kvarstående överklaganderisker","category":"Rättslig osäkerhet","trigger":"Projektägaren ansöker om bygg-, mark- eller rivningslov mot en detaljplan som ännu inte vunnit laga kraft, eller där överklaganderisk bedömts som liten men bedömningen visar sig fel.","description":"Bygglov får prövas mot en plan som inte vunnit laga kraft endast under mycket snäva förutsättningar (13 kap. 8 § PBL), och i praktiken avvaktar de flesta byggnadsnämnder laga kraft. Om lov medges mot en plan som sedermera upphävs i överinstans, eller mot områdesbestämmelser där prövningsläget är oklart, kan lovbeslutet bli felformat och överklagas med framgång. För stora industriprojekt med många dellov (grundläggning, ställverk, processbyggnader) uppstår dessutom frågan om lovhierarki och samordning mellan separata lovärenden.","motivation":"Preemraff Lysekil illustrerar kedjan mellan plan och tillstånd: Mark- och miljödomstolen i Vänersborg upphävde i början av 2023 kommunfullmäktiges beslut om antagande av detaljplanen som möjliggjort utbyggnaden, efter att planen drivits genom överinstanser; MÖD meddelade prövningstillstånd i maj 2023. Ett till synes antaget planläge kan alltså ruckas långt efter det att tillståndsprocessen byggts på det. Källa: Lysekils kommun, nyhet 2023-05-24 om MÖD:s prövningstillstånd efter MMD:s upphävande av detaljplansbeslutet.","affects":"B50-P040 samt nedströms B50-P050 (lovprövningen kan grundas på fel planläge), B50-P060 och B50-P070 (startbesked kan utebli trots meddelat lov) och i förlängningen B50-G900.","impact":"Återförvisning av lovärendet, krav på ny ansökan mot ny plan, fördröjning av byggstart och osäkerhet kring redan gjorda kontrakts- och entreprenadåtaganden.","mitigation":"Innan ansökan: verifiera planens laga kraft-status via kommunens plansammanställning och begär skriftlig bekräftelse. Vid pressat tidläge: överväg uppdelning i dellov mot tydligt lagakraftvunna delar. Anpassa entreprenadkontraktens milstolpar till laga kraft snarare än till antagandedatum.","source_refs":["PBL","PBL_PLAN","EXT: Lysekils kommun – MÖD ger prövningstillstånd i detaljplanemålet https://www.lysekil.se/sidor/nyheter/2023/2023-05-24-mark--och-miljooverdomstolen-ger-lysekils-kommun-provningstillstand"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-P040-02","node_id":"B50-P040","chart_key":"B50","node_label":"Ansök om bygg-, mark- eller rivningslov/anmälan","title":"Ofullständiga handlingar startar inte tio-veckorsklockan","category":"Underlagsbrist & data","trigger":"Lov-/anmälningshandlingarna (nybyggnadskarta, situationsplan, ritningar, kontrollplansförslag, fackmanhandlingar) är ofullständiga eller avviker från nämndens kravbild.","description":"Byggnadsnämndens lagstadgade handläggningstid om tio veckor (9 kap. 27 § PBL) börjar inte löpa förrän ansökan är komplett. I större verksamhetsprojekt är underlaget omfattande – kontrollplan, tekniska beskrivningar, anmälda kontrollansvariga – och varje kompletteringsrunda nollställer eller fördröjer processen. För marklov kopplade till miljötillstånd kan det dessutom uppstå frågor om lovprövningens avgränsning mot miljöprövningen, vilket ger ytterligare kompletteringsbegäran.","motivation":"Boverkets bygglovsstatistik och kommunal vägledning visar återkommande att ofullständiga ansökningar är den vanligaste orsaken till att ärenden drar ut på tiden; branschrapporteringen (t.ex. Bygglovsrapporten 2026) pekar på stor variation mellan kommuner i digitalisering och kompetens i bygglovshandläggningen. Välgrundat slutsats: ett komplext industrilov i en mindre kommun möter sällan den processvana som finns i storstadsnämnder.","affects":"B50-P040, nedströms B50-P050 (lovprövningen startar sent) och B50-P070 (startbeskedet försenas i motsvarande mån), samt hela PBL-grenen in i B50-G900.","impact":"Fördröjning av byggstart utan formellt beslut att överklaga – en passiv blockering som är svår att driva juridiskt.","mitigation":"Boka förhandsmöte med byggnadsnämnden och gå igenom handlingarna mot kommunens checklista innan inlämning. Använd kommunens digitala ärendeingång där den finns. Säkerställ att kontrollansvarig anmäls tidigt så att handlingarna kan bli fullständiga på en gång.","source_refs":["PBL","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-P050-01","node_id":"B50-P050","chart_key":"B50","node_label":"Lovprövning, beslut och överklagande","title":"Överklagandekedjan länsstyrelse–MMD–MÖD stoppar byggstart","category":"Överklagande & rättsprocess","trigger":"Grannar, sakägare eller berörda överklagar byggnadsnämndens lovbeslut till länsstyrelsen, eller nämnden beslutar om kommunalt veto (13 kap. 16 § PBL) som överprövas.","description":"Lov- och förhandsbesked får överklagas till länsstyrelsen, och länsstyrelsens beslut kan i sin tur överklagas till mark- och miljödomstol och vidare till MÖD. Ett bygglov vinner normalt inte laga kraft förrän beslutet inte överklagats, men för visst byggande kan klaganden dessutom begära inhibition eller prövning av verkställbarhet. I omstridda verksamhetsprojekt – där miljötillståndet redan är omstritt – blir bygglovet ofta en andra front i samma konflikt, och varje instansläger adderar handläggningstid.","motivation":"Boverkets statistik visar tusentals överklagade bygglovsärenden årligen hos länsstyrelserna (ca 3 400 ärenden 2020 enligt Boverkets redovisning), och länsstyrelsen i Norrbotten redovisar mål om 120 dagars handläggning för överklagade bygglov – ett mål som historiskt varit svårt att nå. För omstridda anläggningar kan kedjan nämnd–länsstyrelse–MMD–MÖD därmed binda lovbeslutet under lång tid.","affects":"B50-P050, nedströms B50-P060 (tekniskt samråd kan inte äga rum mot ett beslut som inte står fast), B50-P070 och B50-G900; risken återverkar även på parallella spår som planerat bygglogistik efter lovutfallet.","impact":"Fördröjning av byggstart, i värsta fall återförvisning till byggnadsnämnden för omprövning, och förlorad säsong för markarbeten.","mitigation":"Genomför tidigt grannsamråd även där PBL inte kräver det formellt, dokumentera hänsyn till grannars intressen i ansökan, och utforma anläggningen så att uppenbara överklagandegrunder (höjd, buller, skymning) undanröjs innan beslut. Bedöm möjligheten att begära förhandsbesked för att avskilja principfrågan från detaljerna.","source_refs":["PBL","EXT: Boverket – Överklagande av lov och förhandsbesked https://www.boverket.se/sv/PBL-kunskapsbanken/lov--byggande/overklagande/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-P050-02","node_id":"B50-P050","chart_key":"B50","node_label":"Lovprövning, beslut och överklagande","title":"Lovprövningens avgränsning mot miljöprövningen skapar rättstvist","category":"Rättslig osäkerhet","trigger":"Byggnadsnämnden, överinstans eller klagande anser att lovbeslutet strider mot det prövade miljötillståndets villkor, eller att PBL-prövningen i praktiken sköter in på miljöbalkens prövningsområde.","description":"För stora miljöfarliga verksamheter samexisterar miljötillståndets platsbestämning och villkor med bygglovets plan- och detaljprövning. Om lovansökningens tekniska utformning avviker från det som miljödomstolen prövat – placering av processbyggnader, dammar, bullervallar – uppstår frågan om bygglovet alls kan meddelas eller om en ändringsprövning enligt miljöbalken krävs först. Klaganden kan med framgång hävda att nämnden inte får medge lov som förutsätter en icke prövad ändring av den tillståndsgivna verksamheten.","motivation":"Välgrundat resonemang utifrån PBL 2 kap. 4 § och förhållandet mellan PBL och MB: bygglov ska inte kunna användas för att kringgå miljöprövningens avgränsning. Erfarenheten från svenska industriprojekt visar att diskrepanser mellan lovritningar och MKB-bilagor är en återkommande källa till kompletteringar och överklaganden, särskilt när miljödomens bilagor utgör del av tillståndet.","affects":"B50-P050 och uppströms koppling till B30 (miljöprövningens prövningsram, B30-060) samt nedströms B50-P060, B50-P070 och B50-G900.","impact":"Kompletteringskrav eller upphävande av lov, behov av parallell ändringsansökan enligt MB 16 kap., fördröjning och dubbelprövning av samma fysiska åtgärd.","mitigation":"Säkerställ konsistensgranskning mellan lovhandlingar och miljötillståndets handlingar innan ansökan: samma koordinater, höjder och bullerberäkningar. Vid behov av avvikelse: avgör tidigt om ändringen kräver anmälan/tillstånd enligt MPF 1 kap. 11 § innan lovärendet drivs vidare.","source_refs":["PBL","MB","MPF"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-P050-03","node_id":"B50-P050","chart_key":"B50","node_label":"Lovprövning, beslut och överklagande","title":"Kompetens- och kapacitetsbrist i byggnadsnämnd förlänger tio-veckorsfristen","category":"Myndighetskapacitet & handläggning","trigger":"Den kommunala byggnadsnämnden saknar erfarenhet av storskaliga industrilov eller har personalkris, och begär förlängning av handläggningstiden eller låter ärendet ligga.","description":"PBL:s tio-veckorsfrist får förlängas en gång om särskilda skäl finns (9 kap. 27 § PBL), och i praktiken inväntar nämnderna ofta synpunkter från grannar, räddningstjänst och andra nämnder vilket tär på tiden. För ett industriprojekt i en mindre kommun kan en enda lovhandläggare utgöra hela kapaciteten; sjukdom eller avgång stoppar ärendet helt. Sanktionen – sanktionsavgift vid överskridande – hjälper inte projektet, eftersom avgiften inte leder till något beslut.","motivation":"Branschens återkommande rapportering (bl.a. Bygglovsrapporten) och Boverkets statistik visar betydande variation i handläggningstider mellan kommuner, och att kommuner i glesbygd har svårt att rekrytera och behålla bygglovshandläggare. Detta är en strukturell, verifierad riskbild snarare än ett enskilt fall.","affects":"B50-P050, nedströms B50-P060, B50-P070 och B50-G900.","impact":"Fördröjning utan beslut att överklaga; projektets enda påtryckningsmedel är sanktionsavgiftsbegäran, som inte påskyndar själva prövningen.","mitigation":"Etablera löpande dialog med nämnden och överenskomm om en realistisk hanteringsplan vid ansökans inlämning. Leverera kompletta, granskningsvänliga handlingar för att minimera internt arbete hos nämnden. Vid stillastående ärende: begär formellt sanktionsavgift och dokumentera tidsförlusten för eventuell skadestånds- eller avtalsreglering.","source_refs":["PBL","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P060-01","node_id":"B50-P060","chart_key":"B50","node_label":"Tekniskt samråd, kontrollplan och handlingar","title":"Kontrollansvarig saknas eller saknar behörighet för anläggningstypen","category":"Myndighetskapacitet & handläggning","trigger":"Byggherren kan inte anmäla en certifierad kontrollansvarig (KA) med rätt behörighetsnivå i tid före tekniskt samråd.","description":"Utan anmäld kontrollansvarig får byggnadsnämnden inte ge startbesked för åtgärder som kräver kontrollansvarig enligt PBL och dess förordning. För stora industri- och energianläggningar krävs KA med behörighet för komplicerade byggnader och i vissa fall flera specialister (grundförstärkning, brand, processtekniska system). Marknaden för certifierade kontrollansvariga med tung industriell erfarenhet är tunn, särskilt utanför storstadsregionerna, och en försenad anmälan stoppar hela startbeskedskedjan.","motivation":"Välgrundat resonemang utifrån 10 kap. PBL och PBF:s krav på certifiering och behörighetsnivåer: Boverket har upprepade gånger pekat på brist på certifierade kontrollansvariga som ett strukturelt problem i byggprocessen. För projekt i norra Sverige, där byggmarknaden samtidigt är ansträngd av stora industrietableringar, är konkurrensen om KA-resurser påtaglig.","affects":"B50-P060, nedströms B50-P070 (inget startbesked utan KA) och därmed B50-G900.","impact":"Blockerad byggstart trots vunnen laga kraft för lovet; projektplanen pressas framåt vilket ökar risken för förhastade tekniska lösningar.","mitigation":"Kontraktera kontrollansvarig och biträdande KA redan i lovskedet. Klargör tidigt med nämnden vilken behörighetsnivå och vilka särskilda kontroller (t.ex. för anläggningsbyggande, dammar, högtryckssystem) som krävs, så att rätt kompetens anmäls från början.","source_refs":["PBL","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-P060-02","node_id":"B50-P060","chart_key":"B50","node_label":"Tekniskt samråd, kontrollplan och handlingar","title":"Oenighet vid tekniskt samråd om kontrollplanens omfattning","category":"Teknisk komplexitet","trigger":"Byggnadsnämnden och byggherren är oeniga om vilka kontroller, utbildningskrav och arbetsplatsbesök som ska anges i kontrollplanen för en avvikande eller komplex anläggning.","description":"Det tekniska samrådet ska enligt 10 kap. PBL fastställa förutsättningarna för åtgärden: kontrollplan, erforderliga utbildningsbevis, arbetsplatsbesök och eventuella avvikelser från föreskrifter om obligatorisk ventilationskontroll m.m. För anläggningar som inte ryms i standardmallarna – processindustrier, energianläggningar, anläggningsbyggen – finns inget enkelt facit, och nämndens krav kan växa under handläggningen. Varje oenighet kräver nytt samråd eller skriftligt beslut, vilket förskjuter startbeskedet.","motivation":"Välgrundat resonemang utifrån 10 kap. 10–14 §§ PBL och Boverkets vägledning om startbesked: kontrollplanens innehåll är ofta föremål för förhandling i större projekt, och nämnden har stor frihet att kräva kompletterande dokumentation innan startbesked kan lämnas. Erfarenheten från större infrastruktur- och industribyggen visar att det tekniska samrådet sällan blir ett enkelt möte utan en process i sig.","affects":"B50-P060, nedströms B50-P070 och B50-G900.","impact":"Fördröjning av startbesked, merkostnader för kompletterande projektering och utredningar, samt risk att entreprenader måste omplanläggas.","mitigation":"Skicka kontrollplansförslag och tekniska beskrivningar till nämnden i god tid före samrådet och begär skriftliga synpunkter i förväg. Involvera KA i förberedelserna. Dokumentera samrådsanteckningarna noggrant – de blir styrande för startbeskedet.","source_refs":["PBL","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P070-01","node_id":"B50-P070","chart_key":"B50","node_label":"Startbesked och PBL-byggstartsgate","title":"Startbesked uteblir trots lagakraftvunnet lov","category":"Myndighetskapacitet & handläggning","trigger":"Byggnadsnämnden lämnar inte startbesked eftersom något tekniskt krav återstår, ett parallellt beslut saknas, eller nämnden helt enkelt inte prioriterar ärendet.","description":"Enligt 10 kap. 3 § PBL får byggåtgärder inte påbörjas innan startbesked lämnats, och 10 kap. 23 § ger nämnden befogenhet att ingripa mot svartbygge. Startbesked är en separat myndighetsakt efter lovet och förutsätter att tekniskt samråd hållits, kontrollplan antagits, KA anmälts och att relevanta plan- och lovbeslut är verkställbara. Om någon pusselbit saknas – eller om nämndens handläggning dröjer – står projektet med ett klart lov men får ändå inte börja bygga. Att påbörja arbetet ändå riskerar byggsanktionsavgift och i värsta fall krav på återställning.","motivation":"Boverkets vägledning om startbesked understryker att startbesked är en obligatorisk spärr som ofta missförstås som en formalitet; i praktiken är det den vanligaste punkten där entreprenader med klar byggstart ändå måste vänta. Välgrundat slutsats: i projekt med många parallella beslut (lov, miljötillstånd, strandskyddsdispens, KML-tillstånd) är det lätt att en verkställbarhetsförutsättning förbises tills grävmaskinen står på plats.","affects":"B50-P070, nedströms B50-G900; indirekt hela projektets byggberedskap eftersom startbeskedet är den sista PBL-spärren.","impact":"Uppskjuten byggstart med stillastående entreprenad, merkostnader för omplanering, eller – vid felaktigt påbörjat arbete – sanktionsavgift och tillsynsingripande.","mitigation":"Upprätta en startbeskedschecklista som spårs veckovis: samråd hållet, kontrollplan antagen, KA anmäld, laga kraft kontrollerad, parallella beslut (dispens, KML, vatten) verkställbara. Begär startbeskedet skriftligt så snart förutsättningarna är uppfyllda och följ upp aktivt mot nämnden.","source_refs":["PBL","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-P070-02","node_id":"B50-P070","chart_key":"B50","node_label":"Startbesked och PBL-byggstartsgate","title":"Sen överklagande- eller överprövningshändelse underminerar verkställbarheten","category":"Överklagande & rättsprocess","trigger":"Ett underliggande beslut – detaljplan, strandskydddispens eller själva lovet – överklagas eller upphävs sent, efter det att projektet räknat med verkställbarhet.","description":"Startbesked förutsätter att de beslut åtgärden vilar på är verkställbara. Länsstyrelsen granskar varje kommunal strandskyddsdispens och kan upphäva den, och överklagade lov kan inhiberas. Om ett sådant ingrepp sker mellan lov och startbesked – eller under pågående byggnation – kan nämnden vägra startbesked eller återkalla det. För ett projekt med många dellov över tid multipliceras exponeringen: varje ny delåtgärd kräver egen verkställbarhetsprövning.","motivation":"Naturvårdsverkets vägledning om strandskydd beskriver uttryckligen att medgiven dispens inte bör utnyttjas förrän man förvissat sig om att beslutet inte överklagats eller överprövats av länsstyrelsen, som är skyldig att pröva varje kommunal dispens (19 kap. 3 a § MB). Kedjan kommunal dispens → länsstyrelseprövning → MMD är alltså en reell och systematiserad källa till sena avbräck.","affects":"B50-P070 och B50-G900; återverkningar uppströms på B50-P050 och på parallella skyddsspår (B50-X-grenen).","impact":"Byggstart som måste skjutas upp eller avbrytas, delvis utförda arbeten som kan behöva anpassas eller i värsta fall återställas, samt kontraktsjuridiska tvister om vem som bär förseningen.","mitigation":"Inför varje delstart: gör en formell verkställbarhetskontroll av alla underliggande beslut, inklusive om länsstyrelsens dispensgranskning pågår. Bygg in marginal i entreprenadprogrammet för överprövningstider och undvik att mobilisera full entreprenad före laga kraft i hela beslutskedjan.","source_refs":["PBL","PBL_START","MB","EXT: Naturvårdsverket – Strandskydd https://www.naturvardsverket.se/amnesomraden/skyddad-natur/olika-former-av-naturskydd/strandskydd/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-S010-01","node_id":"B50-S010","chart_key":"B50","node_label":"Identifiera, initiera och verifiera övriga sektorsbeslut","title":"Sent upptäckt sektorskrav – Seveso, livsmedel, försvar eller flyg – stoppar byggstart","category":"Rättslig osäkerhet","trigger":"Tillämpbarhetsmatrisen i B50-G010 missar ett sektorskrav som aktualiseras sent: Seveso-klassning, skyddsområde för dricksvatten, flyginfartsregler, totalförsvarets intressen eller särskilda branschtillstånd.","description":"Noden fångar de sällsynta sektorskraven som inte ryms i de övriga grenarna – och dess karaktär gör att den är sårbar just för det okända. Ett Seveso-ärende kan t.ex. aktualisera krav på att detaljplanen inte får medge bebyggelse inom påverkansområden, vilket i sin tur kan fälla både plan och miljötillstånd. Skyddsföreskrifter för vattentäkter kan förbjuda åtgärder som miljöprövningen redan godkänt. Eftersom dessa krav ofta upptäcks av en annan myndighet än den som driver huvudprocessen (räddningstjänst, livsmedelsverk, försvarsmyndighet, Transportstyrelsen) kommer beskedet sent och kaskaderar bakåt genom redan fattade beslut.","motivation":"Preemraff Lysekil är det mest illustrativa exemplet: utbyggnaden förutsatte detaljplaneändring nära Seveso-klassad verksamhet, planfrågan drevs genom instanserna, och Mark- och miljödomstolen upphävde i början av 2023 kommunens antagandebeslut om detaljplanen – med MÖD:s prövningstillstånd i maj 2023 – samtidigt som miljötillståndsfrågan prövats separat. Sektorskollisionen mellan plan-, Seveso- och miljöregler blev avgörande för hela projektet. Källa: Lysekils kommuns nyhet 2023-05-24.","affects":"B50-S010 och B50-G900; vid Seveso-kollision även uppströms B50-P010–B50-P030 (plan) och B30 (miljötillstånd).","impact":"Upphävda eller omprövade beslut i andra spår, omprojektering, och i värsta fall att projektet måste omlokaliseras trots vunna tillstånd.","mitigation":"Låt tillämpbarhetsmatrisen granskas av en specialist på sektorlagstiftning, inte bara miljörätt. Gör en systematisk genomlysning mot Seveso, livsmedels-, försvars-, flyg- och vattenskyddsregler redan i B10/B50-G010. Etablera kontaktpunkter hos berörda sektorsmyndigheter tidigt så att kravbilden är känd före ansökningarna.","source_refs":["SEVESO","MB","PBL","EXT: Lysekils kommun – MÖD prövningstillstånd efter MMD:s upphävande av detaljplan https://www.lysekil.se/sidor/nyheter/2023/2023-05-24-mark--och-miljooverdomstolen-ger-lysekils-kommun-provningstillstand"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-S010-02","node_id":"B50-S010","chart_key":"B50","node_label":"Identifiera, initiera och verifiera övriga sektorsbeslut","title":"Ingen äger uppföljningen – sektorsbeslut förverkar tyst","category":"Myndighetskapacitet & handläggning","trigger":"Ett sektorsbeslut med tidsbegränsning eller verkställbarhetsvillkor (t.ex. dispens som ska utnyttjas inom viss tid, eller tillstånd som förutsätter anmälan före start) förfaller eller aktiverar nya krav utan att projektorganisationen märker det.","description":"Nodens uppgift är att följa de beslut som faktiskt blockerar byggstart tills de är slutliga – men många sektorsbeslut har egna livscykler: strandskyddsdispenser ska påbörjas inom två år och avslutas inom fem, bygglov har giltighetstider, vissa tillstånd kräver anmälan eller uppföljningsrapporter före idrifttagande. I ett projekt med dussintals beslut över flera år är risken stor att ett beslut föråldras, överklagas utan att projektet noterar det, eller att ett förstartskrav (t.ex. egenkontrollprogram, deposition) förbises. Felet upptäcks ofta först vid byggstart eller tillsyn.","motivation":"Välgrundat resonemang: kommunal vägledning om strandskyddsdispens visar uttryckligen tidsfristerna (påbörja inom två år, avsluta inom fem) och Boverkets byggprocess beskriver start- och slutbeskedskedjan. I projekt med många beslut är förvaltningen av beslutens giltighet en känd svag punkt – det finns ingen myndighet som samlar bilden, ansvaret ligger helt hos projektägaren.","affects":"B50-S010, B50-G900, samt de spår vars beslut förverkats (kan tvinga fram omprövning i B50-P-, B50-X- eller B40-spåren).","impact":"Beslut som måste sökas om på nytt med ny prövning och ny överklagandeexponering, tillsynsingripanden mot påbörjat arbete, och förseningar i byggprogrammet.","mitigation":"Upprätta ett beslutsregister med giltighetstider, förstartskrav och ansvarig per beslut, med larm före utgångsdatum. Gör en formell verkställbarhets- och giltighetskontroll av samtliga beslut inför varje byggetapp. Delegera tydligt vem i organisationen som äger varje sektorstillstånd över tid.","source_refs":["PBL","STRAND","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-START-01","node_id":"B50-START","chart_key":"B50","node_label":"Parallella spår initierade","title":"Osynliga spår blockerar byggstart trots färdigt huvudtillstånd","category":"Sektorssamordning","trigger":"Tillståndsmatrisen från B10 är ofullständig eller projektets lokalisering förändras efter att de parallella spåren initierats.","description":"Noden utgår från att tillståndsmatrisen identifierat alla kompletterande tillstånd, planer, dispenser och rättigheter som kan blockera byggstart. Om ett obligatoriskt spår – till exempel strandskyddsdispens, KML-tillstånd eller en detaljplansändring – inte fångas i matrisen upptäcks det först när huvudtillståndet är klart. Eftersom flera av dessa spår har egna samråd, instanskedjor och överklagandefönster kan ett sent upptäckt spår stoppa ett i övrigt färdigprövat projekt. Risken är särskilt reell när projektets utformning ändras under resans gång och matrisen inte versionshanteras.","motivation":"Erfarenheten från svenska tillståndsprocesser visar att huvudtillstånd enligt MB 9 kap. eller 11 kap. regelbundet beviljas utan att tvärgående förbud (t.ex. strandskydd enligt MB 7 kap. eller fornlämningsskydd enligt KML 2 kap.) är lösta, vilket i praktiken blockerar byggstarten. Boverkets vägledning om samordning mellan PBL och kulturmiljölagen poängterar uttryckligen att dessa frågor måste fångas tidigt. Källa: Boverket, PBL-kunskapsbanken.","affects":"B50-START och hela B50: alla nedströms spår (B50-N010, B50-X010, B50-K010, B50-P010 m.fl.) samt samlingsgaten B50-G900 och byggberedskapen i B70.","impact":"Fördröjning av byggstart trots vunnen laga kraft i huvudspåret, omstart av screening i B50-G010 och i värsta fall omprojektering när ett nytt förbud eller planbehov upptäcks sent.","mitigation":"Gör en strukturerad genomgång av samtliga tvärgående regelverk mot den låsta lokaliseringen innan spåren initieras. Versionshantera tillståndsmatrisen och koppla den till förändringshantering av projektet. Boka en tidig avstämning med länsstyrelse och kommun där matrisen kvitteras ut.","source_refs":["MB","PBL","KML","EXT: Boverket – Fornlämningar (samordning PBL/KML) https://www.boverket.se/sv/PBL-kunskapsbanken/teman/kulturvarden/samordning-med-kulturmiljolagen/fornlamningar/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-T010-01","node_id":"B50-T010","chart_key":"B50","node_label":"Planlägg väg eller järnväg","title":"Åtgärdsvals- och korridorstudien kollapsar under politiskt och lokalt motstånd","category":"Samråd & motstånd","trigger":"Den valda sträckningen möter starkt motstånd från kommuner, samebyar, markägare eller näringsliv, och alternativstudierna håller inte för kravet på verkliga alternativ.","description":"Väg- och järnvägsplaneringen är en fortlöpande process från behov och åtgärdsval via samråd och BMP till planförslag. Kravet på att redovisa verkliga alternativ gör att en sträckning som vaskats fram tidigt kan ifrågasättas sent om alternativanalysen är tunn – särskilt där nollalternativ, tunnellösningar eller andra farleder inte utretts seriöst. Lokalt motstånd kan dessutom kanaliseras politiskt: kommuner kan vägra samverka, och i förlängningen påverkar opinionen den oberoende fastställelseprövningen och regeringens bedömning.","motivation":"Norrbotniabanan är det tydligaste exemplet: sträckningen genom Västerbotten och Norrbotten mötte motstånd från samebyar och privatpersoner som överklagade ända till regeringen (regeringen avslog överklagandena för Dåva–Skellefteå, enligt SVT), och frågan om dragning och finansiering var politiskt omstridd i decennier. Processen visar hur korridor- och samrådsfasen i stora linjeprojekt formar hela projektets förutsättningar.","affects":"B50-T010, nedströms B50-T020 (fastställelseprövningen) och B50-T030, samt B50-G900.","impact":"Omarbetade alternativstudier, fördröjt planförslag, förhöjd konfliktnivå som följer projektet genom hela fastställelse- och byggfasen.","mitigation":"Investera i en genuin alternativutredning med dokumenterade avvägningar och utfallskriterier. Etablera förhandlingsbord med samebyar och kommuner tidigt, med konkreta anpassningsåtgärder (passager, stängsel, omdragningar). Låt samrådsredogörelsen visa hur kritik förändrat planförslaget.","source_refs":["VAGLAG","JARNVAGSLAG","TRAFIKVERKET_PLAN"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-T010-02","node_id":"B50-T010","chart_key":"B50","node_label":"Planlägg väg eller järnväg","title":"MKB och miljöbeskrivning i planen blir inaktuell under den utdragna planprocessen","category":"Underlagsbrist & data","trigger":"Planprocessen sträcker sig över så många år att naturinventeringar, trafikprognoser och samhällsunderlag hinner åldras innan granskning och fastställelse.","description":"Stora väg- och järnvägsprojekt har planprocesser som ofta pågår i fem till femton år. Under den tiden förändras både den biologiska verkligheten (bestånd, skyddade arter, nya skyddade områden) och prognosunderlaget (trafik, befolkning, klimatkrav). Länsstyrelsens granskningsyttrande kan då kräva omgjorda inventeringar – med säsongsberoende som kostar ett år i taget – eller ny trafikanalys. Planen riskerar att fastställas på ett underlag som inte längre speglar verkligheten, vilket både skapar överklaganderisker och dåliga beslutsunderlag för kompletterande tillstånd.","motivation":"Välgrundat resonemang utifrån Trafikverkets planeringsmodell och MBD:s krav: erfarenheten från svenska infrastrukturprojekt (t.ex. Norrbotniabanan, där underlaget för sträckan arbetats om vid upprepade tillfällen mellan 2018 och byggstartsbeslutet 2025) visar att underlagsåldring är en systematisk risk i utdragna planprocesser.","affects":"B50-T010, nedströms B50-T020 (granskningen kan kräva omarbetning) och B50-T030 (kompletterande tillstånd bygger på planens underlag).","impact":"Kostsamma nyinventeringar, skjuten granskning och fastställelse, samt risk att beslutet får svagare rättslig hållbarhet vid överklagande.","mitigation":"Planera inventeringarna med en uppdateringsstrategi: identifiera vilka data som åldras snabbast och schemalägg förnyelse före granskning. Dokumentera datumstämplar och giltighetstider för allt underlag. För trafik- och samhällsprognoser: kör känslighetsanalyser så att planen inte hänger på punktprognoser.","source_refs":["VAGLAG","JARNVAGSLAG","TRAFIKVERKET_PLAN","MBD"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-T020-01","node_id":"B50-T020","chart_key":"B50","node_label":"Granskning, fastställelse och regeringsöverklagande","title":"Länsstyrelsens granskningsyttrande eller oenighet stoppar fastställelsen","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen riktar väsentlig kritik i granskningsyttrandet, eller berörda länsstyrelser är oeniga, vilket gör att planen inte kan fastställas av infrastrukturbyggaren själv.","description":"Väg- och järnvägsplaner fastställs av Trafikverket (eller motsvarande byggare) endast om förutsättningarna är uppfyllda; vid oenighet eller vissa frågor ska ärendet i stället prövas av regeringen. Ett starkt negativt granskningsyttrande – om riksintressen, vatten, Natura 2000 eller alternativ – tvingar antingen omarbetning av planen eller hänskjutande till regeringen. Båda vägarna kostar år, och oenigheten blir dessutom offentlig och mobiliserar opinion inför den fortsatta processen.","motivation":"Norrbotniabanan illustrerar regeringsspårets betydelse: planprocessen krävde regeringens prövning, och regeringen gav först 2020 grönt ljus för planarbetets fortsättning efter tidigare tveksamhet, medan överklaganden om sträckan Dåva–Skellefteå hanterades av regeringen och avslogs. HFD 2020 not. 29 visar dessutom att järnvägsplaners formella innehåll prövas i högsta instans. Källor: SVT om avslagna överklaganden; HFD 2020 not. 29.","affects":"B50-T020, nedströms B50-T030 och B50-G900; regeringsprövningen påverkar även kompletterande spår (vatten, Natura) som hänger på planen.","impact":"Omarbetning av planförslaget, hänskjutande till regeringen med flerårig väntan, eller fastställelse på försämrat underlag som sedan prövas om i överinstans.","mitigation":"Behandla granskningsyttrandet som en förhandlingsfas: möt länsstyrelsens kritik med konkreta planändringar eller fördjupade utredningar före fastställelseansökan. Bedöm tidigt om regeringsprövning är oundviklig och förbered det underlaget parallellt i stället för sekventiellt.","source_refs":["VAGLAG","JARNVAGSLAG","TRAFIKVERKET_PLAN","EXT: HFD 2020 not. 29 https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2020/notiser/hfd-2020-not.-29.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-T020-02","node_id":"B50-T020","chart_key":"B50","node_label":"Granskning, fastställelse och regeringsöverklagande","title":"Regeringsprövningen blir en politisk ödesfråga för hela projektet","category":"Politisk & policyrisk","trigger":"Planen hänskjuts till eller överklagas hos regeringen, där finansiering, nationell transportplan och regionalpolitik vävs in i det formella planbeslutet.","description":"När väg- eller järnvägsplanen hamnar hos regeringen avgörs den inte bara på planunderlagets meriter: den nationella transportplanen, budgetläget och regionalpolitiska löften påverkar både tid och utfall. Ett regeringsskifte kan omvärdera hela projektet, och ett avslag eller ett uppskjutet beslut lämnar projektet utan lagakraftvunnen plan under obestämd tid. Även beslut om byggstart – som är separata från planfastställelsen – ligger hos regeringen och kan fördröjas trots klar plan.","motivation":"Norrbotniabanan: trots fastställd plan för Dåva–Skellefteå fördröjdes byggstarten upprepade gånger; regeringen gav byggstartsbesked först 11 februari 2025, och JARNVAGSnyheter rapporterade 2024 om fördröjning trots överenskommelse om intensifierat arbete. Trafikverkets projektsida bekräftar att det är regeringen som beslutat att banan ska byggas. Verifierad tids- och politisk exponering.","affects":"B50-T020, nedströms B50-T030 och B50-G900; hela infrastrukturprojektets genomförande är beroende av denna nod.","impact":"Flerårig osäkerhet om projektets existens, omfördelning av statliga medel, och svårighet att hålla projektorganisation och entreprenadmarknad varma under väntan.","mitigation":"Förankra projektet i både planunderlag och regionalpolitik: bygg kommun- och näringslivsallianser som gör projektet politiskt kostsamt att skjuta upp. Fasindelning gör att delar kan få byggstart även om helheten väntar. Dokumentera samhällsekonomisk nytta löpande så att underlaget är aktuellt när regeringsbeslutet nalkas.","source_refs":["VAGLAG","JARNVAGSLAG","TRAFIKVERKET_PLAN","EXT: JARNVAGSnyheter – Norrbotniabanans byggstart fördröjs trots överenskommelse https://www.jarnvagsnyheter.se/20241030/16775/norrbotniabanans-byggstart-fordrojs-trots-overenskommelse"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-T020-03","node_id":"B50-T020","chart_key":"B50","node_label":"Granskning, fastställelse och regeringsöverklagande","title":"Överklaganden av planbeslutet från samebyar, markägare och organisationer","category":"Överklagande & rättsprocess","trigger":"Fastställelsebeslutet överklagas till regeringen (eller där rättskedjan kräver det, vidare) av berörda som bestrider sträckning, ersättningsfrågors hantering eller miljöbedömningens tillräcklighet.","description":"Planbeslut för väg och järnväg överklagas till regeringen, och berörda – särskilt samebyar längs sträckan, markägare och miljöorganisationer – använder regelbundet denna möjlighet. Överklagandet stoppar planens laga kraft tills regeringen avgjort, och regeringens handläggning av massöverklaganden i linjeprojekt tar tid eftersom varje klagandes sak ska hanteras. Även där överklagandena ogillas blir effekten en försening av hela byggkedjan, och processfel i planarbetet kan ge upphävande.","motivation":"Verifierat exempel: Regeringen avslog sex överklaganden från samebyar och privatpersoner rörande Norrbotniabanans dragning mellan Dåva och Skellefteå (SVT Nyheter). HFD 2020 not. 29 visar att formella krav på järnvägsplanens innehåll kan prövas i högsta instans. Överklagandemönstret är alltså ett normaltillstånd i svenska storskaliga linjeprojekt.","affects":"B50-T020, nedströms B50-T030 (kompletterande tillstånd kan inte slutföras mot en plan utan laga kraft) och B50-G900.","impact":"Fördröjd laga kraft och därmed fördröjda efterföljande tillstånd och markåtkomst; vid upphävande återförvisning till ny planbehandling.","mitigation":"Förhandla med sannolika klagogrupper (samebyar, större markägare) före fastställelse och lös enskilda sträcknings- och ersättningsfrågor i avtal där det går. Kvalitetssäkra planens formella innehåll mot lagens krav för att undvika processrättsliga grunder. Förbered remiss- och svarsmaterial till regeringen i förväg.","source_refs":["VAGLAG","JARNVAGSLAG","EXT: SVT – Regeringen avslår överklaganden kring Norrbotniabanan https://www.svt.se/nyheter/lokalt/vasterbotten/regeringen-avslar-overklaganden-kring-norrbotniabanan--mz80jk"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-T030-01","node_id":"B50-T030","chart_key":"B50","node_label":"Slutför kompletterande tillstånd och markåtkomst","title":"Vatten-, Natura- och artskyddsbeslut ligger efter planen och blockerar etapper","category":"Sektorssamordning","trigger":"Den fastställda väg-/järnvägsplanen ersätter inte prövningen av vattenverksamhet, Natura 2000-tillstånd, artskyddsdispenser eller KML-beslut, och dessa startas först efter planens laga kraft.","description":"Planen fastställer sträckning och markanvändning men inte alla tillstånd: broar och bankar i vatten kräver prövning enligt MB 11 kap., passage av Natura 2000-områden kräver egen prövning, fridlysta arter längs sträckan kräver dispens, och fornlämningar kräver KML-beslut. Dessa ärenden ligger hos olika instanser (MMD, länsstyrelse) med egna köer och överklagandevägar. Om de drivs sekventiellt efter planen, i stället för parallellt förberedda, blir den kompletterande tillståndskedjan den kritiska linjen mellan plan och byggstart – ofta flera år.","motivation":"Norrbotniabanan visar tidsstrukturen: regeringens byggstartsbesked för Dåva–Skellefteå kom i februari 2025, långt efter planfastställelsen, och kompletterande tillstånd (bl.a. vattenverksamheter) har hanterats som separata spår längs hela sträckan. Erfarenheten från stora svenska infrastrukturprojekt är konsekvent att de kompletterande miljöbesluten, inte planen, styr byggstartstidpunkten.","affects":"B50-T030, B50-G900, samt uppströms kopplingar till B40 (vatten), B50-N010 (Natura), B50-X010 (artskydd) och B50-K010 (KML).","impact":"Etapperad eller uppskjuten byggstart, dyrare entreprenadlogistik när delsträckor inte kan öppnas i rätt ordning, och överklaganderisker i varje kompletterande spår.","mitigation":"Starta alla kompletterande tillståndsärenden så snart planförslaget är stabilt – vänta inte på laga kraft. Bygg en etapperad tillståndsmatris som visar vilka beslut varje byggetapp kräver. Samordna MKB-underlaget mellan plan och tillståndsansökningar för att undvika dubbelarbete och inkonsistens.","source_refs":["VAGLAG","JARNVAGSLAG","MB","NATURA","KML"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-T030-02","node_id":"B50-T030","chart_key":"B50","node_label":"Slutför kompletterande tillstånd och markåtkomst","title":"Markinlösen och fastighetsbildning drar ut på tiden längs sträckan","category":"Intressekonflikt & markåtkomst","trigger":"Överenskommelser om marköverlåtelse nås inte med alla berörda ägare, och expropriations-/intrångsprocesser eller fastighetsbildning måste drivas sträcka för sträcka.","description":"Även med lagakraftvunnen plan krävs att byggherren förfogar över marken: genom köp, inlösen enligt planens möjligheter eller expropriationslagens regler, samt fastighetsbildning för servitut och avvägningar. Tvister om ersättning och intrångsersättning kan drivas i rättsliga processer som inte stoppar planen men väl bygglogistiken och budgeten. Längs en lång järnvägssträcka med hundratals berörda fastigheter blir markåtkomsten en flerårig eftersläntring som måste planmas av byggprogrammet.","motivation":"Välgrundat resonemang utifrån väg- och järnvägslagarnas markåtkomstregler och expropriationslagen: erfarenheten från svenska linjeprojekt visar att inlösen- och ersättningsprocesser regelmässigt pågår parallellt med tidiga byggetapper, och att enskilda ersättningstvister kan följa projekt under många år. Detta är en systematisk struktur i lagstiftningen, inte en avvikelse.","affects":"B50-T030 och B50-G900; indirekt projektets budget och byggprogram.","impact":"Fördröjda eller uppdelade byggetapper, eskalerande ersättningskostnader, och rättsliga processer som binder projektresurser.","mitigation":"Inled markförhandlingar längs hela sträckan direkt efter fastställelse, med prioritering av etapp 1:s markbehov. Använd planens inlösenmöjligheter tidigt där förhandlingar kört fast, och budgetera realistiskt för intrångsersättningar baserat på erfarenhetstal från liknande projekt.","source_refs":["VAGLAG","JARNVAGSLAG"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-X010-01","node_id":"B50-X010","chart_key":"B50","node_label":"Screena artskydd och övrigt områdesskydd","title":"Fridlysta arter missas i screeningen och dyker upp under byggskedet","category":"Underlagsbrist & data","trigger":"Artinventeringen är utdaterad, fel säsong eller bygger enbart på registerdata (Artportalen), och fridlyst art påträffas först vid markarbete eller i sent skede.","description":"Screeningen ska inventera fridlysta arter och kontrollera reservat, strandskydd, biotopskydd, vattenskydd och lokala föreskrifter. Registerdata är notoriskt ofullständiga – fridlysta arter som inte tidigare rapporterats från platsen finns ofta där ändå. Upptäcks arten först under byggskedet gäller artskyddsförbuden direkt (4–9 §§ artskyddsförordningen) oavsett om tillstånd finns: arbetet måste stoppas och dispensansökan lämnas i efterhand. Det är en av de få risker som kan stoppa ett i övrigt helt tillståndsgivet projekt utan föregående domstolsprocess.","motivation":"Naturvårdsverkets vägledning om artskydd i specifik miljöbedömning betonar att inventeringsplikten omfattar arter som kan förekomma, inte bara registrerade fynd. Svenska exploateringsprojekt stoppas regelbundet av sent påträffade fridlysta arter (t.ex. fladdermöss, grodor, lavar) – det är ett återkommande mönster i länsstyrelsers och kommuner ärendehandlingar. Källor: Naturvårdsverket, artskyddsförordningen.","affects":"B50-X010 med nedströms B50-GX020–B50-X050; vid upptäckt under byggskedet direkt stopp i B70.","impact":"Akut arbetsstopp, dispensprocess i efterhand under pågående entreprenad, merkostnad för omprojektering och uppskjuten byggstart minst en säsong.","mitigation":"Komplettera registerdata med fältinventering i rätt säsong för de arter som platsens biotoper kan hysa. Planera arbetstider efter artens känsliga perioder och ha en beredskapsplan för fynd under byggskedet (stopp, dokumentation, dispensanalys).","source_refs":["ARTSKYDD","ART","STRAND","MB","EXT: Naturvårdsverket – Artskydd i specifik miljöbedömning https://www.naturvardsverket.se/vagledning-och-stod/miljobalken/miljobedomningar/specifik-miljobedomning/biologisk-mangfald-i-miljobedomning/artskydd-i-specifik-miljobedomning/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-X010-02","node_id":"B50-X010","chart_key":"B50","node_label":"Screena artskydd och övrigt områdesskydd","title":"Strandskydd och lokala skyddsföreskrifter upptäcks sent i detaljutformningen","category":"Rättslig osäkerhet","trigger":"Projektets tillfartsvägar, ledningar eller spridda byggnader hamnar inom strandskyddsområde eller i område med kommunala/länsvisa föreskrifter som inte fångats i screeningen.","description":"Strandskyddet gäller generellt 100–300 meter från vatten och omfattar ofta delar av ett projekt som inte är själva huvudanläggningen – tillfartsvägar, kablar, depåer. Utökat strandskydd enligt LIS-beslut och lokala ordningsföreskrifter kan dessutom skärpa skyddet utan att det syns i standardkartlager. Biotopskydd och vattenskyddsområden med tillhörande föreskrifter skapar liknande dolda förbud. En screening som fokuserar på huvudanläggningens fotavtryck missar de linjära och punktuella inslagen där förbuden ofta sitter.","motivation":"Naturvårdsverkets strandskyddsvägledning visar att dispensprövningen är individuell och att länsstyrelsen ska granska varje kommunalt dispensbeslut – en struktur som förutsätter att strandskyddskonflikter identifieras och hanteras som egna ärenden. Källa: Naturvårdsverket, Dispens från strandskyddet.","affects":"B50-X010 med nedströms B50-GX020 och B50-X030; i förlängningen B50-P020 (detaljplanen måste också förhålla sig till strandskyddet).","impact":"Sena dispensansökningar, omprojektering av tillfarter och ledningsdragningar samt fördröjning av byggstart för perifera men nödvändiga anläggningsdelar.","mitigation":"Screena hela projektets funktionella fotavtryck – inklusive vägar, ledningar, depåer och arbetsområden – mot strandskydd, LIS, biotopskydd och kommunala föreskrifter. Stäm av med kommunens strandskyddshanterare och länsstyrelsens naturvårdsenhet.","source_refs":["STRAND","MB","EXT: Naturvårdsverket – Dispens från strandskyddet https://www.naturvardsverket.se/vagledning-och-stod/skyddad-natur/strandskydd/dispens-fran-strandskyddet/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-X030-01","node_id":"B50-X030","chart_key":"B50","node_label":"Omprojektera eller lämna dispens-/tillståndsansökan","title":"Bristfällig alternativ- och skälredovisning leder till avslag på dispens","category":"Underlagsbrist & data","trigger":"Dispensansökan beskriver inte tillräckligt varför förbudet inte kan iakttas, vilka alternativ som prövats eller hur skydds- och kompensationsåtgärder uppväger ingreppet.","description":"Dispensprövningen ställer krav på att sökanden redovisar alternativ, dispensgrund, bevarandestatus och 'särskilda skäl' respektive motverkande åtgärder. En ansökan som behandlar dispensen som en formalitet – utan genuin alternativanalys eller konkreta skyddsåtgärder – avslås regelmässigt, eftersom dispensinstituten är undantag från förbud och ska tolkas restriktivt. Vid strandskydd granskas dessutom kommunens beviljande av länsstyrelsen, vilket ställer krav på att underlaget håller i två led.","motivation":"Länsstyrelsen är enligt 19 kap. 3 a § MB skyldig att i varje kommunalt beslut om strandskyddsdispens pröva om dispensrekvisiten är uppfyllda, och kan upphäva beslutet. Naturvårdsverkets vägledning visar att detta är en levande prövning, inte ett rent registreringsförfarande. Källor: Miljöbalken, Naturvårdsverkets vägledning (978-91-620-0175-9).","affects":"B50-X030 med nedströms B50-X040; vid avslag loop tillbaka till B50-X030 med omprojektering och försening av B50-X050.","impact":"Avslag och omarbetad ansökan, försening om minst en handläggningscykel samt i strandskyddsfallen upphävande i andra led trots kommunalt bifall.","mitigation":"Behandla dispensansökan med samma noggrannhet som huvudansökan: dokumenterad alternativgivning, art-/skyddsvärdesanalys, konkreta åtgärder och tydlig koppling till vald dispensgrund. Involvera den prövande myndigheten före inlämning.","source_refs":["MB","ARTSKYDD","STRAND","EXT: Naturvårdsverket – vägledning strandskydd (978-91-620-0175-9) https://www.naturvardsverket.se/4ac151/globalassets/media/publikationer-pdf/0100/978-91-620-0175-9.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-X030-02","node_id":"B50-X030","chart_key":"B50","node_label":"Omprojektera eller lämna dispens-/tillståndsansökan","title":"Omprojektering för att undvika förbudet urholkar projektets funktion eller ekonomi","category":"Teknisk komplexitet","trigger":"Den enda vägen att respektera förbudet är att flytta eller förminska anläggningsdelar, vilket bryter tekniska samband eller kapacitetsantaganden från B10.","description":"Alternativet till dispens är omprojektering, men förbudsläget sitter ofta i funktionellt kritiska delar: landfästen, tillfarter, utsläppspunkter eller ledningsdragningar. En omprojektering som undviker förbudet kan samtidigt minska kapacitet, fördyra drift eller flytta påverkan till ett annat skyddat intresse – och den förändrade utformningen måste i så fall återföras till huvudansökan och MKB. Det finns en reell risk för en ond cirkel där dispensansökan och omprojektering växlar utan att något spår når mål.","motivation":"Vindkraftsexemplet Bruzaholm visar hur lokalisering, teknikval och intressemotstånd samspelar: efter kommunalt tillstyrkande avslogs ansökan av miljöprövningsdelegationen 2018, och projektet tvingades till omprövning i domstol. Skydds- och områdesförbud tvingar regelmässigt fram omkonstruktioner som påverkar hela projektkalkylen. Källa: Vattenfalls projektredovisning för Bruzaholm.","affects":"B50-X030, B50-X040, samt återkoppling till B10-010 (projektdefinition) och B20 (MKB) när utformningen ändras.","impact":"Försämrad projektekonomi eller teknisk prestanda, nya prövningsbehov i huvudspåret samt förlängd total tidplan vid upprepade växlingar mellan dispens- och omprojekteringsspår.","mitigation":"Besluta tidigt om dispensväg eller undvikandeväg per konfliktpunkt, med en enkel kostnads- och riskavvägning per alternativ. Håll huvudansökan flexibel (kapacitetsintervall, alternativa dragningar) så att justeringar inte ogiltigförklarar den.","source_refs":["MB","ARTSKYDD","EXT: Vattenfall – Bruzaholm projekthistorik https://projekt.vattenfall.se/vindprojekt/projekt/land/bruzaholm/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-X040-01","node_id":"B50-X040","chart_key":"B50","node_label":"Pröva, besluta och överpröva skyddsärendet","title":"Dispens- och skyddsbeslut överklagas och gaten skjuts upp","category":"Överklagande & rättsprocess","trigger":"Sakägare, miljöorganisationer eller länsstyrelsen överklagar beviljad dispens, eller projektägaren överklagar avslag, till förvaltningsdomstol/mark- och miljödomstol.","description":"Skyddsärendenas beslut kan överklagas av både sakägare och myndigheter: länsstyrelsen ska granska kommunala strandskyddsdispenser, och den som beslutet gått emot kan överklaga. En beviljad dispens är alltså inte slutgiltig förrän överklagandetiden löpt ut eller processen avgjorts. För projektet innebär det att gaten i B50-X050 inte kan passeras på ett meddelat beslut utan först efter laga kraft eller motsvarande stabilitet – en beroendestruktur som lätt missas i tidsplanen.","motivation":"Strandskyddets processdesign (19 kap. 3 a § MB) innebär att länsstyrelsen i varje enskilt fall prövar kommunala dispensbeslut och att överklagande till mark- och miljödomstol är möjligt för både sökande och sakägare (16 kap. 12–14 §§ MB). Naturvårdsverkets flödesscheman visar att överprövning är en normal del av ärendetypen, inte ett undantag. Källa: Naturvårdsverkets strandskyddsvägledning.","affects":"B50-X040 med nedströms B50-X050 och samlingsgaten B50-G900; vid avslag loop till B50-X030.","impact":"Månader till år av överprövning, upphävda dispenser efter påbörjad planering av byggstart, samt tvingande omprojektering vid slutligt avslag.","mitigation":"Räkna in överklagandeperioden i gatens kriterier – passa inte B50-X050 förrän beslutet är stabilt. Förhandla fram förståelse med sakägare och länsstyrelse före beslut för att minska överklaganderisken.","source_refs":["MB","ARTSKYDD","COURT_APPEAL","EXT: Naturvårdsverket – vägledning strandskydd (978-91-620-0175-9) https://www.naturvardsverket.se/4ac151/globalassets/media/publikationer-pdf/0100/978-91-620-0175-9.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-X040-02","node_id":"B50-X040","chart_key":"B50","node_label":"Pröva, besluta och överpröva skyddsärendet","title":"Inkonsekvent dispenspraxis mellan kommuner och län skapar oförutsägbarhet","category":"Rättslig osäkerhet","trigger":"Samma typ av åtgärd bedöms olika av olika kommuner eller länsstyrelser, och projektets förutsättningar byggda på praxis från en annan kommun slår fel.","description":"Dispensinstituten är skönsmässiga och praxis varierar påtagligt mellan kommuner (strandskydd) och län (artskydd, reservat). Ett projekt som dimensionerat sig efter generös dispenspraxis i en kommun kan möta en strikt linje i en annan – eller en ändrad lokal praxis efter kommunala majoritetsskiften. Osäkerheten kan inte avtalas bort, eftersom varje dispens prövas individuellt, men den kan hanteras genom tidiga förhandssignaler.","motivation":"Att strandskyddsdispenspraxis varierar starkt mellan kommuner är ett välkänt och dokumenterat fenomen i svensk planering, och Naturvårdsverkets vägledning bygger delvis på behovet av att jämka tillämpningen. Detta är ett välgrundat praktiskt resonemang knutet till dispensinstitutets individuella prövning i MB 7 kap. Källa: Naturvårdsverket.","affects":"B50-X040 och bedömningen i B50-GX020; indirekt lokaliseringssäkerheten i B10-020.","impact":"Oväntade avslag, behov av omprojektering eller i värsta fall omprövat lokaliseringssval när lokal praxis visar sig striktare än antaget.","mitigation":"Inhämta aktuell lokal praxis (inte bara lagtext) för just den kommunen/det länet, genom tidigare beslut och dialog med handläggare. Undvik att låsa projektets geometri innan dispensläget är testat.","source_refs":["MB","STRAND","ARTSKYDD","EXT: Naturvårdsverket – Strandskydd https://www.naturvardsverket.se/amnesomraden/skyddad-natur/olika-former-av-naturskydd/strandskydd/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-X050-01","node_id":"B50-X050","chart_key":"B50","node_label":"Natur- och områdesskyddsgate klar","title":"Partiell gate: skyddsbeslut täcker inte hela det planerade markarbetet","category":"Myndighetskapacitet & handläggning","trigger":"Dispenserna och besluten gäller en del av projektet, men byggstarten planeras för större område än besluten omfattar, eller beslutsunderlaget avviker från den slutgiltiga projekteringen.","description":"Gaten ska säkerställa att nödvändiga dispenser, villkor och överprövningar är klara 'för den del av arbetet som träffas'. I praktiken uppstår en farlig glipa när projekteringen förfinas efter beslut: den verkliga arbetsytan blir större, flyttas eller får andra tidpunkter än ansökan beskrev. Förbuden är objektiva – de gäller oavsett om avvikelsen är liten – och markarbete utanför beslutets ram kan utgöra överträdelse med tillsyn, vite eller åtal som följd.","motivation":"Artskydds- och strandskyddsreglerna är förbudsregler med straffsanktion (MB 29 kap.), och det är den faktiska åtgärden – inte ansökningstexten – som bedöms. Att avvikelser mellan tillståndsunderlag och utförande skapar tillsynsärenden är ett etablerat mönster i svensk miljötillsyn. Källa: Miljöbalken, artskyddsförordningen.","affects":"B50-X050 och samlingsgaten B50-G900; vid överträdelse direkt påverkan på byggarbetet i B70 och tillsyn i B60.","impact":"Arbetsstopp, tillsynsärende, möjlig straffexponering samt behov av nya dispensansökningar mitt i byggskedet.","mitigation":"Frys arbetsytor gentemot beslutsunderlagen och inför en formell avvikelsekontroll före varje arbetsmoment: projekteringen jämförs mot dispensernas kartbilagor och villkor. Komplettera ansökan proaktivt vid förändringar.","source_refs":["MB","ARTSKYDD","STRAND"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-010-01","node_id":"B60-010","chart_key":"B60","node_label":"Ge in, registrera och avgiftslägg ansökan","title":"Avgifts- och formaliafel lägger ärendet på is innan prövning startat","category":"Myndighetskapacitet & handläggning","trigger":"Prövningsavgiften betalas inte, fel avgiftsklass används, eller registreringen fastnar i övergången mellan e-tjänst och diarium.","description":"Första instans registrerar ärendet och hanterar eventuell prövningsavgift innan sakprövningen kan börja. Om avgiften är felaktig, inte erläggs i tid eller om ansökan kommit in via fel kanal kan instansen vägra att ta upp ärendet till handläggning. För mark- och miljödomstolarna och delegationerna gäller olika avgifts- och ingivningsordningar, vilket skapar felkällor när samma projekt berör flera instanser. Missade registreringsbesked försvårar dessutom den senare beräkningen av handläggningstider och frister.","motivation":"Länsstyrelsernas e-tjänster för miljöprövningsdelegationer och domstolarnas separata ingivningsordningar skiljer sig åt; praxis från delegationerna visar att ärenden rutinmässigt parkeras tills avgift och formalia är klara (se t.ex. länsstyrelsernas anvisningar om ingivande av ansökningar).","affects":"B60-010 och nedströms B60-G020; ett registreringsfel kan också försena kungörelsen i B60-080.","impact":"Fördröjning om veckor till månader innan ärendet formellt påbörjas, med kostnader för liggande konsult- och projektorganisation.","mitigation":"Verifiera avgiftsklass och ingivningsväg mot aktuell instans före ingivning; begär skriftlig bekräftelse på diarieföring och registreringsdatum; dokumentera ingivningskvitton för senare fristberäkning.","source_refs":["MB","NV_PERMIT","COURT_MFV"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Sökande & ansökan"},{"risk_id":"R-B60-010-02","node_id":"B60-010","chart_key":"B60","node_label":"Ge in, registrera och avgiftslägg ansökan","title":"Aktörsbytet till Miljöprövningsmyndigheten skapar diarie- och behörighetsglapp","category":"Politisk & policyrisk","trigger":"Från 2027-07-01 övertar Miljöprövningsmyndigheten MPD-kategorierna, men ärenden påbörjade före ikraftträdandet och ansökningar strax efter riskerar att hamna i gränslandet mellan gamla och nya diarier, rutiner och IT-system.","description":"Nodens s1_delta pekar på att första instans för B-ärenden byts ut utan att de materiella kraven ändras. I en övergångsperiod måste sökanden avgöra om ansökan ska ges in till delegationen eller den nya myndigheten, och ansökningar som ligger i bero måste överföras med akt, målnummer och frister intakta. Historiska myndighetsbildningar visar att registerflyttar sällan är friktionsfria. Ett registreringsglapp kan innebära att ärendet tappar sin plats i handläggningskön eller att klockan för handläggningstid startar om.","motivation":"Reformen med Miljöprövningsmyndigheten är beslutad (betänkande 2025/26:MJU24 och SFS 2026:1442–1444). Välgrundat resonemang: när handläggande myndighet byts ut mitt i pågående ärenden uppstår i praktiken alltid frågor om överlämning av diarier och pågående frister, oavsett övergångsregler på pappret.","affects":"B60-010, B60-G020 och hela förstainstanskedjan för B-ärenden, särskilt B60-080 (kungörelse) och B60-190 (beslut).","impact":"Fördröjning vid registrering, osäkerhet om behörig mottagare och risk att ansökan behandlas av fel instans med efterföljande överlämnande eller avvisning.","mitigation":"Följ Miljöprövningsmyndighetens ikraftträdande- och övergångsbesked noggrant; tidigarelägg ingivning före 2027-07-01 eller avvakta nya rutiner; begär skriftlig vägledning om rätt mottagare vid gränsfall.","source_refs":["NEW_AUTH","SFS2026_1442","SFS2026_1443","SFS2026_1444"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-030-01","node_id":"B60-030","chart_key":"B60","node_label":"Kontrollera materiell fullständighet","title":"MKB-brister stjälper fullständighetsbedömningen","category":"Underlagsbrist & data","trigger":"MKB:n saknar väsentliga delar – alternativanalys, kumulativa effekter, skyddsåtgärder eller uppföljningsprogram – eller är inte samordnad med den tekniska ansökan.","description":"Fullständighetskontrollen testar om yrkanden, MKB, teknikbeskrivning, sakägarförteckning och specialunderlag räcker för prövning. En MKB som inte täcker de effekter instansen behöver bedöma leder till kompletteringskrav och i värsta fall avvisning. Särskilt känsligt är spårbarheten mellan samråd, avgränsning och slutligt underlag: om avgränsningsbedömningen (B20-050) inte följts kan instansen kräva omgjorda utredningar. Sakägarunderlag som är ofullständiga gör dessutom att kommuniceringen senare brister.","motivation":"MB 22 kap. 1–2 §§ ställer krav på ansökans innehåll; Naturvårdsverkets vägledning om specifik miljöbedömning och domstolarnas praxis om komplettering visar att MKB-brister är den vanligaste orsaken till kompletteringsrundor i första instans.","affects":"B60-030, B60-G040, kompletteringsnoden B60-050 och i förlängningen miljöbedömningsgodkännandet i B60-170.","impact":"Kompletteringsrundor med månaders fördröjning; vid upprepad brist risk för avvisning och omstart.","mitigation":"Kvalitetssäkra underlaget mot MB 22 kap. och MBD innan ingivning (jfr B20-090); använd instansens egna checklistor; håll samråds- och avgränsningsmaterial spårbart kopplat till MKB-kapitlen.","source_refs":["MB","MBD","NV_PERMIT","NV_EIA"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Sökande & ansökan"},{"risk_id":"R-B60-030-02","node_id":"B60-030","chart_key":"B60","node_label":"Kontrollera materiell fullständighet","title":"Skiftande kravbild vid aktörsbyte skapar omprövning av underlaget","category":"Myndighetskapacitet & handläggning","trigger":"Ärendet övergår till Miljöprövningsmyndigheten under pågående fullständighetsgranskning, och den nya myndigheten tillämpar egna rutiner eller tolkningar av kompletthetskraven.","description":"Nodens s1_delta anger att aktörsbytet för MPD-kategorier sker utan att den processuella ramen ändras. I praktiken kan en ny myndighet ändå tillämpa annan praxis för vad som anses komplett – till exempel krav på digitalt format, uppdaterade utredningar eller nya bilagemallar. Ett ärende som var komplett hos delegationen kan då återfås för komplettering hos den nya myndigheten. Sökanden bär risken för att praxisglappet inte kompenseras i övergångsreglerna.","motivation":"Välgrundat resonemang: myndighetsbildningar förändrar rutinmässigt kravprofil och praxis även när materiella regler är oförändrade, eftersom handläggningsanvisningar och e-tjänster är myndighetsspecifika; reformen regleras i SFS 2026:1442 med följdändringar 2026:1443–1444.","affects":"B60-030 med loop tillbaka till B60-050; påverkar även B60-080 om kommunicering redan hunnit påbörjas.","impact":"Förnyad fullständighetsgranskning, fördröjning och risk att daterade utredningar behöver uppdateras mot ny tidsplan.","mitigation":"Dokumentera fullständighetsdialogen skriftligt med ursprungsinstansen; begär att övergångsbesked bekräftar att godkänt underlag består; följ den nya myndighetens publicerade praxis från dag ett.","source_refs":["MB","SFS2026_1442","NEW_AUTH"],"scenario_tags":"S0_current_2026 | S1_actor_override_enacted_2027","origin":"Myndighet & prövning"},{"risk_id":"R-B60-050-01","node_id":"B60-050","chart_key":"B60","node_label":"Begär och lämna komplettering","title":"Säsongsberoende kompletteringar missar fönstret","category":"Klimat & naturhändelse","trigger":"Kompletteringskravet gäller inventeringar (fåglar, fladdermöss, vattenlevande arter, hydrologi) som bara kan utföras under viss årstid, och fristen faller utanför fältsäsongen.","description":"Kompletteringar av naturvärden, spridningsberäkningar eller hydrologiska data är ofta bundna till specifika säsonger. Om kompletteringsföreläggandet kommer på hösten men undersökningen kräver vår-/sommarfält kan ärendet inte kompletteras förrän nästa säsong – en förlust av upp till ett år. Klimatpåverkan som extremt väder, torka eller tidiga köldgrader kan dessutom förstöra planerade fälttillfällen. Instansen kan sällan godta äldre eller partiella data om metodkraven är tydliga.","motivation":"Erfarenheten från svenska vindkraft- och infrastrukturprövningar visar att fågel- och fladdermusinventeringar regelbundet styr tidplanen eftersom Naturvårdsverkets metodkrav anger antal säsonger och fältperioder; missad säsong innebär i praktiken ett års förskjutning.","affects":"B60-050 med återkoppling till B60-030; påverkar indirekt B60-170 (MKB-godkännande) och hela beslutstidplanen.","impact":"Fördröjning om upp till ett år per missad säsong och upplupna utredningskostnader.","mitigation":"Förutse sannolika kompletteringsområden och samla in ett extra säsongsmarginal redan i B10-040/B20-planeringen; låt inventeringsprogrammet löpa under kompletteringsfasen; dokumentera metodavvikelser proaktivt om väder stoppar fältarbete.","source_refs":["MB","MBD","NV_EIA"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B60-050-02","node_id":"B60-050","chart_key":"B60","node_label":"Begär och lämna komplettering","title":"Kompletteringen väsentligt ändrar projektet och tvingar ny kommunicering","category":"Rättslig osäkerhet","trigger":"Kompletteringen innebär nya åtgärder, ändrade alternativ eller utökade effekter som inte omfattats av tidigare samråd och kungörelse.","description":"En komplettering som väsentligt förändrar den ansökta verksamheten kan kräva att delar av samrådet eller kungörandet görs om, eftersom berörda ska ha haft möjlighet att yttra sig över det som faktiskt prövas. Gränsen mellan tillåten justering och ny ansökan är inte alltid given, och instansens bedömning kan bli överklagbar i sig. Om projektet ändras sent kan även parallella sektorsbeslut behöva uppdateras. Sökanden riskerar därmed att kompletteringsarbetet skapar nya processuella kretslopp i stället för att avsluta dem.","motivation":"Processuell huvudregel: prövningen ska vila på kommunicerat underlag; vid väsentliga ändringar krävs förnyad kommunicering, vilket praxis från mark- och miljödomstolarna bekräftar i mål där yrkanden eller projektbeskrivningen ändrats under handläggningen.","affects":"B60-050, tillbaka till B60-080 (ny kungörelse) och B60-G110 (ytterligare skriftväxling).","impact":"Förnyad kommunicering med månaders fördröjning och risk att överklagandefrister måste räknas om.","mitigation":"Håll kompletteringarna inom ramen för det kommunicerade projektet; om ändringar är nödvändiga, gör dem som tydliga, avgränsade tillägg och föreslå själv riktad ny kommunicering för att behålla tempot.","source_refs":["MB"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B60-060-01","node_id":"B60-060","chart_key":"B60","node_label":"Avvisning, återkallelse eller processavslut","title":"Återkallelse av strategiska skäl förstör processuell mervärdesplacering","category":"Politisk & policyrisk","trigger":"Sökanden återkallar ansökan på grund av ändrade marknads- eller policyförutsättningar, eller avslutar ärendet för att undvika ett avslagsbeslut som skulle belasta framtida ansökningar.","description":"Processavslut utan materiellt tillstånd kan vara frivilligt men är sällan kostnadsfritt. En återkallad ansökan innebär att samråd, utredningar och handläggningsarbete delvis måste göras om vid ny ansökan, särskilt om rättsläget, BAT-slutsatserna eller planläget ändrats under tiden. Om avslutet sker för att undvika ett negativt prejudicerande utfall kan motparter och myndigheter i nästa runda hävda att frågan redan prövats. Beslutet att avsluta bör därför vägas mot vad som faktiskt kan återanvändas.","motivation":"Preemraff Lysekil illustrerar dynamiken: efter år av prövning, överklaganden och regeringsbeslut ställde Preem hösten 2020 in utbyggnaden av kommersiella skäl, och hela det upparbetade tillståndsläget förföll (se granskningen i KU 2020/21:KU10).","affects":"B60-060 som slutnod; påverkar indirekt alla uppströms investerade noder (B20, B30, B40) och B70:s byggberedskap.","impact":"Förlust av hela det processuella arbetet, upplupna kostnader utan tillstånd och sämre utgångsläge vid eventuell ny ansökan.","mitigation":"Dokumentera och arkivera allt underlag versionsstyrt så att det kan återanvändas; analysera återkallelsens effekter på parallella spår innan beslut; överväg att låta ärendet avgöras i sak i stället om ett avslag inte skulle binda framtida ansökningar.","source_refs":["MB","EXT: Betänkande 2020/21:KU10 granskning av Preemraff-ärendet https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/granskningsbetankande-hosten-2020_h801ku10/html/"],"scenario_tags":"S0_current_2026","origi
