edömningar bygger på inventeringar med begränsad giltighet, och miljötillstånd kan förlora sin praktiska verkan om förutsättningarna ändrats (ändrad teknik, nya omgivande verksamheter, ny forskning om påverkan). I extremfallet tvingas projektet att komplettera eller söka om beslut som redan vunnit laga kraft, eller möter i tillsyn/överklagande argumentet att underlaget är för gammalt för att byggandet ska vara tillåtet.","motivation":"Välgrundat resonemang utifrån beslutens faktiska giltighetsregler (bl.a. strandskyddsdispensens tidsfrister) och den välkända mekanismen att utdragna svenska tillståndsprojekt – jfr Norra Kärrs process 2009–2026 – tvingas uppdatera underlag som åldrats mellan beslut och genomförande. Ju fler parallella spår, desto större exponering mot det långsammaste.","affects":"B50-G900, med återverkningar på samtliga uppströms spår (B50-P, B50-E, B50-M, B50-T, B50-X) om deras beslut måste förnyas; förskjuter B50-END.","impact":"Förnyelse- eller kompletteringsärenden i redan avslutade spår, tidsförlust trots 'klara' beslut, och försvagad rättslig position om underlaget ifrågasätts vid genomförandet.","mitigation":"Planera spårens måldatum mot en gemensam gate-punkt i stället för att avsluta varje spår så fort som möjligt. För beslut med tidsfrister: tidigarelägg ansökan inte mer än nödvändigt, eller säkra möjlighet till förlängning. Håll nyckelunderlag (inventeringar, prognoser) uppdaterade under väntetiden så att förnyelse vid behov går snabbt.","source_refs":["MB","STRAND","PBL_START"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-GN040-01","node_id":"B50-GN040","chart_key":"B50","node_label":"Kan tillstånd lämnas utan skada eller betydande störning?","title":"Kvarstående vetenskapligt tvivel leder till avslag","category":"Rättslig osäkerhet","trigger":"Prövningsmyndigheten bedömer att underlaget inte undanröjer rimligt tvivel om skada på skyddade livsmiljöer eller betydande störning av skyddade arter.","description":"Prövningen enligt MB 7 kap. 28 b § ställer ett strängt beviskrav: tillstånd får inte lämnas om det kvarstår vetenskapligt rimligt tvivel. Det är sökandens underlag som ska bära bevisbördan, och försiktighetsprincipen gör att osäkerhet slår mot projektet, inte mot skyddsintresset. Även väl underbyggda projekt kan därför avslås om påverkan är komplex, livsmiljön känslig eller data osäkra. Ett avslag i denna nod tvingar projektet till B50-N050 – omlokalisering, omprojektering eller den politiska undantagsvägen i 29 §.","motivation":"I Nordkalk/Bästeträsk avslog MÖD 2018 (mål M 5375-14) verksamheten med hänvisning till påverkan på Natura 2000-området, efter att MMD tidigare bifallit – ett tydligt exempel på att beviskravet tolkas strikt i högre instans. Blekinge offshore avslogs av regeringen 2016 efter bedömning att påverkan på havsörnsreservatet inte kunde uteslutas. Källor: Sveriges Domstolar, eolus.com, Sveriges Natur.","affects":"B50-GN040, med gren till B50-N050 (omprojektering/undantag) istället för B50-N060; blockerar indirekt samlingsgaten B50-G900.","impact":"Avslag eller villkor som gör projektet oekonomiskt, tvångsomprojektering och – om undantagsvägen väljs – överflyttning av avgörandet till politisk nivå med lång och oförutsägbar ledtid.","mitigation":"Kvantifiera osäkerheter i underlaget och visa med känslighetsanalys att slutsatserna håller även i ogynnsamma scenarier. Integrera skadeförebyggande åtgärder i själva projektet (inte som efterkonstruktion) så att prövningen kan konstatera att störningen inte är betydande.","source_refs":["MB","NATURA","EXT: MÖD dom M 5375-14 (2018) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf","EXT: Regeringen säger nej till Blekinge offshore https://www.eolus.com/blog/mfn_news/regeringen-sager-nej-till-det-havsbaserade-vindkraftsprojektet-blekinge-offshore/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-GN040-02","node_id":"B50-GN040","chart_key":"B50","node_label":"Kan tillstånd lämnas utan skada eller betydande störning?","title":"Instanserna landar i olika bedömningar av samma bevisning","category":"Överklagande & rättsprocess","trigger":"Länsstyrelse, MMD och MÖD värderar det vetenskapliga underlaget och försiktighetsbedömningen olika i Natura-frågan.","description":"Bedömningen av 'skada' och 'betydande störning' är en naturvetenskaplig-juridisk sammanblandad bedömning där instanser historiskt kommit till olika slut på samma material. Det innebär att även ett ställningstagande till projektets fördel i första instans inte ger stabilitet – motparten kan överklaga och få bedömningen ändrad i nästa instans. Osäkerheten ligger i själva prövningsstandarden: den är pålitlig i princip men skiftande i tillämpningen, särskilt vid hydrologisk påverkan, störningspåverkan på fågel och kumulativa effekter.","motivation":"Nordkalk/Ojnarefjärden är exemplet där MMD biföll, MÖD avslog och Högsta domstolen prövade delar av ärendet – tre instanser med olika utfall på i stort sett samma vetenskapliga material. Källor: Sveriges Domstolar (M 5375-14), Svenska Botaniska Föreningens historik, lagen.nu (MÖD 2016:1).","affects":"B50-GN040 och nedströms B50-N060; fördröjer hela Natura-grenen och kan blockera byggberedskap även efter positivt utfall i första instans.","impact":"Flerårig instanskedja, juridiska merkostnader och projektfinansiering som inte kan stängas förrän Natura-frågan vunnit laga kraft.","mitigation":"Skriv underlaget så att det är 'appell-säkert': adressera motargumenten explicit, redovisa expertmetodik och osäkerhetsintervall, och låt oberoende experter granska innan inlämning. Ta höjd för överklagande i projektets tids- och finansieringsplan.","source_refs":["MB","NATURA","EXT: Svenska Botaniska Föreningen – Hur Ojnareskogen räddades https://svenskbotanik.se/nyheter/hur-ojnareskogen-raddades-och-bastetrask-blir-nationalpark/","EXT: MÖD 2016:1 https://lagen.nu/dom/mod/2016:1"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-GN040-03","node_id":"B50-GN040","chart_key":"B50","node_label":"Kan tillstånd lämnas utan skada eller betydande störning?","title":"Oklar behörighet för Natura-prövningen i gränsområden","category":"Rättslig osäkerhet","trigger":"Verksamheten ligger i ett område där det är omtvistat vilken myndighet eller domstol som är behörig prövningsinstans för Natura 2000-tillståndet, t.ex. i Sveriges ekonomiska zon.","description":"För vissa verksamheter – särskilt i ekonomiska zonen och vid kombination med sektorstillstånd som bearbetningskoncession – är behörighetsfrågan för 28 b §-prövningen inte fullt klarlagd. Om ärendet lämnas till fel instans, eller om två instanser båda anser sig behöriga respektive obehöriga, riskerar beslutet att upphävas på formell grund oavsett den materiella bedömningens kvalitet. Noden är därför känslig för ren behörighetsrisk utöver sakrisken.","motivation":"Regelrådets yttrande 2024 om Natura 2000-prövning av havsbaserad vindkraft visar att flera remissinstanser (bl.a. Eslövs kommun) argumenterat för att behörigheten är oklar och bör flyttas till mark- och miljödomstol. Riksdagens betänkande 2020/21:NU16 behandlar motsvarande fråga vid bearbetningskoncessioner. Källor: regelradet.se, riksdagen.se.","affects":"B50-GN040 och B50-N060; i förlängningen huvudansökningsnoderna i B30-G110 och B40 där samma behörighetslogik gäller.","impact":"Upphävda beslut på behörighetsgrund, omdistribuerade ärenden och förlorad handläggningstid utan att saken prövats.","mitigation":"Verifiera behörigheten skriftligt med berörda myndigheter före inlämning och bevaka pågående lagstiftning om Natura-instanserna. Vid osäkerhet, välj den instans som etablerad praxis pekar på och dokumentera ställningstagandet.","source_refs":["MB","NATURA","EXT: Regelrådet rr 2024:085 https://www.regelradet.se/download/18.5933842b191974d80396ac/1725527853531/rr_2024_085.pdf","EXT: Riksdagen, bet. 2020/21:NU16 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/natura-2000-tillstand-vid-ansokan-om_h801nu16/html/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-GX020-01","node_id":"B50-GX020","chart_key":"B50","node_label":"Kvarstår förbud eller krävs dispens/tillstånd?","title":"Fel behörig instans väljs för dispens eller tillstånd","category":"Rättslig osäkerhet","trigger":"Projektägaren vänder sig till fel myndighet – t.ex. kommunen för ett ärende som tillhör länsstyrelsen eller Naturvårdsverket – eller bedömer dispensgrund ur fel katalog.","description":"Behörigheten varierar mellan skyddsformerna: strandskyddsdispens prövas av kommun eller länsstyrelse beroende på område och åtgärd, artskyddsdispens av länsstyrelse eller Naturvårdsverket beroende på art, och reservatsföreskrifter av reservatsförvaltaren. En ansökan till fel instans avvisas eller återförvisas, och vägvalen i artskyddsförordningens dispenskatalog (t.ex. skillnaden mellan dispens för säkrande av bevarandestatus och dispens för 'särskilda skäl') leder till olika beviskrav. Felaktigt vägval i denna nod kan innebära att en i sak befogad dispens ändå avslås på formell grund.","motivation":"Naturvårdsverkets vägledningar för strandskydd respektive artskydd visar att behörighets- och dispenskatalogfrågorna är komplexa nog att kräva egna flödesscheman. Länsstyrelsens obligatoriska granskning av kommunala strandskyddsdispenser (19 kap. 3 a § MB) visar dessutom att även 'rätt' kommunalt beslut kan upphävas i andra ledet. Källor: Naturvårdsverket, miljöbalken.","affects":"B50-GX020 med nedströms B50-X030 och B50-X040; vid återförvisning försenas hela skyddsspåret mot B50-X050.","impact":"Avvisade eller återförvisade ansökningar, förlorade månader i handläggningsköer och risk att beviljad dispens upphävs vid länsstyrelsens granskning eller överklagande.","mitigation":"Kartlägg behörighet per skyddsform och åtgärd innan ansökan, och verifiera med respektive myndighet. Analysera dispensgrunden mot rätt katalogrekvisit och begär förhandsbesked i gränsfall.","source_refs":["MB","ARTSKYDD","STRAND","EXT: Naturvårdsverket – Dispens från strandskyddet https://www.naturvardsverket.se/vagledning-och-stod/skyddad-natur/strandskydd/dispens-fran-strandskyddet/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-K010-01","node_id":"B50-K010","chart_key":"B50","node_label":"Kontrollera fornlämningar och samråd med länsstyrelsen","title":"Okända fornlämningar påträffas sent – Fornsök är inte uttömmande","category":"Underlagsbrist & data","trigger":"Screeningen bygger på Fornsök och arkiv, men stora delar av landskapet har aldrig inventerats systematiskt, och nya fornlämningar upptäcks först vid fältinventering eller schakt.","description":"KML 2 kap. 10 § förelägger den som planerar större markanläggningar att i god tid samråda med länsstyrelsen. Utgångspunkten är att alla fornlämningar – kända som okända – är skyddade. Fornsöks täckning speglar historiska inventeringsinsatser, inte faktisk förekomst: skogsmark och utmarker i norra Sverige är stora vitt fläckar i registren. Upptäcks en fornlämning efter att lokalisering låsts tvingas omprojektering, utredning eller ingreppsansökan – i värsta fall efter påbörjat arbete, som då måste stoppas omedelbart.","motivation":"Länsstyrelsen Dalarnas strategi för vindbruk och kulturmiljövård poängterar uttryckligen att alla fornlämningar, 'såväl kända som okända', är skyddade enligt kulturminneslagens andra kapitel – ett etablerat utgångsläge som gör screeningen känslig för registerluckor. Källa: Länsstyrelsen, 'Strategi för vindbruk och kulturmiljövård'.","affects":"B50-K010 med nedströms B50-K020–B50-K040; vid sent fynd direkt stopp av markarbete i B70 och återkoppling till B10-020 (lokalisering).","impact":"Tvingad arkeologisk utredning i pågående projekt, omprojektering av infrastruktur, arbetsstopp vid fynd under schakt samt förlängd KML-process om minst ett år i ogynnsamma fall.","mitigation":"Komplettera registersökning med fältindikatorer och tidig arkeologisk förstudie på konfliktkänsliga delar av projektområdet. Involvera länsstyrelsens kulturmiljöenhet redan vid lokaliseringsvalet, inte först i ansökningsfasen.","source_refs":["KML","EXT: Länsstyrelsen Dalarna – Strategi för vindbruk och kulturmiljövård https://www.lansstyrelsen.se/download/18.8cd5a1b19362fb4fc23934/1732539685148/Strategi för vindbruk och kulturmiljövård.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-K010-02","node_id":"B50-K010","chart_key":"B50","node_label":"Kontrollera fornlämningar och samråd med länsstyrelsen","title":"Samrådsplikten enligt KML iakttas för sent och förgiftar relationen med länsstyrelsen","category":"Samråd & motstånd","trigger":"Projektägaren kontaktar länsstyrelsens kulturmiljöenhet först när lokaliseringen är låst, trots att 2 kap. 10 § KML kräver samråd 'i god tid'.","description":"Samrådsplikten är utformad för att fornlämningsfrågorna ska kunna påverka planeringen medan handlingsfriheten finns kvar. Tar projektägaren kontakt sent framstår samrådet som en formalitet, och länsstyrelsen – som både är samrådspart, utredningsbeslutsfattare och senare tillståndsmyndighet för ingrepp – saknar då incitament att vara tillmötesgående. Det praktiska resultatet blir strängare utredningskrav, längre beslutsvägar och en kulturmiljöprocess som löper parallellt med, istället för integrerat i, övriga spår.","motivation":"Boverkets PBL-kunskapsbank om samordning med kulturmiljölagen betonar att fornlämningsfrågor ska hanteras tidigt i planprocessen för att undvika konflikter i slutet. Det är ett välgrundat resonemang direkt ur 2 kap. 10 § KML:s ordalydelse och syfte. Källa: Boverket.","affects":"B50-K010 med samtliga nedströms kulturmiljönoder B50-K020–B50-K040.","impact":"Förlängd och konfliktladdad KML-process, striktare utrednings- och villkorskrav samt försämrad förhandlingsposition vid ingreppsansökan.","mitigation":"Boka samråd med länsstyrelsen direkt vid screeningen och dokumentera att samrådet hållits. Presentera alternativa lägen för känsliga punkter och visa genuin anpassningsvilja före låsning.","source_refs":["KML","EXT: Boverket – Fornlämningar (samordning PBL/KML) https://www.boverket.se/sv/PBL-kunskapsbanken/teman/kulturvarden/samordning-med-kulturmiljolagen/fornlamningar/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-K020-01","node_id":"B50-K020","chart_key":"B50","node_label":"Utred och avgränsa fornlämningar","title":"Arkeologisk kapacitetsbrist och upphandlingskrav förlänger utredningskedjan","category":"Myndighetskapacitet & handläggning","trigger":"Länsstyrelsen beslutar om arkeologisk utredning eller förundersökning, men utförarmarknaden är ansträngd och upphandlingsreglerna (över tröskelvärdena) tvingar fram anbudsförfaranden.","description":"Efter screeningen beslutar länsstyrelsen vid behov om arkeologisk utredning och förundersökning enligt 2 kap. 11–13 §§ KML. Utförandet sker av uppdragsarkeologer i konkurrens, och när kostnaderna överstiger tillämpliga tröskelvärden krävs anbudsförfarande – en process som i sig tar månader. Fältarbetet är dessutom säsongsberoende (snöfri mark), vilket gör att ett beslut taget på hösten kan skjuta utredningen till nästa säsong. Utredningsresultatet ska sedan återföras till lokalisering och utformning, vilket gör fördröjningen multiplikativ.","motivation":"Kungälvs kommun dokumenterade i samrådsredogörelsen för arenaområdet att kostnaderna för undersökning och borttagning av fornlämningar sannolikt överstiger 20 prisbasbelopp, att anbudsförfarande därmed krävs och att detta är 'en tidskrävande process' som planeringen måste ta höjd för. Källa: Kungälvs kommun, samrådsredogörelse arenaområdet.","affects":"B50-K020 med nedströms B50-K030; återkoppling till projektets lokalisering (B10-020) och samordning med detaljplanespåret B50-P020.","impact":"Förskjutning av utredning och beslut om en till två fältsäsonger, blockering av projektering i berörda delar samt merkostnad för upphandling och utförande.","mitigation":"Initiera utredningsbehovet så tidigt att fältarbetet kan läggas på kommande säsong, och förbered upphandlingsunderlag parallellt med länsstyrelsens beslutsprocess. Överväg etappvis utredning där projektets kritiska delar prioriteras.","source_refs":["KML","EXT: Kungälvs kommun – samrådsredogörelse arenaområdet https://www.kungalv.se/contentassets/c642667d98294c7b923f7b0e4dd38dbf/samradsredogorelse-arenaomradet.pdf","EXT: Kungälvs kommun – arkeologisk förundersökning arenaområdet https://www.kungalv.se/contentassets/c1a2b32eb6b64c8a91ca8f236fa31e5b/arkeologisk-forundersokning-2017-och-2022-arenaomradet.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-K020-02","node_id":"B50-K020","chart_key":"B50","node_label":"Utred och avgränsa fornlämningar","title":"Utredningsresultatet visar större och värdefullare lämningar än väntat","category":"Teknisk komplexitet","trigger":"Förundersökningen avslöjar att fornlämningarna är mer omfattande, äldre eller bättre bevarade än registren indikerat, vilket ändrar skyddsvärdet och möjligheten till ingrepp.","description":"Syftet med utredningen är att avgränsa lämningarna, men resultatet är per definition osäkert förrän arbetet är gjort. Om förundersökningen visar högre vetenskapligt värde eller större utbredning än antaget försvåras förutsättningarna för ingreppstillstånd i nästa nod: länsstyrelsens rimlighetsbedömning ('hinder eller olägenhet som inte står i rimligt förhållande till fornlämningens betydelse') blir svårare att vinna. Projektet står då med ett låst läge som visar sig sitta på ett högvärdigt kulturlager.","motivation":"Rimlighetsavvägningen vid ingrepp i fornlämningar är beroende av lämningens bedömda betydelse, och utredningens syfte är just att fastställa den betydelsen – osäkerheten är alltså inbyggd i processdesignen (2 kap. 11–13 §§ KML). Boverkets vägledning bekräftar att länsstyrelsen får besluta om förundersökning innan tillståndsfrågan prövas. Källa: Boverket, KML.","affects":"B50-K020, B50-K030 samt vid behov omprojektering via loop tillbaka till B50-K020 och lokalisering i B10-020.","impact":"Avskrivna projekteringskostnader för berörda delar, omprojektering under tidspress samt sämre utgångsläge i den efterföljande tillståndsprövningen.","mitigation":"Gör georadar- eller schaktningsundersökningar som försteg före definitiv låsning av kritiska anläggningsdelar. Behåll flexibla reservdragningar för ledningar och vägar tills utredningen är klar.","source_refs":["KML","EXT: Boverket – Fornlämningar (samordning PBL/KML) https://www.boverket.se/sv/PBL-kunskapsbanken/teman/kulturvarden/samordning-med-kulturmiljolagen/fornlamningar/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-K030-01","node_id":"B50-K030","chart_key":"B50","node_label":"Undvik eller pröva ingrepp i fornlämning","title":"Länsstyrelsen avslår ingreppsansökan – fornlämningen ska bevaras","category":"Rättslig osäkerhet","trigger":"Länsstyrelsen bedömer att olägenheten för projektet inte står i rimligt förhållande till fornlämningens betydelse och avslår ansökan om att ta bort eller ändra lämningen.","description":"Utgångspunkten i KML är bevarande: tillstånd till ingrepp är undantaget och kräver att olägenheten av fornlämningen väger tyngre än dess kulturhistoriska betydelse. En ansökan som bygger på projektets ekonomi eller tidsplan, snarare än på en genuin omöjlighet att anpassa läget, avslås. Avslaget tvingar omprojektering (loop till B50-K020) eller överklagande, och är svår att förutse eftersom betydelsebedömningen är vetenskaplig och görs av länsstyrelsens egna experter.","motivation":"KML 2 kap. 12 § stadgar rimlighetsbedömningen, och länsstyrelsernas praxis är att bevarande är utgångspunkten: 'Vår utgångspunkt är att fornlämningar ska bevaras, men vi kan i vissa fall ge tillstånd till ett ingrepp' (Länsstyrelsen Östergötland m.fl.). Källa: lansstyrelsen.se.","affects":"B50-K030 med loop till B50-K020, och i förlängningen B50-K040 samt projektets kritiska linje om lämningen ligger i en funktionellt nödvändig del.","impact":"Tvingad omprojektering av väg-, lednings- eller anläggningslägen, förskjuten tidplan om minst en utrednings- och beslutscykel samt merkostnad för ny projektering.","mitigation":"Utforma ansökan kring att undvikande verkligen prövats och visats ogenomförbart eller oproportionerligt, med dokumenterade alternativ. Lägg ingreppsdelarna utanför projektets tidkritiska linje tills beslutet föreligger.","source_refs":["KML","EXT: Länsstyrelsen Östergötland – Fornlämningar och fornfynd https://www.lansstyrelsen.se/ostergotland/samhalle/kulturmiljo/fornlamningar-och-fornfynd.html"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-K030-02","node_id":"B50-K030","chart_key":"B50","node_label":"Undvik eller pröva ingrepp i fornlämning","title":"Slutundersökningsvillkoren blir dyrare och långsammare än budgeterat","category":"Underlagsbrist & data","trigger":"Tillståndet till ingrepp villkoras med arkeologisk slutundersökning på exploatörens bekostnad, och omfattningen visar sig större än förundersökningen antydde.","description":"Vid bifall villkorar länsstyrelsen regelmässigt tillståndet med slutundersökning: fornlämningen dokumenteras vetenskapligt innan den tas bort, på projektets bekostnad. Kostnaden styrs av lämningens faktiska omfattning och komplexitet – inte av förundersökningens prognos – och kan i gravfält eller boplatser bli mycket stor. Slutundersökningen ska dessutom vara genomförd före markarbetet, vilket gör den till ett hårt förstartsvillkor som direkt styr byggstarten.","motivation":"Länsstyrelsens arbetssätt är att upphandla slutundersökningen för exploatörens räkning (Länsstyrelsen, 'Fornlämningar'), och Kungälv-exemplet visar att kostnader på över 20 prisbasbelopp med tillhörande anbudsprocess är en realistisk nivå även för begränsade områden. Källor: lansstyrelsen.se, Kungälvs kommun.","affects":"B50-K030 och B50-K040 (förstartsvillkoren), med direkt koppling till markarbetets start i B70.","impact":"Obudgeterade arkeologikostnader, förskjuten byggstart i väntan på färdig slutundersökning samt säsongsberoende ytterligare fördröjning om vintern kommer emellan.","mitigation":"Budgetera slutundersökningen med betydande osäkerhetsmarginal redan i projektkalkylen och ta höjd för en fältsäsong i tidplanen. Förhandla om undersökningens avgränsning och etappindelning med länsstyrelsen i samband med tillståndet.","source_refs":["KML","EXT: Länsstyrelsen – Fornlämningar (upphandling av slutundersökning) https://www.lansstyrelsen.se/download/18.1b1d393819324610c3749ff3/1732518789572/Fornm","EXT: Kungälvs kommun – samrådsredogörelse arenaområdet https://www.kungalv.se/contentassets/c642667d98294c7b923f7b0e4dd38dbf/samradsredogorelse-arenaomradet.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-K040-01","node_id":"B50-K040","chart_key":"B50","node_label":"Kulturmiljöbeslut slutligt och villkor planerade","title":"Överklagat KML-beslut eller ohanterade förstartsvillkor blockerar markarbetet","category":"Överklagande & rättsprocess","trigger":"Länsstyrelsens beslut om ingrepp överklagas till förvaltningsdomstol, eller projektet missar att slutundersökningsvillkoren måste vara fullgjorda före schaktstart.","description":"Beslut om ingrepp i fornlämning kan överklagas enligt 2 kap. 24 § KML, och fram till dess beslutet vunnit laga kraft är förutsättningarna osäkra. Samtidigt är de arkeologiska förstartsvillkoren operativa: slutundersökningen ska vara utförd och dokumenterad innan markarbetet får börja. Ett projekt som planerar byggstart mot ett överklagat beslut, eller som bokat entreprenad utan att räkna in undersökningstiden, riskerar både rättslig ogiltighet och konkret stopp av tillsyn eller polis vid olaga ingrepp.","motivation":"Att bryta fornlämningsförbudet utan giltigt och fullgjort tillstånd är straffbelagt, och processlogiken – tillstånd, överklagandemöjlighet, villkorad slutundersökning före ingrepp – följer direkt av 2 kap. KML. Kungälv-fallet visar att undersöknings- och borttagningsfrågorna i praxis hanteras först efter att planen vunnit laga kraft, vilket förskjuter hela kedjan mot byggstarten. Källor: KML, Kungälvs kommun.","affects":"B50-K040 och samlingsgaten B50-G900, med direkt blockering av berört markarbete i B70.","impact":"Uppskjuten schaktstart om veckor till en fältsäsong, risk för tillsyns- och straffrättsliga konsekvenser vid för tidigt ingrepp samt avbrutna entreprenadkontrakt.","mitigation":"Gör laga kraft på KML-beslutet till ett uttryckligt kriterium i byggstartsbeslutet. Planera slutundersökningen som en egen aktivitet i huvudtidplanen med bokad arkeologisk utförare, och etappdela schaktområdena så att oklanderliga delar kan påbörjas.","source_refs":["KML","EXT: Kungälvs kommun – samrådsredogörelse arenaområdet https://www.kungalv.se/contentassets/c642667d98294c7b923f7b0e4dd38dbf/samradsredogorelse-arenaomradet.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-M010-01","node_id":"B50-M010","chart_key":"B50","node_label":"Verifiera mineralrätt, fyndighet och koncessions-MKB","title":"Undersökningstillståndet eller mineralrätten är osäker eller bestridd","category":"Rättslig osäkerhet","trigger":"Projektets undersökningstillstånd har löpt ut, täcks av konkurrerande tillstånd, eller rätten till fyndigheten är föremål för tvist (t.ex. avstående, inlösen eller förknippad fastighetsrätt).","description":"En ansökan om bearbetningskoncession förutsätter att sökanden har en giltig mineralrätt – normalt genom undersökningstillstånd där fyndigheten konstaterats inom tillståndsområdet. Om undersökningstillståndet hunnit upphöra, om det finns överlappande konkurrerande ansökningar, eller om fyndighetsgränserna sträcker sig utanför tillståndsområdet, kan ansökan inte vinna bifall i nuvarande skick. Koncessions-MKB:n ska dessutom täcka hela den framtida driften, inklusive driftsanläggningar, vilket kräver att fyndighets- och anläggningsgeometrin är låst tidigt.","motivation":"Verifierbart prejudikat: HFD 2016 ref. 21 (mål 2047-14, Norra Kärr) slog fast att en bearbetningskoncession inte omfattar för driften nödvändiga anläggningar om dessa inte prövats, och att prövningen måste omfatta slutlig tillämpning av MB 3 och 4 kap. för driftsanläggningarna – med följden att regeringens koncessionsbeslut upphävdes och återförvisades. Hela prövningens objekt måste alltså vara rätt avgränsat redan i underlagsskedet.","affects":"B50-M010, nedströms B50-M020 (ansökan kan inte lämnas eller avvisas), B50-M030 och hela gruvspåret in i B50-G900.","impact":"Avvisning eller återförvisning av koncessionsansökan, behov av nya undersökningstillstånd och omarbetad MKB – i praktiken flera års försening.","mitigation":"Verifiera mineralrättens giltighet och täckning mot Bergmästarens register innan MKB-arbetet startar. Avgränsa prövningsobjektet så att fyndighet och samtliga driftsanläggningar (upplag, anrikningsverk, vägar, vattenanläggningar) ingår i samma utredningsram. Lös gränser och tvister om täckande rättigheter innan ansökan.","source_refs":["MINERALLAG","SGU_MINING","EXT: HFD 2016 ref. 21 (mål 2047-14) https://lagen.nu/dom/hfd/2016:21"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-M010-02","node_id":"B50-M010","chart_key":"B50","node_label":"Verifiera mineralrätt, fyndighet och koncessions-MKB","title":"Koncessions-MKB:n håller inte för kraven på samlad bedömning av driften","category":"Underlagsbrist & data","trigger":"Den specifika miljöbedömningen för koncessionsärendet begränsas till själva fyndighetsbrytningen och missar driftsanläggningar, kumulativa effekter eller påverkan på Natura 2000-områden.","description":"Sedan HFD 2016 ref. 21 och den efterföljande lagändringen ställs höga krav på att miljöbedömningen i koncessionsärendet omfattar hela den tilltänkta verksamheten, inklusive driftsanläggningar, och att påverkan på Natura 2000-områden bedöms samlat. En MKB som bygger på äldre praxis – att detaljerna 'löses i miljöprövningen' – håller inte. Konsekvensen blir kompletteringskrav från Bergmästaren, ny remissrunda, eller i värsta fall upphävande i överinstans om en koncession ändå meddelas på bristfälligt underlag.","motivation":"HFD 2016 ref. 21 (Norra Kärr) upphävde regeringens koncessionsbeslut just därför att begränsningen av koncessionsärendet medfört att ingen samlad bedömning av påverkan på angränsande Natura 2000-områden gjorts. Riksdagens betänkande 2020/21:NU16 behandlade efterspelet. Detta är direkt tillämplig praxis på nodens arbete.","affects":"B50-M010, nedströms B50-M020–B50-M030, samt parallella spåret B50-N010/B50-N020 (Natura-prövningen) och B50-M040.","impact":"Återförvisning eller upphävande av koncessionsbeslut, omarbetad MKB med nya inventeringar (säsongsberoende), samt förlorat förtroende hos myndigheter och opinion.","mitigation":"Låt MKB:n omfatta hela projektets livscykel och samtliga driftsanläggningar redan i koncessionsskedet. Gör en tydlig Natura 2000-analys även där separat tillstånd senare söks. Dokumentera kumulativa effekter med andra projekt i regionen.","source_refs":["MINERALLAG","SGU_MINING","NATURA","EXT: HFD 2016 ref. 21 (mål 2047-14) https://lagen.nu/dom/hfd/2016:21"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-M020-01","node_id":"B50-M020","chart_key":"B50","node_label":"Ansök om bearbetningskoncession","title":"Kungörelse och samråd med länsstyrelsen blir en konfliktarena","category":"Samråd & motstånd","trigger":"Kungörelsen av koncessionsansökan mobiliserar samebyar, markägare, kommuner och miljöorganisationer vars synpunkter tvingar Bergmästaren till omfattande kompletteringar.","description":"Bergmästaren ska kungöra ansökan och samråda med länsstyrelsen om den avvägning som ska göras enligt miljöbalkens riksintresse- och lokaliseringregler. I konfliktfyllda gruvärenden blir detta skedet en fullskalig opinionsprocess: samebyar aktiverar rennäringens riksintresse, kommuner splittras, och remissvaren pekar ut brister i MKB och alternativanalys. Varje kompletteringsrunda förlänger ärendet, och konfliktnivån påverkar senare om ärendet hänskjuts till regeringen.","motivation":"Kallak/Gállok är det mest kända exemplet: ansökan 2011–2013, Bergmästaren ansåg i flera avseenden att koncession kunde beviljas men hänskjöt ärendet till regeringen 2014, och regeringen beviljade först i mars 2022 efter år av konflikt med Gállokkronföreningen och lokal motståndsopinion – därefter följde överklaganden som MÖD slutligt prövade 2024. Processen visar hur samråds- och remisskedjan i gruvärenden kan sträckas över ett decennium. Källor: SVT 2024-06-26 om domstolens klartecken; Regeringens beslut mars 2022.","affects":"B50-M020, nedströms B50-M030 (regeringsspåret aktiveras oftare i konfliktlägen), B50-M040 och B50-M050 samt B50-G900.","impact":"Mångårig fördröjning, eskalerad konflikt som följer projektet in i miljöprövningen (B30), samt ökad sannolikhet att ärendet hamnar på regeringens bord.","mitigation":"Bedriv strukturerad dialog med samebyar, markägare och kommun långt före kungörelsen, och låt koncessions-MKB:n besvara de väntade invändningarna om rennäring, vatten och transporter. Dokumentera samrådet noggrant – det blir en del av regeringens och domstolarnas prövningsunderlag.","source_refs":["MINERALLAG","SGU_MINING","EXT: SVT – Omstridd gruva i Kallak får klartecken av domstol https://www.svt.se/nyheter/lokalt/norrbotten/gruvan-i-kallak-far-klartecken-av-domstolen"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-M020-02","node_id":"B50-M020","chart_key":"B50","node_label":"Ansök om bearbetningskoncession","title":"Bergmästarens kapacitet och processpraxis fördröjer fullständighetsgranskningen","category":"Myndighetskapacitet & handläggning","trigger":"Bergsstaten/SGU har få handläggare för koncessionsärenden samtidigt som antalet ansökningar om kritiska mineral ökar, vilket ger köer redan i fullständighetsgranskningen.","description":"Bergmästaren är en liten enhet inom SGU med ansvar för både undersökningstillstånd, koncessionsärenden och förvaltningsuppgifter. Energikris och grön omställning har dramatiskt ökat trycket på gruvspåret, inklusive nya regler för kritiska råvaror. Ett koncessionsärende med tung MKB och många remissinstanser kan därför ligga i fullständighets- och kompletteringsfas under lång tid innan det ens når sakprövning, utan att sökanden har någon effektiv rättsmedelsväg mot dröjsmålet.","motivation":"Välgrundat resonemang: Bergsstatens roll och organisation framgår av SGU:s redovisning av regelsystemet, och regeringens gruv- och mineralstrategi har upprepade gånger identifierat handläggningstider i minerallagsspåret som ett hinder. Norra Kärr-ärendets långa historia (undersökningstillstånd 2009, koncession 2013/2014, upphävande 2016, ny ansökan, regeringsbeslut 2026) illustrerar systemets tidsförlopp.","affects":"B50-M020, nedströms B50-M030–B50-M050 och B50-G900; indirekt hela gruvprojektets finansiering som är beroende av koncessionen.","impact":"Passiv fördröjning utan beslut att överklaga, försvårad finansiering (investerare kräver koncession) och förlorad marknadsposition för tidskänsliga mineralprojekt.","mitigation":"Leverera en komplett ansökan som inte kräver komplettering: följ Bergsstatens ansökningskrav till punkt, inklusive MKB och karta. Upprätthåll löpande kontakt med handläggaren och svara omedelbart på kompletteringsbegäran. Planera finansieringen med buffert för flerårig handläggning.","source_refs":["MINERALLAG","SGU_MINING"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-M030-01","node_id":"B50-M030","chart_key":"B50","node_label":"Koncessionsbeslut, regeringsspår och överklagande","title":"Hänskjutande till regeringen lägger till år av osäkerhet","category":"Politisk & policyrisk","trigger":"Bergmästaren bedömer att frågan är av särskild betydelse eller att länsstyrelsen är oenig, och hänskjuter ärendet till regeringen enligt minerallagen.","description":"När koncessionsfrågan hänskjuts till regeringen ersätts den administrativa prövningen av en politisk avvägning där riksintressen mot varandra (mineralutvinning mot rennäring, naturvård, vattenskydd) avgörs i regeringskansliet. Regeringens handläggning har ingen formell tidsgräns, och ärendet kan ligga i flera år – särskilt om regeringsskifte inträffar eller om opinionen är hård. Beslutet påverkas dessutom av skiftande politiska majoriteter, vilket gör utfallet svårprognostiserat oavsett underlagets kvalitet.","motivation":"Verifierade exempel: I Kallak hänskjöt Bergmästaren ärendet till regeringen 2014; regeringen beviljade koncession först i mars 2022 – åtta år senare. I Norra Kärr slog regeringen fast koncessionen 2014, HFD upphävde beslutet 2016, och regeringen beviljade en ny koncession först 2026. Båda fallen visar att regeringsspåret är en flerårig, politiskt laddad fas. Källor: SVT om Kallak (2024-06-26); SvD om Norra Kärr (2026-06-27).","affects":"B50-M030, nedströms B50-M040, B50-M050 och B50-G900; regeringsbeslutet blir dessutom utgångspunkt för efterföljande överklaganden.","impact":"Flerårig planeringsosäkerhet, politisk exponering av projektet, och risk för avslag på politisk grund trots tekniskt godkänt underlag – eller tvärtom bifall som sedan prövas i domstol.","mitigation":"Bygg underlaget så att det tål både administrativ och politisk prövning: tydliggör samhällsnytta, arbetstillfällen och kritisk mineralproduktion jämte miljöhänsynen. Upprätthåll dialog med berörda departement och länsstyrelse. Scenarieplanera för regeringsskiften och förbered kommunikation kring riksintresseavvägningen.","source_refs":["MINERALLAG","SGU_MINING","EXT: SvD – Gruvfyndighet i Norra Kärr får undersökas vidare https://www.svd.se/a/K8WX27/regeringen-ger-gruva-i-norra-karr-gront-ljus"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-M030-02","node_id":"B50-M030","chart_key":"B50","node_label":"Koncessionsbeslut, regeringsspår och överklagande","title":"Koncessionsbeslutet upphävs i domstol på process- eller MKB-grunder","category":"Överklagande & rättsprocess","trigger":"Berörda – länsstyrelse, kommuner, samebyar, organisationer eller enskilda – överklagar Bergmästarens eller regeringens beslut, med åberopande av brister i miljöbedömningen eller i processen.","description":"Koncessionsbeslut kan överklagas, och regeringsbeslut prövas av Högsta förvaltningsdomstolen. Prövningen kan leda till upphävande och återförvisning om miljöbedömningen inte omfattat hela verksamheten, om Natura 2000-påverkan inte bedömts samlat, eller om processfel begåtts. Ett upphävt beslut skickar ärendet tillbaka i systemet – ofta till Bergmästaren för ny behandling – och koncessionens giltighet är därefter osäker tills kedjan är slutförd, vilket blockerar alla efterföljande tillstånd som bygger på den.","motivation":"HFD 2016 ref. 21 (Norra Kärr, mål 2047-14): Högsta förvaltningsdomstolen upphävde regeringens koncessionsbeslut och återförvisade ärendet till Bergmästaren, eftersom prövningen inte omfattat driftsanläggningarna och därmed inte heller en samlad bedömning av påverkan på angränsande Natura 2000-områden. I Kallak prövade MÖD överklaganden av regeringens koncessionsbeslut, med slutligt klartecken först i juni 2024 (SVT 2024-06-26). Direkt tillämplig praxis.","affects":"B50-M030, nedströms B50-M040 (miljötillstånd och markanvisning kan inte slutföras mot en osäker koncession), B50-M050 och B50-G900.","impact":"Återförvisning med ny behandling, år av fördröjning, och i förlängningen risk att koncessionen upphör om ny prövning inte slutförs – jfr att bolaget i Norra Kärr förlorade koncessionen efter upphävandet 2016.","mitigation":"Säkerställ att MKB och prövningsobjekt uppfyller HFD 2016 ref. 21:s krav på helhetstäckning. Bemöt alla remissinvändningar skriftligt i ärendet. Förbered överklagandefasen juridiskt redan vid ansökan och bedöm löpande om kompletterande utredningar bör göras för att underlaget ska hålla i HFD/MÖD.","source_refs":["MINERALLAG","SGU_MINING","EXT: HFD 2016 ref. 21 (mål 2047-14) https://lagen.nu/dom/hfd/2016:21"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-M030-03","node_id":"B50-M030","chart_key":"B50","node_label":"Koncessionsbeslut, regeringsspår och överklagande","title":"Rikskonflikt enligt MB 3–4 kap. fäller avvägningen mot projektet","category":"Rättslig osäkerhet","trigger":"Länsstyrelsen hävdar att markanvändningen inte är förenlig med riksintressen för rennäring, naturvård eller vattenförsörjning, och Bergmästaren/regeringen gör en annan bedömning än projektet räknat med.","description":"Koncessionsprövningen omfattar en slutlig tillämpning av miljöbalkens 3 och 4 kap. om riksintressen och hushållning med mark och vatten. Om koncessionsområdet ligger i renskötselområde av riksintresse, nära ett vattenskyddsområde eller i område av riksintresse för naturvård, krävs att verksamheten kan ske utan att riksintresset skadas väsentligt – en materiell spärr, inte bara en avvägning. Avslag på denna grund kan inte botas med villkor, utan kräver omlokalisering eller avgränsning av projektet.","motivation":"I Norra Kärr var dricksvattenförsörjningen från Vättern och närliggande Natura 2000-områden centrala invändningar som präglade både domstolsprövningen 2016 och den förnyade processen fram till regeringsbeslutet 2026, där bolaget tvingades revidera projektet (bl.a. flytta kemisk bearbetning). I Kallak var rennäringens riksintresse den avgörande konfliktlinjen i regeringens avvägning. Direkt verifierade erfarenheter.","affects":"B50-M030, med återkoppling till B50-M010 (prövningsobjektet kan behöva avgränsas om) och nedströms B50-M040, B50-M050, B50-G900.","impact":"Avslag på koncession eller tvång till väsentlig projektomgestaltning (ändrad placering av upplag och processanläggningar), med återverkningar på hela projektets ekonomi.","mitigation":"Gör riksintresse- och hushållningsanalysen till en kärnfråga redan i koncessions-MKB:n, med konkreta redovisningar av hur rennäring, vattentäkter och naturmiljö skyddas. Utforma projektet med marginaler (buffertzoner, alternativ placering av driftsanläggningar) som kan erbjudas i prövningen utan att projektets bärkraft bryts.","source_refs":["MINERALLAG","MB","SGU_MINING"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-M040-01","node_id":"B50-M040","chart_key":"B50","node_label":"Slutför miljötillstånd, Natura 2000 och markanvisning","title":"Koncessionen räcker inte – miljötillståndet blir den verkliga flaskhalsen","category":"Sektorssamordning","trigger":"Projektet vinner bearbetningskoncession men underskattar att 9 kap.-tillståndet hos mark- och miljödomstolen är en fullskalig, självständig prövning som kan ge avslag eller strängare villkor än koncessionen förutsätter.","description":"Bearbetningskoncessionen ger ensamrätt till fyndigheten men tillåter ingen drift: gruvverksamheten kräver tillstånd som miljöfarlig verksamhet enligt MB 9 kap. hos MMD, med full miljöprövning av utsläpp, dammar, avfallsanordningar och vattenpåverkan. MMD kan ställa villkor som gör koncessionens brytningsplan ogörlig, eller neka tillstånd. Att driva koncessionsspår och miljöprövning sekventiellt – i stället för parallellt förberett – fördubblar i praktiken tiden till byggstart, och ett miljötillstånd som avviker från koncessionsantagandena kan kräva omarbetning av båda spåren.","motivation":"Norra Kärr illustrerar spårseparationen: miljödomstolen lämnade ansökan om miljötillstånd utan bifall med hänvisning till lokaliseringen och risken för påverkan på vattentäkt och naturmiljö, trots att koncessionsfrågan hanterats parallellt. Länsstyrelsen i Östergötland bekräftar i sin ärendehantering att gruvverksamhet kräver tillstånd från mark- och miljödomstolen oberoende av koncessionen. Direkt verifierat exempel på att ett spår inte ersätter det andra.","affects":"B50-M040 och nedströms B50-M050, B50-G900; uppströms koppling till B30 (miljöprövningen, B30-100) och B50-N010 (Natura).","impact":"Flerårig förlängning av totalprocessen, avslag eller villkor som bryter koncessionens förutsättningar, samt behov av samordnad omprövning av båda spåren.","mitigation":"Förbered miljötillståndsansökan parallellt med koncessionsärendet, med samma tekniska beskrivning som grund. Använd MB 22 kap. 1 d § (samlad tillståndshistorik) för att hålla spåren konsistenta. Säkerställ att koncessions-MKB:n och 9 kap.-ansökans MKB är versionsstyrda och överensstämmande.","source_refs":["MINERALLAG","MB","SGU_MINING","EXT: Riksdagen bet. 2020/21:NU16 Natura 2000-tillstånd vid ansökan om bearbetningskoncession https://data.riksdagen.se/dokument/H801NU16.html"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-M040-02","node_id":"B50-M040","chart_key":"B50","node_label":"Slutför miljötillstånd, Natura 2000 och markanvisning","title":"Natura 2000-tillståndet hänger inte ihop med koncessionens tidplan","category":"Rättslig osäkerhet","trigger":"Gruvprojektet berör Natura 2000-områden, och den självständiga prövningen enligt MB 7 kap. kan inte slutföras på samma villkor som koncessionen antagit – eller kräver regeringens tillåtelseprövning.","description":"Natura 2000-tillstånd är en egen prövning som inte ingår i koncessionen och inte heller automatiskt i miljöprövningen. Om projektet inte kan genomföras utan att skada områdets värden krävs undantagsprövning enligt MB 7 kap. 29 § med regeringens medverkan – en lång och sällan framgångsrik väg. Riksdagen har visserligen klargjort att Natura-tillstånd inte ska vara förutsättning för koncession (bet. 2020/21:NU16), men i praktiken kan projektet då stå med en koncession som inte kan utnyttjas förrän Natura-frågan lösts, och kompensationskraven kan förändra projektets utformning.","motivation":"HFD 2016 ref. 21 etablerade att påverkan på Natura 2000-områden måste bedömas samlat i koncessionsprövningen, och betänkande 2020/21:NU16 behandlade den kvarstående ordningsfrågan. I Norra Kärr kvarstod Natura- och dricksvattenfrågorna som centrala även i 2026 års regeringsbeslut. Praxis och regelverk tillsammans visar att Natura-spåret är en självständig kritisk linje för gruvprojekt nära skyddade områden.","affects":"B50-M040, parallella spåret B50-N010–B50-N060, nedströms B50-M050 och B50-G900.","impact":"Koncession som inte kan utnyttjas förrän Natura-frågan lösts, krav på omfattande kompensationsåtgärder eller omprojektering, samt fördröjning om undantagsprövning aktualiseras.","mitigation":"Identifiera Natura-konflikten redan i B50-M010 och dimensionera alternativ (flytt av upplag, ändrad deponiteknik) som undanröjer skadan. Om undantag är oundvikligt: förbered regeringsärendet med kompensationspaket tidigt. Samordna tidsplanen för Natura-ansökan med 9 kap.-ansökan så att prövningarna kan hantera samma underlag.","source_refs":["MINERALLAG","MB","NATURA","EXT: Riksdagen bet. 2020/21:NU16 https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/natura-2000-tillstand-vid-ansokan-om_h801nu16/html/"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-M040-03","node_id":"B50-M040","chart_key":"B50","node_label":"Slutför miljötillstånd, Natura 2000 och markanvisning","title":"Markanvisning och fastighetsrättslig åtkomst halkar efter tillståndsspåren","category":"Intressekonflikt & markåtkomst","trigger":"Koncessionsinnehavaren får inte tillgång till den mark som behövs för driftsanläggningar, upplag och infrastruktur, eftersom markägare vägrar avtal eller markanvisningsprövningen drar ut på tiden.","description":"Minerallagen ger koncessionsinnehavaren möjlighet att få utrymme för verksamheten genom markanvisning, men det är en egen formell process hos Bergmästaren med ersättnings- och prövningsfrågor, och den ersätter inte samtliga rättigheter. För stora gruvprojekt behövs dessutom mark utanför koncessionsområdet (vägar, ledningar, industriytor), där vanlig fastighetsbildning eller avtal krävs. Om markanvisningsärendet startar först efter koncession och miljötillstånd uppstår en tredje sekventiell process som kan ta år, och motstånd från markägare eller samebyar kan driva den i domstol.","motivation":"Välgrundat resonemang utifrån minerallagens markanvisningsregler (jfr SGU:s regelsammanfattning) och erfarenheten från svenska gruvetableringar, där markåtkomst för upplag, logistik och infrastruktur regelmässigt är en senarelagd men tidskritisk fråga. I konfliktfyllda projekt som Kallak har mark- och rennäringsfrågorna drivits parallellt i flera rättsliga spår.","affects":"B50-M040, nedströms B50-M050 och B50-G900; koppling även till B50-E-spåret om elledningar ska dras över tredje mans mark.","impact":"Byggstart som inte kan ske trots koncession och miljötillstånd, tvister om ersättning och rättigheter, samt förseningar i markanvisnings- och fastighetsbildningsprocesser.","mitigation":"Kartlägg markbehovet för hela driften – inte bara fyndigheten – redan i koncessions-MKB:n. Starta avtalsförhandlingar och markanvisningsärende parallellt med tillståndsspåren. Säkra optioner på kritiska fastigheter tidigt för att minska exponeringen mot enskilda motståndare.","source_refs":["MINERALLAG","SGU_MINING"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-M050-01","node_id":"B50-M050","chart_key":"B50","node_label":"Samlad gruvbyggstartsgate","title":"Beslutspaketet är inkonsistent – villkor biter inte på varandra","category":"Sektorssamordning","trigger":"Koncession, miljötillstånd, Natura-beslut, markanvisning och PBL-beslut innehåller överlappande eller motstridiga villkor om områdesgränser, säkerheter, buller, dammar eller tidplaner.","description":"Den samlade gruvgaten kräver att alla beslut är förenliga och verkställbara samtidigt. I praktiken kan koncessionen avse en geometri som miljötillståndet beskurit, säkerhetsställandet för efterbehandling enligt miljötillståndet vara större än finansieringen antagit, eller PBL-lovets placering av byggnader avvika från MKB-bilagorna. Varje inkonsistens måste lösas genom ändringsansökan, komplettering eller nytt beslut i respektive spår – ofta i turordning, eftersom besluten refererar till varandra. Gaten blir därmed en kvalitetssäkring som kan avslöja fel skapade år tidigare.","motivation":"Välgrundat resonemang utifrån nodens funktion och MB 22 kap. 1 d §:s krav på konsoliderad tillståndshistorik: svenska gruvprojekt har en väl dokumenterad historia av att olika besluts spår utvecklas olika över tid. HFD 2016 ref. 21 visar dessutom att avgränsningsfrågan mellan koncession och övriga tillstånd är reellt förrädisk – vad som prövats var måste stämma exakt.","affects":"B50-M050, B50-G900, samt uppströms B50-M040, B30-spåret och B50-P-spåret vid behov av rättelser.","impact":"Uppskjuten byggstart trots att samtliga beslut formellt finns, kostsamma ändringsärenden, och i värsta fall upptäckt av att ett beslut måste överklagas eller sökas om på nytt.","mitigation":"Inför en beslutsdatabas som spårar varje villkor, områdesgräns och förstartskrav per beslut, med en formell konsistensgranskning före byggstart. Låt en juridisk samordnare ansvara för versionskontroll av handlingarna över spåren. Begär i varje beslut att det uttryckligen hänvisar till aktuella versioner av underliggande handlingar.","source_refs":["MINERALLAG","MB","SGU_MINING"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-N010-01","node_id":"B50-N010","chart_key":"B50","node_label":"Kan Natura 2000 påverkas betydande?","title":"Indirekt och kumulativ påverkan underskattas i screeningen","category":"Rättslig osäkerhet","trigger":"Projektet ligger utanför eller i kanten av ett Natura 2000-område och screeningen bedömer bara direkt arealpåverkan, inte hydrologi, störningsavstånd eller samverkan med andra projekt.","description":"Tröskeln i MB 7 kap. 28 a § – 'påverka på ett betydande sätt' – omfattar även indirekt och kumulativ påverkan mot områdets bevarandemål och skyddade värden. En screening som bygger på enkel kartöverlagring missar t.ex. grundvattenpåverkan nerströms, störningar på fågelliv utanför områdesgränsen eller samverkan med andra tillståndsgivna anläggningar. Om tillståndsplikten upptäcks först i huvudprövningen, på remiss eller efter överklagande, tvingas projektet till ett Natura 2000-spår i efterhand – ofta parallellt med en pågående domstolsprocess. Gränsdragningen är dessutom beroende av bevarandeplaner som kan vara inaktuella.","motivation":"Nordkalk/Ojnarefjärden är det tydligaste svenska exemplet: prövningen kom att handla om täkternas påverkan på Natura 2000-området Bästeträsk, inklusive hydrologisk påverkan utanför täktgränserna, och frågan drev processen genom MMD, MÖD (bl.a. MÖD 2016:1 om Hoburgsmyr och dom 2018 i M 5375-14 om Bästeträsk) och Högsta domstolen under många år. Källor: Sveriges Domstolar, lagen.nu.","affects":"B50-N010 med nedströms B50-N020–B50-N060; sen upptäckt tvingar återföring från B50-G900 och kan pausa huvudspåren B30/B40.","impact":"Fördröjning i storleksordningen hela miljöprövningar, retroaktiv ansökningsplikt, risk för att redan meddelat huvudtillstånd överklagas och i slutänden förlorad byggberedskap.","mitigation":"Screena alltid mot bevarandeplanens skyddade värden och störningsavstånd, inte bara arealöverlagring. Inkludera kumulativ påverkan med andra tillståndsgivna och planerade projekt. Dokumentera screeningen skriftligt så att den kan försvaras vid överklagande.","source_refs":["MB","NATURA","EXT: MÖD 2016:1 https://lagen.nu/dom/mod/2016:1","EXT: MÖD dom M 5375-14 (2018) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-N010-02","node_id":"B50-N010","chart_key":"B50","node_label":"Kan Natura 2000 påverkas betydande?","title":"Oklar rollfördelning i screeningen mellan projektägare och länsstyrelse","category":"Myndighetskapacitet & handläggning","trigger":"Projektägaren väntar på länsstyrelsens ställningstagande om tillståndsplikt medan länsstyrelsen saknar resurser eller underlag för ett snabbt svar.","description":"Screeningsbeslutet görs av projektägare och/eller länsstyrelse beroende på spår, men det finns ingen formell tidsgräns för länsstyrelsens besked om tillståndsplikt i det inledande skedet. Länsstyrelsernas naturvårdsenheter är i flera län hårt belastade, och ett svagt screeningunderlag ger besked som inte håller vid överprövning. Projektägaren bär det slutliga ansvaret att inte bedriva tillståndspliktig verksamhet utan tillstånd, men praktiken att invänta informella besked gör noden till en flaskhals där båda parter väntar på varandra.","motivation":"Länsstyrelsernas egen vägledning om Natura 2000-tillstånd visar att processen bygger på att sökanden själv tar fram samrådsunderlag och MKB innan myndigheten kan ta ställning – ett upplägg som förutsätter både tid och kapacitet hos båda parter. Källa: Länsstyrelsen (t.ex. Värmland, Dalarna, Östergötland), 'Tillstånd Natura 2000-område'.","affects":"B50-N010 och nedströms B50-N020 samt beroenden i B20-G010 (miljöbedömningsväg) som styr om separat BMP-undersökning behövs.","impact":"Handläggningsstopp i veckor till månader, otydligt mandat att gå vidare, och risk att ett informellt besked överrörs vid senare prövning.","mitigation":"Driv screeningen själv med egen expertis och lämna ett komplett screeningunderlag till länsstyrelsen istället för att fråga öppet. Begär skriftligt besked, sätt tydliga mötes- och svarstider i dialogen och eskalera via remissvägen om beskedet uteblir.","source_refs":["MB","NATURA","EXT: Länsstyrelsen Värmland – Tillstånd Natura 2000-område https://www.lansstyrelsen.se/varmland/natur-och-landsbygd/aktiviteter-och-atgarder-i-naturen/tillstand-natura-2000-omrade.html"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-N020-01","node_id":"B50-N020","chart_key":"B50","node_label":"Genomför specifik miljöbedömning för Natura 2000","title":"Säsongsberoende inventeringar avskyddade värden försenas och förlänger Natura-MKB:n","category":"Klimat & naturhändelse","trigger":"Inventeringsfönster för skyddade arter och livsmiljöer (fågel, fladdermöss, vaxtarter, hydrologi) missas p.g.a. sen projektstart eller extrema väderförhållanden.","description":"Natura-MKB:n måste bygga på inventeringar av områdets skyddade värden, och många arter kan bara inventeras under snäva säsongsfönster. Missas ett fönster kan nästa möjlighet ligga ett år bort, och milda vintrar, sena vårar eller översvämningar kan göra även planerade inventeringar obrukbara. Eftersom prövningen i B50-GN040 kräver att vetenskapligt rimligt tvivel undanröjs duger inte proxydata eller bristfälliga årsupplagor – domstolarna ställer höga krav på datakvalitet just i Natura-frågor.","motivation":"I vindkraftprövningar mot Natura 2000-områden (t.ex. prövningar där havsörn och fladdermöss varit skyddade värden, se Naturvårdsverkets ärendelista för vindkraft) har inventeringsunderlagens omfattning och tillförlitlighet upprepade gånger varit avgörande och utdragna tvistefrågor. Nordkalk/ Ojnarefjärden visar dessutom att domstolarna prövar vetenskaplig osäkerhet mycket noggrant. Källor: Naturvårdsverket, Sveriges Domstolar.","affects":"B50-N020, loop tillbaka från B50-N050 vid omprojektering, samt nedströms B50-N030 och B50-GN040.","impact":"Fördröjning om ett inventeringsår, merkostnad för kompletterande fältarbete och försvagad bevisställning som ökar risken för avslag eller återförvisning.","mitigation":"Lås inventeringsplanen minst två säsonger före planerad ansökan, med marginal för ett extra år. Använd ackrediterade/erfarna inventerare, dokumentera metodik och täckning, och stäm av metodiken med länsstyrelsen innan fältarbetet startar.","source_refs":["MB","NATURA","EXT: Naturvårdsverket – ärendelista vindkraft (Natura 2000-frågor) https://www.naturvardsverket.se/4a8e81/contentassets/3cfac512e28b4aa8b1e75c33781db056/arendelista-vindkraft.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-N020-02","node_id":"B50-N020","chart_key":"B50","node_label":"Genomför specifik miljöbedömning för Natura 2000","title":"Bristfällig alternativ- och kumulativ analys håller inte vid prövning","category":"Underlagsbrist & data","trigger":"Natura-MKB:n beskriver det sökta alternativet men underredovisar rimliga alternativlösningar, nollalternativet eller samverkanseffekter med andra verksamheter.","description":"Noden kräver analys av alternativ, kumulativa effekter och koppling till bevarandemålen. Om analysen är för tunn blir hela kedjan sårbar: prövningsmyndigheten kan inte undanröja rimligt tvivel i B50-GN040 och undantagsvägen i 29 § kräver dessutom att frånvaro av alternativa lösningar visas. En Natura-MKB som inte täcker detta tvingar antingen komplettering eller, i värsta fall, ett helt omtag efter avslag. Att separat BMP-undersökning inte krävs gör att det är lätt att underskatta underlagskraven – miljöbedömningen ska ändå motsvara den specifika miljöbedömningens kvalitet.","motivation":"I Nordkalk/Bästeträsk-målet (MÖD M 5375-14, 2018) föll avgörandet på bedömningen av verksamhetens påverkan på det utvidgade Natura 2000-området, där underlagets styrka och osäkerhetsbedömningen var centrala. Praxis visar att kumulativa effekter är ett av de vanligaste skälen till att Natura-prövningar dras ut i tid. Källa: Sveriges Domstolar.","affects":"B50-N020 och nedströms B50-N030, B50-GN040 och B50-N050; vid avslag återkoppling till B10-020 (lokalisering) och B20 (miljöbedömning).","impact":"Kompletteringsloopar, återförvisning, och vid avslag tvångsomprojektering eller obligatorisk regeringsprövning med år av extra ledtid.","mitigation":"Bygg Natura-MKB:n explicit mot prövningsrekvisiten i MB 7 kap. 28 a–29 §§: alternativ, kumulativa effekter, bevarandemål, osäkerhetsanalys. Låt en oberoende granskare verifiera spårbarheten från data till slutsats innan ansökan lämnas.","source_refs":["MB","NATURA","EXT: MÖD dom M 5375-14 (2018) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-N030-01","node_id":"B50-N030","chart_key":"B50","node_label":"Lämna och komplettera Natura 2000-ansökan","title":"Fel val mellan samordnad och separat handläggning skapar dubbla processer","category":"Sektorssamordning","trigger":"Natura 2000-ansökan lämnas separat till länsstyrelsen medan huvudprövningen pågår i MMD/MPD, utan samordnad tidsplan eller enhetlig bevisning.","description":"Noden tillåter att ansökan antingen samordnas med huvudprövningen eller handläggs separat av behörig myndighet. Väljer projektägaren separat spår riskerar samma miljöfråga att prövas två gånger med olika beviskrav, olika instanskedjor och olika tidsplaner – med risk för att utfallen blir oförenliga. En separat handläggning kan också fortsätta efter att huvudtillståndet vunnit laga kraft, vilket lämnar projektet med ett tillstånd som inte får nyttjas. Samordningen är inte automatisk utan kräver aktiv styrning från projektägaren.","motivation":"Riksdagens behandling av Natura 2000-tillstånd vid bearbetningskoncessioner (bet. 2020/21:NU16) och Regelrådets yttrande 2024 visar att frågan om vilken instans som ska pröva Natura 2000-tillstånd fortfarande är omtvistad och under reform – vilket förstärker risken för inkonsekvent handläggning när flera regelverk möts. Källor: riksdagen.se, Regelrådet.","affects":"B50-N030 med nedströms B50-GN040 och B50-N060, samt instansnoderna i B30-G110 och motsvarande i B40 (vatten) där huvudprövningen bedrivs.","impact":"Dubblerade handläggningstider och kostnader, risk för motstridiga beslut och att ett lagakraftvunnet huvudtillstånd inte kan tas i bruk förrän Natura-ärendet är klart.","mitigation":"Välj samordnad prövning när det är möjligt och begär det uttryckligen i ansökan. Synkronisera bevisningen mellan spåren så att samma Natura-MKB ligger till grund, och upprätta en gemensam tidsplan med alla berörda myndigheter och domstolar.","source_refs":["MB","NATURA","EXT: Riksdagen, bet. 2020/21:NU16 Natura 2000-tillstånd vid bearbetningskoncession https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/natura-2000-tillstand-vid-ansokan-om_h801nu16/html/","EXT: Regelrådet rr 2024:085 https://www.regelradet.se/download/18.5933842b191974d80396ac/1725527853531/rr_2024_085.pdf"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-N030-02","node_id":"B50-N030","chart_key":"B50","node_label":"Lämna och komplettera Natura 2000-ansökan","title":"Kompletteringsloopar i Natura-ärendet återställer tidplanen","category":"Myndighetskapacitet & handläggning","trigger":"Prövningsmyndigheten begär komplettering av underlaget, och varje komplettering kräver nytt samråd eller ny remissrunda hos länsstyrelse och sakägare.","description":"Nodens syfte är att nå ett 'komplett Natura-ärende', men kompletthetskravet är inte kodifierat och tolkas olika mellan länsstyrelser och domstolar. Varje kompletteringsbegäran kan utlösa nya inventeringar, ny alternativanalys eller nytt sakägarsamråd, vilket flyttar ärendet tillbaka mot B50-N020. Eftersom Natura-ärenden ofta handläggs av myndigheter med små specialistenheter kan även väl förberedda ansökningar fastna i kompletteringscykler där både myndighetens och sökandens resurser utgör flaskhalsen.","motivation":"Länsstyrelsernas vägledning om Natura 2000-tillstånd visar att ansökningsprocessen är uppbyggd i flera obligatoriska steg (inledande samråd, samrådsunderlag, MKB) där brister i något steg tvingar omtag. Erfarenheten från svenska miljöprövningar generellt är att kompletteringskrav är den enskilt vanligaste orsaken till förlängda handläggningstider. Källa: Länsstyrelsen, 'Tillstånd Natura 2000-område'.","affects":"B50-N030, med återkoppling till B50-N020, och fördröjning av B50-GN040 samt samlingsgaten B50-G900.","impact":"Förskjutna beslut om flera månader till år, ökade konsult- och inventeringskostnader samt osäker tidsplan för huvudprojektets byggstart.","mitigation":"Gör en egen kompletthetskontroll mot myndighetens checklista och prövningsrekvisiten innan inlämning. Förhandla om kompletteringsfrågornas omfattning vid kompletteringsmöte och begär att flera brister hanteras i en enda kompletteringsrunda.","source_refs":["MB","NATURA","EXT: Länsstyrelsen Värmland – Tillstånd Natura 2000-område https://www.lansstyrelsen.se/varmland/natur-och-landsbygd/aktiviteter-och-atgarder-i-naturen/tillstand-natura-2000-omrade.html"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-N050-01","node_id":"B50-N050","chart_key":"B50","node_label":"Omlokalisera, omprojektera eller pröva undantagsväg","title":"Omprojekteringen skapar ny kumulativ påverkan och nollställer underlaget","category":"Teknisk komplexitet","trigger":"Projektet flyttas eller ritas om för att undvika Natura-konflikten, men den nya utformningen påverkar andra skyddade värden eller kräver nya inventeringssäsonger.","description":"Omlokalisering eller omprojektering är den rationella vägen ur ett negativt ställningstagande, men den återför projektet till B50-N020 med krav på nytt underlag. Nytt läge kan innebära nya konflikter: andra Natura 2000-områden, fridlysta arter, fornlämningar eller strandskydd. Varje omprojektering ogiltigförklarar dessutom delar av huvudspårets MKB och teknikbeskrivning, vilket tvingar synkroniserade kompletteringar i flera spår samtidigt. Efter minst två omprojekteringscykler blir koordinationsbördan i sig en dominerande risk.","motivation":"Erfarenheten från svenska infrastruktur- och energiprojekt visar att lokaliseringar som väljs för att undvika ett skyddsintresse regelbundet kolliderar med ett annat – det är en strukturell egenskap hos det svenska skyddsnätet (Natura 2000, reservat, strandskydd, fornlämningar) snarare än en projektspecifik miss. Kungälvs arenaområde illustrerar hur fornlämnings- och planfrågor flätas in i omprojekteringar. Källor: Kungälvs kommun, Boverket.","affects":"B50-N050 med återkoppling till B50-N020, samt B50-X010, B50-K010 och B10-020 (lokaliseringsbeslut).","impact":"Upprepade inventerings- och ansökningscykler, år av förlorad tid, och risk för ett 'skyddsnålsöga' där ingen praktiskt genomförbar lokalisering återstår.","mitigation":"Gör omprojekteringen multi-kriteriebaserad: screena varje kandidatläge mot samtliga skyddsregelverk samtidigt innan nytt läge låses. Behåll ett reservläge och planera inventeringar så att de täcker båda alternativen.","source_refs":["MB","NATURA","KML","STRAND","EXT: Kungälvs kommun – samrådsredogörelse arenaområdet (arkeologi och anbudsprocess) https://www.kungalv.se/contentassets/c642667d98294c7b923f7b0e4dd38dbf/samradsredogorelse-arenaomradet.pdf"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-N050-02","node_id":"B50-N050","chart_key":"B50","node_label":"Omlokalisera, omprojektera eller pröva undantagsväg","title":"Undantagsvägen i 29 § är politisk och oförutsägbar","category":"Politisk & policyrisk","trigger":"Projektet kan inte undvika påverkan och måste söka tillåtelse hos regeringen med hänvisning till tvingande allmänintresse.","description":"Undantagsprövningen enligt MB 7 kap. 29 § kräver att det saknas alternativa lösningar, att det finns tvingande hänsyn av allmänt intresse och att kompensationsåtgärder säkerställer nätverkets sammanhållning. Avgörandet fattas politiskt av regeringen, inte av en domstol, och utgången beror på regeringens sammansättning, konjunkturläge och dagsaktuell politik snarare än enbart på underlagets kvalitet. Det finns ingen handläggningstid som skyddar sökanden, och beslutet kan bara rättsprövas i Högsta förvaltningsdomstolen på begränsade grunder.","motivation":"Blekinge offshore avslogs av regeringen i december 2016 trots lång förberedelse och domstolsprövning. Regeringens avslag på 13 havsbaserade vindkraftsparker i november 2024 (av försvarsskäl) visar att politiska avvägningar på samma sätt kan slå ut stora projektportföljer sent i processen. Kallak visar att regeringsbeslut dessutom blir föremål för årslång rättsprövning i HFD (HFD 2024 not. 36, mål 801-23). Källor: eolus.com, SVT Nyheter, Sveriges Domstolar.","affects":"B50-N050 med nedströms B50-N060; hela projektets investeringsbeslut beroende av samlingsgaten B50-G900.","impact":"Flerårig väntan på politiskt avgörande, hög avslagsrisk trots starkt sakunderlag, och i förlängningen rättsprövning som ytterligare förlänger osäkerheten.","mitigation":"Gå undantagsvägen bara som sista utväg och bygg då argumentationen kring det tvingande allmänintresset med samma noggrannhet som det naturvetenskapliga underlaget. Säkerställ att kompensationsåtgärderna är konkreta, finansierade och genomförbara före beslutet.","source_refs":["MB","NATURA","EXT: Regeringen säger nej till Blekinge offshore https://www.eolus.com/blog/mfn_news/regeringen-sager-nej-till-det-havsbaserade-vindkraftsprojektet-blekinge-offshore/","EXT: SVT – Regeringen säger nej till 13 havsbaserade vindkraftsparker https://www.svt.se/nyheter/inrikes/regeringen-sager-nej-till-13-havsbaserade-vindkraftsparker","EXT: HFD 2024 not. 36 (Kallak) https://www.domstol.se/globalassets/filer/domstol/hogstaforvaltningsdomstolen/2025/vb-2024/webbversion-250220.pdf"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-N050-03","node_id":"B50-N050","chart_key":"B50","node_label":"Omlokalisera, omprojektera eller pröva undantagsväg","title":"Kompensationsåtgärdernas ekologiska effekt är osäker och kan undermineras i efterhand","category":"Rättslig osäkerhet","trigger":"Tillåtelsen bygger på kompensationsåtgärder vars effekt inte är dokumenterad eller som inte kan genomföras på den tänkta platsen.","description":"För att undantag enligt 29 § ska vara möjligt måste kompensationsåtgärderna säkerställa Natura 2000-nätverkets sammanhållning. I praktiken är ekologisk kompensation – nya våtmarker, flyttade livsmiljöer, skydd av ersättningsområden – ofta osäker i effekt, fördröjd i tid eller beroende av tredje parts mark. Om kompensationen inte kan visas realistisk faller undantagsgrundens sista rekvisit. Dessutom kan villkorade kompensationsåtgärder bli föremål för tvist vid uppföljning och tillsyn långt efter byggstart.","motivation":"Art- och habitatdirektivets artikel 6.4, som 29 § genomför, kräver uttryckligen att alla kompensationsåtgärder som behövs för att säkerställa nätverkets sammanhållning vidtas. EU-rättens och svenska myndigheters vägledning understryker att kompensationen måste vara konkret och genomförbar – inte en avsiktsförklaring. Källa: Naturvårdsverket, Natura 2000 i Sverige.","affects":"B50-N050 och nedströms B50-N060; villkoren följer med in i huvudtillståndets uppföljnings- och tillsynsfaser (B60).","impact":"Avslag på undantagsansökan, uppskjuten byggstart i väntan på att kompensationen realiseras, samt långsiktig tillsyns- och tvistbelastning.","mitigation":"Välj kompensationsåtgärder med dokumenterad ekologisk effekt och säkra markkontroll (avtal/servitut) tidigt. Beskriv tidsordningen – kompensation före eller samtidigt med skadan – och bygg in uppföljning med tydliga avbrottskriterier.","source_refs":["MB","NATURA","EXT: Naturvårdsverket – Natura 2000 i Sverige https://www.naturvardsverket.se/vagledning-och-stod/skyddad-natur/natura-2000-i-sverige/"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-N060-01","node_id":"B50-N060","chart_key":"B50","node_label":"Natura-beslut, överklagande och laga kraft","title":"Överklagandekedjan i Natura-spåret tar längre tid än huvudprövningen","category":"Överklagande & rättsprocess","trigger":"Miljöorganisationer eller sakägare överklagar tillståndet, eller projektägaren överklagar avslag/villkor, och ärendet vandrar MMD → MÖD.","description":"Natura-beslut överprövas enligt ordinarie miljömålsväg, med möjlighet till prövning i två domstolsinstanser. Miljöorganisationer har talerätt och historiskt stark drivkraft att föra Natura-frågor till högsta instans. Eftersom berört arbete inte får påbörjas förrän ett nödvändigt tillstånd är verkställbart, blir varje överklagande ett direkt byggstopp för den berörda delen – även när huvudtillståndet är lagakraftvunnet. Den asymmetriska tidstrukturen (huvudspår klart, Natura-spår pågående) är en av de mest kostsamma konfliktkonstellationerna i svensk miljöprövning.","motivation":"Nordkalk/Ojnarefjärden-processen sträckte sig från ansökan 2011/2012 genom MMD, MÖD och Högsta domstolen fram till slutliga avgöranden 2016–2018 – samtidigt som huvudärendena om miljöfarlig verksamhet prövades parallellt. Preemraff visar motsvarande mönster i huvudspåret: MMD 2020, överklagande till MÖD, och slutligen drog Preem tillbaka ansökan 2020 efter år av process. Källor: Sveriges Domstolar, Sveriges Natur, Naturskyddsföreningen.","affects":"B50-N060 och samlingsgaten B50-G900; blockerar berört markarbete i B70 även när B30/B40-tillstånd vunnit laga kraft.","impact":"Flerårigt byggstopp för berörda delar, finansierings- och entreprenadkostnader under avvaktan, samt risk för att projektet avbryts trots vunna tillstånd (jfr Preem).","mitigation":"Planera byggnationen i etapper så att arbete utanför den Natura-berörda delen kan fortsätta. Säkerställ att beslutets verkställbarhetsrekvisit uppfylls innan entreprenader tecknas, och för tidig dialog med tänkbara klagande för att minska överklagandeincitamentet.","source_refs":["MB","MMDL","NATURA","EXT: Sveriges Domstolar – MÖD M 5375-14 (2018) https://www.domstol.se/globalassets/filer/domstol/markochmiljooverdomstolen/avgoranden/2018/m-5375-14.pdf","EXT: Naturskyddsföreningen – Striden om Preemraff https://www.naturskyddsforeningen.se/artiklar/striden-om-preemraff-det-har-har-hant/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-N060-02","node_id":"B50-N060","chart_key":"B50","node_label":"Natura-beslut, överklagande och laga kraft","title":"Natura-villkor kolliderar med huvudtillståndets villkor","category":"Sektorssamordning","trigger":"Natura-beslutet och miljötillståndet meddelas av olika instanser med villkor som inte är harmoniserade, t.ex. motstridiga skyddsåtgärder, tider eller uppföljningskrav.","description":"När Natura-beslutet meddelas separat från huvudtillståndet finns ingen automatisk mekanism som säkerställer att villkoren är förenliga. Skyddsåtgärder, tidsbegränsningar för störande arbete och övervakningskrav kan överlappa eller motsäga varandra, och i tvister om vilket villkor som gäller är det den strängaste tolkningen som i praktiken styr driften. Avvikelser riskerar att bedömas som brott mot respektive beslut oberoende av varandra, med tillsynsärenden som följd.","motivation":"Erfarenheten från svensk tillsynspraxis är att överlappande villkor från parallella tillstånd (miljötillstånd, vattendom, Natura-tillstånd, strandskyddsdispens) är en återkommande källa till tolkningsproblem vid uppföljning. Det är ett välgrundat rättsligt resonemang utifrån MB 19 och 21 kap.:s separata prövnings- och överklagandespår snarare än ett enskilt prejudikat. Källa: Miljöbalken, Sveriges Domstolars processbeskrivningar.","affects":"B50-N060, samlingsgaten B50-G900 samt drift- och tillsynsfaserna i B60.","impact":"Driftbegränsningar som är strängare än något enskilt beslut avsett, tillsynsingripanden och behov av villkorsändringar (omprövning) i båda spåren.","mitigation":"Gör en villkorsmatris över alla meddelade beslut före byggstart och lös motsägelser genom begäran om förtydligande eller ändring. Arbeta för att samordnad prövning väljs i B50-N030 så att villkoren meddelas i samma ärende.","source_refs":["MB","MMDL","COURT_MFV","COURT_APPEAL"],"scenario_tags":"S0_current_2026","origin":"Myndighet & prövning"},{"risk_id":"R-B50-N060-03","node_id":"B50-N060","chart_key":"B50","node_label":"Natura-beslut, överklagande och laga kraft","title":"Beslutet är inte verkställbart – laga kraft missförstås och arbete stoppas","category":"Myndighetskapacitet & handläggning","trigger":"Entreprenad eller markarbete planeras mot ett Natura-beslut som överklagats men inte vunnit laga kraft, eller som saknar verkställighetsförordnande.","description":"Noden kräver att ett nödvändigt tillstånd är verkställbart före berört arbete. I praktiken missförstås ofta skillnaden mellan ett meddelat beslut, ett lagakraftvunnet beslut och ett beslut med verkställighetsförordnande. Ett påbörjat arbete utan verkställbart tillstånd kan stoppas av tillsynsmyndighet eller domstol (inhibition/interimistiskt beslut), vilket skapar både juridisk exponering och brutna entreprenader. Risken förstärks när flera beslut i olika spår har olika laga kraft-status samtidigt.","motivation":"Verkställbarhetskravet följer av den ordinarie miljömålsprocessens struktur (MB 19 och 21 kap., lagen om mark- och miljödomstolar). Erfarenheten från svenska infrastrukturprojekt visar att interimistiska inhibitioner och dispenser för tidig påbörjan är återkommande instrument just i projekt med parallella tillstånd. Källa: MMDL, Sveriges Domstolar.","affects":"B50-N060 och samlingsgaten B50-G900, med direkt koppling till byggstartnoderna i B70.","impact":"Omedelbart arbetsstopp, avtalsbrott mot entreprenörer, potentiell straff- och skadeståndsexponering samt fördröjning till dess laga kraft eller förordnande vunnits.","mitigation":"Inför en lagakraft-checklista i projektets byggstartsbeslut som kvitterar status för varje berört beslut. Begär verkställighetsförordnande när tidplanen kräver det, och inhämta dispens för förberedande arbeten där det är möjligt.","source_refs":["MB","MMDL","COURT_APPEAL"],"scenario_tags":"S0_current_2026","origin":"Sökande & ansökan"},{"risk_id":"R-B50-P010-01","node_id":"B50-P010","chart_key":"B50","node_label":"Krävs ny eller ändrad detaljplan?","title":"Kommunens planmonopol: ovilja eller köstopp stoppar projektet i förhand","category":"Politisk & policyrisk","trigger":"Kommunen bedömer att planbehov finns men avstår av politiska skäl, eller sätter planarbetet i kö bakom egna prioriteringar.","description":"Detaljplanebeslutet är kommunens exklusiva befogenhet – det finns ingen rätt för en projektägare att få en plan upprättad. Bedömningen av planbehov och planförutsättningar är därmed i praktiken ett politiskt vägval: en kommun som inte vill ha verksamheten kan förhala eller avstå utan att fatta ett överklagbart beslut. Planbeskedet är, som noden noterar, varken tillstånd eller överklagbart, vilket gör att projektägaren saknar rättsliga instrument att forcera processen. Kommunvalet kan dessutom ändra förutsättningarna mitt i pågående planarbete.","motivation":"Vindkraftsexemplet Bruzaholm visar kommunernas nyckelroll: trots kommunfullmäktiges tillstyrkande avslogs ansökan av miljöprövningsdelegationen – och omvänt har kommunalt avståndstagande stoppat många projekt före ansökan. Det kommunala planmonopolets effekt på energi- och industriprojekt är ett välgrundat strukturellt resonemang utifrån PBL 4–5 kap. Källor: Vattenfall (Bruzaholm), PBL.","affects":"B50-P010 med nedströms B50-P020 och B50-P030; om planen uteblir blockeras hela PBL-spåret och därmed byggberedskapen i B70.","impact":"Projektstopp utan rättslig angreppspunkt, år av fördröjning vid politiska majoritetsskiften, samt förlorad investeringsvilja när planhorisonten blir oöverskådlig.","mitigation":"Säkra politisk förankring tidigt genom dialog med kommunledning och nämnder, och erbjud att bekosta planarbetet (exploateringsavtal/medfinansiering) för att få plats i plankön. Dokumentera kommunens ställningstaganden skriftligt.","source_refs":["PBL","PBL_PLAN","EXT: Vattenfall – Bruzaholm projekthistorik https://projekt.vattenfall.se/vindprojekt/projekt/land/bruzaholm/"],"scenario_tags":"S0_current_2026","origin":"Extern & omvärld"},{"risk_id":"R-B50-P010-02","node_id":"B50-P010","chart_key":"B50","node_label":"Krävs ny eller ändrad detaljplan?","title":"Felbedömt planbehov: projektet bedöms inte kräva plan – och tvingas ändå till det sent","category":"Rättslig osäkerhet","trigger":"Kommunen bedömer initialt att befintlig plan räcker eller att åtgärden inte strider mot planen, men prövningen i domstol eller bygglovsprövningen drar annan slutsats.","description":"Gränsdragningen mellan åtgärder som följer gällande plan, som kräver planändring och som kräver helt ny plan är tolkningsbar – särskilt för anläggningar utanför detaljplaneläge där PBL:s krav på att åtgärder ska vara förenliga med riksintressen och översiktsplan ändå gäller. Om planbedömningen görs optimistiskt för att spara tid, kan en senare instans (byggnadsnämnd, MMD vid överklagat bygglov, eller länsstyrelsen vid riksintressebevakning) kräva plan efter att miljöprövningen redan pågått. Då måste PBL-spåret köras i efterhand, utan samordning.","motivation":"MÖD:s praxis om detaljplaners förenlighet med översiktlig planering och riksintressen (bl.a. dom P 1151-23, 2024, där planen upphävdes för bl.a. avsaknad av förenlighet och bristfällig handläggning) visar att planförutsättningarna prövas hårt i efterhand. Källa: Sveriges Domstolar.","affects":"B50-P010, B50-P020 samt huvudspåren B30/B40 vars prövning kan påverkas av planläget.","impact":"Påtvingad planprocess i efterhand med flera års fördröjning, ogiltigförklarade eller upphävda underliggande beslut samt bruten samordning mellan PBL och miljöprövningen.","mitigation":"Låt kommunen ge ett skriftligt och motiverat ställningstagande till planbehovet tidigt, och te
