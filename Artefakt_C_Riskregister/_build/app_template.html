<body>
<header>
  <h1>Artefakt C <span class="accent">·</span> Riskregister — Miljötillståndsprocessen i Sverige</h1>
  <div class="sub">Nodnivårisker för samtliga riskmappbara detaljnoder i processkartan (B10–B70) · Sverige AB · Baslinje S0 per 2026-08-20</div>
  <div class="headstats" id="headstats"></div>
  <div class="controls">
    <div class="searchwrap">
      <span class="icon">⌕</span>
      <input id="search" type="search" placeholder="Sök i titel, beskrivning, motivation, påverkan, åtgärder…" autocomplete="off">
    </div>
    <select id="sort">
      <option value="id">Sortera: Diagram / nod</option>
      <option value="category">Sortera: Kategori</option>
      <option value="origin">Sortera: Ursprung</option>
      <option value="node">Sortera: Nodnamn</option>
      <option value="affects">Sortera: Flest berörda noder</option>
    </select>
    <button class="btn active" data-view="risks">Risker</button>
    <button class="btn" data-view="process">Processkarta</button>
    <button class="btn" data-view="nodes">Nodbläddrare</button>
    <button class="btn" data-view="stats">Statistik</button>
    <button class="btn" id="expandAll">Expandera alla</button>
    <a class="btn" href="https://nic-esp.github.io/miljotillstandsrisker/ai-access.html">AI &amp; rådata</a>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
/*__PROCESS_GEOMETRY__*/
/*__RISK_FIELDS__*/

const DATA = /*__PAYLOAD__*/;
const RISKS = DATA.risks;
const NODES = Object.values(DATA.nodesByChart).flat();
const NODE_BY_ID = Object.fromEntries(NODES.map(n => [n.node_id, n]));
const SOURCES = DATA.sources;
const CHARTS = Object.keys(DATA.nodesByChart);
const CHART_NAME = DATA.chartNames;
const PROC = DATA.proc;
const PROC_CHARTS = Object.keys(PROC);
const PROCESS_GEOMETRY = createProcessGeometry();
const PROC_GEOMETRY_CACHE = {};
const PROC_NODE = {};
for (const ck of PROC_CHARTS) for (const n of PROC[ck].nodes) PROC_NODE[n.id] = { ...n, chart: ck };

const CATEGORIES = [...new Set(RISKS.map(r => r.category))].sort((a,b)=>a.localeCompare(b,'sv'));
const ORIGINS = ['Myndighet & prövning','Sökande & ansökan','Extern & omvärld'];
const RISK_COUNT = {};
for (const r of RISKS) RISK_COUNT[r.node_id] = (RISK_COUNT[r.node_id] || 0) + 1;
const CHART_RISKS = {};
for (const r of RISKS) CHART_RISKS[r.chart_key] = (CHART_RISKS[r.chart_key] || 0) + 1;

// ---- state ----
const state = { q:'', charts:new Set(CHARTS), cats:new Set(CATEGORIES), origins:new Set(ORIGINS),
  node:'', view:'risks', sort:'id', selNode:null, selChart:'B00', selProcNode:null, expandAll:false };
const requestedRiskId = new URLSearchParams(location.search).get('risk');
const requestedRisk = requestedRiskId && RISKS.find(r => r.risk_id === requestedRiskId);
if (requestedRisk) {
  state.q = requestedRisk.risk_id;
  state.expandAll = true;
  document.title = `${requestedRisk.risk_id} – ${requestedRisk.title}`;
  document.querySelector('#canonical').href = `https://nic-esp.github.io/miljotillstandsrisker/?risk=${encodeURIComponent(requestedRisk.risk_id)}`;
}

// ---- helpers ----
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text, q){
  const e = esc(text);
  if (!q) return e;
  const parts = q.trim().split(/\s+/).filter(Boolean).map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!parts.length) return e;
  return e.replace(new RegExp('(' + parts.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function refLink(s){
  if (s.startsWith('EXT:')) {
    const m = s.slice(4).trim().match(/^(.*?)\s*(https?:\/\/\S+)$/);
    if (m) return `<a class="ref" href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[1])} ↗</a>`;
    return `<span class="ref plain">${esc(s.slice(4).trim())}</span>`;
  }
  const src = SOURCES[s];
  if (src && src.url) return `<a class="ref" href="${esc(src.url)}" target="_blank" rel="noopener" title="${esc(src.title)} — ${esc(src.authority)}">${esc(s)} ↗</a>`;
  return `<span class="ref plain">${esc(s)}</span>`;
}
function affectsCount(r){ return (String(r.affects).match(/B\d{2}-[A-Z]*\d+/g) || []).length; }

// ---- CSV export ----
function csvDownload(filename, header, rows){
  const blob = new Blob([serializeCsv(header, rows)], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}
function exportRisks(rs, fname){
  csvDownload(fname, RISK_CSV_HEADER, rs.map(r => riskCsvRow(r, CHART_NAME)));
}
function exportRiskItems(rs, fname){
  csvDownload(fname, RISK_ITEM_CSV_HEADER, rs.flatMap(r => riskItemCsvRows(r, CHART_NAME)));
}
function exportProcNodes(ck){
  const chart = PROC[ck];
  csvDownload(`processkarta_${ck}_noder.csv`,
    ['delprocess','node_id','etikett','nodtyp','fas','aktor','x','y','antal_risker','riskmappbar','handoff_fran','handoff_till'],
    chart.nodes.map(n => [ck, n.id, n.label, n.type, n.phase, n.actor, n.x, n.y, RISK_COUNT[n.id]||0, n.rma?'ja':'nej', n.hf.join(' | '), n.ht.join(' | ')]));
}
function exportProcEdges(ck){
  const chart = PROC[ck];
  csvDownload(`processkarta_${ck}_kanter.csv`,
    ['delprocess','kant_id','fran','till','etikett'],
    chart.edges.map(e => [ck, e.id, e.s, e.t, e.label]));
}
function exportNodes(){
  csvDownload('riskregister_noder.csv',
    ['node_id','delprocess','etikett','fas','aktor','beskrivning','rattslig_grund','antal_risker','scenario'],
    NODES.map(n => [n.node_id, CHART_NAME[n.chart_key]||n.chart_key, n.label, n.phase, n.actor, n.description, n.legal_basis, RISK_COUNT[n.node_id]||0, n.scenario_tags]));
}
function exportStats(){
  const rows = [];
  const byChart = {}, byCat = {}, byOrg = {};
  for (const r of RISKS){ byChart[r.chart_key]=(byChart[r.chart_key]||0)+1; byCat[r.category]=(byCat[r.category]||0)+1; byOrg[r.origin]=(byOrg[r.origin]||0)+1; }
  for (const c of CHARTS) rows.push(['Delprocess', CHART_NAME[c], byChart[c]||0]);
  for (const c of CATEGORIES) rows.push(['Kategori', c, byCat[c]||0]);
  for (const o of ORIGINS) rows.push(['Ursprung', o, byOrg[o]||0]);
  const factors = RISKS.flatMap(triggerFactors);
  const effects = RISKS.flatMap(consequences);
  rows.push(['Datamodell', 'Utlösande faktorer', factors.length]);
  rows.push(['Datamodell', 'Källförankrade premisser – utlösande faktorer', factors.filter(item => item.basis === 'source').length]);
  rows.push(['Datamodell', 'Möjliga konsekvenser', effects.length]);
  rows.push(['Datamodell', 'Källförankrade premisser – konsekvenser', effects.filter(item => item.basis === 'source').length]);
  csvDownload('riskregister_statistik.csv', ['grupp','namn','antal'], rows);
}

// ---- filtering ----
function filtered(){
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  return RISKS.filter(r => {
    if (!state.charts.has(r.chart_key)) return false;
    if (!state.cats.has(r.category)) return false;
    if (!state.origins.has(r.origin)) return false;
    if (state.node && r.node_id !== state.node) return false;
    if (terms.length){
      const hay = (r.risk_id+' '+r.title+' '+r.node_id+' '+r.node_label+' '+r.description+' '+r.motivation+' '+r.trigger+' '+riskItemText(triggerFactors(r))+' '+r.affects+' '+r.impact+' '+riskItemText(consequences(r))+' '+r.mitigation+' '+r.category+' '+r.origin+' '+r.scenario_tags+' '+r.source_refs.join(' ')).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
}
function sorted(rs){
  const arr = [...rs];
  if (state.sort === 'category') arr.sort((a,b)=>a.category.localeCompare(b.category,'sv') || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'origin') arr.sort((a,b)=>ORIGINS.indexOf(a.origin)-ORIGINS.indexOf(b.origin) || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'node') arr.sort((a,b)=>a.node_label.localeCompare(b.node_label,'sv') || a.risk_id.localeCompare(b.risk_id));
  else if (state.sort === 'affects') arr.sort((a,b)=>affectsCount(b)-affectsCount(a));
  else arr.sort((a,b)=>a.risk_id.localeCompare(b.risk_id,'sv'));
  return arr;
}

// ---- shared rendering ----
function renderHead(){
  $('#headstats').innerHTML =
    `<span class="headstat"><b>${RISKS.length}</b>risker</span>

function bar(label, val, max){
  const pct = max ? Math.max(2, Math.round(val/max*100)) : 0;
  return `<div class="bar"><span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="val">${val}</span></div>`;
}
function renderStats(){
  const byChart = {}, byCat = {}, byOrg = {}, byNode = {};
  for (const r of RISKS){ byChart[r.chart_key]=(byChart[r.chart_key]||0)+1; byCat[r.category]=(byCat[r.category]||0)+1; byOrg[r.origin]=(byOrg[r.origin]||0)+1; byNode[r.node_id]=(byNode[r.node_id]||0)+1; }
  const allFactors = RISKS.flatMap(triggerFactors);
  const allEffects = RISKS.flatMap(consequences);
  const sourceFactors = allFactors.filter(item => item.basis === 'source').length;
  const sourceEffects = allEffects.filter(item => item.basis === 'source').length;
  const maxC = Math.max(...Object.values(byChart));
  const maxK = Math.max(...Object.values(byCat));

    <div class="statbox"><h3>Risker per ursprung</h3>
      ${ORIGINS.map(o => bar(o, byOrg[o]||0, maxO)).join('')}
      <p style="color:var(--muted);font-size:12.5px;margin-top:8px">Ursprunget anger vems handlande eller underlåtenhet som i första hand orsakar risken — vägledning för var processförbättringar kan göra skillnad.</p></div>

// ---- view: process map ----
function nodeGeom(n){ return PROCESS_GEOMETRY.nodeGeometry(n); }
function riskFill(cnt, rma){
  if (!rma) return '#eef0f3';
  if (cnt >= 3) return '#7d9cbb';
  if (cnt === 2) return '#b7cbdd';
  return '#dfe8f1';
}
function wrapText(s, max, maxLines=4){
  const words = String(s).split(/\s+/); const lines = []; let cur = '';
  for (const w of words){
    if (cur && (cur + ' ' + w).length > max){ lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  if (lines.length <= maxLines) return lines;
  const visible = lines.slice(0, maxLines);
  visible[maxLines-1] = visible[maxLines-1].replace(/[….]*$/, '') + '…';
  return visible;
}
function processLayout(ck){
  if (!PROC_GEOMETRY_CACHE[ck]) {
    const raw = PROC[ck];
    const nodes = PROCESS_GEOMETRY.layoutNodes(raw.nodes);
    const routes = PROCESS_GEOMETRY.routeEdges(nodes, raw.edges);
    PROC_GEOMETRY_CACHE[ck] = {
      nodes,
      routes,
      bounds: PROCESS_GEOMETRY.diagramBounds(nodes, routes),
    };
  }
  return PROC_GEOMETRY_CACHE[ck];
}

    $('#zoomReadable').classList.toggle('active', mode === 'readable');
    $('#zoomFit').classList.toggle('active', mode === 'overview');
    $('#procViewMode').textContent = mode === 'overview' ? 'Översiktsläge' : (mode === 'readable' ? 'Läsbart läge' : 'Egen zoom');
  };
  const positionView = (center, width, height) => {
    const fullW = b.x1-b.x0, fullH = b.y1-b.y0;
    vb.w = width; vb.h = height;
    vb.x = width >= fullW ? b.x0-(width-fullW)/2 : Math.max(b.x0, Math.min(b.x1-width, center.x-width/2));
    vb.y = height >= fullH ? b.y0-(height-fullH)/2 : Math.max(b.y0, Math.min(b.y1-height, center.y-height/2));
    apply();
  };
  const setOverview = () => {
    vb.x=b.x0; vb.y=b.y0; vb.w=b.x1-b.x0; vb.h=b.y1-b.y0;
    apply(); setModeButtons('overview');
  };
  const setReadable = () => {
    const cw = Math.max(svg.clientWidth, 1), chh = Math.max(svg.clientHeight, 1);
    const focus = nodes.find(n => n.id === state.selProcNode) || nodes.find(n => n.type === 'start') || nodes[0];
    const center = PROCESS_GEOMETRY.nodeCenter(focus);
    const targetNodeWidth = cw < 700 ? 150 : 190;
    const width = Math.min(b.x1-b.x0, cw*PROCESS_GEOMETRY.dimensions.process.w/targetNodeWidth);
    positionView(center, width, width*chh/cw);
    setModeButtons('readable');
  };
  procCtx = { svg, vb, b, drag: null, moved: false, setModeButtons };
  const zoom = f => {
    const cw = Math.max(svg.clientWidth, 1), chh = Math.max(svg.clientHeight, 1);
    const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
    const width = Math.max(320, Math.min((b.x1-b.x0)*1.35, vb.w*f));
    positionView({x:cx,y:cy}, width, width*chh/cw);
    setModeButtons(null);
  };
  $('#zoomIn').onclick = () => zoom(0.8);
  $('#zoomOut').onclick = () => zoom(1.25);
  $('#zoomReadable').onclick = setReadable;
  $('#zoomFit').onclick = setOverview;
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.15 : 0.87); }, { passive:false });
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    procCtx.drag = {
      startX:e.clientX, startY:e.clientY,
      lastX:e.clientX, lastY:e.clientY,
      pointerId:e.pointerId,
    };
    procCtx.moved = false;
  });
  setReadable();

  // node click
  const g = $('#procG');
  g.querySelectorAll('.pnode').forEach(el => el.addEventListener('click', () => {
    if (procCtx && procCtx.moved) return;
    state.selProcNode = el.dataset.nid;
    g.querySelectorAll('.pnode').forEach(x => x.classList.toggle('sel', x === el));
    const det = $('#procDetail');
    det.innerHTML = nodeDetailHTML(state.selProcNode);
    bindDetail(det);
    det.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }));

  if (state.selProcNode) bindDetail($('#procDetail'));
}

// one-time global pan listeners, acting on the active process-view context
let procCtx = null;
window.addEventListener('pointermove', e => {
  if (!procCtx || !procCtx.drag || procCtx.drag.pointerId !== e.pointerId) return;
  const { svg, vb } = procCtx;
  const total = Math.abs(e.clientX-procCtx.drag.startX) + Math.abs(e.clientY-procCtx.drag.startY);
  if (!procCtx.moved && total <= 4) return;
  if (!procCtx.moved) {
    procCtx.moved = true;
    procCtx.setModeButtons(null);
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
  }
  const dx = e.clientX-procCtx.drag.lastX, dy = e.clientY-procCtx.drag.lastY;
  vb.x -= dx * vb.w / svg.clientWidth;
  vb.y -= dy * vb.h / svg.clientHeight;
  procCtx.drag.lastX = e.clientX;
  procCtx.drag.lastY = e.clientY;
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
});
function endProcessPan(e){
  if (!procCtx || !procCtx.drag || procCtx.drag.pointerId !== e.pointerId) return;
  if (procCtx.svg.hasPointerCapture(e.pointerId)) procCtx.svg.releasePointerCapture(e.pointerId);
  procCtx.drag = null;
  procCtx.svg.classList.remove('dragging');
}
window.addEventListener('pointerup', endProcessPan);
window.addEventListener('pointercancel', endProcessPan);

function renderMain(){
  $('#layout').classList.toggle('full', state.view === 'process');
  if (state.view === 'risks') renderRisks();
  else if (state.view === 'process') renderProcess();
  else if (state.view === 'nodes') renderNodes();
  else renderStats();
}

// ---- events ----
let deb;
$('#search').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(() => { state.q = e.target.value; renderMain(); }, 120); });
$('#sort').onchange = e => { state.sort = e.target.value; renderMain(); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#expandAll').onclick = () => {
  state.expandAll = !state.expandAll;
  $('#expandAll').textContent = state.expandAll ? 'Minimera alla' : 'Expandera alla';
  if (state.view === 'risks') renderRisks();
};

$('#search').value = state.q;
if (state.expandAll) $('#expandAll').textContent = 'Minimera alla';
renderHead(); renderSidebar(); renderMain();
if (requestedRisk) requestAnimationFrame(() => {
  const card = document.querySelector(`[data-rid="${CSS.escape(requestedRisk.risk_id)}"]`);
  if (card) card.scrollIntoView({ block:'start' });
});
</script>
</body>
